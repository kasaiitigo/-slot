
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#170010">
<title>Red Peanuts SLOT 画面破壊テスト</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#170010;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",sans-serif;
  touch-action:manipulation;
}
button{
  font:inherit;
  cursor:pointer;
}
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#170010
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png")
    center top/auto 100% no-repeat;
}
#start{
  position:absolute;
  inset:0;
  z-index:10;
}
#startBtn{
  position:absolute;
  left:50%;
  bottom:8.5%;
  transform:translateX(-50%);
  width:min(80vw,390px);
  height:70px;
  border:2px solid #fff;
  border-radius:45px;
  background:linear-gradient(#ff78c4,#d00068);
  color:#fff;
  font-size:28px;
  font-weight:1000;
  box-shadow:0 0 28px #ff008d;
}
#rate{
  position:absolute;
  bottom:23%;
  width:100%;
  text-align:center;
  font-weight:900;
  text-shadow:0 2px 7px #000;
}
#rate b{
  display:block;
  color:#ffed9d;
  font-size:30px;
}
#guideBtn{
  position:absolute;
  bottom:34%;
  left:50%;
  transform:translateX(-50%);
  padding:11px 22px;
  white-space:nowrap;
  border:1px solid #fff;
  border-radius:30px;
  background:#580033df;
  color:#fff;
  font-weight:900;
  box-shadow:0 0 14px #ff3896;
}
#demoLabel{
  position:absolute;
  top:max(14px,env(safe-area-inset-top));
  right:12px;
  z-index:11;
  padding:6px 10px;
  border:1px solid #ffe59a;
  border-radius:20px;
  background:#4f002dc9;
  color:#ffe59a;
  font-size:12px;
  font-weight:900;
}

/* 数字 */

#num{
  position:absolute;
  z-index:25;
  top:61%;
  left:50%;
  width:100%;
  text-align:center;
  transform:translate(-50%,-50%);
  font-size:min(52vw,255px);
  line-height:1.1;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:clamp(5px,1.5vw,9px) #ff4b9d;
  text-shadow:0 7px #ae0054,0 14px 10px #370018;
  opacity:0;
  pointer-events:none;
}
#num.show{
  opacity:1;
  animation:numPop .22s ease-out;
}
#num.red{
  color:#ff508b;
}
#num.gold{
  color:#fff1a8;
  -webkit-text-stroke:6px #f4a000;
  text-shadow:0 0 30px #ffd100;
}
#num.dots{
  font-size:min(34vw,155px);
  color:#fff1a8;
}
#num.question{
  font-size:min(40vw,190px);
}
#num.big{
  font-size:min(65vw,300px);
}
#num.nocount{
  width:94%;
  font-size:clamp(31px,9vw,56px);
  white-space:nowrap;
  letter-spacing:-.05em;
  -webkit-text-stroke:2px #ff4b9d;
}
@keyframes numPop{
  from{
    transform:translate(-50%,-50%) scale(.6);
  }
  75%{
    transform:translate(-50%,-50%) scale(1.1);
  }
  to{
    transform:translate(-50%,-50%) scale(1);
  }
}

/* 基本演出 */

#dim,#black,#flash,#lightning,#noise{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
#dim{
  z-index:12;
  background:#0009;
}
#black{
  z-index:28;
  background:#000;
}
#noise{
  z-index:29;
  background:repeating-linear-gradient(
    0deg,#fff6 0 2px,#0005 2px 5px
  );
}
#lightning{
  z-index:30;
  background:linear-gradient(
    120deg,
    transparent 42%,
    #fff 47%,
    #ff5db6 49%,
    transparent 54%
  );
  filter:drop-shadow(0 0 24px #ff1494);
}
#flash{
  z-index:160;
  background:#fff;
}
.flashGo,.lightGo,.noiseGo{
  animation:flashAnim .4s ease-out;
}
@keyframes flashAnim{
  0%,100%{opacity:0}
  40%{opacity:1}
}

/* ハズレ */

#result{
  position:absolute;
  z-index:35;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:18px;
  background:#000a;
  text-align:center;
  pointer-events:none;
}
#result.show{
  display:flex;
}
#near{
  font-size:clamp(26px,9vw,56px);
  font-weight:1000;
  color:#ffe18d;
  text-shadow:0 0 18px #ff8a00;
}
#mainResult{
  position:relative;
  display:inline-block;
  white-space:nowrap;
  font-size:clamp(42px,15vw,82px);
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:3px #e00073;
  text-shadow:0 5px #8e0044,0 0 18px #ff379a;
}
#mainResult.appear{
  animation:resultPop .55s ease-out;
}
#message{
  font-size:clamp(14px,4vw,20px);
  font-weight:900;
  color:#ffe5aa;
  line-height:1.7;
  text-shadow:0 2px 5px #000;
}
@keyframes resultPop{
  from{
    opacity:0;
    transform:scale(.3);
  }
  65%{transform:scale(1.1)}
  to{
    opacity:1;
    transform:scale(1);
  }
}
#cracks{
  position:absolute;
  inset:-7%;
  width:114%;
  height:114%;
  opacity:0;
  pointer-events:none;
}
#cracks.show{
  opacity:1;
}
#result.shaking #mainResult{
  animation:shake .12s linear infinite;
}
@keyframes shake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-8px,5px)}
  50%{transform:translate(7px,-5px)}
  75%{transform:translate(-5px,-7px)}
}

/* 斬撃 */

.slash{
  position:absolute;
  z-index:90;
  left:-30%;
  top:48%;
  width:160%;
  height:22px;
  opacity:0;
  pointer-events:none;
  transform-origin:left center;
  background:linear-gradient(
    90deg,transparent,#ff87c9 10%,
    #fff 30%,#fff 75%,#ff1785,transparent
  );
  box-shadow:0 0 13px #fff,0 0 35px #ff0087;
}
#slash1{
  transform:rotate(-22deg) scaleX(0);
}
#slash2{
  transform:rotate(19deg) scaleX(0);
}
#slash1.go{
  animation:slashA .4s ease-out;
}
#slash2.go{
  animation:slashB .4s ease-out;
}
@keyframes slashA{
  0%{
    opacity:0;
    transform:rotate(-22deg) scaleX(0);
  }
  25%,75%{opacity:1}
  100%{
    opacity:0;
    transform:rotate(-22deg) scaleX(1);
  }
}
@keyframes slashB{
  0%{
    opacity:0;
    transform:rotate(19deg) scaleX(0);
  }
  25%,75%{opacity:1}
  100%{
    opacity:0;
    transform:rotate(19deg) scaleX(1);
  }
}

/* 当たり */

#hit{
  position:absolute;
  z-index:180;
  top:46%;
  left:50%;
  width:100%;
  text-align:center;
  white-space:nowrap;
  opacity:0;
  transform:translate(-50%,-50%) scale(.1);
  pointer-events:none;
  font-size:clamp(65px,23vw,155px);
  line-height:1.2;
  font-weight:1000;
  color:#fff2a8;
  -webkit-text-stroke:clamp(4px,1.2vw,7px) #ff266b;
  text-shadow:
    0 6px #ff9b00,
    0 12px #a90043,
    0 0 28px #fff;
}
#hit.go{
  animation:hitPop .7s
    cubic-bezier(.16,.7,.2,1.2) forwards;
}
@keyframes hitPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.1);
  }
  55%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.18);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}
#hitInfo{
  position:absolute;
  z-index:181;
  top:65%;
  left:4%;
  width:92%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}
#hitInfo.show{
  animation:info .6s forwards;
}
#hitName{
  display:inline-block;
  margin-top:9px;
  padding:10px 18px;
  border:1px solid #ffe391;
  border-radius:14px;
  background:#530b33e8;
  color:#ffec9c;
  font-size:clamp(15px,4.8vw,24px);
}
@keyframes info{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
#tap{
  position:absolute;
  z-index:182;
  bottom:9%;
  width:100%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}
#tap.show{
  animation:blink 1.2s infinite;
}
@keyframes blink{
  0%,100%{opacity:.4}
  50%{opacity:1}
}

/* 追加演出 */

#specialFX{
  position:absolute;
  inset:0;
  z-index:95;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
  overflow:hidden;
  background:#100516;
}
#specialFX.active{
  display:flex;
}
#specialFX .fxTitle{
  font-size:clamp(38px,12vw,86px);
  font-weight:1000;
  text-shadow:0 0 18px #ffbc33;
}
#specialFX .fxSub{
  font-size:clamp(16px,5vw,29px);
  font-weight:900;
  margin-top:22px;
  text-shadow:0 3px 8px #000;
}
#specialFX.preview{
  background:#100516
    url("./0EB99059-7515-429E-B34D-8BFCE53ED083.png")
    center/contain no-repeat;
}
#specialFX.preview .fxTitle{
  display:none;
}
#specialFX.rainbow{
  background:#100516
    url("./CC92EC2B-BC54-4037-9F8C-45DB1AE891E2.png")
    center/contain no-repeat;
  animation:rainbowHue 1s linear infinite;
}
#specialFX.rainbow .fxTitle{
  display:none;
}
@keyframes rainbowHue{
  to{filter:hue-rotate(360deg)}
}
#specialFX.freeze{
  background:#000;
}
#specialFX.push{
  background:radial-gradient(circle,#581000,#080008 80%);
}
#specialFX.push .fxTitle{
  font-size:clamp(25px,7vw,48px);
}
#specialFX .fxButton{
  pointer-events:auto;
  border:3px solid #ffdf78;
  border-radius:50%;
  width:min(59vw,245px);
  height:min(59vw,245px);
  background:
    url("./BF43324D-F195-4E15-A371-AA8862724654.png")
    center/contain no-repeat;
  color:transparent;
  font-size:60px;
  font-weight:1000;
  box-shadow:0 0 25px #f80,0 0 50px #d00;
  animation:pushPulse .45s infinite alternate;
}
@keyframes pushPulse{
  from{transform:scale(.96)}
  to{transform:scale(1.04)}
}

/* =========================
   画面完全破壊
========================= */

/*
  画面上にヒビを重ね、
  その下の表示をCanvas上に再現し、
  破片ごとに分割して飛ばす。
*/

#glassArea{
  position:absolute;
  inset:0;
  z-index:120;
  pointer-events:none;
  overflow:hidden;
  display:none;
}
#glassArea.active{
  display:block;
}

/* 元の割れ画像を使用 */

#glassCrack{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  background:
    url("./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png")
    center/contain no-repeat;
  mix-blend-mode:screen;
  filter:contrast(1.45) brightness(1.35);
  transform-origin:50% 48%;
}

#glassCrack.first{
  animation:firstCrack .38s steps(3,end) forwards;
}
#glassCrack.second{
  animation:secondCrack .42s steps(3,end) forwards;
}
@keyframes firstCrack{
  0%{
    opacity:0;
    clip-path:circle(0% at 50% 48%);
    transform:scale(.9);
  }
  100%{
    opacity:1;
    clip-path:circle(24% at 50% 48%);
    transform:scale(1);
  }
}
@keyframes secondCrack{
  0%{
    opacity:1;
    clip-path:circle(24% at 50% 48%);
    transform:scale(1);
  }
  100%{
    opacity:1;
    clip-path:circle(95% at 50% 48%);
    transform:scale(1.06);
  }
}

/* 画面ごと割れるようにするための
   カバーと破片用Canvas */

#glassUnder{
  position:absolute;
  inset:0;
  z-index:1;
  background:#0c0612;
  opacity:0;
}
#glassCanvas{
  position:absolute;
  inset:0;
  z-index:3;
  width:100%;
  height:100%;
}
#glassCrack{
  z-index:2;
}
#glassGlare{
  position:absolute;
  inset:0;
  z-index:4;
  opacity:0;
  background:radial-gradient(
    circle at 50% 48%,
    #fff 0%,
    #ffffff9c 13%,
    #b5edff55 42%,
    transparent 72%
  );
}
#glassGlare.go{
  animation:glassGlare .35s ease-out;
}
@keyframes glassGlare{
  0%,100%{opacity:0}
  24%{opacity:1}
}

#glassArea.rumbling{
  animation:glassRumble .09s linear infinite;
}
@keyframes glassRumble{
  0%{transform:translate(0,0)}
  25%{transform:translate(-5px,3px)}
  50%{transform:translate(5px,-4px)}
  75%{transform:translate(-3px,-3px)}
}

/* 選べるヒビ発生タイミングの表示 */

#breakHint{
  position:absolute;
  z-index:125;
  bottom:17%;
  width:100%;
  text-align:center;
  color:#dff9ff;
  font-size:14px;
  font-weight:900;
  opacity:0;
  pointer-events:none;
  text-shadow:0 0 12px #fff,0 2px 5px #000;
}

/* 流れ星とキラキラ */

.shooting{
  position:absolute;
  z-index:32;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px #fff,0 0 25px #ff62b9;
  pointer-events:none;
  animation:shoot .9s linear forwards;
}
.shooting::after{
  content:"";
  position:absolute;
  right:0;
  top:2px;
  width:75px;
  height:2px;
  background:linear-gradient(90deg,transparent,#fff);
}
@keyframes shoot{
  from{
    opacity:0;
    transform:translate(0,0);
  }
  20%{opacity:1}
  to{
    opacity:0;
    transform:translate(240px,370px);
  }
}
.particle{
  position:absolute;
  z-index:100;
  pointer-events:none;
  color:#fff;
  font-size:25px;
  text-shadow:0 0 12px #fff,0 0 20px #ff2194;
  animation:particleFly 1.1s ease-out forwards;
}
@keyframes particleFly{
  from{
    opacity:1;
    transform:translate(0,0) rotate(0);
  }
  to{
    opacity:0;
    transform:
      translate(var(--dx),var(--dy))
      rotate(var(--rot)) scale(.2);
  }
}

/* 期待度 */

#modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000d;
  padding:15px;
}
#modal.open{
  display:flex;
}
#guide{
  width:min(94vw,430px);
  max-height:88dvh;
  overflow:auto;
  padding:20px 14px;
  text-align:center;
  border:2px solid #ff8bc5;
  border-radius:22px;
  background:linear-gradient(#580031,#1b0013);
}
#guide h2{
  color:#ffe6a1;
}
#guide p{
  padding:8px 0;
  border-bottom:1px solid #ffffff30;
  font-weight:800;
}
#guide em{
  color:#ffe58d;
  font-style:normal;
}
#closeGuide{
  margin:12px;
  padding:10px 50px;
  border:1px solid #fff;
  border-radius:25px;
  background:#ed2c8d;
  color:#fff;
}
</style>
</head>

<body>

<div id="stage">

  <div id="start">
    <div id="demoLabel">画面破壊テスト版</div>

    <button id="guideBtn">
      演出期待度を見る
    </button>

    <div id="rate">
      画面破壊テスト
      <b>当たり確定</b>
      STARTで毎回発生
    </div>

    <button id="startBtn">START</button>
  </div>

  <div id="dim"></div>
  <div id="num"></div>
  <div id="black"></div>
  <div id="noise"></div>
  <div id="lightning"></div>

  <div id="result">
    <div id="near"></div>

    <div id="mainResult">
      ハズレ
      <svg id="cracks" viewBox="0 0 320 130"
        preserveAspectRatio="none">
        <g fill="none" stroke="white" stroke-width="3">
          <path d="M155 0 L143 24 L169 38 L147 56 L180 77 L155 100 L175 130"/>
          <path d="M143 24 L106 15 L88 35 L54 28"/>
          <path d="M169 38 L208 22 L229 44 L269 29"/>
          <path d="M147 56 L107 70 L83 63 L40 93"/>
          <path d="M180 77 L220 88 L244 74 L296 96"/>
        </g>
      </svg>
    </div>

    <div id="message"></div>
  </div>

  <div id="slash1" class="slash"></div>
  <div id="slash2" class="slash"></div>

  <div id="specialFX">
    <div class="fxTitle"></div>
    <div class="fxSub"></div>
  </div>

  <!-- ガラス破壊 -->
  <div id="glassArea">
    <div id="glassUnder"></div>
    <div id="glassCrack"></div>
    <canvas id="glassCanvas"></canvas>
    <div id="glassGlare"></div>
  </div>

  <div id="breakHint"></div>
  <div id="flash"></div>

  <div id="hit">当たり</div>

  <div id="hitInfo">
    ✨ 今回の当選演出 ✨
    <div><span id="hitName"></span></div>
  </div>

  <div id="tap">画面をタップして戻る</div>

</div>

<div id="modal">
  <div id="guide">
    <h2>✨ 演出期待度 ✨</h2>
    <p>⚡ ピンク稲妻 → <em>チャンス</em></p>
    <p>❓「？」 → <em>チャンス</em></p>
    <p>🌑 ブラックアウト → <em>大チャンス</em></p>
    <p>🎬 次回予告 → <em>約95%</em></p>
    <p>🌈 レインボー → <em>当たり確定</em></p>
    <p>💥 画面破壊 → <em>当たり確定</em></p>
    <p>🔴 デカPUSH → <em>チャンス</em></p>
    <p>⚔️ 斬撃＋当たり → <em>当たり確定</em></p>
    <p style="color:#ffe58d">
      ※この版は画面破壊を試すため、
      STARTで毎回当たります。
    </p>
    <button id="closeGuide">閉じる</button>
  </div>
</div>

<script>
"use strict";

/* ==========================
   設定
========================== */

/*
  true  = 画面破壊テスト
          毎回必ず当たり

  false = 通常モード
          当選確率1/25

  完成演出を見るため、
  今はtrueにしています。
*/

const TEST_MODE = true;

const BACKGROUND_IMAGE =
  "./9E28B31B-C619-4F41-AB55-91C025168D02.png";

const CRACK_IMAGE =
  "./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png";

const TENSION_SOUND =
  "./Tension.mp3";

const HIT_SOUND =
  "./hit_music_final.mp3";

/*
  MOVはSafariで音声のみの再生に
  失敗する場合があるため、
  同名MP3がある場合はそちらを優先。

  今GitHubにあるMOVも予備として指定。
*/

const GLASS_SOUND_MP3 =
  "./glass_crack_crack_shatter_v3.mp3";

const GLASS_SOUND_MOV =
  "./glass_crack_crack_shatter_v3_preview.mov";

/* ==========================
   基本
========================== */

const $ = id => document.getElementById(id);

const wait = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

const rnd = (min,max) =>
  Math.floor(
    Math.random()*(max-min+1)
  )+min;

const roll = chance =>
  Math.random()<chance;

const stage = $("stage");
const num = $("num");
const result = $("result");
const main = $("mainResult");
const near = $("near");
const message = $("message");
const black = $("black");
const fx = $("specialFX");

const glassArea = $("glassArea");
const glassCrack = $("glassCrack");
const glassUnder = $("glassUnder");
const glassGlare = $("glassGlare");
const glassCanvas = $("glassCanvas");
const ctx = glassCanvas.getContext("2d");

let busy = false;
let tapReady = false;
let runId = 0;

/* ==========================
   音声
========================== */

const tensionAudio = new Audio(TENSION_SOUND);
const hitAudio = new Audio(HIT_SOUND);
const glassAudio = new Audio();

tensionAudio.loop = true;
tensionAudio.volume = .7;

hitAudio.volume = 1;
glassAudio.volume = 1;

tensionAudio.preload = "auto";
hitAudio.preload = "auto";

let glassSoundChosen = false;
let glassSoundAvailable = false;

async function chooseGlassSound(){

  if(glassSoundChosen)return;

  glassSoundChosen = true;

  /*
    MP3が存在すればMP3を使用。
    なければMOVを試す。
  */

  for(const url of [
    GLASS_SOUND_MP3,
    GLASS_SOUND_MOV
  ]){

    try{
      const response = await fetch(url,{
        method:"HEAD",
        cache:"no-store"
      });

      if(response.ok){
        glassAudio.src = url;
        glassAudio.load();
        glassSoundAvailable = true;
        return;
      }
    }catch(e){}
  }

  console.warn(
    "ガラス破壊音のファイルが見つかりません"
  );
}

function playAudio(audio){
  try{
    audio.pause();
    audio.currentTime = 0;

    const promise = audio.play();

    if(promise && promise.catch){
      promise.catch(error=>{
        console.warn("音声再生:",error);
      });
    }
  }catch(e){
    console.warn(e);
  }
}

function stopAudio(audio){
  try{
    audio.pause();
    audio.currentTime = 0;
  }catch(e){}
}

}

  stopAudio(tensionAudio);

/*

const snapshot = document.createElement("canvas");

function resizeCanvas(){
  cw = stage.clientWidth;

    window.devicePixelRatio || 1,

}

/* ==========================

function drawBackground(target){
  target.fillStyle = "#170010";
  target.fillRect(0,0,cw,ch);

  if(bgImage.complete &&
     bgImage.naturalWidth>0){

    const scale = ch/bgImage.naturalHeight;

    const w = bgImage.naturalWidth*scale;

    target.drawImage(
      bgImage,
      (cw-w)/2,
      0,

    );

}

/* ==========================
   ガラス破片作成
========================== */

let shards = [];
let dust = [];

function createShards(){

  shards = [];
  dust = [];

  const centerX = cw*.5;
  const centerY = ch*.48;

  /*
    画面を多数の不規則な三角形に分ける。

    各破片に元の画面を映して
    バラバラに飛ばす。
  */

  const maxRadius =
    Math.sqrt(cw*cw+ch*ch);

  const rings = [
    0,
    38,
    90,
    160,
    270,
    maxRadius
  ];

  const segments = [
    16,22,30,38,46
  ];

  for(let ring=0;ring<rings.length-1;ring++){

    const count = segments[ring];

    const inner = rings[ring];
    const outer = rings[ring+1];

    for(let i=0;i<count;i++){

      const a1 =
        i/count*Math.PI*2;

      const a2 =
        (i+1)/count*Math.PI*2;

      const p1 = {
        x:centerX+Math.cos(a1)*inner,
        y:centerY+Math.sin(a1)*inner
      };

      const p2 = {
        x:centerX+Math.cos(a1)*outer,
        y:centerY+Math.sin(a1)*outer
      };

      const p3 = {
        x:centerX+Math.cos(a2)*outer,
        y:centerY+Math.sin(a2)*outer
      };

      const p4 = {
        x:centerX+Math.cos(a2)*inner,
        y:centerY+Math.sin(a2)*inner
      };

      /*
        1区画を2つの三角形に分割。
      */

      const triangles = [
        [p1,p2,p3],
        [p1,p3,p4]
      ];

      for(const points of triangles){

        const mx = points.reduce(
          (sum,p)=>sum+p.x,0
        )/3;

        const my = points.reduce(
          (sum,p)=>sum+p.y,0
        )/3;

        const angle = Math.atan2(
          my-centerY,
          mx-centerX
        );

        const speed =
          180+Math.random()*430;

        shards.push({
          points,
          mx,my,

          vx:
            Math.cos(angle)*speed+
            (Math.random()-.5)*200,

          vy:
            Math.sin(angle)*speed+
            (Math.random()-.5)*180,

          rotation:
            (Math.random()-.5)*11,

          depth:
            .6+Math.random()*1.8,

          duration:
            .85+Math.random()*.65,

          delay:
            Math.random()*.12,

          glint:
            Math.random()
        });
      }
    }
  }

  /*
    細かいガラス粉
  */

  for(let i=0;i<240;i++){

    const angle = Math.random()*Math.PI*2;
    const speed = 140+Math.random()*640;

    dust.push({
      x:centerX+(Math.random()-.5)*35,
      y:centerY+(Math.random()-.5)*35,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      size:.5+Math.random()*2.5,
      life:.45+Math.random()*1.1,
      delay:Math.random()*.2,

      color:
        Math.random()<.5
          ? "#fff"
          : "#c8efff"
    });
  }
}

/* ==========================
   1枚の破片を描画
========================== */

function renderShard(shard,elapsed){

  const t = elapsed-shard.delay;

  if(t<0)return;

  const p = t/shard.duration;

  if(p>=1)return;

  const dx = shard.vx*t;
  const dy = shard.vy*t+150*t*t;

  const angle = shard.rotation*t;

  /*
    手前へ飛び出すにつれ
    破片を大きくする。
  */

  const scale =
    1+p*shard.depth;

  const opacity =
    Math.pow(1-p,1.15);

  ctx.save();

  ctx.globalAlpha = opacity;

  ctx.translate(
    shard.mx+dx,
    shard.my+dy
  );

  ctx.rotate(angle);
  ctx.scale(scale,scale);

  ctx.translate(
    -shard.mx,
    -shard.my
  );

  ctx.beginPath();

  for(let i=0;i<shard.points.length;i++){

    const pt = shard.points[i];

    if(i===0){
      ctx.moveTo(pt.x,pt.y);
    }else{
      ctx.lineTo(pt.x,pt.y);
    }
  }

  ctx.closePath();

  /*
    三角形の内側に
    割れる前の画面を描く。
  */

  ctx.save();
  ctx.clip();

  ctx.drawImage(
    snapshot,
    0,0,snapshot.width,snapshot.height,
    0,0,cw,ch
  );

  /*
    ガラスの反射を重ねる。
  */

  const gradient = ctx.createLinearGradient(
    shard.mx-35,
    shard.my-35,
    shard.mx+35,
    shard.my+35
  );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,.32)"
  );

  gradient.addColorStop(
    .4,
    "rgba(175,225,255,.05)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,.20)"
  );

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.restore();

  /*
    光るガラスの輪郭
  */

  ctx.strokeStyle =
    "rgba(235,250,255,.9)";

  ctx.lineWidth = 1.25;

  ctx.shadowColor =
    "rgba(160,225,255,.95)";

  ctx.shadowBlur = 5;

  ctx.stroke();

  /*
    一部の破片を強く反射
  */

  if(shard.glint>.76){

    const a = shard.points[0];
    const b = shard.points[1];

    ctx.beginPath();

    ctx.moveTo(
      a.x*.8+b.x*.2,
      a.y*.8+b.y*.2
    );

    ctx.lineTo(
      a.x*.2+b.x*.8,
      a.y*.2+b.y*.8
    );

    ctx.strokeStyle =
      "rgba(255,255,255,.88)";

    ctx.lineWidth = 1;

    ctx.stroke();
  }

  ctx.restore();
}

/* ==========================
   ガラス粉
========================== */

function renderDust(elapsed){

  ctx.save();

  for(const d of dust){

    const t = elapsed-d.delay;

    if(t<0 || t>d.life)continue;

    const p = t/d.life;

    ctx.globalAlpha = 1-p;
    ctx.fillStyle = d.color;

    ctx.beginPath();

    ctx.arc(
      d.x+d.vx*t,
      d.y+d.vy*t+170*t*t,
      d.size*(1-p*.4),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

/* ==========================
   画面破片アニメーション
========================== */

function flyGlass(){

  createShards();

  return new Promise(resolve=>{

    const startTime = performance.now();

    function frame(now){

      const elapsed =
        (now-startTime)/1000;

      ctx.clearRect(0,0,cw,ch);

      for(const shard of shards){
        renderShard(shard,elapsed);
      }

      renderDust(elapsed);

      if(elapsed<1.65){

        animationId =
          requestAnimationFrame(frame);

      }else{

        animationId = null;

        ctx.clearRect(0,0,cw,ch);

        resolve();
      }
    }

    animationId = requestAnimationFrame(frame);
  });
}

async function glassBreak(){

  /*
    ヒビが発生する直前の画面を保存。
    数字やハズレも描画対象にする。
  */

  captureDisplay();

  stopTension();

  glassArea.classList.add("active");

  glassCrack.className = "";
  glassUnder.style.opacity = "0";

  /*
    効果音を開始。
    MOVだけの環境ではブラウザにより
    再生できない可能性あり。
  */

  if(glassSoundAvailable){
    playAudio(glassAudio);
  }

  /* 1発目：ピキッ！ */

  await wait(90);

  glassCrack.classList.add("first");

  await wait(430);

  /* 2発目：ピキッ！ */

  glassCrack.classList.remove("first");

  void glassCrack.offsetWidth;

  glassCrack.classList.add("second");

  await wait(500);

  /* 3発目：パリーン！！ */

  glassArea.classList.add("rumbling");

  anim(glassGlare,"go");

  /*
    元の画面を暗くし、
    ガラス片が飛んでいく奥に
    暗い空間が見えるようにする。
  */

  glassUnder.style.opacity = "1";

  glassCrack.style.opacity = "0";

  /*
    元の数字やハズレ表示を
    破片の裏に隠す。
  */

  num.style.visibility = "hidden";

  const hadResult =
    result.classList.contains("show");

  if(hadResult){
    result.style.visibility = "hidden";
  }

  /*
    保存した元の画面を破片に分け、
    四方へ飛ばす。
  */

  await flyGlass();

  glassArea.classList.remove("rumbling");

  glassCrack.className = "";
  glassCrack.style.opacity = "";

  glassArea.classList.remove("active");

  glassUnder.style.opacity = "0";

  num.style.visibility = "";
  result.style.visibility = "";

  hideFalseMiss();
  clearNum();

  await flash();
}

  anim($("cracks"),"show");
  await wait(500);

  result.classList.add("shaking");
  await wait(600);

  await glassBreak();
  await hit(winNames[2]);
}

async function revivalDouble(won){
  await count();
  await falseMissPause(1100);
  await noCount();
  await falseMissPause(1100);
  await noCount();

  if(won){
    await hit(winNames[3]);
  }else{
    await miss(true);
  }
}

  if(won){

  }else{

}

/* ==========================
   通常モード当たり振り分け
========================== */

async function regularWinRoute(){

  const r = Math.random();

  if(r<.19){
    return guaranteedGlassHit();
  }

  if(r<.38){
    return newRoute("preview",true);
  }

  if(r<.46){
    return newRoute("rainbowBurst",true);
  }

  if(r<.54){
    return newRoute("rainbow",true);
  }

  if(r<.70){

    const kinds = [
      "freeze",
      "push",
      "promotion",
      "reverse",
      "odd"
    ];

    return newRoute(
      kinds[rnd(0,kinds.length-1)],
      true
    );
  }

  return winRoute(rnd(0,43));
}

async function missRoute(){

  if(roll(.08)){
    return revivalNoCount(false);
  }

  if(roll(.027)){
    return revivalDouble(false);
  }

  const r = Math.random();

  if(r<.30){
    await count();
    return miss(false);
  }

  if(r<.65){
    return weakMiss(rnd(0,9));
  }

  return strongMiss(rnd(0,5));
}

/* ==========================
   RESET
========================== */

function reset(){

  runId++;

  stopMusic();

  busy = false;
  tapReady = false;

  clearNum();
  fxHide();
  hideFalseMiss();

  $("start").style.display = "block";

  $("hit").classList.remove("go");
  $("hitInfo").classList.remove("show");

  $("hitName").textContent = "";
  $("tap").classList.remove("show");

  $("dim").style.opacity = "0";
  black.style.opacity = "0";

  $("flash").classList.remove("flashGo");

  $("slash1").classList.remove("go");
  $("slash2").classList.remove("go");

  glassArea.className = "";
  glassCrack.className = "";
  glassCrack.style.opacity = "";

  glassUnder.style.opacity = "0";

  num.style.visibility = "";
  result.style.visibility = "";

  if(animationId!==null){
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if(ctx){
    ctx.clearRect(0,0,cw,ch);
  }

  stage.querySelectorAll(
    ".particle,.shooting"
  ).forEach(el=>el.remove());
}

/* ==========================
   GUIDE
========================== */

$("guideBtn").onclick = ()=>{
  $("modal").classList.add("open");
};

$("closeGuide").onclick = ()=>{
  $("modal").classList.remove("open");
};

$("modal").onclick = e=>{
  if(e.target===$("modal")){
    $("modal").classList.remove("open");
  }
};

/* ==========================
   当たり後のタップ
========================== */

stage.onclick = ()=>{
  if(tapReady){
    reset();
  }
};

/* ==========================
   START
========================== */

$("startBtn").onclick = async e=>{

  e.stopPropagation();

  if(busy)return;

  busy = true;
  tapReady = false;

  const id = ++runId;

  $("start").style.display = "none";

  /*
    TEST_MODE=true の場合、
    100%当たり。

    falseの場合は1/25。
  */

  const won = TEST_MODE
    ? true
    : roll(1/25);

  try{

    /*
      効果音ファイルを確認。
      取得できなくても
      アニメーションは実行する。
    */

    await chooseGlassSound();

    if(id!==runId)return;

    tension();

    if(roll(.28)){
      stars(rnd(2,9));
    }

    if(TEST_MODE){

      /*
        テスト中は必ず
        完全画面破壊で当たり。
      */

      await guaranteedGlassHit();

    }else if(won){

      /*
        通常モード。
        1/25で当たった場合。
      */

      await regularWinRoute();

    }else{

      /*
        通常モードのハズレ。
      */

      if(roll(1/2400)){

        await newRoute("preview",false);

      }else{

        await missRoute();
      }
    }

  }catch(error){

    console.error(error);

    if(id===runId){
      reset();
    }
  }
};

/* ==========================
   初期化
========================== */

resizeCanvas();
reset();
