<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120008">
<title>Red Peanuts 4th Anniversary</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
body{touch-action:manipulation;}

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
  background-color:#120008;
  transform-origin:center center;
}

#darkOverlay,#hitDark,#impactWhite,#flash,#noise,#bgDark,#lightning,#logoGlow{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
#darkOverlay{z-index:30;background:#000;}
#hitDark{z-index:31;background:rgba(0,0,0,.92);}
#impactWhite{z-index:60;background:#fff;}
#flash{z-index:61;background:rgba(255,255,255,.95);}
#bgDark{z-index:15;background:rgba(0,0,0,.72);}
#noise{
  z-index:45;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,.13) 0,
    rgba(255,255,255,.13) 1px,
    rgba(0,0,0,.15) 2px,
    rgba(0,0,0,.15) 4px
  );
  mix-blend-mode:screen;
}
#lightning{
  z-index:46;
  background:linear-gradient(
    118deg,
    transparent 42%,
    rgba(255,255,255,.98) 46%,
    #ff4fa7 48%,
    transparent 52%
  );
  filter:drop-shadow(0 0 14px #ff1b8d);
}
#logoGlow{
  z-index:20;
  inset:0 0 auto 0;
  height:36%;
  background:radial-gradient(
    ellipse at 50% 25%,
    rgba(255,255,255,.98) 0%,
    rgba(255,88,176,.70) 13%,
    rgba(255,0,115,.24) 31%,
    transparent 58%
  );
}

/* START */

#startScreen{
  position:absolute;
  inset:0;
  z-index:10;
}
#startButton{
  position:absolute;
  left:50%;
  bottom:8.5%;
  transform:translateX(-50%);
  width:min(78vw,390px);
  height:72px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:40px;
  background:linear-gradient(180deg,rgba(255,85,171,.97),rgba(215,0,103,.97));
  box-shadow:
    0 0 12px rgba(255,255,255,.75),
    0 0 26px rgba(255,0,125,.85),
    inset 0 2px 7px rgba(255,255,255,.55);
  color:#fff;
  font-size:28px;
  font-weight:800;
  letter-spacing:3px;
}
#probability{
  position:absolute;
  width:100%;
  bottom:18.5%;
  text-align:center;
  color:#fff;
  font-weight:800;
  font-size:15px;
  line-height:1.55;
  text-shadow:0 2px 4px #000,0 0 8px #ff278c;
}

/* COUNTDOWN */

#number{
  position:absolute;
  z-index:25;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  transform-origin:center;
  width:100%;
  text-align:center;
  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;
  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);
  opacity:0;
}
#number.show{
  opacity:1;
  animation:numberPop .20s ease-out;
}
#number.big{
  transform:translate(-50%,-50%) scale(1.28);
}
#number.crack{
  text-shadow:
    -5px -3px 0 rgba(255,255,255,.7),
    4px 4px 0 #b50059,
    0 9px 0 #8b003e,
    0 18px 8px rgba(60,0,28,.75);
}
#number.pink{color:#ffb5dc;}
#number.red{color:#ff315f;}
#number.gold{
  color:#fff0a8;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ffb400;
  text-shadow:
    0 6px 0 #d48300,
    0 12px 0 #9d5700,
    0 18px 8px rgba(60,25,0,.72);
}
#number.dots{font-size:90px;}
#number.question{font-size:min(35vw,175px);}

@keyframes numberPop{
  0%{transform:translate(-50%,-50%) scale(.78);}
  70%{transform:translate(-50%,-50%) scale(1.06);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

/* SLASH */

#slash1,#slash2{
  position:absolute;
  z-index:55;
  left:-30%;
  top:50%;
  width:160%;
  height:31px;
  opacity:0;
  transform:rotate(-19deg) scaleX(0);
  transform-origin:left center;
  background:linear-gradient(
    90deg,
    transparent,
    #fff 8%,
    #fff 43%,
    #ff4aa5 68%,
    transparent
  );
  box-shadow:
    0 0 9px #fff,
    0 0 22px #fff,
    0 0 40px #ff1687,
    0 0 70px #ff1687;
}
#slash2{
  top:54%;
  transform:rotate(17deg) scaleX(0);
}
.slashGo{animation:slashGo .32s cubic-bezier(.1,.7,.2,1);}
#slash2.slashGo{animation:slashGo2 .32s cubic-bezier(.1,.7,.2,1);}

@keyframes slashGo{
  0%{opacity:0;transform:rotate(-19deg) scaleX(0);}
  12%{opacity:1;}
  72%{opacity:1;transform:rotate(-19deg) scaleX(1);}
  100%{opacity:0;transform:rotate(-19deg) scaleX(1.06);}
}
@keyframes slashGo2{
  0%{opacity:0;transform:rotate(17deg) scaleX(0);}
  12%{opacity:1;}
  72%{opacity:1;transform:rotate(17deg) scaleX(1);}
  100%{opacity:0;transform:rotate(17deg) scaleX(1.06);}
}

/* HIT */

#hitText{
  position:absolute;
  z-index:70;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%) scale(.1);
  width:180vw;
  text-align:center;
  color:#fff7bd;
  font-size:min(43vw,220px);
  font-weight:1000;
  -webkit-text-stroke:clamp(5px,1.5vw,9px) #ff245f;
  text-shadow:
    0 5px 0 #ff9a00,
    0 10px 0 #b50c22,
    0 0 18px #fff,
    0 0 42px #ff005d,
    0 0 75px #ff9a00;
  opacity:0;
}
#hitText.go{
  animation:hitPop .68s cubic-bezier(.15,.75,.2,1.4) forwards;
}
@keyframes hitPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.08);}
  48%{opacity:1;transform:translate(-50%,-50%) scale(1.30);}
  72%{transform:translate(-50%,-50%) scale(.92);}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1);}
}
.hitShake{animation:hitShake .48s linear;}
@keyframes hitShake{
  0%{transform:translate(0,0)}
  10%{transform:translate(-14px,8px)}
  20%{transform:translate(13px,-9px)}
  30%{transform:translate(-11px,-5px)}
  40%{transform:translate(14px,7px)}
  50%{transform:translate(-8px,4px)}
  60%{transform:translate(9px,-6px)}
  70%{transform:translate(-5px,3px)}
  80%{transform:translate(5px,-2px)}
  100%{transform:translate(0,0)}
}
.hitZoom{animation:hitZoom .55s ease-out;}
@keyframes hitZoom{
  0%{transform:scale(1)}
  45%{transform:scale(1.07)}
  100%{transform:scale(1)}
}

/* STARS */

.star{
  position:absolute;
  z-index:42;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 7px #fff,
    0 0 15px #ff78c1,
    0 0 26px #ff1687;
  pointer-events:none;
}
.star::after{
  content:"";
  position:absolute;
  right:1px;
  top:50%;
  width:80px;
  height:2px;
  transform:translateY(-50%) rotate(45deg);
  transform-origin:right center;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.92));
}
.star.fly{animation:starFly var(--dur) linear forwards;}
@keyframes starFly{
  from{opacity:0;transform:translate(0,0);}
  8%{opacity:1;}
  85%{opacity:1;}
  to{opacity:0;transform:translate(var(--dx),var(--dy));}
}

/* TREASURE */

#treasureScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background-image:url("./F7895B75-5746-46F2-85F2-049F10C9FB87.png");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  overflow:hidden;
}
#treasureScreen.show{display:block;}
#treasureShade{
  position:absolute;
  inset:0;
  background:linear-gradient(
    180deg,
    rgba(0,0,0,.03),
    rgba(0,0,0,.02) 55%,
    rgba(0,0,0,.24)
  );
  pointer-events:none;
}
#treasureTitle{
  position:absolute;
  top:8.5%;
  left:0;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:clamp(24px,7vw,40px);
  font-weight:1000;
  text-shadow:0 0 8px #ff268e,0 0 18px #ff268e,0 3px 4px #000;
}
#treasureSub{
  position:absolute;
  top:14.3%;
  left:0;
  width:100%;
  text-align:center;
  color:#fff6c8;
  font-size:clamp(15px,4vw,22px);
  font-weight:800;
  text-shadow:0 2px 5px #000,0 0 9px #ff2a8e;
}
.chestTap{
  position:absolute;
  z-index:105;
  top:35%;
  height:33%;
  border:0;
  background:transparent;
}
#chest0{left:2%;width:31%;}
#chest1{left:34.5%;width:31%;}
#chest2{right:2%;width:31%;}

.chestGlow{
  position:absolute;
  z-index:102;
  top:33%;
  height:37%;
  width:31%;
  border-radius:45%;
  opacity:0;
  pointer-events:none;
  background:radial-gradient(
    ellipse,
    rgba(255,255,255,.95) 0%,
    rgba(255,232,113,.72) 19%,
    rgba(255,80,168,.28) 45%,
    transparent 70%
  );
  filter:drop-shadow(0 0 16px #fff) drop-shadow(0 0 28px #ffcf36);
}
#glow0{left:2%}
#glow1{left:34.5%}
#glow2{right:2%}
.chestGlow.on{animation:chestGlow .65s ease-in-out infinite alternate;}
@keyframes chestGlow{
  from{opacity:.45;transform:scale(.92);}
  to{opacity:1;transform:scale(1.09);}
}

#treasureBeam{
  position:absolute;
  z-index:103;
  left:50%;
  top:22%;
  width:18%;
  height:58%;
  transform:translateX(-50%) scaleY(0);
  transform-origin:center bottom;
  opacity:0;
  background:linear-gradient(
    180deg,
    transparent,
    rgba(255,255,255,.95) 45%,
    rgba(255,228,91,.92)
  );
  filter:blur(8px);
}
#treasureBeam.go{animation:beamGo .75s ease-out;}
@keyframes beamGo{
  0%{opacity:0;transform:translateX(-50%) scaleY(0);}
  35%{opacity:1;}
  100%{opacity:0;transform:translateX(-50%) scaleY(1);}
}

#treasureBurst{
  position:absolute;
  z-index:104;
  left:50%;
  top:50%;
  width:30px;
  height:30px;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(.1);
  opacity:0;
  background:#fff;
  box-shadow:0 0 25px #fff,0 0 55px #ffdd55,0 0 90px #ff228b;
}
#treasureBurst.go{animation:burstGo .7s ease-out;}
@keyframes burstGo{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.1);}
  55%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) scale(13);}
}

/* RANK */

.rankLabel{
  position:absolute;
  z-index:115;
  top:67.5%;
  width:29%;
  text-align:center;
  font-weight:1000;
  font-size:clamp(27px,8vw,44px);
  opacity:0;
  transform:scale(.4);
  text-shadow:0 3px 4px #000,0 0 9px #000;
}
.rankLabel.show{
  animation:rankShow .42s cubic-bezier(.15,.8,.25,1.3) forwards;
}
@keyframes rankShow{
  to{opacity:1;transform:scale(1);}
}
#rank0{left:3%}
#rank1{left:35.5%}
#rank2{right:3%}
.rank1{color:#ffe26b;-webkit-text-stroke:2px #a66300;}
.rank2{color:#f2f2f2;-webkit-text-stroke:2px #777;}
.rank3{color:#ffb26d;-webkit-text-stroke:2px #9d4100;}

#selectedBadge{
  position:absolute;
  z-index:116;
  top:29%;
  padding:7px 12px;
  border-radius:20px;
  background:linear-gradient(180deg,#fff8b5,#ffb51b);
  color:#7b2900;
  font-size:12px;
  font-weight:1000;
  box-shadow:0 0 9px #fff,0 0 20px #ffca36;
  opacity:0;
  transform:translateX(-50%);
}
#selectedBadge.show{opacity:1;}

#resultBox{
  position:absolute;
  z-index:120;
  left:50%;
  bottom:11%;
  transform:translateX(-50%);
  width:88%;
  text-align:center;
  color:#fff;
  font-size:clamp(18px,5vw,28px);
  font-weight:900;
  text-shadow:0 2px 4px #000,0 0 12px #ff2c91;
  opacity:0;
}
#resultBox.show{opacity:1;}
#resultMain{
  display:block;
  margin-top:5px;
  font-size:clamp(34px,10vw,58px);
  font-weight:1000;
  color:#fff4a8;
  text-shadow:
    0 3px 0 #e37900,
    0 0 14px #fff,
    0 0 26px #ff2c91;
}
#nextButton{
  position:absolute;
  z-index:125;
  left:50%;
  bottom:3.2%;
  transform:translateX(-50%);
  width:72%;
  height:58px;
  border:2px solid #fff;
  border-radius:30px;
  background:linear-gradient(180deg,#ff5caf,#d80068);
  color:#fff;
  font-size:20px;
  font-weight:900;
  box-shadow:0 0 15px #ff2b91;
  display:none;
}

.chestDim{
  position:absolute;
  z-index:106;
  top:32%;
  height:39%;
  width:31%;
  background:rgba(0,0,0,.48);
  opacity:0;
  pointer-events:none;
  border-radius:24px;
}
#dim0{left:2%}
#dim1{left:34.5%}
#dim2{right:2%}
.chestDim.on{opacity:1;}

.fadeWhite{animation:fadeWhite .23s ease-out;}
@keyframes fadeWhite{
  0%{opacity:0}
  40%{opacity:1}
  100%{opacity:0}
}
.noiseGo{animation:noiseGo .55s steps(2,end);}
@keyframes noiseGo{
  0%{opacity:0}
  20%{opacity:.75}
  38%{opacity:.18}
  55%{opacity:.85}
  70%{opacity:.25}
  100%{opacity:0}
}
.lightningGo{animation:lightningGo .4s ease-out;}
@keyframes lightningGo{
  0%{opacity:0}
  15%{opacity:1}
  35%{opacity:.1}
  52%{opacity:.9}
  100%{opacity:0}
}
.logoGlowGo{animation:logoGlowGo .85s ease-out;}
@keyframes logoGlowGo{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}
.bgDarkGo{opacity:1!important;}
</style>
</head>

<body>

<div id="stage">
  <div id="bgDark"></div>
  <div id="logoGlow"></div>

  <div id="startScreen">
    <div id="probability">
      完全抽選 1/20<br>
      毎回独立抽選
    </div>

    <button id="startButton">START</button>
  </div>

  <div id="number"></div>
  <div id="darkOverlay"></div>
  <div id="hitDark"></div>
  <div id="noise"></div>
  <div id="lightning"></div>
  <div id="slash1"></div>
  <div id="slash2"></div>
  <div id="impactWhite"></div>
  <div id="flash"></div>
  <div id="hitText">当たり</div>
</div>

<div id="treasureScreen">
  <div id="treasureShade"></div>
  <div id="treasureTitle">宝箱を1つ選べ！</div>
  <div id="treasureSub">好きな宝箱をタップ！</div>

  <div class="chestGlow" id="glow0"></div>
  <div class="chestGlow" id="glow1"></div>
  <div class="chestGlow" id="glow2"></div>

  <div class="chestDim" id="dim0"></div>
  <div class="chestDim" id="dim1"></div>
  <div class="chestDim" id="dim2"></div>

  <button class="chestTap" id="chest0"></button>
  <button class="chestTap" id="chest1"></button>
  <button class="chestTap" id="chest2"></button>

  <div id="treasureBeam"></div>
  <div id="treasureBurst"></div>

  <div class="rankLabel" id="rank0"></div>
  <div class="rankLabel" id="rank1"></div>
  <div class="rankLabel" id="rank2"></div>

  <div id="selectedBadge">あなたが選んだ箱</div>

  <div id="resultBox">
    あなたの結果
    <span id="resultMain"></span>
  </div>

  <button id="nextButton">NEXT</button>
</div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r,ms));
const rand = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const chance = p => Math.random()<p;

const stage=$("stage");
const startScreen=$("startScreen");
const startButton=$("startButton");
const number=$("number");
const darkOverlay=$("darkOverlay");
const hitDark=$("hitDark");
const slash1=$("slash1");
const slash2=$("slash2");
const impactWhite=$("impactWhite");
const flash=$("flash");
const hitText=$("hitText");
const noise=$("noise");
const lightning=$("lightning");
const bgDark=$("bgDark");
const logoGlow=$("logoGlow");
const treasureScreen=$("treasureScreen");

let playing=false;
let playToken=0;
let starTimers=[];

function restartAnimation(el,cls){
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

function resetNumberStyle(){
  number.className="";
  number.style.color="";
  number.style.opacity="";
  number.style.transform="";
}

/* AUDIO */

let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let hitSource=null;
let audioLoaded=false;

function ensureAudioContext(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AC();
  }
  return audioCtx;
}

async function prepareAudio(){
  if(audioLoaded)return;

  ensureAudioContext();

  const [tensionRes,hitRes]=await Promise.all([
    fetch("./Tension.mp3"),
    fetch("./hit_music_final.mp3")
  ]);

  const [tensionData,hitData]=await Promise.all([
    tensionRes.arrayBuffer(),
    hitRes.arrayBuffer()
  ]);

  tensionBuffer=await audioCtx.decodeAudioData(tensionData);
  hitBuffer=await audioCtx.decodeAudioData(hitData);
  audioLoaded=true;
}

function stopTension(){
  if(tensionSource){
    try{tensionSource.stop();}catch(e){}
    tensionSource=null;
  }
}

function startTension(){
  stopTension();
  if(!audioCtx||!tensionBuffer)return;

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=tensionBuffer;
  source.loop=true;
  gain.gain.value=.72;

  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start(0);

  tensionSource=source;
}

function stopHitMusic(){
  if(hitSource){
    try{hitSource.stop();}catch(e){}
    hitSource=null;
  }
}

function playHitMusic(){
  stopHitMusic();
  if(!audioCtx||!hitBuffer)return;

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=hitBuffer;
  gain.gain.value=1;

  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start(0);

  hitSource=source;
}

/* COUNTDOWN */

async function showNumber(value,ms=1250){
  resetNumberStyle();
  number.textContent=value;
  number.classList.add("show");
  await sleep(ms);
  number.classList.remove("show");
}

async function normalCount(){
  await showNumber("3",1250);
  await sleep(190);
  await showNumber("2",1250);
  await sleep(190);
  await showNumber("1",1450);
}

async function quickCount(){
  await showNumber("3",550);
  await showNumber("2",550);
  await showNumber("1",700);
}

async function showDots(ms=1800){
  resetNumberStyle();
  number.textContent="…";
  number.classList.add("show","dots");
  await sleep(ms);
  number.classList.remove("show","dots");
}

/* STARS */

function clearStars(){
  starTimers.forEach(t=>clearTimeout(t));
  starTimers=[];
  document.querySelectorAll(".star").forEach(el=>el.remove());
}

function makeStar(){
  const s=document.createElement("div");
  s.className="star";

  if(chance(.55)){
    s.style.left=rand(-8,55)+"%";
    s.style.top=rand(-5,28)+"%";
  }else{
    s.style.left=rand(-8,12)+"%";
    s.style.top=rand(4,48)+"%";
  }

  s.style.setProperty("--dx",rand(220,520)+"px");
  s.style.setProperty("--dy",rand(260,620)+"px");
  s.style.setProperty("--dur",rand(700,1250)+"ms");

  stage.appendChild(s);

  requestAnimationFrame(()=>s.classList.add("fly"));
  setTimeout(()=>s.remove(),1500);
}

function starBurst(){
  let count;
  const r=Math.random();

  if(r<.75) count=rand(1,3);
  else if(r<.95) count=rand(4,6);
  else count=rand(7,10);

  for(let i=0;i<count;i++){
    setTimeout(makeStar,i*rand(80,170));
  }
}

function scheduleStars(token){
  if(!chance(.27))return;

  const t1=setTimeout(()=>{
    if(token!==playToken)return;
    starBurst();
  },rand(850,3900));

  starTimers.push(t1);

async function runHitRoute(){
  const route=Math.floor(Math.random()*44);

  switch(route){
    case 0:return normalHitAt(3);
    case 1:return normalHitAt(2);
    case 2:return normalHitAt(1);
    case 3:return normalHitAt(0);
    case 4:return normalBlackout();
    case 5:return freezeTwo();
    case 6:return reverseCountdown();
    case 7:return zeroPremium();
    case 8:return numberDisappear();
    case 9:return soundStopPattern();
    case 10:return longOne();
    case 11:return recountSequence();
    case 12:return doubleCountdown();
    case 13:return puchunDirect();
    case 14:return puchunRecount();
    case 15:return fakeSlashPattern();
    case 16:return weirdCountdown();
    case 17:return silentStart();
    case 18:return classicRevival();
    case 19:return skipCountHit();
    case 20:return oneVanishHit();
    case 21:return oneBackToTwoHit();
    case 22:return speedCountHit();
    case 23:return doubleSlashHit();
    case 24:return silentOddityHit();

    case 26:return blackoutReturnHit();
    case 27:return dotsDirectHit();

async function runMissRoute(){
  if(Math.random()<.36){

    );
  }
}

/* PRIZE
   当たった後
   1等 2%
   2等 20%
   3等 78%
*/

function drawPrize(){
  const r=Math.random();

  if(r<.02)return 1;
  if(r<.22)return 2;

  return 3;
}

function shuffle(arr){
  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}

async function chooseChest(selectedIndex){
  if(treasureLocked)return;

  treasureLocked=true;

  for(let i=0;i<3;i++){
    $("chest"+i).disabled=true;
  }

  /*
    選んだ宝箱の賞をここで1回だけ抽選

    1等 2%
    2等 20%
    3等 78%
  */

  const selectedRank=drawPrize();

  /*
    残り2箱には、
    選ばれなかった残り2つの等級を配置
  */

  const remainingRanks=shuffle(
    [1,2,3].filter(r=>r!==selectedRank)
  );

  const ranks=[null,null,null];

  ranks[selectedIndex]=selectedRank;

  const otherIndexes=[0,1,2].filter(
    i=>i!==selectedIndex
  );

  ranks[otherIndexes[0]]=remainingRanks[0];
  ranks[otherIndexes[1]]=remainingRanks[1];

  /* 選択した宝箱を強調 */

  $("glow"+selectedIndex).classList.add("on");

  const centers=["17.5%","50%","82.5%"];

  const badge=$("selectedBadge");
  badge.style.left=centers[selectedIndex];
  badge.classList.add("show");

  const beam=$("treasureBeam");
  beam.style.left=centers[selectedIndex];
  restartAnimation(beam,"go");

  const burst=$("treasureBurst");
  burst.style.left=centers[selectedIndex];
  restartAnimation(burst,"go");

  await sleep(700);

  /* 選んだ箱を先に公開 */

  setRankLabel(
    selectedIndex,
    selectedRank
  );

  $("resultMain").textContent=
    selectedRank+"等 当選！";

  $("resultBox").classList.add("show");

  await sleep(1500);

  /* 残りの箱を暗くする */

  otherIndexes.forEach(i=>{
    $("dim"+i).classList.add("on");
  });

  /* 残り2箱も順番に公開 */

  const revealOrder=shuffle(otherIndexes);

  await sleep(450);

  setRankLabel(
    revealOrder[0],
    ranks[revealOrder[0]]
  );

  await sleep(900);

  setRankLabel(
    revealOrder[1],
    ranks[revealOrder[1]]
  );

  await sleep(650);

  $("nextButton").style.display="block";
}

for(let i=0;i<3;i++){
  $("chest"+i).addEventListener(
    "click",
    ()=>chooseChest(i)
  );
}

/* START */

startButton.addEventListener("click",async()=>{
  if(playing)return;

  playing=true;
  playToken++;

  const thisPlay=playToken;

  clearStars();

  startScreen.style.display="none";

  /*
    iPhone用オーディオ解除
  */

  try{
    ensureAudioContext();

    const resumePromise=audioCtx.resume();

    await Promise.all([
      resumePromise,
      prepareAudio()
    ]);
  }catch(e){
    console.log("Audio load error:",e);
  }

  startTension();

  scheduleStars(thisPlay);

  /*
    ==================================
    本抽選

    1 / 20
    = 5%

    STARTを押すたびに
    1回だけ独立抽選
    ==================================
  */

  const win=Math.random()<(1/20);

  if(win){
    await runHitRoute();
  }else{
    await runMissRoute();
  }
});
