
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#190011">
<title>Red Peanuts 4th Anniversary</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#190011;
  color:white;
  font-family:"Arial Black","Hiragino Kaku Gothic ProN",
    "Yu Gothic",sans-serif;
}
button{font-family:inherit;cursor:pointer}
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png")
    center top/auto 100% no-repeat,
    #190011;
}
.layer{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
#shade{
  z-index:15;
  background:#0009;
}
#black{
  z-index:32;
  background:#000;
}
#hitBlack{
  z-index:33;
  background:#000;
}
#flash{
  z-index:65;
  background:#fff;
}
#lightning{
  z-index:42;
  background:linear-gradient(
    115deg,
    transparent 40%,
    white 44%,
    #ff35a0 48%,
    transparent 53%
  );
  filter:drop-shadow(0 0 20px #ff007b);
}
#noise{
  z-index:41;
  background:repeating-linear-gradient(
    0deg,
    #ffffff35 0 2px,
    #00000055 3px 5px
  );
}
#glow{
  z-index:19;
  height:45%;
  background:radial-gradient(
    ellipse at 50% 15%,
    #fff9,
    #ff45aa66 24%,
    transparent 65%
  );
}
#startScreen{
  position:absolute;
  inset:0;
  z-index:10;
}
#startButton{
  position:absolute;
  left:50%;
  bottom:8.5%;
  transform:translateX(-50%);
  width:min(78vw,390px);
  height:72px;
  border:2px solid white;
  border-radius:40px;
  background:linear-gradient(#ff77bf,#d00068);
  box-shadow:0 0 15px #fff8,0 0 30px #ff008b;
  color:white;
  font-size:28px;
  font-weight:1000;
  letter-spacing:3px;
}
#expectButton{
  position:absolute;
  left:50%;
  bottom:34%;
  transform:translateX(-50%);
  border:1.5px solid white;
  border-radius:25px;
  background:#570030d9;
  color:white;
  padding:11px 21px;
  white-space:nowrap;
  font-size:14px;
  font-weight:900;
  box-shadow:0 0 15px #ff2c94;
}
#probability{
  position:absolute;
  left:0;
  bottom:23%;
  width:100%;
  text-align:center;
  font-weight:900;
  text-shadow:0 2px 5px black,0 0 10px #ff208d;
}
#probability .small{font-size:15px}
#probability .rate{
  font-size:28px;
  color:#fff1a0;
  letter-spacing:2px;
}
#number{
  position:absolute;
  z-index:25;
  top:61%;
  left:50%;
  width:100%;
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;
  text-shadow:
    0 6px #d82779,
    0 12px #a80052,
    0 18px 9px #31001e;
}
#number.show{
  opacity:1;
  animation:numPop .25s ease-out;
}
#number.gold{
  color:#fff1aa;
  -webkit-text-stroke:6px #ffae00;
  text-shadow:0 6px #d48300,0 0 28px #ffdb30;
}
#number.red{color:#ff356a}
#number.pink{color:#ffb1d7}
#number.big{font-size:min(67vw,315px)}
#number.question{font-size:min(40vw,190px)}
#number.dots{
  font-size:min(34vw,155px);
  color:#fff1a2;
  -webkit-text-stroke:3px #ffb600;
  text-shadow:0 0 12px white,0 0 35px #ffc000;
}
@keyframes numPop{
  0%{transform:translate(-50%,-50%) scale(.65)}
  70%{transform:translate(-50%,-50%) scale(1.1)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

/* ハズレ：スマホでも横1行 */
#missScreen{
  position:absolute;
  z-index:85;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:18px;
  background:#000b;
  text-align:center;
  pointer-events:none;
}
#missScreen.show{display:flex}
#closeText{
  opacity:0;
  font-size:clamp(30px,10vw,58px);
  font-weight:1000;
  color:#ffe48c;
  text-shadow:0 0 15px #ff9a00;
}
#missText{
  position:relative;
  display:inline-block;
  opacity:0;
  white-space:nowrap;
  font-size:clamp(46px,17vw,95px);
  line-height:1.35;
  font-weight:1000;
  letter-spacing:-.055em;
  color:white;
  -webkit-text-stroke:3px #d90068;
  text-shadow:0 5px #8e0046,0 0 22px #ff238d;
}
#missMessage{
  opacity:0;
  margin-top:17px;
  max-width:95%;
  font-size:clamp(14px,4vw,20px);
  line-height:1.7;
  font-weight:900;
  color:#ffe3a2;
  text-shadow:0 2px 5px black;
}
.appear{
  animation:appear .5s ease-out forwards;
}
#missText.appear{
  animation:missPop .55s ease-out forwards;
}
@keyframes appear{
  from{opacity:0;transform:translateY(15px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes missPop{
  0%{opacity:0;transform:scale(.3)}
  65%{opacity:1;transform:scale(1.12)}
  100%{opacity:1;transform:scale(1)}
}

/* 復活用：ハズレにヒビ */
#cracks{
  position:absolute;
  inset:-10%;
  width:120%;
  height:120%;
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 3px black)
    drop-shadow(0 0 4px white);
}
#cracks.show{
  animation:crackAppear .6s steps(3,end) forwards;
}
@keyframes crackAppear{
  0%{opacity:0}
  35%{opacity:.45}
  70%{opacity:.8}
  100%{opacity:1}
}
#missText.cracking{
  opacity:1;
  animation:crackShake .12s linear infinite;
}
@keyframes crackShake{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(-6px,5px)}
  50%{transform:translate(7px,-5px)}
  75%{transform:translate(-5px,-7px)}
}

/* ノーカン */
#noCount{
  position:absolute;
  z-index:75;
  top:48%;
  left:50%;
  width:100%;
  transform:translate(-50%,-50%);
  text-align:center;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  font-size:clamp(45px,13vw,90px);
  font-weight:1000;
  color:#fff3a5;
  -webkit-text-stroke:3px #ff338d;
  text-shadow:0 5px #9b004c,0 0 28px #ff008c;
}
#noCount.show{
  animation:noCountPop .55s ease-out forwards;
}
@keyframes noCountPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

/* 斬撃 */
.slash{
  position:absolute;
  z-index:62;
  left:-30%;
  top:48%;
  width:160%;
  height:23px;
  opacity:0;
  pointer-events:none;
  transform-origin:left center;
  background:linear-gradient(
    90deg,
    transparent,
    #ff8bc9 12%,
    white 30%,
    white 70%,
    #ff258b,
    transparent
  );
  box-shadow:0 0 12px white,0 0 30px #ff1687;
}
#slash1{transform:rotate(-22deg) scaleX(0)}
#slash2{transform:rotate(20deg) scaleX(0)}
#slash1.go{animation:slashOne .4s ease-out}
#slash2.go{animation:slashTwo .4s ease-out}
@keyframes slashOne{
  0%{opacity:0;transform:rotate(-22deg) scaleX(0)}
  25%{opacity:1}
  80%{opacity:1;transform:rotate(-22deg) scaleX(1)}
  100%{opacity:0;transform:rotate(-22deg) scaleX(1)}
}
@keyframes slashTwo{
  0%{opacity:0;transform:rotate(20deg) scaleX(0)}
  25%{opacity:1}
  80%{opacity:1;transform:rotate(20deg) scaleX(1)}
  100%{opacity:0;transform:rotate(20deg) scaleX(1)}
}
.fragment{
  position:absolute;
  z-index:64;
  color:white;
  font-size:24px;
  font-weight:1000;
  pointer-events:none;
  text-shadow:0 0 9px white,0 0 18px #ff2694;
  animation:fragmentFly 1s ease-out forwards;
}
@keyframes fragmentFly{
  from{opacity:1;transform:translate(0,0) rotate(0)}
  to{
    opacity:0;
    transform:translate(var(--x),var(--y))
      rotate(var(--r)) scale(.1);
  }
}

/* 当たり */
#hitText{
  position:absolute;
  z-index:72;
  top:47%;
  left:50%;
  width:100%;
  transform:translate(-50%,-50%) scale(.1);
  text-align:center;
  opacity:0;
  pointer-events:none;
  white-space:nowrap;
  font-size:min(27vw,140px);
  font-weight:1000;
  color:#fff2a2;
  -webkit-text-stroke:4px #ff266e;
  text-shadow:
    0 6px #ff9500,
    0 11px #97003b,
    0 0 20px white,
    0 0 45px #ff2a91;
}
#hitText.go{
  animation:hitPop .75s cubic-bezier(.15,.7,.2,1.2) forwards;
}
@keyframes hitPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
#hitInfo{
  position:absolute;
  z-index:73;
  top:65%;
  left:5%;
  width:90%;
  text-align:center;
  opacity:0;
  transform:translateY(18px);
  pointer-events:none;
}
#hitInfo.show{
  animation:appear .6s ease-out forwards;
}
#hitInfoLabel{
  font-size:16px;
  font-weight:900;
  text-shadow:0 2px 5px black;
}
#hitRouteName{
  display:inline-block;
  margin-top:9px;
  padding:10px 17px;
  max-width:100%;
  border:1.5px solid #ffe28a;
  border-radius:14px;
  background:#4a082ee8;
  color:#fff0a8;
  font-size:clamp(15px,4.6vw,23px);
  font-weight:1000;
  box-shadow:0 0 16px #ff8c0077;
}
#tapGuide{
  position:absolute;
  z-index:74;
  bottom:9%;
  width:100%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-size:15px;
  font-weight:900;
  text-shadow:0 2px 5px black;
}
#tapGuide.show{
  animation:blink 1.3s infinite;
}
@keyframes blink{
  0%,100%{opacity:.45}
  50%{opacity:1}
}

/* 光・ノイズ */
.flashGo{animation:flashGo .35s ease-out}
@keyframes flashGo{
  0%{opacity:0}
  35%{opacity:1}
  100%{opacity:0}
}
.lightGo{animation:lightGo .5s ease-out}
@keyframes lightGo{
  0%{opacity:0}
  20%{opacity:1}
  45%{opacity:.1}
  65%{opacity:1}
  100%{opacity:0}
}
.noiseGo{animation:noiseGo .6s steps(2,end)}
@keyframes noiseGo{
  0%{opacity:0}
  25%{opacity:.8}
  50%{opacity:.2}
  75%{opacity:.9}
  100%{opacity:0}
}
.glowGo{animation:glowGo .9s ease-out}
@keyframes glowGo{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}
.star{
  position:absolute;
  z-index:44;
  width:5px;
  height:5px;
  border-radius:50%;
  background:white;
  pointer-events:none;
  box-shadow:0 0 8px white,0 0 17px #ff69b6;
  animation:starFly 1s linear forwards;
}
.star:after{
  content:"";
  position:absolute;
  right:0;
  top:1px;
  width:80px;
  height:2px;
  transform:rotate(45deg);
  transform-origin:right center;
  background:linear-gradient(90deg,transparent,white);
}
@keyframes starFly{
  0%{opacity:0;transform:translate(0,0)}
  15%{opacity:1}
  85%{opacity:1}
  100%{
    opacity:0;
    transform:translate(var(--dx),var(--dy));
  }
}

/* 演出期待度 */
#modal{
  position:fixed;
  z-index:200;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:#000d;
}
#modal.open{display:flex}
#modalBox{
  width:min(92vw,430px);
  max-height:90dvh;
  overflow-y:auto;
  padding:24px 15px;
  border:2px solid #ff80bd;
  border-radius:23px;
  text-align:center;
  background:linear-gradient(#57002f,#190010);
  box-shadow:0 0 20px #ff268e;
}
#modalTitle{
  font-size:25px;
  font-weight:1000;
  color:#ffeba0;
  margin-bottom:15px;
}
.guideRow{
  padding:9px 3px;
  border-bottom:1px solid #ffffff25;
  font-size:15px;
  font-weight:800;
}
.guideRow span{color:#ffe279}
#closeModal{
  margin-top:15px;
  width:75%;
  height:46px;
  border:1px solid white;
  border-radius:24px;
  background:linear-gradient(#ff68b6,#d50067);
  color:white;
  font-size:17px;
  font-weight:900;
}
</style>
</head>

<body>

<div id="stage">

  <div id="shade" class="layer"></div>
  <div id="glow" class="layer"></div>

  <div id="startScreen">
    <button id="expectButton">演出期待度を見る</button>

    <div id="probability">
      <div class="small">完全抽選</div>
      <div class="rate">1 / 25</div>
      <div class="small">毎回独立抽選</div>
    </div>

    <button id="startButton">START</button>
  </div>

  <div id="number"></div>

  <div id="black" class="layer"></div>
  <div id="hitBlack" class="layer"></div>
  <div id="noise" class="layer"></div>
  <div id="lightning" class="layer"></div>

  <div id="missScreen">
    <div id="closeText">惜しい！</div>

    <div id="missText">
      ハズレ
      <svg id="cracks"
        viewBox="0 0 320 130"
        preserveAspectRatio="none">
        <g fill="none" stroke="white"
          stroke-width="3" stroke-linecap="round">
          <path d="M155 0 L144 24 L170 38 L147 56 L181 77 L155 100 L176 130"/>
          <path d="M144 24 L107 14 L90 35 L58 28"/>
          <path d="M170 38 L208 23 L230 44 L267 29"/>
          <path d="M147 56 L108 70 L84 63 L42 92"/>
          <path d="M181 77 L220 88 L243 74 L294 96"/>
          <path d="M155 100 L125 118 L92 105"/>
        </g>
      </svg>
    </div>

    <div id="missMessage"></div>
  </div>

  <div id="noCount">ノーカン！？</div>

  <div id="slash1" class="slash"></div>
  <div id="slash2" class="slash"></div>

  <div id="flash" class="layer"></div>

  <div id="hitText">当たり</div>

  <div id="hitInfo">
    <div id="hitInfoLabel">✨ 今回の当選演出 ✨</div>
    <div id="hitRouteName"></div>
  </div>

  <div id="tapGuide">画面をタップして戻る</div>
</div>

<div id="modal">
  <div id="modalBox">
    <div id="modalTitle">✨ 演出期待度 ✨</div>

    <div class="guideRow">
      ⚡ ピンク稲妻 → <span>チャンス！</span>
    </div>
    <div class="guideRow">
      ❓「？」出現 → <span>チャンス！</span>
    </div>
    <div class="guideRow">
      ✨ 流れ星大量 → <span>期待度UP！</span>
    </div>
    <div class="guideRow">
      🌑 ブラックアウト → <span>大チャンス！？</span>
    </div>
    <div class="guideRow">
      🟡 金色変化 → <span>大チャンス！？</span>
    </div>
    <div class="guideRow">
      🔥「…」出現 → <span>大チャンス！？</span>
    </div>
    <div class="guideRow">
      ⚔️ 斬撃＋「当たり」 → <span>当選確定！</span>
    </div>

    <button id="closeModal">閉じる</button>
  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const chance=p=>Math.random()<p;

const stage=$("stage");
const number=$("number");
const startScreen=$("startScreen");
const startButton=$("startButton");
const shade=$("shade");
const black=$("black");
const hitBlack=$("hitBlack");
const flash=$("flash");
const lightning=$("lightning");
const noise=$("noise");
const glow=$("glow");
const missScreen=$("missScreen");
const missText=$("missText");
const missMessage=$("missMessage");
const closeText=$("closeText");
const cracks=$("cracks");
const noCount=$("noCount");
const slash1=$("slash1");
const slash2=$("slash2");
const hitText=$("hitText");
const hitInfo=$("hitInfo");
const hitRouteName=$("hitRouteName");
const tapGuide=$("tapGuide");

let playing=false;
let waitingTap=false;
let gameToken=0;
let effectTimers=[];

/* 期待度 */
$("expectButton").onclick=e=>{
  e.stopPropagation();
  $("modal").classList.add("open");
};
$("closeModal").onclick=e=>{
  e.stopPropagation();
  $("modal").classList.remove("open");
};
$("modal").onclick=e=>{
  if(e.target===$("modal")){
    $("modal").classList.remove("open");
  }
};

/* 基本演出 */
function animate(el,name){
  el.classList.remove(name);
  void el.offsetWidth;
  el.classList.add(name);
}
function clearNumber(){
  number.className="";
  number.textContent="";
}
async function showNumber(text,ms=1100,style=""){
  clearNumber();
  number.textContent=text;
  if(style)number.classList.add(style);
  number.classList.add("show");
  await sleep(ms);
  number.classList.remove("show");
}
async function countdown(){
  await showNumber("3",1250);
  await sleep(180);
  await showNumber("2",1250);
  await sleep(180);
  await showNumber("1",1450);
}
async function quickCount(){
  await showNumber("3",550);
  await showNumber("2",550);
  await showNumber("1",700);
}
async function dots(ms=1700){
  await showNumber("…",ms,"dots");
}
async function blackout(ms=1600){
  black.style.opacity="1";
  await sleep(ms);
  black.style.opacity="0";
}
async function pinkLightning(){
  animate(lightning,"lightGo");
  await sleep(500);
}
async function screenNoise(){
  animate(noise,"noiseGo");
  await sleep(650);
}
async function logoFlash(){
  animate(glow,"glowGo");
  await sleep(900);
}
async function slash(double=true){
  animate(slash1,"go");
  if(double){
    await sleep(145);
    animate(slash2,"go");
  }
  await sleep(420);
}
function flashScreen(){
  animate(flash,"flashGo");
}

/* BGM */
let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let hitSource=null;
let audioPromise=null;

function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||
      window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }
}
function loadAudio(){
  if(audioPromise)return audioPromise;
  if(!audioCtx)return Promise.resolve();

  audioPromise=(async()=>{
    const files=[
      "./Tension.mp3",
      "./hit_music_final.mp3"
    ];
    const buffers=await Promise.all(
      files.map(async file=>{
        const res=await fetch(file);
        if(!res.ok)throw new Error(file);
        const data=await res.arrayBuffer();
        return audioCtx.decodeAudioData(data);
      })
    );
    tensionBuffer=buffers[0];
    hitBuffer=buffers[1];
  })().catch(err=>{
    audioPromise=null;
    console.warn("音声読み込み失敗",err);
  });

  return audioPromise;
}
function stopTension(){
  if(tensionSource){
    try{tensionSource.stop()}catch(e){}
    tensionSource=null;
  }
}
function stopHit(){
  if(hitSource){
    try{hitSource.stop()}catch(e){}
    hitSource=null;
  }
}
function playBuffer(buffer,loop=false,volume=1){
  if(!audioCtx||!buffer)return null;
  const src=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();
  src.buffer=buffer;
  src.loop=loop;
  gain.gain.value=volume;
  src.connect(gain);
  gain.connect(audioCtx.destination);
  src.start();
  return src;
}
function playTension(){
  stopTension();
  tensionSource=playBuffer(tensionBuffer,true,.72);
}
function playHit(){
  stopHit();
  hitSource=playBuffer(hitBuffer,false,1);
}

/* 流れ星 */
function clearEffects(){
  effectTimers.forEach(clearTimeout);
  effectTimers=[];
  document.querySelectorAll(".star,.fragment")
    .forEach(el=>el.remove());
}
function starBurst(count=rand(4,9)){
  for(let i=0;i<count;i++){
    const timer=setTimeout(()=>{
      const star=document.createElement("div");
      star.className="star";
      star.style.left=rand(-5,60)+"%";
      star.style.top=rand(-5,35)+"%";
      star.style.setProperty(
        "--dx",rand(200,500)+"px"
      );
      star.style.setProperty(
        "--dy",rand(250,650)+"px"
      );
      stage.appendChild(star);
      setTimeout(()=>star.remove(),1200);
    },i*100);
    effectTimers.push(timer);
  }
}
function scheduleStars(id){
  if(chance(.27)){
    effectTimers.push(setTimeout(()=>{

function fragments(){
  const symbols=["✦","◆","◈","✧","★","♦"];
  for(let i=0;i<42;i++){

    piece.style.top=(39+Math.random()*18)+"%";
    piece.style.setProperty(
      "--x",(Math.random()*520-260)+"px"
    );
    piece.style.setProperty(
      "--y",(Math.random()*520-260)+"px"
    );

/*
  毎回の抽選はSTART時点で確定。

  当選確率：1/25

  「…」当たり：44種類中6種類
  「…」ハズレ：ハズレ時704分の1

  これにより
  P(当たり | 「…」出現) = 80%

  ノーカンや復活演出は
  追加抽選を行わない。
*/
async function runMissRoute(){
  if(chance(1/704)){
    await dotsHotMiss();
    return;
  }

  /* ノーカン演出はハズレでも発生 */
  if(chance(.012)){
    await noCountMiss();
    return;
  }
  if(chance(.003)){
    await doubleNoCountMiss();
    return;
  }

  if(chance(.36)){
    await commonEffect(rand(0,7));
    await showMiss(false);
    return;
  }

  const r=Math.random();

  if(r<.50){
    await normalMiss();
  }else if(r<.75){
    await weakFake(rand(0,9));
  }else{
    await strongFake(rand(0,5));
  }
}

/* 初期状態に戻す */
function resetGame(){
  gameToken++;
  stopTension();
  stopHit();
  clearEffects();
  clearNumber();

  black.style.opacity="0";
  hitBlack.style.opacity="0";
  shade.style.opacity="0";

  missScreen.classList.remove("show");
  missText.classList.remove("appear","cracking");
  closeText.classList.remove("appear");
  missMessage.classList.remove("appear");
  missMessage.textContent="";
  cracks.classList.remove("show");

  noCount.classList.remove("show");
  noCount.style.opacity="0";

  slash1.classList.remove("go");
  slash2.classList.remove("go");
  flash.classList.remove("flashGo");
  lightning.classList.remove("lightGo");
  noise.classList.remove("noiseGo");
  glow.classList.remove("glowGo");

  hitText.classList.remove("go");
  hitInfo.classList.remove("show");
  hitRouteName.textContent="";
  tapGuide.classList.remove("show");

  playing=false;
  waitingTap=false;
  startScreen.style.display="block";
}

/* 当たり後は画面タップで戻る */
stage.addEventListener("click",()=>{
  if(waitingTap)resetGame();
});

/* START */
startButton.addEventListener("click",async e=>{
  e.stopPropagation();

  if(playing)return;

  playing=true;
  waitingTap=false;
  gameToken++;

  const currentToken=gameToken;

  startScreen.style.display="none";
  clearEffects();

  /*
    最初に1回だけ当落を決定。
    演出中に再抽選はしない。
  */
  const win=chance(1/25);

  try{
    ensureAudio();

    if(audioCtx){
      await Promise.all([
        audioCtx.resume(),
        loadAudio()
      ]);
    }
  }catch(err){
    console.warn(err);
  }

  if(currentToken!==gameToken)return;

  playTension();
  scheduleStars(currentToken);

  try{
    if(win){
      const route=rand(0,43);
      await runHitRoute(route);
    }else{
      await runMissRoute();
    }
  }catch(err){
    console.error("ゲームエラー",err);
    resetGame();
  }
});
