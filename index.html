
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#170010">
<title>Red Peanuts SLOT</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #170010;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", sans-serif;
  touch-action: manipulation;
}

button {
  font: inherit;
  cursor: pointer;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #170010
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png")
    center top / auto 100% no-repeat;
}

/* =============================
   START SCREEN
============================= */

#start {
  position: absolute;
  inset: 0;
  z-index: 10;
}

#startBtn {
  position: absolute;
  left: 50%;
  bottom: 8.5%;
  transform: translateX(-50%);
  width: min(80vw,390px);
  height: 70px;
  border: 2px solid white;
  border-radius: 45px;
  background: linear-gradient(#ff78c4,#d00068);
  color: white;
  font-size: 28px;
  font-weight: 1000;
  box-shadow: 0 0 28px #ff008d;
}

#rate {
  position: absolute;
  bottom: 23%;
  width: 100%;
  text-align: center;
  font-weight: 900;
  text-shadow: 0 2px 7px black;
}

#rate b {
  display: block;
  color: #ffed9d;
  font-size: 30px;
}

#guideBtn {
  position: absolute;
  bottom: 34%;
  left: 50%;
  transform: translateX(-50%);
  padding: 11px 22px;
  white-space: nowrap;
  border: 1px solid white;
  border-radius: 30px;
  background: #580033d9;
  color: white;
  font-weight: 900;
  box-shadow: 0 0 14px #ff3896;
}

/* =============================
   MODAL
============================= */

#modal {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  background: #000d;
  padding: 15px;
}

#modal.open {
  display: flex;
}

#guide {
  width: min(94vw,430px);
  max-height: 88dvh;
  overflow: auto;
  padding: 20px 14px;
  text-align: center;
  border: 2px solid #ff8bc5;
  border-radius: 22px;
  background: linear-gradient(#580031,#1b0013);
}

#guide h2 {
  color: #ffe6a1;
}

#guide p {
  padding: 8px 0;
  border-bottom: 1px solid #ffffff30;
  font-weight: 800;
}

#guide em {
  color: #ffe58d;
  font-style: normal;
}

#closeGuide {
  margin: 12px;
  padding: 10px 50px;
  background: #ed2c8d;
  color: white;
  border: 1px solid white;
  border-radius: 25px;
}

/* =============================
   BASE EFFECTS
============================= */

#dim,
#black,
#flash,
#lightning,
#noise {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
}

#dim {
  z-index: 12;
  background: #0009;
}

#black {
  z-index: 26;
  background: black;
}

#noise {
  z-index: 29;
  background: repeating-linear-gradient(
    0deg,
    #fff6 0 2px,
    #0005 2px 5px
  );
}

#lightning {
  z-index: 30;
  background: linear-gradient(
    120deg,
    transparent 42%,
    white 47%,
    #ff5db6 49%,
    transparent 54%
  );
  filter: drop-shadow(0 0 24px #ff1494);
}

#flash {
  z-index: 115;
  background: white;
}

.flashGo,
.lightGo,
.noiseGo {
  animation: flashAnim .4s ease-out;
}

@keyframes flashAnim {
  0%,100% { opacity: 0; }
  40% { opacity: 1; }
}

/* =============================
   NUMBERS
============================= */

#num {
  position: absolute;
  z-index: 25;
  top: 61%;
  left: 50%;
  width: 100%;
  text-align: center;
  transform: translate(-50%,-50%);
  font-size: min(52vw,255px);
  line-height: 1.1;
  font-weight: 1000;
  color: white;
  -webkit-text-stroke:
    clamp(5px,1.5vw,9px) #ff4b9d;
  text-shadow:
    0 7px #ae0054,
    0 14px 10px #370018;
  opacity: 0;
  pointer-events: none;
}

#num.show {
  opacity: 1;
  animation: numPop .25s ease-out;
}

#num.gold {
  color: #fff1a8;
  -webkit-text-stroke: 6px #f4a000;
  text-shadow: 0 0 30px #ffd100;
}

#num.red {
  color: #ff508b;
}

#num.dots {
  font-size: min(34vw,155px);
  color: #fff1a8;
  -webkit-text-stroke: 3px #f4a000;
}

#num.question {
  font-size: min(40vw,190px);
}

#num.big {
  font-size: min(65vw,300px);
}

#num.nocount {
  width: 94%;
  font-size: clamp(31px,9vw,56px);
  white-space: nowrap;
  letter-spacing: -.05em;
  -webkit-text-stroke: 2px #ff4b9d;
  text-shadow:
    0 4px #ae0054,
    0 0 15px #ff65b7;
}

@keyframes numPop {
  from {
    transform:
      translate(-50%,-50%) scale(.6);
  }
  75% {
    transform:
      translate(-50%,-50%) scale(1.1);
  }
  to {
    transform:
      translate(-50%,-50%) scale(1);
  }
}

/* =============================
   MISS RESULT
============================= */

#result {
  position: absolute;
  z-index: 35;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px;
  background: #000a;
  text-align: center;
  pointer-events: none;
}

#result.show {
  display: flex;
}

#near {
  font-size: clamp(26px,9vw,56px);
  font-weight: 1000;
  color: #ffe18d;
  text-shadow: 0 0 18px #ff8a00;
}

#mainResult {
  position: relative;
  display: inline-block;
  white-space: nowrap;
  max-width: 100%;
  font-size: clamp(42px,15vw,82px);
  line-height: 1.2;
  letter-spacing: -.05em;
  font-weight: 1000;
  color: white;
  -webkit-text-stroke: 3px #e00073;
  text-shadow:
    0 5px #8e0044,
    0 0 18px #ff379a;
}

#mainResult.appear {
  animation: resultPop .55s ease-out;
}

#message {
  font-size: clamp(14px,4vw,20px);
  font-weight: 900;
  color: #ffe5aa;
  line-height: 1.7;
  margin-top: 12px;
  text-shadow: 0 2px 5px black;
}

#message:empty {
  display: none;
}

@keyframes resultPop {
  from {
    opacity: 0;
    transform: scale(.3);
  }
  65% {
    transform: scale(1.1);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

#cracks {
  position: absolute;
  inset: -7%;
  width: 114%;
  height: 114%;
  opacity: 0;
  pointer-events: none;
}

#cracks.show {
  opacity: 1;
  animation: crack .55s steps(3,end);
}

@keyframes crack {
  from { opacity: 0; }
  to { opacity: 1; }
}

#result.shaking #mainResult {
  animation: shake .12s linear infinite;
}

@keyframes shake {
  0%,100% { transform: translate(0,0); }
  25% { transform: translate(-8px,5px); }
  50% { transform: translate(7px,-5px); }
  75% { transform: translate(-5px,-7px); }
}

/* =============================
   SLASH
============================= */

.slash {
  position: absolute;
  z-index: 82;
  left: -30%;
  top: 48%;
  width: 160%;
  height: 22px;
  opacity: 0;
  pointer-events: none;
  transform-origin: left center;
  background: linear-gradient(
    90deg,
    transparent,
    #ff87c9 10%,
    white 30%,
    white 75%,
    #ff1785,
    transparent
  );
  box-shadow:
    0 0 13px white,
    0 0 35px #ff0087;
}

#slash1 {
  transform: rotate(-22deg) scaleX(0);
}

#slash2 {
  transform: rotate(19deg) scaleX(0);
}

#slash1.go {
  animation: slashA .4s ease-out;
}

#slash2.go {
  animation: slashB .4s ease-out;
}

@keyframes slashA {
  0% {
    opacity: 0;
    transform: rotate(-22deg) scaleX(0);
  }
  25%,75% { opacity: 1; }
  100% {
    opacity: 0;
    transform: rotate(-22deg) scaleX(1);
  }
}

@keyframes slashB {
  0% {
    opacity: 0;
    transform: rotate(19deg) scaleX(0);
  }
  25%,75% { opacity: 1; }
  100% {
    opacity: 0;
    transform: rotate(19deg) scaleX(1);
  }
}

/* =============================
   HIT
============================= */

#hit {
  position: absolute;
  z-index: 140;
  top: 46%;
  left: 50%;
  width: 100%;
  text-align: center;
  white-space: nowrap;
  opacity: 0;
  transform:
    translate(-50%,-50%) scale(.1);
  pointer-events: none;
  font-size: clamp(65px,23vw,155px);
  line-height: 1.2;
  font-weight: 1000;
  color: #fff2a8;
  -webkit-text-stroke:
    clamp(4px,1.2vw,7px) #ff266b;
  text-shadow:
    0 6px #ff9b00,
    0 12px #a90043,
    0 0 28px white;
}

#hit.go {
  animation: hitPop .7s
    cubic-bezier(.16,.7,.2,1.2) forwards;
}

@keyframes hitPop {
  0% {
    opacity: 0;
    transform:
      translate(-50%,-50%) scale(.1);
  }
  55% {
    opacity: 1;
    transform:
      translate(-50%,-50%) scale(1.18);
  }
  100% {
    opacity: 1;
    transform:
      translate(-50%,-50%) scale(1);
  }
}

#hitInfo {
  position: absolute;
  z-index: 141;
  top: 65%;
  left: 4%;
  width: 92%;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  font-weight: 900;
  text-shadow: 0 2px 5px black;
}

#hitInfo.show {
  animation: info .6s forwards;
}

#hitName {
  display: inline-block;
  margin-top: 9px;
  padding: 10px 18px;
  max-width: 100%;
  border: 1px solid #ffe391;
  border-radius: 14px;
  background: #530b33e8;
  color: #ffec9c;
  font-size: clamp(15px,4.8vw,24px);
}

@keyframes info {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

#tap {
  position: absolute;
  z-index: 142;
  bottom: 9%;
  width: 100%;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  text-shadow: 0 2px 5px black;
}

#tap.show {
  animation: blink 1.2s infinite;
}

@keyframes blink {
  0%,100% { opacity: .4; }
  50% { opacity: 1; }
}

/* =============================
   STARS
============================= */

.shooting {
  position: absolute;
  z-index: 28;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 12px white,
    0 0 25px #ff62b9;
  pointer-events: none;
  animation: shoot .9s linear forwards;
}

.shooting::after {
  content: "";
  position: absolute;
  right: 0;
  top: 2px;
  width: 75px;
  height: 2px;
  background:
    linear-gradient(90deg,transparent,white);
}

@keyframes shoot {
  from {
    opacity: 0;
    transform: translate(0,0);
  }
  20% { opacity: 1; }
  to {
    opacity: 0;
    transform: translate(240px,370px);
  }
}

.particle {
  position: absolute;
  z-index: 85;
  pointer-events: none;
  color: white;
  font-size: 25px;
  text-shadow:
    0 0 12px white,
    0 0 20px #ff2194;
  animation: fly 1.1s ease-out forwards;
}

@keyframes fly {
  from {
    opacity: 1;
    transform:
      translate(0,0) rotate(0);
  }
  to {
    opacity: 0;
    transform:
      translate(var(--dx),var(--dy))
      rotate(var(--rot)) scale(.2);
  }
}

/* =============================
   SPECIAL EFFECTS
============================= */

#specialFX {
  position: absolute;
  inset: 0;
  z-index: 90;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
  overflow: hidden;
  background: #100516;
  color: white;
}

#specialFX.active {
  display: flex;
}

#specialFX .fxTitle {
  font-size: clamp(38px,12vw,86px);
  font-weight: 1000;
  line-height: 1.16;
  text-shadow:
    0 0 18px #ffbc33,
    0 4px 0 #6b1600;
}

#specialFX .fxSub {
  font-size: clamp(16px,5vw,29px);
  font-weight: 900;
  margin-top: 22px;
  text-shadow: 0 3px 8px black;
}

/* 次回予告 */

#specialFX.preview {
  background: #100516
    url("./0EB99059-7515-429E-B34D-8BFCE53ED083.png")
    center / contain no-repeat;
}

#specialFX.preview .fxTitle {
  display: none;
}

/* レインボー */

#specialFX.rainbow {
  background: #100516
    url("./CC92EC2B-BC54-4037-9F8C-45DB1AE891E2.png")
    center / contain no-repeat;
  animation: rainbowHue 1s linear infinite;
}

#specialFX.rainbow .fxTitle {
  display: none;
}

@keyframes rainbowHue {
  to {
    filter: hue-rotate(360deg);
  }
}

/* フリーズ */

#specialFX.freeze {
  background: black;
}

/* デカPUSH */

#specialFX.push {
  background:
    radial-gradient(circle,#581000,#080008 80%);
}

#specialFX.push .fxTitle {
  font-size: clamp(25px,7vw,48px);
}

#specialFX .fxButton {
  pointer-events: auto;
  border: 3px solid #ffdf78;
  border-radius: 50%;
  width: min(59vw,245px);
  height: min(59vw,245px);
  background:
    url("./BF43324D-F195-4E15-A371-AA8862724654.png")
    center / contain no-repeat;
  color: transparent;
  font-size: 60px;
  font-weight: 1000;
  box-shadow:
    0 0 25px #f80,
    0 0 50px #d00;
  animation: pushPulse .45s infinite alternate;
}

@keyframes pushPulse {
  from {
    transform: scale(.96);
    filter: brightness(.85);
  }
  to {
    transform: scale(1.04);
    filter: brightness(1.3);
  }
}

/* =============================
   REALISTIC GLASS BREAK
============================= */

/* ヒビ画像 */

#glassCrack {
  position: absolute;
  inset: 0;
  z-index: 101;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
  background:
    url("./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png")
    center / contain no-repeat;
  mix-blend-mode: screen;
  filter:
    contrast(1.4)
    brightness(1.3)
    drop-shadow(0 0 4px white);
  transform-origin: 50% 47%;
}

/* 最初のヒビ */

#glassCrack.crackOne {
  opacity: 1;
  animation: crackOne .42s steps(3,end) forwards;
}

/* 2回目のヒビ */

#glassCrack.crackTwo {
  opacity: 1;
  animation: crackTwo .46s steps(3,end) forwards;
}

@keyframes crackOne {
  0% {
    opacity: 0;
    clip-path: circle(0% at 50% 47%);
    transform: scale(.90);
  }
  30% {
    opacity: .95;
  }
  100% {
    opacity: 1;
    clip-path: circle(22% at 50% 47%);
    transform: scale(1);
  }
}

@keyframes crackTwo {
  0% {
    opacity: .8;
    clip-path: circle(22% at 50% 47%);
    transform: scale(1);
  }
  100% {
    opacity: 1;
    clip-path: circle(90% at 50% 47%);
    transform: scale(1.1);
  }
}

/* 破片描画Canvas */

#glassCanvas {
  position: absolute;
  inset: 0;
  z-index: 105;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* 破壊瞬間の光 */

#glassFlash {
  position: absolute;
  inset: 0;
  z-index: 112;
  opacity: 0;
  pointer-events: none;
  background: radial-gradient(
    circle at 50% 47%,
    white 0%,
    #ffffffbb 15%,
    #ffffff44 45%,
    transparent 75%
  );
}

#glassFlash.go {
  animation: glassFlashAnim .35s ease-out;
}

@keyframes glassFlashAnim {
  0%,100% { opacity: 0; }
  25% { opacity: 1; }
}

/* ガラスが割れるときの揺れ */

#stage.glassShake {
  animation: glassShake .12s linear infinite;
}

@keyframes glassShake {
  0% {
    transform: translate(0,0);
  }
  25% {
    transform: translate(-6px,4px);
  }
  50% {
    transform: translate(6px,-5px);
  }
  75% {
    transform: translate(-4px,-3px);
  }
  100% {
    transform: translate(0,0);
  }
}

/* =============================
   MOBILE
============================= */

@media (max-width: 380px) {
  #startBtn {
    height: 65px;
    font-size: 25px;
  }

  #guideBtn {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div id="stage">

  <div id="start">
    <button id="guideBtn">
      演出期待度を見る
    </button>

    <div id="rate">
      完全抽選
      <b>1 / 25</b>
      毎回独立抽選
    </div>

    <button id="startBtn">
      START
    </button>
  </div>

  <div id="dim"></div>
  <div id="num"></div>
  <div id="black"></div>
  <div id="noise"></div>
  <div id="lightning"></div>

  <div id="result">

    <div id="near"></div>

    <div id="mainResult">
      ハズレ

      <svg id="cracks"
        viewBox="0 0 320 130"
        preserveAspectRatio="none">

        <g fill="none"
          stroke="white"
          stroke-width="3">

          <path d="
            M155 0
            L143 24
            L169 38
            L147 56
            L180 77
            L155 100
            L175 130
          "/>

          <path d="
            M143 24
            L106 15
            L88 35
            L54 28
          "/>

          <path d="
            M169 38
            L208 22
            L229 44
            L269 29
          "/>

          <path d="
            M147 56
            L107 70
            L83 63
            L40 93
          "/>

          <path d="
            M180 77
            L220 88
            L244 74
            L296 96
          "/>

        </g>
      </svg>

    </div>

    <div id="message"></div>

  </div>

  <div id="slash1" class="slash"></div>
  <div id="slash2" class="slash"></div>

  <div id="specialFX">
    <div class="fxTitle"></div>
    <div class="fxSub"></div>
  </div>

  <!-- 画面破壊 -->
  <div id="glassCrack"></div>
  <canvas id="glassCanvas"></canvas>
  <div id="glassFlash"></div>

  <div id="flash"></div>

  <div id="hit">当たり</div>

  <div id="hitInfo">
    ✨ 今回の当選演出 ✨

    <div>
      <span id="hitName"></span>
    </div>

    画面をタップして戻る
  </div>

</div>

<div id="modal">
  <div id="guide">

    <h2>✨ 演出期待度 ✨</h2>

    <p>⚡ ピンク稲妻 → <em>チャンス！</em></p>
    <p>❓「？」出現 → <em>チャンス！</em></p>
    <p>✨ 流れ星大量 → <em>期待度UP！</em></p>
    <p>🌑 ブラックアウト → <em>大チャンス！？</em></p>
    <p>🟡 金色変化 → <em>大チャンス！？</em></p>
    <p>🎬 次回予告 → <em>約95%！</em></p>
    <p>💥 画面破壊 → <em>当たり確定！</em></p>
    <p>🌈 レインボー → <em>当たり確定！</em></p>
    <p>🔴 デカPUSH → <em>チャンス！</em></p>
    <p>⚔️ 斬撃＋当たり → <em>当たり確定！</em></p>

    <button id="closeGuide">
      閉じる
    </button>

  </div>
</div>

<script>
"use strict";

/* =============================
   BASIC
============================= */

const $ = id => document.getElementById(id);

const wait = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

const rnd = (a,b) =>
  Math.floor(Math.random() * (b-a+1)) + a;

const roll = probability =>
  Math.random() < probability;

const stage = $("stage");
const num = $("num");
const result = $("result");
const near = $("near");
const main = $("mainResult");
const message = $("message");
const black = $("black");
const fx = $("specialFX");

let busy = false;
let tapReady = false;
let runId = 0;

/* =============================
   SOUND FILES
============================= */

/*
  GitHubに入れたMOVファイルを指定。

  iPhoneで再生できない場合は
  MP3版を同じフォルダにアップして
  GLASS_SOUND をMP3名に変更する。
*/

const GLASS_SOUND =
  "./glass_crack_crack_shatter_v3_preview.mov";

const TENSION_SOUND = "./Tension.mp3";

const HIT_SOUND = "./hit_music_final.mp3";

const tensionAudio = new Audio(TENSION_SOUND);
const hitAudio = new Audio(HIT_SOUND);
const glassAudio = new Audio(GLASS_SOUND);

tensionAudio.loop = true;
tensionAudio.volume = .7;

hitAudio.volume = 1;
glassAudio.volume = 1;

tensionAudio.preload = "auto";
hitAudio.preload = "auto";
glassAudio.preload = "auto";

function safePlay(audio){
  try {
    audio.pause();
    audio.currentTime = 0;
    const promise = audio.play();

    if(promise && promise.catch){
      promise.catch(err => {
        console.warn("音声再生に失敗:",err);
      });
    }
  } catch(err){
    console.warn(err);
  }
}

    audio.pause();
    audio.currentTime = 0;
  } catch(err){}
}

/* =============================
   REAL GLASS BREAK SYSTEM
============================= */

/*
  既存の画面破壊画像を使う。

  ヒビ：
  既存画像を2段階で表示。

  破片：
  Canvasで実際に動かす。

  破片には背景画像も描画し、
  割れた画面の欠片っぽく見せる。
*/

const glassCrack = $("glassCrack");
const glassCanvas = $("glassCanvas");
const glassFlash = $("glassFlash");

const glassCtx = glassCanvas.getContext("2d");

const BG_IMAGE =
  "./9E28B31B-C619-4F41-AB55-91C025168D02.png";

const CRACK_IMAGE =
  "./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png";

const bgImage = new Image();
const crackImage = new Image();

bgImage.src = BG_IMAGE;
crackImage.src = CRACK_IMAGE;

let glassPieces = [];
let glassAnimation = null;

let canvasW = 0;
let canvasH = 0;
let canvasScale = 1;

function resizeGlass(){
  canvasW = stage.clientWidth;
  canvasH = stage.clientHeight;

  canvasScale = Math.min(
    window.devicePixelRatio || 1,
    2
  );

  glassCanvas.width =
    Math.round(canvasW * canvasScale);

  glassCanvas.height =
    Math.round(canvasH * canvasScale);

  glassCanvas.style.width = canvasW + "px";
  glassCanvas.style.height = canvasH + "px";

  if(glassCtx){
    glassCtx.setTransform(
      canvasScale,0,0,canvasScale,0,0
    );
  }
}

window.addEventListener("resize",resizeGlass);

resizeGlass();

/*
  背景画像をstageと同じ配置で
  Canvasにも描く。
*/

function drawStageBackground(ctx,w,h){
  if(!bgImage.complete ||
     !bgImage.naturalWidth){
    return;
  }

  const scale = h / bgImage.naturalHeight;

  const drawW =
    bgImage.naturalWidth * scale;

  const drawH = h;

  const x = (w - drawW) / 2;

  ctx.drawImage(
    bgImage,
    x,0,
    drawW,drawH
  );
}

/*
  三角形のガラス破片生成
*/

function createGlassPieces(){

  glassPieces = [];

  const cx = canvasW * .50;
  const cy = canvasH * .47;

  /*
    中央から放射状に割れる。
    大きい破片と小さい破片を混在。
  */

  const rings = [0,55,125,230,430,800];

  for(let ring=0;ring<rings.length-1;ring++){

    const inner = rings[ring];
    const outer = rings[ring+1];

    const segments =
      ring===0 ? 16 :
      ring===1 ? 23 :
      ring===2 ? 30 :
      ring===3 ? 37 : 44;

    for(let i=0;i<segments;i++){

      const a1 =
        (i/segments)*Math.PI*2;

      const a2 =
        ((i+1)/segments)*Math.PI*2;

      const jitter1 =
        (Math.random()-.5)*.14;

      const jitter2 =
        (Math.random()-.5)*.14;

      const r1 =
        inner + rnd(-8,8);

      const r2 =
        outer + rnd(-18,18);

      const p1 = {
        x:cx+Math.cos(a1+jitter1)*r1,
        y:cy+Math.sin(a1+jitter1)*r1
      };

      const p2 = {
        x:cx+Math.cos(a1+jitter1)*r2,
        y:cy+Math.sin(a1+jitter1)*r2
      };

      const p3 = {
        x:cx+Math.cos(a2+jitter2)*r2,
        y:cy+Math.sin(a2+jitter2)*r2
      };

      const p4 = {
        x:cx+Math.cos(a2+jitter2)*r1,
        y:cy+Math.sin(a2+jitter2)*r1
      };

      const points =
        Math.random()<.35
          ? [p1,p2,p3]
          : [p1,p2,p3,p4];

      const midX =
        points.reduce((s,p)=>s+p.x,0)
        / points.length;

      const midY =
        points.reduce((s,p)=>s+p.y,0)
        / points.length;

      const angle =
        Math.atan2(midY-cy,midX-cx);

      const speed =
        rnd(170,510);

      glassPieces.push({

        points,

        midX,
        midY,

        vx:
          Math.cos(angle)*speed +
          rnd(-80,80),

        vy:
          Math.sin(angle)*speed +
          rnd(-120,80),

        rot:
          (Math.random()-.5)*8,

        rotation:0,

        depth:
          .65+Math.random()*1.5,

        opacity:1,

        time:0,

        delay:
          Math.random()*.14,

        life:
          .85+Math.random()*.65

      });
    }
  }
}

/*
  一つの破片を描画。

  背景の一部を切り取るように描く。
*/

function drawGlassPiece(piece,elapsed){

  const time =
    Math.max(0,elapsed-piece.delay);

  if(time<=0)return;

  const progress =
    Math.min(time/piece.life,1);

  if(progress>=1)return;

  const dx =
    piece.vx*time;

  const dy =
    piece.vy*time +
    120*time*time;

  const rotation =
    piece.rot*time;

  const scale =
    1 + progress*piece.depth;

  const opacity =
    Math.pow(1-progress,1.3);

  glassCtx.save();

  glassCtx.globalAlpha = opacity;

  glassCtx.translate(
    piece.midX+dx,
    piece.midY+dy
  );

  glassCtx.rotate(rotation);

  glassCtx.scale(scale,scale);

  glassCtx.translate(
    -piece.midX,
    -piece.midY
  );

  glassCtx.beginPath();

  piece.points.forEach((point,index)=>{
    if(index===0){
      glassCtx.moveTo(point.x,point.y);
    }else{
      glassCtx.lineTo(point.x,point.y);
    }
  });

  glassCtx.closePath();

  glassCtx.save();
  glassCtx.clip();

  /*
    破片の中に元の画面背景を描く。
  */

  drawStageBackground(
    glassCtx,
    canvasW,
    canvasH
  );

  /*
    割れ画像の明るい部分を
    破片の表面に重ねる。
  */

  if(crackImage.complete &&
     crackImage.naturalWidth){

    glassCtx.globalAlpha =
      opacity*.75;

    glassCtx.globalCompositeOperation =
      "screen";

    const imageScale = Math.min(
      canvasW/crackImage.naturalWidth,
      canvasH/crackImage.naturalHeight
    );

    const iw =
      crackImage.naturalWidth*imageScale;

    const ih =
      crackImage.naturalHeight*imageScale;

    glassCtx.drawImage(
      crackImage,
      (canvasW-iw)/2,
      (canvasH-ih)/2,
      iw,ih
    );

    glassCtx.globalCompositeOperation =
      "source-over";
  }

  glassCtx.restore();

  /*
    ガラスの輪郭と反射
  */

  glassCtx.strokeStyle =
    "rgba(240,250,255,.9)";

  glassCtx.lineWidth = 1.5;

  glassCtx.shadowColor =
    "rgba(180,220,255,.9)";

  glassCtx.shadowBlur = 7;

  glassCtx.stroke();

  /*
    表面の小さな光
  */

  glassCtx.strokeStyle =
    "rgba(255,255,255,.65)";

  glassCtx.lineWidth = .7;

  glassCtx.beginPath();

  if(piece.points.length>=3){

    const a = piece.points[0];
    const b = piece.points[1];

    glassCtx.moveTo(
      a.x*.7+b.x*.3,
      a.y*.7+b.y*.3
    );

    glassCtx.lineTo(
      a.x*.2+b.x*.8,
      a.y*.2+b.y*.8
    );
  }

  glassCtx.stroke();

  glassCtx.restore();
}

/*
  小さいガラス粉
*/

let glassDust = [];

function createGlassDust(){

  glassDust = [];

  const cx = canvasW*.5;
  const cy = canvasH*.47;

  for(let i=0;i<180;i++){

    const angle = Math.random()*Math.PI*2;
    const speed = rnd(100,630);

    glassDust.push({

      x:cx+rnd(-25,25),
      y:cy+rnd(-25,25),

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      size:Math.random()*2.7+.6,

      life:.5+Math.random()*1.1,

      delay:Math.random()*.22

    });
  }
}

function drawDust(elapsed){

  for(const dust of glassDust){

    const t =
      elapsed-dust.delay;

    if(t<0 || t>dust.life)continue;

    const p=t/dust.life;

    glassCtx.globalAlpha = 1-p;

    glassCtx.fillStyle =
      Math.random()<.5
        ? "#ffffff"
        : "#9ee8ff";

    const x =
      dust.x+dust.vx*t;

    const y =
      dust.y+dust.vy*t+100*t*t;

    glassCtx.beginPath();

    glassCtx.arc(
      x,y,dust.size*(1-p*.5),
      0,Math.PI*2
    );

    glassCtx.fill();
  }

  glassCtx.globalAlpha = 1;
}

/*
  アニメーション本体
*/

function animateGlass(){

  return new Promise(resolve=>{

    if(!glassCtx){
      resolve();
      return;
    }

    createGlassPieces();
    createGlassDust();

    const started = performance.now();

    function frame(now){

      const elapsed =
        (now-started)/1000;

      glassCtx.clearRect(
        0,0,
        canvasW,canvasH
      );

      for(const piece of glassPieces){
        drawGlassPiece(
          piece,
          elapsed
        );
      }

      drawDust(elapsed);

      if(elapsed<1.55){

        glassAnimation =
          requestAnimationFrame(frame);

      }else{

        glassCtx.clearRect(
          0,0,
          canvasW,canvasH
        );

        glassAnimation = null;

        resolve();
      }
    }

    glassAnimation =
      requestAnimationFrame(frame);
  });
}

  anim($("cracks"),"show");

  await wait(650);

  result.classList.add("shaking");

  await wait(900);

  await slashes();

  fragments();

  result.classList.remove("shaking");

  main.style.opacity = "0";

  await flash();

  await blackout(550);

  await hit(winNames[2]);
}

async function revivalDouble(won){

  await count();

  await falseMissPause(1200);

  await noCount();

  await falseMissPause(1150);

  await noCount();

  if(won){
    await hit(winNames[3]);
  }else{
    await miss(true);
  }
}

  await dots();

  switch(rnd(0,3)){

    case 0:
      await wait(1400);
      break;

    case 1:
      await blackout(1500);
      break;

      break;

      stars(10);
      await wait(1300);
      break;
  }

  await miss(true);
}

/* =============================
   MISS ROUTES
============================= */

async function missRoute(){

  if(roll(1/704)){
    return dotsMiss();
  }

  const r = Math.random();

  if(r<.08){
    return revivalNoCount(false);
  }

  if(r<.105){
    return revivalDouble(false);
  }

  if(r<.36){
    await common(rnd(0,11));
    return miss(false);
  }

  if(r<.66){
    await count();
    return miss(false);
  }

  if(r<.84){
    return weakMiss(rnd(0,9));
  }

  return strongMiss(rnd(0,5));
}

/* =============================
   RESET
============================= */

function reset(){

  runId++;

  stopMusic();

  busy = false;
  tapReady = false;

  fxHide();

  clearNum();
  hideFalseMiss();

  $("start").style.display = "block";

  $("hit").classList.remove("go");

  $("hitInfo").classList.remove("show");

  $("hitName").textContent = "";

  $("tap").classList.remove("show");

  $("dim").style.opacity = "0";
  black.style.opacity = "0";

  $("flash").classList.remove("flashGo");

  $("slash1").classList.remove("go");
  $("slash2").classList.remove("go");

  glassCrack.className = "";

  stage.classList.remove(
    "glassShake"
  );

  if(glassAnimation!==null){
    cancelAnimationFrame(glassAnimation);
    glassAnimation = null;
  }

  if(glassCtx){
    glassCtx.clearRect(
      0,0,
      canvasW,canvasH
    );
  }

  stage.querySelectorAll(
    ".particle,.shooting"
  ).forEach(el=>el.remove());
}

/* =============================
   GUIDE
============================= */

$("guideBtn").onclick = () => {
  $("modal").classList.add("open");
};

$("closeGuide").onclick = () => {
  $("modal").classList.remove("open");
};

$("modal").onclick = event => {
  if(event.target===$("modal")){
    $("modal").classList.remove("open");
  }
};

/* =============================
   TAP TO RETURN
============================= */

stage.onclick = () => {
  if(tapReady){
    reset();
  }
};

/* =============================
   START / LOTTERY
============================= */

$("startBtn").onclick = async event => {

  event.stopPropagation();

  if(busy)return;

  busy = true;
  tapReady = false;

  const id = ++runId;

  $("start").style.display = "none";

  /*
    全体の当選確率は1/25。
    ここで一度だけ抽選する。
  */

  const won = roll(1/25);

  try {

    tension();

    if(roll(.28)){
      stars(rnd(2,9));
    }

    if(won){

      /*
        当たり時

        画面破壊       19%
        次回予告       19%
        レインボー      8%
        虹フリーズ      8%
        その他新演出   16%
        既存44ルート   30%
      */

      const r = Math.random();

      if(r<.19){

        await randomBreak();

      }else if(r<.38){

        await newRoute(
          "preview",
          true
        );

      }else if(r<.46){

        await newRoute(
          "rainbowBurst",
          true
        );

      }else if(r<.54){

        await newRoute(
          "rainbow",
          true
        );

      }else if(r<.70){

        const kinds = [
          "freeze",
          "push",
          "promotion",
          "reverse",
          "odd"
        ];

        await newRoute(
          kinds[rnd(0,kinds.length-1)],
          true
        );

      }else{

        await winRoute(
          rnd(0,43)
        );
      }

    }else{

      /*
        ハズレ時

        次回予告だけ非常にまれに
        ハズレを許可。

        画面破壊とレインボーは
        絶対に出さない。
      */

      if(roll(1/2400)){

        await newRoute(
          "preview",
          false
        );

      }else if(roll(.10)){

        const kinds = [
          "freeze",
          "push",
          "promotion",
          "reverse",
          "odd"
        ];

        await newRoute(
          kinds[rnd(0,kinds.length-1)],
          false
        );

      }else{

        await missRoute();
      }
    }

  }catch(error){

    console.error(error);

    if(id===runId){
      reset();
    }
  }
};

/* =============================
   INITIALIZE
============================= */

reset();
