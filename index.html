
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#170010">
<title>Red Peanuts SLOT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#170010;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",sans-serif;
  touch-action:manipulation;
}
button{
  font:inherit;
  cursor:pointer;
}
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#170010
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png")
    center top/auto 100% no-repeat;
}
#stage.broken{
  background:#110816;
}

/* START */

#start{
  position:absolute;
  inset:0;
  z-index:10;
}
#startBtn{
  position:absolute;
  left:50%;
  bottom:8.5%;
  transform:translateX(-50%);
  width:min(80vw,390px);
  height:70px;
  border:2px solid #fff;
  border-radius:45px;
  background:linear-gradient(#ff78c4,#d00068);
  color:#fff;
  font-size:28px;
  font-weight:1000;
  box-shadow:0 0 28px #ff008d;
}
#rate{
  position:absolute;
  bottom:23%;
  width:100%;
  text-align:center;
  font-weight:900;
  text-shadow:0 2px 7px #000;
}
#rate b{
  display:block;
  color:#ffed9d;
  font-size:30px;
}
#guideBtn{
  position:absolute;
  bottom:34%;
  left:50%;
  transform:translateX(-50%);
  padding:11px 22px;
  white-space:nowrap;
  border:1px solid #fff;
  border-radius:30px;
  background:#580033df;
  color:#fff;
  font-weight:900;
  box-shadow:0 0 14px #ff3896;
}

/* NUMBER */

#num{
  position:absolute;
  z-index:25;
  top:61%;
  left:50%;
  width:100%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:min(52vw,255px);
  line-height:1.1;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:clamp(5px,1.5vw,9px) #ff4b9d;
  text-shadow:0 7px #ae0054,0 14px 10px #370018;
  opacity:0;
  pointer-events:none;
}
#num.show{
  opacity:1;
  animation:numPop .23s ease-out;
}
#num.red{
  color:#ff508b;
}
#num.gold{
  color:#fff1a8;
  -webkit-text-stroke:6px #f4a000;
  text-shadow:0 0 30px #ffd100;
}
#num.question{
  font-size:min(40vw,190px);
}
#num.dots{
  font-size:min(34vw,155px);
  color:#fff1a8;
}
#num.big{
  font-size:min(65vw,300px);
}
#num.nocount{
  width:94%;
  font-size:clamp(31px,9vw,56px);
  white-space:nowrap;
  letter-spacing:-.05em;
  -webkit-text-stroke:2px #ff4b9d;
}
@keyframes numPop{
  from{transform:translate(-50%,-50%) scale(.6)}
  75%{transform:translate(-50%,-50%) scale(1.1)}
  to{transform:translate(-50%,-50%) scale(1)}
}

/* BASIC EFFECTS */

#dim,#black,#noise,#lightning,#flash{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
#dim{
  z-index:12;
  background:#0009;
}
#black{
  z-index:29;
  background:#000;
}
#noise{
  z-index:30;
  background:repeating-linear-gradient(
    0deg,#fff6 0 2px,#0005 2px 5px
  );
}
#lightning{
  z-index:31;
  background:linear-gradient(
    120deg,
    transparent 42%,
    #fff 47%,
    #ff5db6 49%,
    transparent 54%
  );
  filter:drop-shadow(0 0 24px #ff1494);
}
#flash{
  z-index:165;
  background:#fff;
}
.flashGo,.noiseGo,.lightGo{
  animation:flashAnim .4s ease-out;
}
@keyframes flashAnim{
  0%,100%{opacity:0}
  40%{opacity:1}
}

/* MISS */

#result{
  position:absolute;
  z-index:36;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:18px;
  background:#000a;
  text-align:center;
  pointer-events:none;
}
#result.show{
  display:flex;
}
#near{
  font-size:clamp(26px,9vw,56px);
  font-weight:1000;
  color:#ffe18d;
  text-shadow:0 0 18px #ff8a00;
}
#mainResult{
  font-size:clamp(42px,15vw,82px);
  white-space:nowrap;
  line-height:1.2;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:3px #e00073;
  text-shadow:0 5px #8e0044,0 0 18px #ff379a;
}
#mainResult.appear{
  animation:resultPop .5s ease-out;
}
#message{
  font-size:clamp(14px,4vw,20px);
  font-weight:900;
  color:#ffe5aa;
  line-height:1.7;
  text-shadow:0 2px 5px #000;
}
@keyframes resultPop{
  from{opacity:0;transform:scale(.3)}
  65%{transform:scale(1.1)}
  to{opacity:1;transform:scale(1)}
}

/* SLASH */

.slash{
  position:absolute;
  z-index:95;
  left:-30%;
  top:48%;
  width:160%;
  height:22px;
  opacity:0;
  pointer-events:none;
  transform-origin:left center;
  background:linear-gradient(
    90deg,
    transparent,
    #ff87c9 10%,
    #fff 30%,
    #fff 75%,
    #ff1785,
    transparent
  );
  box-shadow:0 0 13px #fff,0 0 35px #ff0087;
}
#slash1{
  transform:rotate(-22deg) scaleX(0);
}
#slash2{
  transform:rotate(19deg) scaleX(0);
}
#slash1.go{
  animation:slashA .4s ease-out;
}
#slash2.go{
  animation:slashB .4s ease-out;
}
@keyframes slashA{
  0%{opacity:0;transform:rotate(-22deg) scaleX(0)}
  25%,75%{opacity:1}
  100%{opacity:0;transform:rotate(-22deg) scaleX(1)}
}
@keyframes slashB{
  0%{opacity:0;transform:rotate(19deg) scaleX(0)}
  25%,75%{opacity:1}
  100%{opacity:0;transform:rotate(19deg) scaleX(1)}
}

/* HIT */

#hit{
  position:absolute;
  z-index:180;
  top:46%;
  left:50%;
  width:100%;
  text-align:center;
  white-space:nowrap;
  opacity:0;
  transform:translate(-50%,-50%) scale(.1);
  pointer-events:none;
  font-size:clamp(65px,23vw,155px);
  line-height:1.2;
  font-weight:1000;
  color:#fff2a8;
  -webkit-text-stroke:clamp(4px,1.2vw,7px) #ff266b;
  text-shadow:
    0 6px #ff9b00,
    0 12px #a90043,
    0 0 28px #fff;
}
#hit.go{
  animation:hitPop .7s cubic-bezier(.16,.7,.2,1.2) forwards;
}
@keyframes hitPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}
  55%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
#hitInfo{
  position:absolute;
  z-index:181;
  top:65%;
  left:4%;
  width:92%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}
#hitInfo.show{
  animation:info .6s forwards;
}
#hitName{
  display:inline-block;
  max-width:100%;
  margin-top:9px;
  padding:10px 18px;
  border:1px solid #ffe391;
  border-radius:14px;
  background:#530b33e8;
  color:#ffec9c;
  font-size:clamp(15px,4.8vw,24px);
}
@keyframes info{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
#tap{
  position:absolute;
  z-index:182;
  bottom:9%;
  width:100%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}
#tap.show{
  animation:blink 1.2s infinite;
}
@keyframes blink{
  0%,100%{opacity:.4}
  50%{opacity:1}
}

/* SPECIAL FX */

#specialFX{
  position:absolute;
  inset:0;
  z-index:90;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  pointer-events:none;
  background:#100516;
  overflow:hidden;
}
#specialFX.active{
  display:flex;
}
#specialFX .fxTitle{
  font-size:clamp(38px,12vw,86px);
  font-weight:1000;
  text-shadow:0 0 18px #ffbc33;
}
#specialFX .fxSub{
  margin-top:22px;
  font-size:clamp(16px,5vw,29px);
  font-weight:900;
  text-shadow:0 3px 8px #000;
}
#specialFX.preview{
  background:#100516
    url("./0EB99059-7515-429E-B34D-8BFCE53ED083.png")
    center/contain no-repeat;
}
#specialFX.preview .fxTitle{
  display:none;
}
#specialFX.rainbow{
  background:#100516
    url("./CC92EC2B-BC54-4037-9F8C-45DB1AE891E2.png")
    center/contain no-repeat;
  animation:rainbowHue 1s linear infinite;
}
#specialFX.rainbow .fxTitle{
  display:none;
}
@keyframes rainbowHue{
  to{filter:hue-rotate(360deg)}
}
#specialFX.freeze{
  background:#000;
}
#specialFX.push{
  background:radial-gradient(circle,#581000,#080008 80%);
}
#specialFX.push .fxTitle{
  font-size:clamp(25px,7vw,48px);
}
#specialFX .fxButton{
  pointer-events:auto;
  border:3px solid #ffdf78;
  border-radius:50%;
  width:min(59vw,245px);
  height:min(59vw,245px);
  background:
    url("./BF43324D-F195-4E15-A371-AA8862724654.png")
    center/contain no-repeat;
  color:transparent;
  font-size:60px;
  font-weight:1000;
  box-shadow:0 0 25px #f80,0 0 50px #d00;
  animation:pushPulse .45s infinite alternate;
}
@keyframes pushPulse{
  from{transform:scale(.96)}
  to{transform:scale(1.04)}
}

/* STARS */

.shooting{
  position:absolute;
  z-index:32;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px #fff,0 0 25px #ff62b9;
  pointer-events:none;
  animation:shoot .9s linear forwards;
}
.shooting::after{
  content:"";
  position:absolute;
  right:0;
  top:2px;
  width:75px;
  height:2px;
  background:linear-gradient(90deg,transparent,#fff);
}
@keyframes shoot{
  from{opacity:0;transform:translate(0,0)}
  20%{opacity:1}
  to{opacity:0;transform:translate(240px,370px)}
}

/* GLASS */

#glassArea{
  position:absolute;
  inset:0;
  z-index:120;
  overflow:hidden;
  display:none;
  pointer-events:none;
}
#glassArea.active{
  display:block;
}
#glassCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#glassLight{
  position:absolute;
  inset:0;
  opacity:0;
  background:radial-gradient(
    circle at 50% 48%,
    #fff 0%,
    #ffffffb0 12%,
    transparent 65%
  );
}
#glassLight.go{
  animation:glassFlash .35s ease-out;
}
@keyframes glassFlash{
  0%,100%{opacity:0}
  25%{opacity:1}
}

/* GUIDE */

#modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000d;
  padding:15px;
}
#modal.open{
  display:flex;
}
#guide{
  width:min(94vw,430px);
  max-height:88dvh;
  overflow:auto;
  padding:20px 14px;
  text-align:center;
  border:2px solid #ff8bc5;
  border-radius:22px;
  background:linear-gradient(#580031,#1b0013);
}
#guide h2{
  color:#ffe6a1;
}
#guide p{
  padding:8px 0;
  border-bottom:1px solid #ffffff30;
  font-weight:800;
}
#guide em{
  color:#ffe58d;
  font-style:normal;
}
#closeGuide{
  margin:12px;
  padding:10px 50px;
  background:#ed2c8d;
  color:#fff;
  border:1px solid #fff;
  border-radius:25px;
}
#audioStatus{
  position:absolute;
  z-index:190;
  bottom:3%;
  width:100%;
  text-align:center;
  font-size:11px;
  color:#ffdf98;
  display:none;
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}
#audioStatus.show{
  display:block;
}
</style>
</head>

<body>

<div id="stage">

  <div id="start">
    <button id="guideBtn">演出期待度を見る</button>

    <div id="rate">
      大当たり確率
      <b>1 / 25</b>
    </div>

    <button id="startBtn">START</button>
  </div>

  <div id="dim"></div>
  <div id="num"></div>
  <div id="black"></div>
  <div id="noise"></div>
  <div id="lightning"></div>

  <div id="result">
    <div id="near"></div>
    <div id="mainResult">ハズレ</div>
    <div id="message"></div>
  </div>

  <div id="slash1" class="slash"></div>
  <div id="slash2" class="slash"></div>

  <div id="specialFX">
    <div class="fxTitle"></div>
    <div class="fxSub"></div>
  </div>

  <div id="glassArea">
    <canvas id="glassCanvas"></canvas>
    <div id="glassLight"></div>
  </div>

  <div id="flash"></div>
  <div id="hit">当たり</div>

  <div id="hitInfo">
    ✨ 今回の当選演出 ✨
    <div><span id="hitName"></span></div>
  </div>

  <div id="tap">画面をタップして戻る</div>
  <div id="audioStatus"></div>

</div>

<div id="modal">
  <div id="guide">
    <h2>✨ 演出期待度 ✨</h2>

    <p>⚡ ピンク稲妻 → <em>チャンス</em></p>
    <p>❓「？」出現 → <em>チャンス</em></p>
    <p>🌑 ブラックアウト → <em>大チャンス</em></p>
    <p>🟡 金色変化 → <em>大チャンス</em></p>
    <p>🎬 次回予告 → <em>約95%</em></p>
    <p>🌈 レインボー → <em>当たり確定</em></p>
    <p>💥 画面破壊 → <em>当たり確定</em></p>
    <p>🔴 デカPUSH → <em>チャンス</em></p>

    <button id="closeGuide">閉じる</button>
  </div>
</div>

<script>
"use strict";

/* ======================================
   CONFIG
====================================== */

const TEST_MODE = false;
const WIN_PROBABILITY = 1 / 25;
const LOOP_HIT_BGM = true;

const BACKGROUND_IMAGE =
  "./9E28B31B-C619-4F41-AB55-91C025168D02.png";

const CRACK_IMAGE =
  "./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png";

const TENSION_SOUND = "./Tension.mp3";
const HIT_SOUND = "./hit_music_final.mp3";

const GLASS_SOUND_MP3 =
  "./glass_crack_crack_shatter_v3.mp3";

const GLASS_SOUND_MOV =
  "./glass_crack_crack_shatter_v3_preview.mov";

/*
  演出の振り分け。

  先に1/25で大当たり抽選。
  そのあと当たり用・ハズレ用の演出を選ぶ。

  これなら演出の期待度を調整しても
  大当たり確率そのものは変わらない。
*/

const WIN_EFFECT_WEIGHTS = [
  ["glass",   0.16],
  ["rainbow", 0.08],
  ["preview", 0.18],
  ["gold",    0.08],
  ["black",   0.07],
  ["pink",    0.08],
  ["push",    0.06],
  ["normal",  0.29]
];

/*
  次回予告の出現時期待度を約95%にする
  ハズレ側の出現率。

  P(当たり|予告) = 0.95

  1/25の全体抽選は維持。
*/
const PREVIEW_WIN_WEIGHT = 0.18;
const PREVIEW_EXPECTATION = 0.95;

const PREVIEW_MISS_WEIGHT =
  WIN_PROBABILITY *
  PREVIEW_WIN_WEIGHT *
  (1 / PREVIEW_EXPECTATION - 1) /
  (1 - WIN_PROBABILITY);

const MISS_EFFECT_WEIGHTS = [
  ["preview", PREVIEW_MISS_WEIGHT],
  ["gold",    0.0025],
  ["black",   0.0020],
  ["pink",    0.0120],
  ["push",    0.0150]
];

/* ======================================
   BASIC
====================================== */

const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

const rnd = (a, b) =>
  Math.floor(Math.random() * (b - a + 1)) + a;

const roll = p => Math.random() < p;

function weightedChoice(items, fallback) {
  const r = Math.random();
  let sum = 0;

  for (const [name, weight] of items) {
    sum += weight;

    if (r < sum) {
      return name;
    }
  }

  return fallback;
}

const stage = $("stage");
const num = $("num");
const result = $("result");
const near = $("near");
const main = $("mainResult");
const message = $("message");
const black = $("black");
const fx = $("specialFX");

const glassArea = $("glassArea");
const glassCanvas = $("glassCanvas");
const glassLight = $("glassLight");

const ctx = glassCanvas.getContext("2d");

let busy = false;
let tapReady = false;
let runId = 0;

/* ======================================
   AUDIO
====================================== */

const AudioContextClass =
  window.AudioContext || window.webkitAudioContext;

let audioCtx = null;
let audioLoadPromise = null;

const buffers = {
  tension: null,
  hit: null,
  glass: null
};

let tensionSource = null;
let hitSource = null;
let glassSource = null;

const fallbackGlassAudio = new Audio();
fallbackGlassAudio.preload = "auto";
fallbackGlassAudio.volume = 1;

function showAudioStatus(text) {
  const el = $("audioStatus");

  el.textContent = text;
  el.classList.toggle("show", Boolean(text));
}

function activateAudio() {
  if (!AudioContextClass) {
    return Promise.resolve();
  }

  if (!audioCtx) {
    audioCtx = new AudioContextClass();
  }

  try {
    const silent = audioCtx.createBuffer(
      1, 1, audioCtx.sampleRate
    );

    const source = audioCtx.createBufferSource();
    source.buffer = silent;
    source.connect(audioCtx.destination);
    source.start(0);
  } catch (error) {
    console.warn(error);
  }

  return audioCtx.resume().catch(console.warn);
}

async function loadBuffer(url) {
  if (!audioCtx) return null;

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error(url);
    }

    const bytes = await response.arrayBuffer();

    return await audioCtx.decodeAudioData(
      bytes.slice(0)
    );
  } catch (error) {
    console.warn("音声読み込み:", url, error);
    return null;
  }
}

async function prepareAudio() {
  if (!audioCtx) return;

  if (!audioLoadPromise) {
    audioLoadPromise = (async () => {
      const data = await Promise.all([
        loadBuffer(TENSION_SOUND),
        loadBuffer(HIT_SOUND),
        loadBuffer(GLASS_SOUND_MP3)
      ]);

      buffers.tension = data[0];
      buffers.hit = data[1];
      buffers.glass = data[2];

      if (!buffers.glass) {
        fallbackGlassAudio.src = GLASS_SOUND_MOV;
        fallbackGlassAudio.load();
      }

      if (!buffers.hit) {
        showAudioStatus(
          "当たりBGMのファイルを確認してください"
        );
      }
    })();
  }

  await audioLoadPromise;
}

function makeSound(buffer, loop = false, volume = 1) {
  if (!audioCtx || !buffer) return null;

  try {
    const source = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();

    source.buffer = buffer;
    source.loop = loop;
    gain.gain.value = volume;

    source.connect(gain);
    gain.connect(audioCtx.destination);

    source.start(0);

    return source;
  } catch (error) {
    console.warn(error);
    return null;
  }
}

function stopSource(source) {
  if (!source) return;

  try {
    source.stop(0);
  } catch (error) {}
}

function tension() {
  stopSource(tensionSource);

  tensionSource = makeSound(
    buffers.tension, true, .7
  );
}

function stopTension() {
  stopSource(tensionSource);
  tensionSource = null;
}

function playHitBGM() {
  stopTension();

  stopSource(glassSource);
  glassSource = null;

  try {
    fallbackGlassAudio.pause();
  } catch (error) {}

  stopSource(hitSource);

  hitSource = makeSound(
    buffers.hit,
    LOOP_HIT_BGM,
    1
  );

  if (!hitSource) {
    showAudioStatus("当たりBGMを再生できません");
  } else {
    showAudioStatus("");
  }
}

function playGlassSound() {
  stopSource(glassSource);

  glassSource = makeSound(
    buffers.glass, false, 1
  );

  if (!glassSource) {
    try {
      fallbackGlassAudio.currentTime = 0;

      const playing = fallbackGlassAudio.play();

      if (playing && playing.catch) {
        playing.catch(() => {});
      }
    } catch (error) {}
  }
}

function stopMusic() {
  stopSource(tensionSource);
  stopSource(hitSource);
  stopSource(glassSource);

  tensionSource = null;
  hitSource = null;
  glassSource = null;

  try {
    fallbackGlassAudio.pause();
    fallbackGlassAudio.currentTime = 0;
  } catch (error) {}
}

document.addEventListener("visibilitychange", () => {
  if (!audioCtx) return;

  if (document.hidden) {
    audioCtx.suspend().catch(() => {});

/* ======================================
   CRACK IMAGE MATCHING
====================================== */

let crackPixels = null;
let mapW = 0;
let mapH = 0;

function buildCrackMap() {
  const scale = Math.min(
    1, 480 / Math.max(cw, ch)
  );

  mapW = Math.max(1, Math.floor(cw * scale));
  mapH = Math.max(1, Math.floor(ch * scale));

  crackMap.width = mapW;
  crackMap.height = mapH;

  crackCtx.clearRect(0, 0, mapW, mapH);

  if (!crackImage.naturalWidth) {
    crackPixels = null;
    return;
  }

  const scaleImage = Math.min(
    mapW / crackImage.naturalWidth,
    mapH / crackImage.naturalHeight
  );

  const iw = crackImage.naturalWidth * scaleImage;
  const ih = crackImage.naturalHeight * scaleImage;

  crackCtx.drawImage(
    crackImage,
    (mapW - iw) / 2,
    (mapH - ih) / 2,
    iw,
    ih
  );

  try {
    crackPixels = crackCtx.getImageData(
      0, 0, mapW, mapH
    );
  } catch (error) {
    crackPixels = null;
  }
}

function crackBrightness(x, y) {
  if (!crackPixels) return 0;

  const px = Math.floor(x / cw * mapW);
  const py = Math.floor(y / ch * mapH);

  if (
    px < 0 || py < 0 ||
    px >= mapW || py >= mapH
  ) {
    return 0;
  }

  const i = (py * mapW + px) * 4;
  const d = crackPixels.data;

  return (
    d[i] * .30 +
    d[i + 1] * .55 +
    d[i + 2] * .15
  ) * (d[i + 3] / 255) / 255;
}

function snapToCrack(x, y, radius = 18) {
  if (!crackPixels) return {x, y};

  let bestX = x;
  let bestY = y;
  let bestScore = -1;

  const step = Math.max(3, radius / 4);

  for (
    let dy = -radius;
    dy <= radius;
    dy += step
  ) {
    for (
      let dx = -radius;
      dx <= radius;
      dx += step
    ) {
      const distance = Math.hypot(dx, dy);

      if (distance > radius) continue;

      const bx = x + dx;
      const by = y + dy;

      const score =
        crackBrightness(bx, by) -
        distance / radius * .27;

      if (score > bestScore) {
        bestScore = score;
        bestX = bx;
        bestY = by;
      }
    }
  }

  if (bestScore < .22) return {x, y};

  return {x:bestX, y:bestY};
}

/* ======================================
   GLASS GEOMETRY
====================================== */

let shards = [];
let crackLines = [];
let dust = [];

function makeGeometry() {
  shards = [];
  crackLines = [];
  dust = [];

  const cx = cw * .5;
  const cy = ch * .48;

  const maxRadius = Math.hypot(cw, ch) * .9;
  const rings = [0, 37, 91, 160, 270, maxRadius];
  const sides = 28;
  const vertices = [];

  for (
    let ring = 0;
    ring < rings.length;
    ring++
  ) {
    vertices[ring] = [];

    for (let i = 0; i < sides; i++) {
      if (ring === 0) {
        vertices[ring][i] = {x:cx, y:cy};
        continue;
      }

      const angle =
        i / sides * Math.PI * 2 +
        (Math.random() - .5) * .09;

      const radius =
        rings[ring] *
        (1 + (Math.random() - .5) * .1);

      const x = cx + Math.cos(angle) * radius;
      const y = cy + Math.sin(angle) * radius;

      vertices[ring][i] = snapToCrack(
        x, y, ring < 2 ? 12 : 22
      );
    }
  }

  function line(a, b) {
    crackLines.push({a, b});
  }

  function shard(points) {
    const mx = points.reduce(
      (s, p) => s + p.x, 0
    ) / points.length;

    const my = points.reduce(
      (s, p) => s + p.y, 0
    ) / points.length;

    const angle = Math.atan2(
      my - cy, mx - cx
    );

    const speed = 170 + Math.random() * 360;

    shards.push({
      points,
      mx,
      my,
      vx:Math.cos(angle) * speed +
        (Math.random() - .5) * 140,
      vy:Math.sin(angle) * speed +
        (Math.random() - .5) * 130,
      spin:(Math.random() - .5) * 9,
      depth:.65 + Math.random() * 1.55,
      delay:Math.random() * .09,
      duration:.9 + Math.random() * .65,
      shine:Math.random()
    });
  }

  for (
    let ring = 0;
    ring < rings.length - 1;
    ring++
  ) {
    for (let i = 0; i < sides; i++) {
      const j = (i + 1) % sides;

      const a = vertices[ring][i];
      const b = vertices[ring + 1][i];
      const c = vertices[ring + 1][j];
      const d = vertices[ring][j];

      if (ring === 0) {
        shard([a, b, c]);
        line(a, b);
        line(b, c);
      } else {
        if (Math.random() < .5) {
          shard([a, b, c]);
          shard([a, c, d]);
          line(a, c);
        } else {
          shard([a, b, d]);
          shard([b, c, d]);
          line(b, d);
        }

        line(a, b);
        line(b, c);
      }
    }
  }

  for (let i = 0; i < 180; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 120 + Math.random() * 540;

    dust.push({
      x:cx + (Math.random() - .5) * 35,
      y:cy + (Math.random() - .5) * 35,
      vx:Math.cos(angle) * speed,
      vy:Math.sin(angle) * speed,
      size:.5 + Math.random() * 2.4,
      life:.5 + Math.random() * 1.1,
      delay:Math.random() * .18
    });
  }
}

/* ======================================
   DRAW CRACKS
====================================== */

function drawCrackLines(progress) {
  const cx = cw * .5;
  const cy = ch * .48;
  const radius = Math.hypot(cw, ch) * progress;

  ctx.save();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (crackImage.naturalWidth) {
    const scale = Math.min(
      cw / crackImage.naturalWidth,
      ch / crackImage.naturalHeight
    );

    const iw = crackImage.naturalWidth * scale;
    const ih = crackImage.naturalHeight * scale;

    ctx.save();

    ctx.beginPath();
    ctx.arc(
      cx, cy,
      Math.max(1, radius),
      0, Math.PI * 2
    );
    ctx.clip();

    ctx.globalAlpha = .16;
    ctx.globalCompositeOperation = "screen";

    ctx.drawImage(
      crackImage,
      (cw - iw) / 2,
      (ch - ih) / 2,
      iw,
      ih
    );

    ctx.restore();
  }

  for (const line of crackLines) {
    const mx = (line.a.x + line.b.x) / 2;
    const my = (line.a.y + line.b.y) / 2;

    if (Math.hypot(mx - cx, my - cy) > radius) {
      continue;
    }

    ctx.beginPath();
    ctx.moveTo(line.a.x, line.a.y);
    ctx.lineTo(line.b.x, line.b.y);

    ctx.strokeStyle = "rgba(20,37,55,.82)";
    ctx.lineWidth = 3.5;
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(line.a.x, line.a.y);
    ctx.lineTo(line.b.x, line.b.y);

    ctx.strokeStyle = "rgba(245,251,255,.94)";
    ctx.lineWidth = 1.3;
    ctx.shadowColor = "#d7f5ff";
    ctx.shadowBlur = 5;
    ctx.stroke();
  }

  ctx.restore();
}

/* ======================================
   DRAW SHARDS
====================================== */

function drawShard(s, elapsed) {
  const t = elapsed - s.delay;
  if (t < 0) return;

  const p = t / s.duration;
  if (p >= 1) return;

  const dx = s.vx * t;
  const dy = s.vy * t + 150 * t * t;

  ctx.save();

  ctx.globalAlpha = Math.pow(1 - p, 1.15);

  ctx.translate(s.mx + dx, s.my + dy);
  ctx.rotate(s.spin * t);
  ctx.scale(
    1 + p * s.depth,
    1 + p * s.depth
  );
  ctx.translate(-s.mx, -s.my);

  ctx.beginPath();

  s.points.forEach((point, i) => {
    if (i === 0) {
      ctx.moveTo(point.x, point.y);
    } else {
      ctx.lineTo(point.x, point.y);
    }
  });

  ctx.closePath();

  ctx.save();
  ctx.clip();

  ctx.drawImage(
    snapshot,
    0, 0, snapshot.width, snapshot.height,
    0, 0, cw, ch
  );

  const gradient = ctx.createLinearGradient(
    s.mx - 35,
    s.my - 35,
    s.mx + 35,
    s.my + 35
  );

  gradient.addColorStop(
    0, "rgba(255,255,255,.30)"
  );

  gradient.addColorStop(
    .45, "rgba(165,215,255,.03)"
  );

  gradient.addColorStop(
    1, "rgba(255,255,255,.24)"
  );

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.restore();

  ctx.lineWidth = 1.1;
  ctx.strokeStyle = "rgba(235,250,255,.84)";
  ctx.shadowColor = "rgba(160,220,255,.85)";
  ctx.shadowBlur = 5;
  ctx.stroke();

  if (s.shine > .8) {
    const a = s.points[0];
    const b = s.points[1];

    ctx.beginPath();

    ctx.moveTo(
      a.x * .75 + b.x * .25,
      a.y * .75 + b.y * .25
    );

    ctx.lineTo(
      a.x * .25 + b.x * .75,
      a.y * .25 + b.y * .75
    );

    ctx.strokeStyle = "rgba(255,255,255,.92)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.restore();
}

function drawDust(elapsed) {
  ctx.save();

  for (const d of dust) {
    const t = elapsed - d.delay;

    if (t < 0 || t > d.life) continue;

    const p = t / d.life;

    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = p < .5 ? "#fff" : "#c8efff";

    ctx.beginPath();

    ctx.arc(
      d.x + d.vx * t,
      d.y + d.vy * t + 160 * t * t,
      d.size * (1 - p * .4),
      0, Math.PI * 2
    );

    ctx.fill();
  }

  ctx.restore();
}

function growCracks(from, to, duration) {
  return new Promise(resolve => {
    const started = performance.now();

    function frame(now) {
      const p = Math.min(
        (now - started) / duration, 1
      );

      ctx.clearRect(0, 0, cw, ch);

      drawCrackLines(
        from + (to - from) * p
      );

      if (p < 1) {
        requestAnimationFrame(frame);
      } else {
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

function flyGlass() {
  return new Promise(resolve => {
    const started = performance.now();

    function frame(now) {
      const elapsed = (now - started) / 1000;

      ctx.clearRect(0, 0, cw, ch);

      for (const shard of shards) {
        drawShard(shard, elapsed);
      }

      drawDust(elapsed);

      if (elapsed < 1.65) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, cw, ch);
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

/* ======================================
   SCREEN BREAK
====================================== */

async function glassBreak() {
  await Promise.all([
    imageLoaded(bgImage),
    imageLoaded(crackImage)
  ]);

  resizeCanvases();
  captureScreen();
  buildCrackMap();
  makeGeometry();

  stopTension();

  glassArea.classList.add("active");
  ctx.clearRect(0, 0, cw, ch);

  playGlassSound();

  await growCracks(0, .26, 360);
  await wait(150);

  await growCracks(.26, 1.08, 440);
  await wait(130);

  anim(glassLight, "go");

  stage.classList.add("broken");

  num.style.visibility = "hidden";
  result.style.visibility = "hidden";
  $("dim").style.visibility = "hidden";

  await flyGlass();

  glassArea.classList.remove("active");
  stage.classList.remove("broken");

  num.style.visibility = "";
  result.style.visibility = "";
  $("dim").style.visibility = "";

  hideFalseMiss();
  clearNum();

  await flash();
}

/* ======================================
   GLASS HIT - 8 TIMINGS
====================================== */

async function guaranteedGlassHit() {
  const pattern = rnd(0, 7);

  switch (pattern) {
    case 0:
      await wait(650);
      break;

    case 1:
      showNum("3");
      await wait(780);
      break;

    case 2:
      await digit("3", 800);
      showNum("2");
      await wait(780);
      break;

    case 3:
      await digit("3", 800);
      await digit("2", 800);
      showNum("1");
      await wait(780);
      break;

    case 4:
      await slowCountdown();
      await wait(400);
      break;

    case 5:
      await count();
      await falseMissPause(1350);
      break;

    case 6:
      await count();
      await falseMissPause(1000);
      await noCount();
      showNum("1");
      await wait(650);
      break;

    case 7:
      await count();
      await fxPush();
      showNum("1");
      await wait(550);
      break;
  }

  await glassBreak();
  await hit("画面破壊・当たり確定");
}

/* ======================================
   REVIVALS
====================================== */

async function revivalBlack() {
  await slowCountdown();
  await falseMissPause(1600);
  await blackout(1700);
  await hit(winNames[0]);
}

async function revivalNoCount(won) {
  await slowCountdown();
  await falseMissPause(1300);
  await noCount();

  if (won) {
    await hit(winNames[1]);
  } else {
    await miss(true);
  }
}

async function revivalCrack() {
  await count();
  await falseMissPause(1300);
  await glassBreak();
  await hit(winNames[2]);
}

async function revivalDouble(won) {
  await count();
  await falseMissPause(1100);
  await noCount();

  await falseMissPause(1100);
  await noCount();

  if (won) {
    await hit(winNames[3]);
  } else {
    await miss(true);
  }
}

/* ======================================
   44 WIN ROUTES
====================================== */

async function winRoute(i) {
  if (i === 0) return revivalBlack();
  if (i === 1) return revivalNoCount(true);
  if (i === 2) return revivalCrack();
  if (i === 3) return revivalDouble(true);

  switch (i) {
    case 4:
      await blackout(1200);
      break;

    case 5:
      await digit("3");
      await digit("2", 2200);
      break;

    case 6:
      await count();
      await digit("2", 900);
      break;

    case 7:
      await count();
      await digit("0", 900, "gold");
      break;

    case 8:
      await slowCountdown();
      await wait(950);
      break;

    case 9:
      stopTension();
      await digit("3", 1400);
      await wait(1000);
      break;

    case 10:
      await digit("3");
      await digit("2");
      await holdOne(3200);
      break;

    case 11:
      await count();
      await fastCount();
      break;

    case 12:
      await fastCount();
      await fastCount();
      break;

    case 13:
      await slowCountdown();
      await blackout(2300);
      break;

    case 14:
      await slowCountdown();
      await blackout(1300);
      await fastCount();
      break;

    case 15:
      await slowCountdown();
      await slashes();
      break;

    case 16:
      await digit("3");
      await digit("1");
      await digit("2");
      break;

    case 17:
      await quietCountdown();
      break;

    case 18:
      await slowCountdown();
      await dots();
      await digit("1", 850);
      break;

    case 19:
      await digit("3", 1200);
      await digit("1", 1100);
      break;

    case 20:
      await slowCountdown();
      await wait(1700);
      break;

    case 21:
      await rewindCountdown();
      break;

    case 22:
      await fastCount();
      break;

    case 23:
      await slowCountdown();
      await slashes();
      break;

    case 24:
      await digit("3");
      stopTension();
      await wait(1350);
      break;

    case 25:
      await count();
      await digit("?", 1200, "question");
      break;

    case 26:
      await slowCountdown();
      await blackout(1600);
      break;

    case 27:
      await count();
      await dots();
      break;

    case 28:
      await slowCountdown();
      await dots();
      await digit("1", 850);
      break;

    case 29:
      await slowCountdown();
      await dots();
      await blackout(1500);
      break;

    case 30:
      await count();
      await dots();
      stars(12);
      await wait(950);
      break;

    case 31:
      await quietCountdown();
      await dots();
      await wait(1300);
      break;

    case 32:
      await count();
      await digit("1", 1500, "big");
      break;

    case 33:
      await count();
      await digit("1", 1000, "red");
      break;

    case 34:
      await slowCountdown();
      await lightning();
      break;

    case 35:
      await count();
      await noise();
      break;

    case 36:
      await count();
      await digit("1", 1000, "gold");
      break;

    case 37:
      await digit("3");
      await digit("2");
      await holdOne(4000);
      break;

    case 38:
      await slowCountdown();
      await digit("?", 1200, "question");
      break;

    case 39:
      $("dim").style.opacity = "1";
      await slowCountdown();
      $("dim").style.opacity = "0";
      break;

    case 40:
      await digit("3", 1000);
      await digit("2", 1900);
      await holdOne(2600);
      break;

    case 41:
      await quietCountdown();
      await wait(1200);
      break;

    case 42:
      await count();
      await wait(800);
      await fastCount();
      break;

    case 43:
      await slowCountdown();
      await flash();
      break;
  }

  await hit(winNames[i]);
}

/* ======================================
   SUDDEN HIT
====================================== */

async function suddenHit() {
  const timing = rnd(0, 4);

  switch (timing) {
    case 0:
      await digit("3", rnd(650, 1200));
      break;

    case 1:
      await digit("3", 950);
      await digit("2", rnd(650, 1400));
      break;

    case 2:
      await digit("3", 850);
      await digit("2", 950);
      await holdOne(rnd(850, 1900));
      break;

    case 3:
      await slowCountdown();
      break;

    case 4:
      await quietCountdown();
      await wait(900);
      break;
  }

  await hit("突然当たり");
}

   EXPECTATION EFFECT ROUTES
====================================== */

async function rainbowEffect() {

  await hit("レインボー・当たり確定");

/* ======================================
   OTHER WIN ROUTES
====================================== */

/*
  元の44ルートはすべて残す。

  普通のカウントダウンからでも
  当たりが出るようにする。

  ここで選ばれる通常系ルートは
  金色・稲妻・ブラックアウトなど
  特定演出の出現率に影響することがある。
*/

async function normalWinRoute() {
  /*
    普通のカウントダウンから
    突然当たるルートを入れる。
  */

  if (roll(.38)) {
    return suddenHit();
  }

  /*
    その他は元の44ルート。
  */

  return winRoute(rnd(0, 43));
}

/* ======================================
   WIN EFFECT SELECTION
====================================== */

async function regularWinRoute() {
  const kind = weightedChoice(
    WIN_EFFECT_WEIGHTS,
    "normal"
  );

  switch (kind) {
    case "glass":
      return guaranteedGlassHit();

    case "rainbow":
      return rainbowEffect();

    case "preview":
      return previewEffect(true);

    case "gold":
      return goldEffect(true);

    case "black":
      return blackEffect(true);

    case "pink":
      return pinkEffect(true);

    case "push":
      return pushEffect(true);

    default:
      return normalWinRoute();
  }
}

/* ======================================
   NORMAL MISS ROUTES
====================================== */

async function weakMiss(i) {
  switch (i) {
    case 0:
      await slowCountdown();
      break;

    case 1:
      await digit("3", 1000);
      await digit("2", 1200);
      await holdOne(2700);
      break;

    case 2:
      await slowCountdown();
      await digit("1", 750, "red");
      break;

    case 3:
      await quietCountdown();
      break;

    case 4:
      await count();
      await wait(1000);
      break;

    case 5:
      await digit("3", 2500);
      await digit("2", 1000);
      await holdOne(1500);
      break;

    case 6:
      await digit("3");
      await digit("2", 650, "red");
      await holdOne(1900);
      break;

    case 7:
      await slowCountdown();
      await digit("0", 500);
      break;

    case 8:
      await slowCountdown();
      await wait(1200);
      break;

    case 9:
      await fastCount();
      await wait(1200);
      break;
  }

  await miss(false);
}

/* ======================================
   MISS REVIVALS / NEAR MISS
====================================== */

async function strongMiss(i) {
  switch (i) {
    case 0:
      await slowCountdown();
      await slashes();
      break;

    case 1:
      await quietCountdown();
      await wait(1100);
      break;

    case 2:
      await slowCountdown();
      await digit("1", 1200, "red");
      break;

    case 3:
      await slowCountdown();
      await slashes();
      await flash();
      break;

    case 4:
      await slowCountdown();
      await wait(1200);
      break;

    case 5:
      await slowCountdown();
      await dots();
      await wait(1100);
      break;
  }

  await miss(true);
}

async function normalMissRoute() {
  const r = Math.random();

  if (r < .06) {
    return revivalNoCount(false);
  }

  if (r < .085) {
    return revivalDouble(false);
  }

  if (r < .40) {
    await slowCountdown();
    return miss(false);
  }

  if (r < .58) {
    await quietCountdown();
    return miss(false);
  }

  if (r < .84) {
    return weakMiss(rnd(0, 9));
  }

  return strongMiss(rnd(0, 5));
}

/* ======================================
   MISS EFFECT SELECTION
====================================== */

async function missRoute() {
  const kind = weightedChoice(
    MISS_EFFECT_WEIGHTS,
    "normal"
  );

  switch (kind) {
    case "preview":
      return previewEffect(false);

    case "gold":
      return goldEffect(false);

    case "black":
      return blackEffect(false);

    case "pink":
      return pinkEffect(false);

    case "push":
      return pushEffect(false);

    default:
      return normalMissRoute();
  }
}

/* ======================================
   RESET
====================================== */

function reset() {
  runId++;
  stopMusic();

  busy = false;
  tapReady = false;

  clearNum();
  fxHide();
  hideFalseMiss();

  $("start").style.display = "block";

  $("hit").classList.remove("go");
  $("hitInfo").classList.remove("show");

  $("hitName").textContent = "";
  $("tap").classList.remove("show");

  $("dim").style.opacity = "0";
  black.style.opacity = "0";

  $("flash").classList.remove("flashGo");
  $("slash1").classList.remove("go");
  $("slash2").classList.remove("go");

  glassArea.classList.remove("active");
  stage.classList.remove("broken");

  num.style.visibility = "";
  result.style.visibility = "";
  $("dim").style.visibility = "";

  ctx.clearRect(0, 0, cw, ch);

  stage.querySelectorAll(".shooting").forEach(el => {
    el.remove();
  });
}

/* ======================================
   GUIDE
====================================== */

$("guideBtn").onclick = () => {
  $("modal").classList.add("open");
};

$("closeGuide").onclick = () => {
  $("modal").classList.remove("open");
};

$("modal").onclick = event => {
  if (event.target === $("modal")) {
    $("modal").classList.remove("open");
  }
};

/* ======================================
   TAP RETURN
====================================== */

stage.onclick = () => {
  if (tapReady) {
    reset();
  }
};

/* ======================================
   START
====================================== */

$("startBtn").onclick = async event => {
  event.stopPropagation();

  if (busy) return;

  busy = true;
  tapReady = false;

  const id = ++runId;

  $("start").style.display = "none";

  /*
    大当たり抽選はSTART時に1回。

    1/25で大当たり。
    演出の途中で抽選結果は変わらない。
  */

  const won = TEST_MODE
    ? true
    : roll(WIN_PROBABILITY);

  /*
    音声はSTART時に有効化する。
  */

  try {
    await activateAudio();
    await prepareAudio();

    if (id !== runId) return;

    tension();

    if (roll(.28)) {
      stars(rnd(2, 9));
    }

    if (TEST_MODE) {
      await guaranteedGlassHit();

    } else if (won) {
      await regularWinRoute();

    } else {
      await missRoute();
    }

  } catch (error) {
    console.error(error);

    if (id === runId) {
      reset();
    }
  }
};

/* ======================================
   INIT
====================================== */

resizeCanvases();
reset();

</script>
