<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RP COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN",sans-serif;
}

body{
  user-select:none;
}

/* =========================================================
   MAIN
========================================================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;

  background-color:#120008;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;

  transform-origin:center center;
}

#stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:rgba(0,0,0,0);
  transition:background 1s;
}

#stage.bgDark::after{
  background:rgba(0,0,0,.76);
}

#stage.hitZoom{
  animation:hitStageZoom .52s cubic-bezier(.12,.8,.15,1);
}

@keyframes hitStageZoom{
  0%{transform:scale(1)}
  18%{transform:scale(1.13)}
  35%{transform:scale(.98)}
  55%{transform:scale(1.07)}
  100%{transform:scale(1)}
}

/* =========================================================
   COUNT NUMBER
========================================================= */

#number{
  position:absolute;
  z-index:20;

  left:50%;
  top:61%;

  transform:translate(-50%,-50%);

  width:100%;
  text-align:center;

  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;

  color:#fff7fb;

  -webkit-text-stroke:
    clamp(5px,1.6vw,9px)
    #ff4b9d;

  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);

  transition:
    color .18s,
    transform .18s,
    opacity .18s,
    filter .18s;
}

#number.show{
  animation:numberPop .32s ease-out;
}

@keyframes numberPop{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.16);
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

#number.bigChance{
  animation:
    bigChance
    .7s
    cubic-bezier(.1,1.4,.2,1);
}

@keyframes bigChance{
  0%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  35%{
    transform:
      translate(-50%,-50%)
      scale(1.55);
  }

  65%{
    transform:
      translate(-50%,-50%)
      scale(.92);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

#number.red{
  color:#ff5353;
  -webkit-text-stroke-color:#fff;
}

#number.gold{
  color:#fff0a0;
  -webkit-text-stroke-color:#ffb300;

  text-shadow:
    0 6px 0 #d78c00,
    0 12px 0 #8c5200,
    0 0 20px #fff,
    0 0 45px #ffc400;
}

#number.pink{
  color:#ffb6dc;
}

#number.cracked{
  filter:contrast(1.5);

  text-shadow:
    -4px -2px 0 rgba(255,255,255,.5),
    4px 3px 0 #8b003d,
    0 8px 0 #d82779,
    0 15px 0 #7a003a;
}

#dots{
  position:absolute;
  z-index:22;

  display:none;

  left:50%;
  top:61%;

  transform:translate(-50%,-50%);

  font-size:90px;
  font-weight:1000;

  color:#fff7fb;

  -webkit-text-stroke:4px #ff4b9d;

  text-shadow:
    0 5px 0 #d82779,
    0 10px 0 #970049;
}

/* =========================================================
   START
========================================================= */

#start{
  position:absolute;
  z-index:100;

  left:50%;

  bottom:
    max(
      7%,
      env(safe-area-inset-bottom)
    );

  transform:translateX(-50%);

  width:min(72vw,330px);

  padding:17px 20px;

  border:
    2px solid
    rgba(255,255,255,.9);

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #ff73b9,
      #d00064
    );

  color:#fff;

  font-size:21px;
  font-weight:1000;

  letter-spacing:.12em;

  box-shadow:
    0 5px 0 #79003a,
    0 0 25px rgba(255,40,140,.7);
}

#start:active{
  transform:
    translateX(-50%)
    translateY(4px);
}

#info{
  position:absolute;
  z-index:100;

  left:0;
  right:0;

  bottom:
    calc(
      max(
        7%,
        env(safe-area-inset-bottom)
      )
      + 75px
    );

  text-align:center;

  font-size:11px;
  font-weight:800;
  line-height:1.6;

  text-shadow:
    0 2px 5px #000;
}

/* =========================================================
   COMMON FX
========================================================= */

#black{
  position:fixed;
  inset:0;

  z-index:150;

  display:none;

  background:#000;
}

#noise{
  position:fixed;
  inset:0;

  z-index:125;

  display:none;

  pointer-events:none;

  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.13) 0px,
      rgba(255,255,255,.13) 1px,
      rgba(0,0,0,.2) 2px,
      rgba(0,0,0,.2) 4px
    );

  mix-blend-mode:screen;
}

#noise.go{
  display:block;
  animation:
    noiseMove
    .07s
    steps(2)
    infinite;
}

@keyframes noiseMove{
  0%{transform:translate(0,0)}
  25%{transform:translate(5px,-4px)}
  50%{transform:translate(-5px,3px)}
  75%{transform:translate(3px,5px)}
  100%{transform:translate(-3px,-5px)}
}

#lightning{
  position:fixed;
  inset:0;

  z-index:130;

  display:none;

  pointer-events:none;
}

#lightning.go{
  display:block;
}

.bolt{
  position:absolute;

  left:48%;
  top:-10%;

  width:10px;
  height:125%;

  background:#fff;

  transform:rotate(17deg);

  box-shadow:
    0 0 10px #fff,
    0 0 30px #ff4fa8,
    0 0 70px #ff0080;

  clip-path:
    polygon(
      50% 0,
      100% 0,
      65% 38%,
      100% 38%,
      38% 100%,
      50% 53%,
      0 53%
    );
}

#logoGlow{
  position:fixed;
  inset:0;

  z-index:15;

  pointer-events:none;

  opacity:0;

  background:
    radial-gradient(
      circle at 50% 27%,
      rgba(255,255,255,.95) 0%,
      rgba(255,50,155,.6) 8%,
      rgba(255,0,100,.18) 23%,
      transparent 43%
    );
}

#logoGlow.go{
  animation:
    logoGlow
    .8s
    ease-out;
}

@keyframes logoGlow{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

#question{
  position:fixed;
  z-index:140;

  display:none;

  left:50%;
  top:58%;

  transform:translate(-50%,-50%);

  font-size:110px;
  font-weight:1000;

  color:#fff;

  -webkit-text-stroke:
    5px #ff4b9d;

  text-shadow:
    0 0 25px #ff1493;
}

/* =========================================================
   SHOOTING STARS
========================================================= */

.star{
  position:fixed;

  z-index:12;

  pointer-events:none;

  width:10px;
  height:10px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 5px #fff,
    0 0 12px rgba(255,255,255,.95),
    0 0 22px rgba(255,190,225,.7);
}

.star::after{
  content:"";

  position:absolute;

  right:4px;
  top:4px;

  width:var(--tail,150px);
  height:2px;

  transform-origin:right center;
  transform:rotate(32deg);

  background:
    linear-gradient(
      90deg,
      transparent 0%,
      rgba(255,255,255,.04) 18%,
      rgba(255,255,255,.18) 45%,
      rgba(255,255,255,.55) 76%,
      #fff 100%
    );
}

.star.go{
  animation:
    shootNatural
    var(--speed,.85s)
    linear
    forwards;
}

@keyframes shootNatural{
  0%{
    transform:
      translate3d(0,0,0);

    opacity:0;
  }

  7%{
    opacity:1;
  }

  75%{
    opacity:1;
  }

  100%{
    transform:
      translate3d(78vw,48vh,0);

    opacity:0;
  }
}

/* =========================================================
   HIT IMPACT
========================================================= */

#hitDark{
  position:fixed;
  inset:0;

  z-index:180;

  display:none;

  background:
    rgba(0,0,0,.92);
}

#slash{
  position:fixed;
  inset:0;

  z-index:210;

  display:none;

  pointer-events:none;

  overflow:hidden;
}

#slash.go{
  display:block;
}

.slashLine{
  position:absolute;

  left:-30%;
  top:50%;

  width:160%;
  height:31px;

  background:#fff;

  box-shadow:
    0 0 8px #fff,
    0 0 22px #fff,
    0 0 50px #ff58ad,
    0 0 110px #ff007b;

  transform:
    rotate(-18deg)
    scaleX(0);
}

#slash.go .slashLine{
  animation:
    slashGo
    .22s
    ease-out
    forwards;
}

@keyframes slashGo{
  to{
    transform:
      rotate(-18deg)
      scaleX(1);
  }
}

#flash{
  position:fixed;
  inset:0;

  z-index:460;

  pointer-events:none;

  background:#fff;

  opacity:0;
}

#flash.go{
  animation:
    whiteFlash
    .55s
    ease-out;
}

@keyframes whiteFlash{
  0%{opacity:0}
  8%{opacity:1}
  20%{opacity:1}
  35%{opacity:.15}
  48%{opacity:1}
  100%{opacity:0}
}

#impactWhite{
  position:fixed;
  inset:0;

  z-index:280;

  pointer-events:none;

  display:none;

  background:#fff;
}

#impactWhite.go{
  display:block;

  animation:
    impactWhite
    .24s
    linear
    forwards;
}

@keyframes impactWhite{
  0%{opacity:1}
  42%{opacity:1}
  100%{opacity:0}
}

body.hitShake{
  animation:
    hitShake
    .065s
    linear
    10;
}

@keyframes hitShake{
  0%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-12px,7px) rotate(-.7deg)}
  20%{transform:translate(11px,-8px) rotate(.7deg)}
  30%{transform:translate(-8px,-9px) rotate(-.4deg)}
  40%{transform:translate(13px,6px) rotate(.5deg)}
  50%{transform:translate(-12px,9px) rotate(-.6deg)}
  60%{transform:translate(9px,-7px) rotate(.5deg)}
  70%{transform:translate(-7px,5px) rotate(-.4deg)}
  80%{transform:translate(7px,-4px) rotate(.3deg)}
  90%{transform:translate(-3px,2px)}
  100%{transform:translate(0,0)}
}

#hitText{
  position:fixed;

  z-index:300;

  display:none;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  width:180vw;

  text-align:center;

  font-size:
    min(43vw,220px);

  line-height:1;

  font-weight:1000;

  color:#fff4a6;

  -webkit-text-stroke:
    5px #ff245f;

  text-shadow:
    0 8px 0 #b0003c,
    0 15px 0 #60001f,
    0 0 20px #fff,
    0 0 55px #ffca00,
    0 0 120px #ff004c;
}

#hitText.go{
  display:block;

  animation:
    hitExplosion
    1.05s
    cubic-bezier(.08,1.45,.12,1);
}

@keyframes hitExplosion{
  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(6.5)
      rotate(-7deg);

    filter:blur(20px);
  }

  17%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(.55)
      rotate(2deg);

    filter:blur(0);
  }

  31%{
    transform:
      translate(-50%,-50%)
      scale(1.45)
      rotate(-1deg);
  }

  46%{
    transform:
      translate(-50%,-50%)
      scale(.88);
  }

  61%{
    transform:
      translate(-50%,-50%)
      scale(1.18);
  }

  76%{
    transform:
      translate(-50%,-50%)
      scale(.96);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

/* =========================================================
   NEW TREASURE SCREEN
   画像そのものを宝箱画面として使用
========================================================= */

#treasure{
  position:fixed;
  inset:0;

  z-index:350;

  display:none;

  overflow:hidden;

  background:#100006;
}

#treasure.show{
  display:block;
}

/*
  元画像は縦長。
  画面いっぱいに表示して、
  iPhoneでは縦方向を優先。
*/
#treasureBg{
  position:absolute;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center center;

  pointer-events:none;

  user-select:none;
}

/*
  タップ判定。
  画像の宝箱の上に透明ボタンを重ねる。
*/
.treasureTap{
  position:absolute;

  z-index:365;

  top:44%;

  width:31%;
  height:23%;

  appearance:none;

  border:0;
  padding:0;

  background:transparent;

  cursor:pointer;

  border-radius:20px;
}

#tapLeft{
  left:1%;
}

#tapCenter{
  left:34.5%;
}

#tapRight{
  right:1%;
}

.treasureTap:active{
  transform:scale(.96);
}

/*
  選んだ宝箱の発光
*/
#selectedGlow{
  position:absolute;

  z-index:360;

  display:none;

  top:43%;

  width:31%;
  height:24%;

  border-radius:35%;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.85) 0%,
      rgba(255,236,110,.55) 18%,
      rgba(255,42,150,.35) 45%,
      transparent 72%
    );

  box-shadow:
    0 0 30px rgba(255,255,255,.9),
    0 0 65px rgba(255,210,50,.8),
    0 0 120px rgba(255,0,120,.75);

  animation:
    treasureGlowPulse
    .35s
    ease-in-out
    infinite alternate;
}

@keyframes treasureGlowPulse{
  from{
    transform:scale(.9);
    opacity:.65;
  }

  to{
    transform:scale(1.18);
    opacity:1;
  }
}

/*
  選んだ宝箱を揺らしているように見せる
*/
#treasureShake{
  position:absolute;

  z-index:361;

  display:none;

  top:44%;

  width:31%;
  height:23%;

  border-radius:25px;

  pointer-events:none;

  border:
    4px solid
    rgba(255,255,255,.0);
}

#treasureShake.go{
  display:block;

  animation:
    treasureShake
    .075s
    linear
    infinite;
}

@keyframes treasureShake{
  0%{
    transform:
      translate(-5px,1px)
      rotate(-1deg);
  }

  25%{
    transform:
      translate(5px,-2px)
      rotate(1deg);
  }

  50%{
    transform:
      translate(-4px,2px)
      rotate(-.8deg);
  }

  75%{
    transform:
      translate(5px,1px)
      rotate(.8deg);
  }

  100%{
    transform:
      translate(-5px,1px)
      rotate(-1deg);
  }
}

/*
  開封時の光
*/
#treasureBurst{
  position:absolute;

  z-index:375;

  display:none;

  width:22vw;
  height:22vw;

  max-width:150px;
  max-height:150px;

  border-radius:50%;

  pointer-events:none;

  background:#fff;

  box-shadow:
    0 0 20px #fff,
    0 0 55px #fff6a0,
    0 0 110px #ffcc00,
    0 0 180px #ff1493;
}

#treasureBurst.go{
  display:block;

  animation:
    treasureBurst
    .9s
    cubic-bezier(.05,.8,.15,1)
    forwards;
}

@keyframes treasureBurst{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.15);
  }

  15%{
    opacity:1;
  }

  50%{
    opacity:1;
    transform:translate(-50%,-50%) scale(2.3);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(5);
  }
}

/*
  宝箱から上に伸びる光
*/
#treasureBeam{
  position:absolute;

  z-index:370;

  display:none;

  bottom:42%;

  width:23%;

  height:55%;

  pointer-events:none;

  transform-origin:center bottom;

  background:
    linear-gradient(
      to top,
      rgba(255,255,255,.95),
      rgba(255,235,120,.55) 20%,
      rgba(255,80,180,.20) 55%,
      transparent 100%
    );

  filter:blur(8px);

  clip-path:
    polygon(
      38% 100%,
      62% 100%,
      100% 0,
      0 0
    );
}

#treasureBeam.go{
  display:block;

  animation:
    beamAppear
    1.1s
    ease-out
    forwards;
}

@keyframes beamAppear{
  0%{
    opacity:0;
    transform:scaleY(.05);
  }

  20%{
    opacity:1;
    transform:scaleY(1);
  }

  70%{
    opacity:.9;
  }

  100%{
    opacity:0;
  }
}

/*
  あなたが選んだ箱
*/
#chosenBadge{
  position:absolute;

  z-index:390;

  display:none;

  top:35%;

  transform:translateX(-50%);

  width:max-content;

  padding:7px 14px;

  border:
    2px solid #fff;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #ff75b9,
      #c7005e
    );

  color:#fff;

  font-size:13px;
  font-weight:1000;

  text-shadow:
    0 2px 4px #730034;

  box-shadow:
    0 4px 0 #760038,
    0 0 20px #ff4fa8;
}

/*
  結果表示
*/
#treasureResult{
  position:absolute;

  z-index:400;

  display:none;

  left:50%;
  top:69%;

  transform:
    translate(-50%,-50%);

  width:100%;

  text-align:center;

  pointer-events:none;
}

#resultSmall{
  font-size:17px;
  font-weight:1000;

  color:#fff;

  text-shadow:
    0 3px 8px #000;
}

#resultBig{
  margin-top:5px;

  font-size:
    min(14vw,72px);

  line-height:1.05;

  font-weight:1000;

  white-space:nowrap;

  -webkit-text-stroke:
    2px rgba(80,0,20,.6);

  text-shadow:
    0 5px 0 rgba(80,0,35,.7),
    0 10px 18px rgba(0,0,0,.8),
    0 0 20px currentColor;
}

.rank1{
  color:#ffe55e;
}

.rank2{
  color:#f0f5ff;
}

.rank3{
  color:#ff9b52;
}

#treasureResult.go{
  display:block;

  animation:
    resultExplosion
    .8s
    cubic-bezier(.08,1.5,.15,1);
}

@keyframes resultExplosion{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.1);
  }

  60%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.25);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

/*
  NEXT
*/
#next{
  position:absolute;

  z-index:410;

  display:none;

  left:50%;

  bottom:
    max(
      5%,
      env(safe-area-inset-bottom)
    );

  transform:translateX(-50%);

  width:min(68vw,300px);

  padding:14px 30px;

  border:
    2px solid #fff;

  border-radius:999px;

  background:
    linear-gradient(
      180deg,
      #ff70b4,
      #c90060
    );

  color:#fff;

  font-size:18px;
  font-weight:1000;

  box-shadow:
    0 5px 0 #710035,
    0 0 25px rgba(255,0,120,.65);
}

/*
  結果が出たあと、
  選ばなかった箱を暗くする
*/
.treasureDim{
  position:absolute;

  z-index:355;

  top:43%;

  width:32%;
  height:26%;

  display:none;

  pointer-events:none;

  border-radius:30px;

  background:
    rgba(15,0,8,.58);
}

#dimLeft{
  left:0;
}

#dimCenter{
  left:34%;
}

#dimRight{
  right:0;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px){

  .treasureTap{
    top:43%;
    height:24%;
  }

  #selectedGlow{
    top:42%;
    height:26%;
  }

  #treasureShake{
    top:43%;
    height:24%;
  }

  #chosenBadge{
    top:34%;
  }

  #treasureResult{
    top:70%;
  }
}

</style>
</head>

<body>

<div id="stage">

  <div id="number">3</div>

  <div id="dots">…</div>

  <div id="info">
    完全抽選 1/30<br>
    毎回独立抽選
  </div>

  <button id="start">
    START
  </button>

</div>

<div id="noise"></div>

<div id="lightning">
  <div class="bolt"></div>
</div>

<div id="logoGlow"></div>

<div id="question">
  ？
</div>

<div id="black"></div>

/* =========================================================
   AUDIO
========================================================= */

function ensureAudioContext(){

  if(!audioCtx){

    audioCtx=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  return audioCtx;
}

async function loadBuffer(url){

  const res=
    await fetch(
      url,
      {
        cache:"force-cache"
      }
    );

  if(!res.ok){

    throw new Error(
      url+" load failed"
    );

  }

  const arr=
    await res.arrayBuffer();

  return await
    audioCtx.decodeAudioData(arr);
}

async function prepareAudio(){

  ensureAudioContext();

  if(!tensionBuffer){

    try{

      tensionBuffer=
        await loadBuffer(
          "./Tension.mp3"
        );

    }catch(e){

      console.log(
        "Tension load error",
        e
      );

    }

  }

  if(!hitBuffer){

    try{

      hitBuffer=
        await loadBuffer(
          "./hit_music_final.mp3"
        );

    }catch(e){

      console.log(
        "Hit music load error",
        e
      );

    }

  }

}

function stopTension(){

  try{
    tensionSource?.stop();
  }catch(e){}

  tensionSource=null;
}

function startTension(){

  if(
    !audioCtx ||
    !tensionBuffer
  )return;

  stopTension();

  const source=
    audioCtx.createBufferSource();

  const gain=
    audioCtx.createGain();

  source.buffer=
    tensionBuffer;

  source.loop=true;

  gain.gain.value=.72;

  source.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  source.start(0);

  tensionSource=source;
}

function stopHitMusic(){

  try{
    hitSource?.stop();
  }catch(e){}

  hitSource=null;
}

function playHitMusic(){

  if(
    !audioCtx ||
    !hitBuffer
  )return;

  stopHitMusic();

  const source=
    audioCtx.createBufferSource();

  const gain=
    audioCtx.createGain();

  source.buffer=
    hitBuffer;

  gain.gain.value=1;

  source.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  source.start(0);

  hitSource=source;
}

/* =========================================================
   SHOOTING STARS
========================================================= */

function clearStars(){

  starTimers.forEach(
    clearTimeout
  );

  starTimers=[];

  $$(".star").forEach(
    star=>star.remove()
  );
}

function shootStar(){

  const star=
    document.createElement("div");

  star.className="star";

  const fromTop=
    Math.random()<.55;

  if(fromTop){

    star.style.left=
      (-12+Math.random()*52)
      +"vw";

    star.style.top=
      (-5-Math.random()*8)
      +"vh";

  }else{

    star.style.left=
      (-12-Math.random()*8)
      +"vw";

    star.style.top=
      (2+Math.random()*28)
      +"vh";

  }

  star.style.setProperty(
    "--tail",
    (110+Math.random()*130)
    +"px"
  );

  star.style.setProperty(
    "--speed",
    (.62+Math.random()*.38)
    +"s"
  );

  const size=
    .75+Math.random()*.65;

  star.style.width=
    (10*size)+"px";

  star.style.height=
    (10*size)+"px";

  document.body.appendChild(star);

  requestAnimationFrame(
    ()=>star.classList.add("go")
  );

  setTimeout(
    ()=>star.remove(),
    1400
  );
}

function starBurst(count){

  for(
    let i=0;
    i<count;
    i++
  ){

    const timer=
      setTimeout(
        shootStar,
        i*(
          60+
          Math.random()*100
        )
      );

    starTimers.push(timer);
  }
}

function scheduleStars(token){

  if(
    Math.random()>=.27
  )return;

  const r=Math.random();

  let count;

  if(r<.75){

    count=
      1+
      Math.floor(
        Math.random()*3
      );

  }else if(r<.95){

    count=
      4+
      Math.floor(
        Math.random()*3
      );

  }else{

    count=
      7+
      Math.floor(
        Math.random()*4
      );

  }

  const delay=
    600+
    Math.random()*3000;

  starTimers.push(

    setTimeout(()=>{

      if(
        token!==playToken
      )return;

      starBurst(count);

      if(
        Math.random()<.15
      ){

        starTimers.push(

          setTimeout(()=>{

            if(
              token===playToken
            ){

              starBurst(
                1+
                Math.floor(
                  Math.random()*4
                )
              );

            }

          },
          700+
          Math.random()*1000)

        );

      }

    },delay)

  );
}

      await sleep(1900);

      break;
  }

  stopTension();

  showDots();

  await sleep(1400);

  return finishMiss();
}

async function strongFake(type){

  switch(type){

    case 0:

      await normalCount();

      stopTension();

      $("#slash").className=
        "go";

      await sleep(230);

      $("#slash").className=
        "";

      await sleep(1800);

      break;


    case 1:

      await normalCount();

      stopTension();

      hideNumber();

      await blackout(2200);

      break;


    case 2:

      await normalCount();

      $("#number")
        .classList
        .add("gold");

      await sleep(3000);

      $("#number")
        .classList
        .remove("gold");

      break;


    case 3:

      await normalCount();

      stopTension();

      $("#slash").className=
        "go";

      await sleep(220);

      flash();

      await sleep(250);

      $("#slash").className=
        "";

      await sleep(1800);

      break;


    case 4:

      await normalCount();

      stopTension();

      hideNumber();

      await blackout(1500);

      showNumber(1);

      await sleep(2300);

      break;


    case 5:

      await normalCount();

      $("#number")
        .classList
        .add("gold");

      await sleep(700);

      stopTension();

      await sleep(3300);

      $("#number")
        .classList
        .remove("gold");

      break;
  }

  showDots();

  await sleep(1500);

  return finishMiss();
}

/* =========================================================
   COMMON FX MISS
========================================================= */

async function commonFxMiss(index){

  switch(index){

    case 0:

      await normalCount();

      await fxBigNumber();

      break;


    case 1:

      await normalCount();

      await fxCrack();

      break;


    case 2:

      await normalCount();

      await fxLightning(
        Math.random()<.25
        ? 3
        : 1
      );

      break;


    case 3:

      showNumber(3);

      await sleep(1400);

      showNumber(2);

      await fxNoise(700);

      showNumber(1);

      await sleep(1700);

      break;


    case 4:

      await normalCount();

      await fxColorStep();

      await sleep(1000);

      break;


    case 5:

      showNumber(3);

      await sleep(1500);

      showNumber(2);

      await sleep(1600);

      await fxSuperLongOne();

      break;


    case 6:

      showNumber(3);

      await sleep(1400);

      await fxQuestion();

      showNumber(2);

      await sleep(1500);

      showNumber(1);

      await sleep(1600);

      break;


    case 7:

      await normalCount();

      await fxBackgroundDark();

      break;


    case 8:

      await fxStopRestart();

      break;


    case 9:

      showNumber(3);

      await sleep(1500);

      showNumber(2);

      await sleep(1600);

      await fxSilentDisappear();

      break;


    case 10:

      await fxFakeFinish();

      break;


    case 11:

      await normalCount();

      await fxLogoGlow();

      await sleep(1000);

      break;
  }

  stopTension();

  if(
    Math.random()<.55
  ){

    showDots();

    await sleep(
      1200+
      Math.random()*700
    );

  }else{

    hideNumber();

    hideDots();

    await sleep(1300);
  }

  return finishMiss();
}

async function finishMiss(){

  stopTension();

  hideNumber();

  hideDots();

  $("#stage")
    .classList
    .remove(
      "bgDark",
      "hitZoom"
    );

  $("#noise").className="";

  $("#lightning").className="";

  $("#question").style.display=
    "none";

  $("#black").style.display=
    "none";

  $("#slash").className="";

  $("#impactWhite").className="";

  document.body.classList.remove(
    "hitShake"
  );

  await sleep(800);

  resetMain();
}

/* =========================================================
   PRIZE
   1等 2%
   2等 20%
   3等 78%
========================================================= */

function drawPrize(){

  const r=Math.random();

  if(r<.02){
    return 1;
  }

  if(r<.22){
    return 2;
  }

  return 3;
}

function rankClass(rank){

  return "rank"+rank;
}

/* =========================================================
   NEW TREASURE FUNCTIONS
========================================================= */

function resetTreasure(){

  $("#selectedGlow")
    .style
    .display="none";

  $("#treasureShake")
    .className="";

  $("#treasureBeam")
    .className="";

  $("#treasureBurst")
    .className="";

  $("#chosenBadge")
    .style
    .display="none";

  $("#treasureResult")
    .className="";

  $("#resultBig")
    .className="";

  $("#resultBig")
    .textContent="";

  $("#next")
    .style
    .display="none";

  $$(".treasureDim")
    .forEach(
      dim=>
        dim.style.display="none"
    );

  $$(".treasureTap")
    .forEach(button=>{

      button.disabled=false;

      button.style.display=
        "block";

    });
}

function showTreasure(){

  selectedRank=
    drawPrize();

  selectedIndex=-1;

  chestBusy=false;

  resetTreasure();

  $("#treasure")
    .className="show";
}

/*
  各宝箱の中心位置
*/
function chestCenter(index){

  if(index===0){
    return 16.5;
  }

  if(index===1){
    return 50;
  }

  return 83.5;
}

function setSelectedPosition(index){

  const x=
    chestCenter(index);

  const glow=
    $("#selectedGlow");

  const shake=
    $("#treasureShake");

  const beam=
    $("#treasureBeam");

  const burst=
    $("#treasureBurst");

  const badge=
    $("#chosenBadge");

  glow.style.left=
    `calc(${x}% - 15.5%)`;

  shake.style.left=
    `calc(${x}% - 15.5%)`;

  beam.style.left=
    `calc(${x}% - 11.5%)`;

  burst.style.left=
    x+"%";

  burst.style.top=
    "55%";

  badge.style.left=
    x+"%";
}

function dimOtherChests(index){

  const dims=[
    $("#dimLeft"),
    $("#dimCenter"),
    $("#dimRight")
  ];

  dims.forEach(
    (dim,i)=>{

      dim.style.display=
        i===index
        ? "none"
        : "block";

    }
  );
}

async function chooseTreasure(index){

  if(chestBusy){
    return;
  }

  chestBusy=true;

  selectedIndex=index;

  $$(".treasureTap")
    .forEach(button=>{
      button.disabled=true;
    });

  setSelectedPosition(index);

  /*
    まず選んだ箱を発光
  */
  $("#selectedGlow")
    .style
    .display="block";

  $("#chosenBadge")
    .style
    .display="block";

  /*
    ブルブル
  */
  $("#treasureShake")
    .className="go";

  await sleep(1000);

  $("#treasureShake")
    .className="";

  /*
    一瞬静止
  */
  await sleep(250);

  /*
    開封光
  */
  const beam=
    $("#treasureBeam");

  beam.className="";

  void beam.offsetWidth;

  beam.className="go";


  const burst=
    $("#treasureBurst");

  burst.className="";

  void burst.offsetWidth;

  burst.className="go";

  /*
    白フラッシュ
  */
  await sleep(170);

  flash();

  await sleep(350);

  /*
    選ばなかった箱を暗くする
  */
  dimOtherChests(index);

  /*
    結果発表
  */
  const big=
    $("#resultBig");

  big.textContent=
    selectedRank+
    "等 当選！";

  big.className=
    rankClass(
      selectedRank
    );

  const result=
    $("#treasureResult");

  result.className="";

  void result.offsetWidth;

  result.className="go";

  /*
    結果の瞬間もう一回フラッシュ
  */
  await sleep(180);

  flash();

  await sleep(1200);

  /*
    選択した箱は最後まで光らせる
  */
  $("#selectedGlow")
    .style
    .display="block";

  $("#next")
    .style
    .display="block";
}

/* =========================================================
   MISS SELECTOR
========================================================= */

async function runMiss(){

  if(
    Math.random()<.36
  ){

    return commonFxMiss(
      Math.floor(
        Math.random()*12
      )
    );
  }

  const r=
    Math.random();

  if(r<.50){

    return normalMiss();
  }

  if(r<.75){

    return weakFake(
      Math.floor(
        Math.random()*10
      )
    );
  }

  return strongFake(
    Math.floor(
      Math.random()*6
    )
  );
}

/* =========================================================
   RESET
========================================================= */

function resetVisuals(){

  $("#black").style.display=
    "none";

  $("#hitDark").style.display=
    "none";

  $("#slash").className="";

  $("#flash").className="";

  $("#impactWhite").className="";

  $("#hitText").className="";

  $("#noise").className="";

  $("#lightning").className="";

  $("#logoGlow").className="";

  $("#question").style.display=
    "none";

  $("#stage")
    .classList
    .remove(
      "bgDark",
      "hitZoom"
    );

  document.body.classList.remove(
    "hitShake"
  );

  hideDots();

  clearNumberClasses();
}

function resetMain(){

  stopTension();

  clearStars();

  resetVisuals();

  resetTreasure();

  $("#treasure").className="";

  showNumber(3);

  $("#start").style.display=
    "block";

  $("#info").style.display=
    "block";

  busy=false;

  chestBusy=false;

  selectedRank=null;

  selectedIndex=-1;
}

/* =========================================================
   PLAY
========================================================= */

async function play(){

  if(busy){
    return;
  }

  busy=true;

  $("#start").style.display=
    "none";

  $("#info").style.display=
    "none";

  playToken++;

  clearStars();

  resetVisuals();

  ensureAudioContext();

  const resumePromise=
    audioCtx.resume();

  try{

    await Promise.all([
      resumePromise,
      prepareAudio()
    ]);

  }catch(e){

    console.log(
      "audio preparation error",
      e
    );

  }

  startTension();

  const token=
    playToken;

  /*
    流れ星は当落と独立
  */
  scheduleStars(token);

  /*
    本番抽選

    STARTごとに1回だけ。

    1 / 30

    完全独立抽選。
  */
  const win=
    Math.random() < (1/30);

  if(win){

    await runHit();

  }else{

    await runMiss();

  }
}

/* =========================================================
   EVENTS
========================================================= */

$("#start")
  .addEventListener(
    "click",
    play
  );

$("#tapLeft")
  .addEventListener(
    "click",
    ()=>chooseTreasure(0)
  );

$("#tapCenter")
  .addEventListener(
    "click",
    ()=>chooseTreasure(1)
  );

$("#tapRight")
  .addEventListener(
    "click",
    ()=>chooseTreasure(2)
  );

$("#next")
  .addEventListener(
    "click",
    ()=>{

      stopHitMusic();

      playToken++;

      resetMain();

    }
  );

/* =========================================================
   PRELOAD
========================================================= */

window.addEventListener(
  "load",
  ()=>{

    ensureAudioContext();

    prepareAudio()
      .catch(()=>{});

  }
);

</script>
