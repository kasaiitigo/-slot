
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#170010">
<title>Red Peanuts SLOT</title>
<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#170010;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",sans-serif;
  touch-action:manipulation;
}
button{font:inherit;cursor:pointer}
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#170010
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png")
    center top/auto 100% no-repeat;
}
#stage.broken{background:#110816}
#start{
  position:absolute;
  inset:0;
  z-index:10;
}
#startBtn{
  position:absolute;
  left:50%;
  bottom:8.5%;
  transform:translateX(-50%);
  width:min(80vw,390px);
  height:70px;
  border:2px solid #fff;
  border-radius:45px;
  background:linear-gradient(#ff78c4,#d00068);
  color:#fff;
  font-size:28px;
  font-weight:1000;
  box-shadow:0 0 28px #ff008d;
}
#rate{
  position:absolute;
  bottom:23%;
  width:100%;
  text-align:center;
  font-weight:900;
  text-shadow:0 2px 7px #000;
}
#rate b{
  display:block;
  color:#ffed9d;
  font-size:30px;
}
#guideBtn{
  position:absolute;
  bottom:34%;
  left:50%;
  transform:translateX(-50%);
  padding:11px 22px;
  white-space:nowrap;
  border:1px solid #fff;
  border-radius:30px;
  background:#580033df;
  color:#fff;
  font-weight:900;
  box-shadow:0 0 14px #ff3896;
}

/* 数字：「1」の震えなし */
#num{
  position:absolute;
  z-index:25;
  top:61%;
  left:50%;
  width:100%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-size:min(52vw,255px);
  line-height:1.1;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:
    clamp(5px,1.5vw,9px) #ff4b9d;
  text-shadow:
    0 7px #ae0054,
    0 14px 10px #370018;
  opacity:0;
  pointer-events:none;
}
#num.show{opacity:1}
#num.red{color:#ff508b}
#num.gold{
  color:#fff1a8;
  -webkit-text-stroke:6px #f4a000;
  text-shadow:0 0 30px #ffd100;
}
#num.question{font-size:min(40vw,190px)}
#num.dots{
  font-size:min(34vw,155px);
  color:#fff1a8;
}
#num.big{font-size:min(65vw,300px)}
#num.nocount{
  width:94%;
  font-size:clamp(31px,9vw,56px);
  white-space:nowrap;
  -webkit-text-stroke:2px #ff4b9d;
}

/* 画面エフェクト */
#dim,#black,#noise,#lightning,#flash{
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}
#dim{z-index:12;background:#0009}
#black{z-index:29;background:#000}
#noise{
  z-index:30;
  background:repeating-linear-gradient(
    0deg,#fff6 0 2px,#0005 2px 5px
  );
}
#lightning{
  z-index:31;
  background:linear-gradient(
    120deg,
    transparent 42%,
    #fff 47%,
    #ff5db6 49%,
    transparent 54%
  );
  filter:drop-shadow(0 0 24px #ff1494);
}
#flash{
  z-index:170;
  background:#fff;
}
.noiseGo,.lightGo{
  animation:flashAnim .4s ease-out;
}
@keyframes flashAnim{
  0%,100%{opacity:0}
  40%{opacity:1}
}
#flash.flashGo{
  animation:jackpotFlash .65s ease-out;
}
@keyframes jackpotFlash{
  0%{opacity:0}
  15%{opacity:1}
  40%{opacity:.92}
  100%{opacity:0}
}

/* ハズレ・惜しい */
#result{
  position:absolute;
  z-index:36;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:18px;
  background:#000a;
  text-align:center;
  pointer-events:none;
}
#result.show{display:flex}
#near{
  font-size:clamp(26px,9vw,56px);
  font-weight:1000;
  color:#ffe18d;
  text-shadow:0 0 18px #ff8a00;
}
#mainResult{
  font-size:clamp(42px,15vw,82px);
  white-space:nowrap;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:3px #e00073;
  text-shadow:0 5px #8e0044,0 0 18px #ff379a;
}
#mainResult.appear{
  animation:resultPop .5s ease-out;
}
#message{
  font-size:clamp(14px,4vw,20px);
  font-weight:900;
  color:#ffe5aa;
  line-height:1.7;
  text-shadow:0 2px 5px #000;
}
@keyframes resultPop{
  from{opacity:0;transform:scale(.3)}
  65%{transform:scale(1.1)}
  to{opacity:1;transform:scale(1)}
}

/* 巨大斬撃 */
.slash{
  position:absolute;
  z-index:160;
  left:-30%;
  top:48%;
  width:160%;
  height:32px;
  opacity:0;
  pointer-events:none;
  transform-origin:left center;
  background:linear-gradient(
    90deg,
    transparent,
    #ff0088 8%,
    #ff7cca 18%,
    #fff 35%,
    #fff 70%,
    #ff359c 88%,
    transparent
  );
  box-shadow:
    0 0 20px #fff,
    0 0 45px #ff0088,
    0 0 85px #ff0088;
}
#slash1{transform:rotate(-25deg) scaleX(0)}
#slash2{transform:rotate(23deg) scaleX(0)}
#slash1.go{animation:giantSlashA .65s ease-out}
#slash2.go{animation:giantSlashB .65s ease-out}
@keyframes giantSlashA{
  0%{opacity:0;transform:rotate(-25deg) scaleX(0)}
  20%{opacity:1}
  75%{opacity:1;transform:rotate(-25deg) scaleX(1)}
  100%{opacity:0;transform:rotate(-25deg) scaleX(1)}
}
@keyframes giantSlashB{
  0%{opacity:0;transform:rotate(23deg) scaleX(0)}
  20%{opacity:1}
  75%{opacity:1;transform:rotate(23deg) scaleX(1)}
  100%{opacity:0;transform:rotate(23deg) scaleX(1)}
}

/* 画面いっぱいの当たり */
#hit{
  position:absolute;
  z-index:180;
  top:46%;
  left:50%;
  width:100%;
  text-align:center;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  font-size:clamp(75px,25vw,170px);
  line-height:1.2;
  font-weight:1000;
  color:#fff8c4;
  -webkit-text-stroke:
    clamp(5px,1.5vw,9px) #f60062;
  text-shadow:
    0 5px 0 #ff9900,
    0 11px 0 #a50043,
    0 17px 15px #000,
    0 0 35px #fff,
    0 0 65px #ff146f;
  transform:translate(-50%,-50%) scale(3);
}
#hit.go{
  animation:massiveHit .95s
    cubic-bezier(.15,.8,.18,1) forwards;
}
@keyframes massiveHit{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(4);
    filter:brightness(3);
  }
  22%{
    opacity:1;
    transform:translate(-50%,-50%) scale(2.8);
    filter:brightness(2);
  }
  52%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.35);
    filter:brightness(1.4);
  }
  75%{transform:translate(-50%,-50%) scale(.92)}
  88%{transform:translate(-50%,-50%) scale(1.08)}
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:brightness(1);
  }
}
#hitInfo{
  position:absolute;
  z-index:181;
  top:65%;
  left:4%;
  width:92%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}
#hitInfo.show{animation:info .6s forwards}
#hitName{
  display:inline-block;
  max-width:100%;
  margin-top:9px;
  padding:10px 18px;
  border:1px solid #ffe391;
  border-radius:14px;
  background:#530b33e8;
  color:#ffec9c;
  font-size:clamp(15px,4.8vw,24px);
}
@keyframes info{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}
#tap{
  position:absolute;
  z-index:182;
  bottom:9%;
  width:100%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}
#tap.show{animation:blink 1.2s infinite}
@keyframes blink{
  0%,100%{opacity:.4}
  50%{opacity:1}
}

/* 特殊演出 */
#specialFX{
  position:absolute;
  inset:0;
  z-index:90;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:15px;
  text-align:center;
  pointer-events:none;
  background:#100516;
  overflow:hidden;
}
#specialFX.active{display:flex}
#specialFX .fxTitle{
  font-size:clamp(38px,12vw,86px);
  font-weight:1000;
  text-shadow:0 0 18px #ffbc33;
}
#specialFX .fxSub{
  font-size:clamp(16px,5vw,29px);
  font-weight:900;
  text-shadow:0 3px 8px #000;
}
#specialFX.preview{
  background:#100516
    url("./0EB99059-7515-429E-B34D-8BFCE53ED083.png")
    center/contain no-repeat;
}
#specialFX.preview .fxTitle{display:none}
#specialFX.rainbow{
  background:#100516
    url("./CC92EC2B-BC54-4037-9F8C-45DB1AE891E2.png")
    center/contain no-repeat;
  animation:rainbowHue 1s linear infinite;
}
#specialFX.rainbow .fxTitle{display:none}
@keyframes rainbowHue{
  to{filter:hue-rotate(360deg)}
}

/* 立体PUSH：外側リング固定、内側だけ動く */
#specialFX.push{
  background:radial-gradient(
    circle at 50% 46%,
    #581000,
    #22000d 45%,
    #080008 85%
  );
}
#specialFX.push .fxTitle{
  font-size:clamp(25px,7vw,48px);
}
.fxButton{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  width:min(59vw,245px);
  height:min(59vw,245px);
  flex-shrink:0;
  padding:0;
  border:0;
  border-radius:50%;
  background:linear-gradient(
    145deg,
    #fff2b5,
    #e5b752 19%,
    #855018 44%,
    #ffe9a0 65%,
    #ad6b25 85%,
    #59300c
  );
  box-shadow:
    0 0 0 4px #5a300c,
    0 0 0 7px #d9a345,
    0 10px 25px #000a,
    0 0 25px #ffb534aa;
  pointer-events:auto;
  -webkit-appearance:none;
  appearance:none;
}
.fxButton::before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  background:#310008;
  box-shadow:inset 0 7px 15px #000c;
}
.fxButtonInner{
  position:absolute;
  inset:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #ff9e87;
  border-radius:50%;
  background:radial-gradient(
    circle at 35% 21%,
    #ff8790,
    #fa3854 19%,
    #c90032 46%,
    #83001f 74%,
    #40000e
  );
  box-shadow:
    inset 0 4px 12px #ffffff66,
    inset 0 -12px 18px #280008,
    0 9px 0 #55000f,
    0 12px 15px #0009;
  animation:pushPeko .95s ease-in-out infinite;
}
.fxButtonText{
  color:#fff3c7;
  font-size:clamp(27px,8.5vw,46px);
  font-weight:1000;
  letter-spacing:1px;
  text-shadow:
    0 2px 2px #660016,
    0 0 10px #ffd69b;
  pointer-events:none;
}
@keyframes pushPeko{
  0%,100%{transform:translateY(0)}
  45%,55%{transform:translateY(8px)}
}
.fxButton:active .fxButtonInner,
.fxButton.pressed .fxButtonInner{
  animation:none;
  transform:translateY(11px);
  box-shadow:
    inset 0 9px 20px #260006,
    0 2px 0 #55000f,
    0 3px 5px #0008;
}

/* 流れ星 */
.shooting{
  position:absolute;
  z-index:32;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px #fff,0 0 25px #ff62b9;
  pointer-events:none;
  animation:shoot .9s linear forwards;
}
.shooting::after{
  content:"";
  position:absolute;
  right:0;
  top:2px;
  width:75px;
  height:2px;
  background:linear-gradient(90deg,transparent,#fff);
}
@keyframes shoot{
  from{opacity:0;transform:translate(0,0)}
  20%{opacity:1}
  to{opacity:0;transform:translate(240px,370px)}
}

/* 画面破壊 */
#glassArea{
  position:absolute;
  inset:0;
  z-index:120;
  display:none;
  overflow:hidden;
  pointer-events:none;
}
#glassArea.active{display:block}
#glassCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
#glassLight{
  position:absolute;
  inset:0;
  opacity:0;
  background:radial-gradient(
    circle at 50% 48%,
    #fff,
    #ffffffb0 12%,
    transparent 65%
  );
}
#glassLight.go{
  animation:glassFlash .35s ease-out;
}
@keyframes glassFlash{
  0%,100%{opacity:0}
  25%{opacity:1}
}

/* 期待度ガイド */
#modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000d;
  padding:15px;
}
#modal.open{display:flex}
#guide{
  width:min(94vw,430px);
  max-height:88dvh;
  overflow:auto;
  padding:20px 14px;
  text-align:center;
  border:2px solid #ff8bc5;
  border-radius:22px;
  background:linear-gradient(#580031,#1b0013);
}
#guide h2{color:#ffe6a1}
#guide p{
  padding:8px 0;
  border-bottom:1px solid #ffffff30;
  font-weight:800;
}
#guide em{color:#ffe58d;font-style:normal}
#closeGuide{
  margin:12px;
  padding:10px 50px;
  background:#ed2c8d;
  color:#fff;
  border:1px solid #fff;
  border-radius:25px;
}
#audioStatus{
  position:absolute;
  z-index:190;
  bottom:3%;
  width:100%;
  text-align:center;
  font-size:11px;
  color:#ffdf98;
  display:none;
  pointer-events:none;
  text-shadow:0 2px 5px #000;
}
#audioStatus.show{display:block}
</style>
</head>

<body>
<div id="stage">

  <div id="start">
    <button id="guideBtn">演出期待度を見る</button>
    <div id="rate">
      大当たり確率
      <b>1 / 25</b>
    </div>
    <button id="startBtn">START</button>
  </div>

  <div id="dim"></div>
  <div id="num"></div>
  <div id="black"></div>
  <div id="noise"></div>
  <div id="lightning"></div>

  <div id="result">
    <div id="near"></div>
    <div id="mainResult">ハズレ</div>
    <div id="message"></div>
  </div>

  <div id="slash1" class="slash"></div>
  <div id="slash2" class="slash"></div>

  <div id="specialFX">
    <div class="fxTitle"></div>
    <div class="fxSub"></div>
  </div>

  <div id="glassArea">
    <canvas id="glassCanvas"></canvas>
    <div id="glassLight"></div>
  </div>

  <div id="flash"></div>
  <div id="hit">当たり</div>

  <div id="hitInfo">
    ✨ 今回の当選演出 ✨
    <div><span id="hitName"></span></div>
  </div>

  <div id="tap">画面をタップして戻る</div>
  <div id="audioStatus"></div>

</div>

<div id="modal">
  <div id="guide">
    <h2>✨ 演出期待度 ✨</h2>
    <p>⚡ ピンク稲妻 → <em>チャンス</em></p>
    <p>❓「？」出現 → <em>チャンス</em></p>
    <p>🌑 ブラックアウト → <em>大チャンス</em></p>
    <p>🟡 金色変化 → <em>大チャンス</em></p>
    <p>🎬 次回予告 → <em>約95%</em></p>
    <p>🌈 レインボー → <em>当たり確定</em></p>
    <p>💥 画面破壊 → <em>当たり確定</em></p>
    <p>🔴 デカPUSH → <em>チャンス</em></p>
    <button id="closeGuide">閉じる</button>
  </div>
</div>

<script>
"use strict";

/* ===========================
   基本設定
=========================== */

const TEST_MODE=false;
const WIN_PROBABILITY=1/25;

const BACKGROUND_IMAGE=
  "./9E28B31B-C619-4F41-AB55-91C025168D02.png";

const CRACK_IMAGE=
  "./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png";

const TENSION_SOUND="./Tension.mp3";
const HIT_SOUND="./hit_music_final.mp3";

const GLASS_SOUND=
  "./glass_crack_crack_shatter_v3.mp3";

const GLASS_FALLBACK=
  "./glass_crack_crack_shatter_v3_preview.mov";

/*
  溜めの基本速度。
  ただしハズレ・当たりとも
  変則パターンも用意。
*/

const COUNT_SPEED={
  normal:[1500,1800,2300],
  chance:[1500,1800,3000],
  hot:[1500,2000,3500],
  fast:[500,500,650]
};

/* ===========================
   当たり演出振り分け
=========================== */

const WIN_EFFECTS=[
  ["glass",.15],
  ["rainbow",.07],
  ["preview",.17],
  ["pinkPush",.06],
  ["goldBlack",.06],
  ["pink",.07],
  ["gold",.07],
  ["black",.06],
  ["push",.05],
  ["normal",.24]
];

/*
  次回予告の信頼度約95%。
*/

const PREVIEW_MISS_RATE=
  (WIN_PROBABILITY*.17*.05)/
  (.95*(1-WIN_PROBABILITY));

const MISS_EFFECTS=[
  ["preview",PREVIEW_MISS_RATE],
  ["pinkPush",.0012],
  ["goldBlack",.001],
  ["pink",.013],
  ["gold",.0025],
  ["black",.002],
  ["push",.012]
];

/* ===========================
   共通
=========================== */

const $=id=>document.getElementById(id);
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const rnd=(a,b)=>
  Math.floor(Math.random()*(b-a+1))+a;

const roll=p=>Math.random()<p;

function chooseWeighted(items,fallback="normal"){
  const r=Math.random();
  let sum=0;

  for(const [name,weight] of items){
    sum+=weight;
    if(r<sum)return name;
  }

  return fallback;
}

const stage=$("stage");
const num=$("num");
const result=$("result");
const near=$("near");
const main=$("mainResult");
const message=$("message");
const black=$("black");
const fx=$("specialFX");

const glassArea=$("glassArea");
const glassCanvas=$("glassCanvas");
const glassLight=$("glassLight");
const ctx=glassCanvas.getContext("2d");

let busy=false;
let tapReady=false;
let runId=0;

/* ===========================
   音楽管理
=========================== */

const AudioContextClass=
  window.AudioContext||window.webkitAudioContext;

let audioCtx=null;
let audioLoadPromise=null;

const buffers={
  tension:null,
  hit:null,
  glass:null
};

let tensionSource=null;
let tensionGain=null;
let tensionPlaying=false;

let hitSource=null;
let glassSource=null;

const fallbackGlassAudio=new Audio();
fallbackGlassAudio.preload="auto";

function audioStatus(text){
  const el=$("audioStatus");
  el.textContent=text;
  el.classList.toggle("show",!!text);
}

function unlockAudio(){
  if(!AudioContextClass){
    return Promise.resolve();
  }

  if(!audioCtx){
    audioCtx=new AudioContextClass();
  }

  try{
    const b=audioCtx.createBuffer(
      1,1,audioCtx.sampleRate
    );
    const source=audioCtx.createBufferSource();
    source.buffer=b;
    source.connect(audioCtx.destination);
    source.start();
  }catch(e){
    console.warn(e);
  }

  return audioCtx.resume().catch(console.warn);
}

async function loadBuffer(url){
  if(!audioCtx)return null;

  try{
    const response=await fetch(url);
    if(!response.ok)throw new Error(url);

    const data=await response.arrayBuffer();
    return await audioCtx.decodeAudioData(data);
  }catch(e){
    console.warn("音声読み込み失敗",url,e);
    return null;
  }
}

async function prepareAudio(){
  if(!audioCtx)return;

  if(!audioLoadPromise){
    audioLoadPromise=(async()=>{
      const data=await Promise.all([
        loadBuffer(TENSION_SOUND),
        loadBuffer(HIT_SOUND),
        loadBuffer(GLASS_SOUND)
      ]);

      buffers.tension=data[0];
      buffers.hit=data[1];
      buffers.glass=data[2];

      if(!buffers.glass){
        fallbackGlassAudio.src=GLASS_FALLBACK;
      }

      if(!buffers.hit){
        audioStatus(
          "当たりBGMのファイルを確認してください"
        );
      }
    })();
  }

  await audioLoadPromise;
}

function stopSource(source){
  if(!source)return;
  try{source.stop()}catch(e){}
}

function makeSound(buffer,loop=false,volume=1){
  if(!audioCtx||!buffer)return null;

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=buffer;
  source.loop=loop;
  gain.gain.value=volume;

  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();

  return source;
}

function startTension(){
  if(!audioCtx||!buffers.tension)return;
  if(tensionPlaying)return;

  tensionSource=audioCtx.createBufferSource();
  tensionGain=audioCtx.createGain();

  tensionSource.buffer=buffers.tension;
  tensionSource.loop=true;
  tensionGain.gain.value=.7;

  tensionSource.connect(tensionGain);
  tensionGain.connect(audioCtx.destination);
  tensionSource.start();

  tensionPlaying=true;
}

/*
  無音にする場合も曲は停止しない。
  音量を一時的に下げるだけ。
*/

function setTensionVolume(volume,time=.06){
  if(!audioCtx||!tensionGain)return;

  const t=audioCtx.currentTime;

  tensionGain.gain.cancelScheduledValues(t);
  tensionGain.gain.setTargetAtTime(
    volume,t,time
  );
}

function silenceTension(){
  setTensionVolume(0,.04);
}

function softenTension(){
  setTensionVolume(.16,.08);
}

function restoreTension(){
  if(!busy||tapReady||!audioCtx)return;

  if(!tensionPlaying){
    startTension();
  }

  setTensionVolume(.7,.06);
}

function stopTension(){
  stopSource(tensionSource);
  tensionSource=null;
  tensionGain=null;
  tensionPlaying=false;
}

function playHitBGM(){
  stopTension();
  stopSource(hitSource);

  hitSource=makeSound(buffers.hit,true,1);

  if(!hitSource){
    audioStatus("当たりBGMを再生できません");
  }else{
    audioStatus("");
  }
}

function playGlassSound(){
  stopSource(glassSource);

  glassSource=makeSound(buffers.glass,false,1);

  if(!glassSource){
    try{
      fallbackGlassAudio.currentTime=0;
      fallbackGlassAudio.play().catch(()=>{});
    }catch(e){}
  }
}

function stopMusic(){
  stopTension();
  stopSource(hitSource);
  stopSource(glassSource);

  hitSource=null;
  glassSource=null;
  fallbackGlassAudio.pause();
}

document.addEventListener("visibilitychange",()=>{
  if(!audioCtx)return;

  if(document.hidden){
    audioCtx.suspend().catch(()=>{});
  }else if(busy){
    audioCtx.resume().catch(()=>{});

});

const bgImage=new Image();

bgImage.src=BACKGROUND_IMAGE;

const snapshot=document.createElement("canvas");
const snapCtx=snapshot.getContext("2d");

const crackMap=document.createElement("canvas");
const crackCtx=crackMap.getContext("2d");

let cw=0,ch=0,dpr=1;
let crackPixels=null;
let mapW=0,mapH=0;

let shards=[];
let crackLines=[];
let dust=[];

function resizeCanvases(){

function imageLoaded(img){

function drawBackground(target){

function buildCrackMap(){
  const scale=Math.min(
    1,480/Math.max(cw,ch)
  );

  mapW=Math.max(1,Math.floor(cw*scale));
  mapH=Math.max(1,Math.floor(ch*scale));

  crackMap.width=mapW;
  crackMap.height=mapH;

  crackCtx.clearRect(0,0,mapW,mapH);

  if(!crackImage.naturalWidth){
    crackPixels=null;
    return;
  }

  const scaleImage=Math.min(
    mapW/crackImage.naturalWidth,
    mapH/crackImage.naturalHeight
  );

  const iw=crackImage.naturalWidth*scaleImage;
  const ih=crackImage.naturalHeight*scaleImage;

  crackCtx.drawImage(
    crackImage,
    (mapW-iw)/2,
    (mapH-ih)/2,
    iw,
    ih
  );

  try{
    crackPixels=crackCtx.getImageData(
      0,0,mapW,mapH
    );
  }catch(e){
    crackPixels=null;
  }
}

function crackBrightness(x,y){
  if(!crackPixels)return 0;

  const px=Math.floor(x/cw*mapW);
  const py=Math.floor(y/ch*mapH);

  if(
    px<0||py<0||
    px>=mapW||py>=mapH
  )return 0;

  const i=(py*mapW+px)*4;
  const d=crackPixels.data;

  return(
    d[i]*.30+
    d[i+1]*.55+
    d[i+2]*.15
  )*(d[i+3]/255)/255;
}

function snapToCrack(x,y,radius=18){
  if(!crackPixels)return{x,y};

  let bestX=x;
  let bestY=y;
  let bestScore=-1;

  const step=Math.max(3,radius/4);

  for(let dy=-radius;dy<=radius;dy+=step){
    for(let dx=-radius;dx<=radius;dx+=step){
      const distance=Math.hypot(dx,dy);

      if(distance>radius)continue;

      const score=
        crackBrightness(x+dx,y+dy)-
        distance/radius*.27;

      if(score>bestScore){
        bestScore=score;
        bestX=x+dx;
        bestY=y+dy;
      }
    }
  }

  return bestScore<.22
    ?{x,y}
    :{x:bestX,y:bestY};
}

function makeGeometry(){
  shards=[];
  crackLines=[];
  dust=[];

  const cx=cw*.5;
  const cy=ch*.48;

  const rings=[
    0,37,91,160,270,
    Math.hypot(cw,ch)*.9
  ];

  const sides=28;
  const vertices=[];

  for(let r=0;r<rings.length;r++){
    vertices[r]=[];

    for(let i=0;i<sides;i++){
      if(r===0){
        vertices[r][i]={x:cx,y:cy};
        continue;
      }

      const angle=
        i/sides*Math.PI*2+
        (Math.random()-.5)*.09;

      const radius=
        rings[r]*
        (1+(Math.random()-.5)*.1);

      vertices[r][i]=snapToCrack(
        cx+Math.cos(angle)*radius,
        cy+Math.sin(angle)*radius,
        r<2?12:22
      );
    }
  }

  function addShard(points){
    const mx=points.reduce(
      (s,p)=>s+p.x,0
    )/points.length;

    const my=points.reduce(
      (s,p)=>s+p.y,0
    )/points.length;

    const angle=Math.atan2(my-cy,mx-cx);
    const speed=170+Math.random()*360;

    shards.push({
      points,
      mx,
      my,
      vx:Math.cos(angle)*speed+
        (Math.random()-.5)*140,
      vy:Math.sin(angle)*speed+
        (Math.random()-.5)*130,
      spin:(Math.random()-.5)*9,
      depth:.65+Math.random()*1.55,
      delay:Math.random()*.09,
      duration:.9+Math.random()*.65
    });
  }

  for(let r=0;r<rings.length-1;r++){
    for(let i=0;i<sides;i++){
      const j=(i+1)%sides;

      const a=vertices[r][i];
      const b=vertices[r+1][i];
      const c=vertices[r+1][j];
      const d=vertices[r][j];

      if(r===0){
        addShard([a,b,c]);
      }else if(Math.random()<.5){
        addShard([a,b,c]);
        addShard([a,c,d]);
        crackLines.push({a,b:c});
      }else{
        addShard([a,b,d]);
        addShard([b,c,d]);
        crackLines.push({a:b,b:d});
      }

      crackLines.push({a,b});
      crackLines.push({a:b,b:c});
    }
  }

  for(let i=0;i<180;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=120+Math.random()*540;

    dust.push({
      x:cx+(Math.random()-.5)*35,
      y:cy+(Math.random()-.5)*35,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,
      size:.5+Math.random()*2.4,
      life:.5+Math.random()*1.1,
      delay:Math.random()*.18
    });
  }
}

function drawCrackLines(progress){
  const cx=cw*.5;
  const cy=ch*.48;
  const radius=Math.hypot(cw,ch)*progress;

  ctx.save();
  ctx.lineCap="round";
  ctx.lineJoin="round";

  if(crackImage.naturalWidth){
    const scale=Math.min(
      cw/crackImage.naturalWidth,
      ch/crackImage.naturalHeight
    );

    const iw=crackImage.naturalWidth*scale;
    const ih=crackImage.naturalHeight*scale;

    ctx.save();
    ctx.beginPath();
    ctx.arc(
      cx,cy,
      Math.max(1,radius),
      0,Math.PI*2
    );
    ctx.clip();

    ctx.globalAlpha=.16;
    ctx.globalCompositeOperation="screen";

    ctx.drawImage(
      crackImage,
      (cw-iw)/2,
      (ch-ih)/2,
      iw,
      ih
    );

    ctx.restore();
  }

  for(const line of crackLines){
    const mx=(line.a.x+line.b.x)/2;
    const my=(line.a.y+line.b.y)/2;

    if(Math.hypot(mx-cx,my-cy)>radius){
      continue;
    }

    ctx.beginPath();
    ctx.moveTo(line.a.x,line.a.y);
    ctx.lineTo(line.b.x,line.b.y);
    ctx.lineWidth=3.5;
    ctx.strokeStyle="rgba(20,37,55,.82)";
    ctx.shadowBlur=0;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(line.a.x,line.a.y);
    ctx.lineTo(line.b.x,line.b.y);
    ctx.lineWidth=1.3;
    ctx.strokeStyle="rgba(245,251,255,.94)";
    ctx.shadowColor="#d7f5ff";
    ctx.shadowBlur=5;
    ctx.stroke();
  }

  ctx.restore();
}

function drawShard(shard,elapsed){
  const t=elapsed-shard.delay;
  if(t<0)return;

  const progress=t/shard.duration;
  if(progress>=1)return;

  ctx.save();

  ctx.globalAlpha=Math.pow(
    1-progress,1.15
  );

  ctx.translate(
    shard.mx+shard.vx*t,
    shard.my+shard.vy*t+150*t*t
  );
  ctx.rotate(shard.spin*t);

  ctx.scale(
    1+progress*shard.depth,
    1+progress*shard.depth
  );

  ctx.translate(-shard.mx,-shard.my);

  ctx.beginPath();

  shard.points.forEach((point,i)=>{
    if(i===0){
      ctx.moveTo(point.x,point.y);
    }else{
      ctx.lineTo(point.x,point.y);
    }
  });

  ctx.closePath();

  ctx.save();
  ctx.clip();

  ctx.drawImage(
    snapshot,
    0,0,
    snapshot.width,snapshot.height,
    0,0,
    cw,ch
  );

  const gradient=ctx.createLinearGradient(
    shard.mx-35,
    shard.my-35,
    shard.mx+35,
    shard.my+35
  );

  gradient.addColorStop(
    0,"rgba(255,255,255,.30)"
  );

  gradient.addColorStop(
    .45,"rgba(165,215,255,.03)"
  );

  gradient.addColorStop(
    1,"rgba(255,255,255,.24)"
  );

  ctx.fillStyle=gradient;
  ctx.fill();
  ctx.restore();

  ctx.lineWidth=1.1;
  ctx.strokeStyle="rgba(235,250,255,.84)";
  ctx.shadowColor="rgba(160,220,255,.85)";
  ctx.shadowBlur=5;
  ctx.stroke();

  ctx.restore();
}

function drawDust(elapsed){
  ctx.save();

  for(const piece of dust){
    const t=elapsed-piece.delay;

    if(t<0||t>piece.life)continue;

    const progress=t/piece.life;

    ctx.globalAlpha=1-progress;
    ctx.fillStyle=
      progress<.5?"#fff":"#c8efff";

    ctx.beginPath();
    ctx.arc(
      piece.x+piece.vx*t,
      piece.y+piece.vy*t+160*t*t,
      piece.size*(1-progress*.4),
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.restore();
}

function growCracks(from,to,duration){
  return new Promise(resolve=>{
    const started=performance.now();

    function frame(now){
      const progress=Math.min(
        (now-started)/duration,1
      );

      ctx.clearRect(0,0,cw,ch);
      drawCrackLines(
        from+(to-from)*progress
      );

      if(progress<1){
        requestAnimationFrame(frame);
      }else{
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

function flyGlass(){
  return new Promise(resolve=>{
    const started=performance.now();

    function frame(now){
      const elapsed=(now-started)/1000;

      ctx.clearRect(0,0,cw,ch);

      shards.forEach(s=>{
        drawShard(s,elapsed);
      });

      drawDust(elapsed);

      if(elapsed<1.65){
        requestAnimationFrame(frame);
      }else{
        ctx.clearRect(0,0,cw,ch);
        resolve();
      }
    }

    requestAnimationFrame(frame);
  });
}

/* ===========================
   ハズレ演出の連発防止

   直近3つと同じ演出を
   なるべく選ばない。

   24種類の演出が対象。
=========================== */

const MISS_VARIATION_COUNT=24;
const recentMisses=[];

function chooseMissVariation(){
  const candidates=[];

  for(let i=0;i<MISS_VARIATION_COUNT;i++){
    if(!recentMisses.includes(i)){
      candidates.push(i);
    }
  }

  const pool=candidates.length
    ?candidates
    :Array.from(
      {length:MISS_VARIATION_COUNT},
      (_,i)=>i
    );

  const choice=pool[rnd(0,pool.length-1)];

  recentMisses.push(choice);

  if(recentMisses.length>3){
    recentMisses.shift();
  }

  return choice;
}

/* ===========================
   ハズレ演出の選択
=========================== */

let recentMissCategory="";

function selectMissCategory(){
  /*
    通常・無音・ノーカンの連発を
    避けながら組み合わせる。
  */
  const categoryRoll=Math.random();

  let category;

  if(categoryRoll<.045){
    category="nocount";
  }else if(categoryRoll<.055){
    category="double";
  }else{
    category="varied";
  }

  if(
    category===recentMissCategory &&
    category!=="varied"
  ){
    category="varied";
  }

  recentMissCategory=category;
  return category;
}

async function normalMissRoute(){
  const category=selectMissCategory();

  if(category==="nocount"){
    return normalNoCountMiss();
  }

  if(category==="double"){
    return doubleNoCountMiss();
  }

  const variation=chooseMissVariation();

  return variedMissRoute(variation);
}

    ?true

    startTension();

  }catch(error){
    console.error(error);

    if(id===runId){
      reset();
    }
  }
};

/* ===========================
   初期化
=========================== */

resizeCanvases();
reset();

</script>
