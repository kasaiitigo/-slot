<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RP COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN",sans-serif;
}

body{
  user-select:none;
}

/* =========================
   MAIN
========================= */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background-color:#120008;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
  transform-origin:center center;
}

#stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:rgba(0,0,0,0);
  transition:background 1s;
}

#stage.bgDark::after{
  background:rgba(0,0,0,.76);
}

/* 本当たり専用：背景が一瞬手前に来る */
#stage.hitZoom{
  animation:hitStageZoom .52s cubic-bezier(.12,.8,.15,1);
}

@keyframes hitStageZoom{
  0%{transform:scale(1)}
  18%{transform:scale(1.13)}
  35%{transform:scale(.98)}
  55%{transform:scale(1.07)}
  100%{transform:scale(1)}
}

/* =========================
   COUNT NUMBER
========================= */
#number{
  position:absolute;
  z-index:20;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;

  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;

  color:#fff7fb;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;

  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);

  transition:
    color .18s,
    transform .18s,
    opacity .18s,
    filter .18s;
}

#number.show{
  animation:numberPop .32s ease-out;
}

@keyframes numberPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.16);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

#number.bigChance{
  animation:bigChance .7s cubic-bezier(.1,1.4,.2,1);
}

@keyframes bigChance{
  0%{transform:translate(-50%,-50%) scale(1)}
  35%{transform:translate(-50%,-50%) scale(1.55)}
  65%{transform:translate(-50%,-50%) scale(.92)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

#number.red{
  color:#ff5353;
  -webkit-text-stroke-color:#fff;
}

#number.gold{
  color:#fff0a0;
  -webkit-text-stroke-color:#ffb300;
  text-shadow:
    0 6px 0 #d78c00,
    0 12px 0 #8c5200,
    0 0 20px #fff,
    0 0 45px #ffc400;
}

#number.pink{
  color:#ffb6dc;
}

#number.cracked{
  filter:contrast(1.5);
  text-shadow:
    -4px -2px 0 rgba(255,255,255,.5),
    4px 3px 0 #8b003d,
    0 8px 0 #d82779,
    0 15px 0 #7a003a;
}

#dots{
  position:absolute;
  z-index:22;
  display:none;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  font-size:90px;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:4px #ff4b9d;
  text-shadow:
    0 5px 0 #d82779,
    0 10px 0 #970049;
}

/* =========================
   START
========================= */
#start{
  position:absolute;
  z-index:100;
  left:50%;
  bottom:max(7%,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(72vw,330px);
  padding:17px 20px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:999px;
  background:linear-gradient(180deg,#ff73b9,#d00064);
  color:#fff;
  font-size:21px;
  font-weight:1000;
  letter-spacing:.12em;
  box-shadow:
    0 5px 0 #79003a,
    0 0 25px rgba(255,40,140,.7);
}

#start:active{
  transform:translateX(-50%) translateY(4px);
}

#info{
  position:absolute;
  z-index:100;
  left:0;
  right:0;
  bottom:calc(max(7%,env(safe-area-inset-bottom)) + 75px);
  text-align:center;
  font-size:11px;
  font-weight:800;
  line-height:1.6;
  text-shadow:0 2px 5px #000;
}

/* =========================
   COMMON FX
========================= */
#black{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  background:#000;
}

#noise{
  position:fixed;
  inset:0;
  z-index:125;
  display:none;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,.13) 0px,
    rgba(255,255,255,.13) 1px,
    rgba(0,0,0,.2) 2px,
    rgba(0,0,0,.2) 4px
  );
  mix-blend-mode:screen;
}

#noise.go{
  display:block;
  animation:noiseMove .07s steps(2) infinite;
}

@keyframes noiseMove{
  0%{transform:translate(0,0)}
  25%{transform:translate(5px,-4px)}
  50%{transform:translate(-5px,3px)}
  75%{transform:translate(3px,5px)}
  100%{transform:translate(-3px,-5px)}
}

#lightning{
  position:fixed;
  inset:0;
  z-index:130;
  display:none;
  pointer-events:none;
}

#lightning.go{
  display:block;
}

.bolt{
  position:absolute;
  left:48%;
  top:-10%;
  width:10px;
  height:125%;
  background:#fff;
  transform:rotate(17deg);
  box-shadow:
    0 0 10px #fff,
    0 0 30px #ff4fa8,
    0 0 70px #ff0080;
  clip-path:polygon(
    50% 0,
    100% 0,
    65% 38%,
    100% 38%,
    38% 100%,
    50% 53%,
    0 53%
  );
}

#logoGlow{
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(
    circle at 50% 27%,
    rgba(255,255,255,.95) 0%,
    rgba(255,50,155,.6) 8%,
    rgba(255,0,100,.18) 23%,
    transparent 43%
  );
}

#logoGlow.go{
  animation:logoGlow .8s ease-out;
}

@keyframes logoGlow{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

#question{
  position:fixed;
  z-index:140;
  display:none;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  font-size:110px;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:5px #ff4b9d;
  text-shadow:0 0 25px #ff1493;
}

/* =========================
   SHOOTING STARS
   左・上 → 右下のみ
========================= */
.star{
  position:fixed;
  z-index:12;
  pointer-events:none;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 5px #fff,
    0 0 12px rgba(255,255,255,.95),
    0 0 22px rgba(255,190,225,.7);
}

.star::after{
  content:"";
  position:absolute;
  right:4px;
  top:4px;
  width:var(--tail,150px);
  height:2px;
  transform-origin:right center;
  transform:rotate(32deg);
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.04) 18%,
    rgba(255,255,255,.18) 45%,
    rgba(255,255,255,.55) 76%,
    #fff 100%
  );
}

.star.go{
  animation:shootNatural var(--speed,.85s) linear forwards;
}

@keyframes shootNatural{
  0%{
    transform:translate3d(0,0,0);
    opacity:0;
  }
  7%{opacity:1}
  75%{opacity:1}
  100%{
    transform:translate3d(78vw,48vh,0);
    opacity:0;
  }
}

/* =========================
   HIT IMPACT
========================= */
#hitDark{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  background:rgba(0,0,0,.92);
}

#slash{
  position:fixed;
  inset:0;
  z-index:210;
  display:none;
  pointer-events:none;
  overflow:hidden;
}

#slash.go{
  display:block;
}

.slashLine{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:31px;
  background:#fff;
  box-shadow:
    0 0 8px #fff,
    0 0 22px #fff,
    0 0 50px #ff58ad,
    0 0 110px #ff007b;
  transform:rotate(-18deg) scaleX(0);
}

#slash.go .slashLine{
  animation:slashGo .22s ease-out forwards;
}

@keyframes slashGo{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

#flash{
  position:fixed;
  inset:0;
  z-index:260;
  pointer-events:none;
  background:#fff;
  opacity:0;
}

#flash.go{
  animation:whiteFlash .55s ease-out;
}

@keyframes whiteFlash{
  0%{opacity:0}
  8%{opacity:1}
  20%{opacity:1}
  35%{opacity:.15}
  48%{opacity:1}
  100%{opacity:0}
}

/* 新：一瞬完全ホワイトアウト */
#impactWhite{
  position:fixed;
  inset:0;
  z-index:280;
  pointer-events:none;
  display:none;
  background:#fff;
}

#impactWhite.go{
  display:block;
  animation:impactWhite .24s linear forwards;
}

@keyframes impactWhite{
  0%{opacity:1}
  42%{opacity:1}
  100%{opacity:0}
}

/* 新：当たり時だけ強烈な縦横振動 */
body.hitShake{
  animation:hitShake .065s linear 10;
}

@keyframes hitShake{
  0%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-12px,7px) rotate(-.7deg)}
  20%{transform:translate(11px,-8px) rotate(.7deg)}
  30%{transform:translate(-8px,-9px) rotate(-.4deg)}
  40%{transform:translate(13px,6px) rotate(.5deg)}
  50%{transform:translate(-12px,9px) rotate(-.6deg)}
  60%{transform:translate(9px,-7px) rotate(.5deg)}
  70%{transform:translate(-7px,5px) rotate(-.4deg)}
  80%{transform:translate(7px,-4px) rotate(.3deg)}
  90%{transform:translate(-3px,2px)}
  100%{transform:translate(0,0)}
}

#hitText{
  position:fixed;
  z-index:300;
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:180vw;
  text-align:center;
  font-size:min(43vw,220px);
  line-height:1;
  font-weight:1000;
  color:#fff4a6;
  -webkit-text-stroke:5px #ff245f;
  text-shadow:
    0 8px 0 #b0003c,
    0 15px 0 #60001f,
    0 0 20px #fff,
    0 0 55px #ffca00,
    0 0 120px #ff004c;
}

#hitText.go{
  display:block;
  animation:hitExplosion 1.05s cubic-bezier(.08,1.45,.12,1);
}

/* 新：さらに手前から叩き込む */
@keyframes hitExplosion{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(6.5) rotate(-7deg);
    filter:blur(20px);
  }

  17%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.55) rotate(2deg);
    filter:blur(0);
  }

  31%{
    transform:translate(-50%,-50%) scale(1.45) rotate(-1deg);
  }

  46%{
    transform:translate(-50%,-50%) scale(.88);
  }

  61%{
    transform:translate(-50%,-50%) scale(1.18);
  }

  76%{
    transform:translate(-50%,-50%) scale(.96);
  }

  100%{
    transform:translate(-50%,-50%) scale(1);
  }
}

/* =========================
   TREASURE
========================= */
#treasure{
  position:fixed;
  inset:0;
  z-index:350;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 40%,#5e0a37,#1c0010 55%,#050003);
}

#treasure.show{
  display:flex;
}

#treasureTitle{
  position:absolute;
  top:max(8%,env(safe-area-inset-top));
  width:100%;
  text-align:center;
  font-size:27px;
  font-weight:1000;
  text-shadow:0 3px 8px #000;
}

#treasureSub{
  position:absolute;
  top:15%;
  width:100%;
  text-align:center;
  font-size:13px;
  font-weight:800;
  opacity:.8;
}

#chests{
  width:min(96vw,650px);
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:10px;
}

.chest{
  appearance:none;
  border:0;
  background:none;
  color:#fff;
  width:32%;
  padding:0;
  position:relative;
  transition:transform .2s,opacity .3s,filter .3s;
}

.chestWrap{
  position:relative;
  width:100%;
  height:145px;
}

.chestBody{
  position:absolute;
  z-index:5;
  left:8%;
  bottom:8px;
  width:84%;
  height:72px;
  border:4px solid #ffd0e5;
  border-radius:8px 8px 18px 18px;
  background:
    linear-gradient(
      90deg,
      #b9005c,
      #ff4e9d 22%,
      #bd005e 52%,
      #ff63ad 80%,
      #a60051
    );
  box-shadow:
    inset 0 0 16px rgba(80,0,35,.65),
    0 10px 18px rgba(0,0,0,.65);
}

.closedLid{
  position:absolute;
  z-index:9;
  left:5%;
  bottom:73px;
  width:90%;
  height:55px;
  border:4px solid #ffd0e5;
  border-radius:50% 50% 7px 7px;
  background:
    linear-gradient(
      90deg,
      #ad0056,
      #ff55a3 25%,
      #bc005c 55%,
      #ff6ab3 82%,
      #a30050
    );
  transition:opacity .2s,transform .25s;
}

.openLid{
  position:absolute;
  z-index:3;
  left:8%;
  bottom:70px;
  width:84%;
  height:43px;
  border:4px solid #ffd0e5;
  border-radius:50% 50% 8px 8px;
  background:linear-gradient(#ff62ad,#a90053);
  transform:translateY(12px) scaleY(.35);
  opacity:0;
  transition:.35s;
}

.hinge{
  position:absolute;
  z-index:10;
  left:17%;
  bottom:69px;
  width:66%;
  height:7px;
  border-radius:10px;
  background:#ffd0e5;
}

.lock{
  position:absolute;
  z-index:12;
  left:41%;
  bottom:60px;
  width:18%;
  height:28px;
  border-radius:6px;
  border:2px solid #fff;
  background:linear-gradient(#fff2a0,#ffbd00);
  box-shadow:0 0 7px rgba(255,255,255,.6);
}

.chest.open .closedLid{
  opacity:0;
  transform:scale(.9);
}

.chest.open .openLid{
  opacity:1;
  transform:translateY(0) scaleY(1);
}

.chest.open .lock{
  opacity:0;
}

.chestLight{
  position:absolute;
  z-index:4;
  left:27%;
  bottom:55px;
  width:46%;
  height:20px;
  opacity:0;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 20px #fff,
    0 0 45px #ff77bb,
    0 0 90px #ff0080;
}

.chest.open .chestLight{
  animation:chestBurst .8s ease-out;
}

@keyframes chestBurst{
  0%{
    opacity:1;
    transform:scale(.4);
  }
  100%{
    opacity:0;
    transform:scale(5);
  }
}

.chest.shaking .chestWrap{
  animation:chestShake .09s linear infinite;
}

@keyframes chestShake{
  0%{transform:translateX(-4px) rotate(-1deg)}
  50%{transform:translateX(4px) rotate(1deg)}
  100%{transform:translateX(-4px) rotate(-1deg)}
}

.rankLabel{
  min-height:38px;
  margin-top:3px;
  font-size:25px;
  font-weight:1000;
  text-shadow:0 2px 5px #000;
}

.rank1{color:#ffe04f}
.rank2{color:#eef5ff}
.rank3{color:#ff9d56}

.chest.selectedChest{
  z-index:25;
  filter:
    brightness(1.18)
    drop-shadow(0 0 7px #fff)
    drop-shadow(0 0 17px #ff4fa1)
    drop-shadow(0 0 30px rgba(255,0,118,.9));
}

.chest.selectedChest::before{
  content:"あなたが選んだ箱";
  position:absolute;
  z-index:40;
  left:50%;
  top:-48px;
  transform:translateX(-50%);
  width:max-content;
  padding:6px 11px;
  border-radius:999px;
  border:2px solid #fff;
  background:linear-gradient(180deg,#ff6bb0,#c90060);
  color:#fff;
  font-size:12px;
  font-weight:1000;
  box-shadow:
    0 3px 0 #750038,
    0 0 15px rgba(255,73,160,.8);
}

.chest.otherChest{
  opacity:.48;
  filter:brightness(.72) saturate(.7);
}

.selectedChest .rankLabel{
  font-size:31px;
}

#prizeResult{
  margin-top:55px;
  min-height:96px;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#resultSmall{
  display:none;
  margin-bottom:2px;
  font-size:16px;
  font-weight:900;
}

#resultBig{
  display:none;
  font-size:46px;
  line-height:1.1;
  font-weight:1000;
  white-space:nowrap;
  text-shadow:
    0 4px 0 rgba(80,0,35,.65),
    0 7px 10px rgba(0,0,0,.7),
    0 0 14px currentColor;
}

.resultPop{
  animation:resultPop .6s cubic-bezier(.1,1.5,.2,1);
}

@keyframes resultPop{
  from{
    transform:scale(.2);
    opacity:0;
  }
  70%{
    transform:scale(1.18);
    opacity:1;
  }
  to{
    transform:scale(1);
  }
}

#next{
  display:none;
  margin-top:18px;
  padding:14px 45px;
  border:2px solid #fff;
  border-radius:999px;
  background:linear-gradient(#ff70b4,#c90060);
  color:#fff;
  font-size:18px;
  font-weight:1000;
}
</style>
</head>

<body>

<div id="stage">
  <div id="number">3</div>
  <div id="dots">…</div>

  <div id="info">
    完全抽選 1/30<br>
    毎回独立抽選
  </div>

  <button id="start">START</button>
</div>

<div id="noise"></div>
<div id="lightning"><div class="bolt"></div></div>
<div id="logoGlow"></div>
<div id="question">？</div>
<div id="black"></div>
<div id="hitDark"></div>

<div id="slash">
  <div class="slashLine"></div>
</div>

<div id="flash"></div>
<div id="impactWhite"></div>
<div id="hitText">当たり</div>

<div id="treasure">
  <div id="treasureTitle">宝箱を1つ選べ！</div>
  <div id="treasureSub">好きな宝箱をタップ</div>

  <div id="chests"></div>

  <div id="prizeResult">
    <div id="resultSmall">あなたの結果</div>
    <div id="resultBig"></div>
  </div>

  <button id="next">NEXT</button>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let busy=false;
let chestBusy=false;
let selectedRank=null;
let selectedIndex=-1;

let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let hitSource=null;

let playToken=0;
let starTimers=[];

/* =========================
   AUDIO
========================= */
function ensureAudioContext(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  return audioCtx;
}

async function loadBuffer(url){
  const res=await fetch(url,{cache:"force-cache"});
  if(!res.ok)throw new Error(url+" load failed");
  const arr=await res.arrayBuffer();
  return await audioCtx.decodeAudioData(arr);
}

async function prepareAudio(){
  ensureAudioContext();

  if(!tensionBuffer){
    try{
      tensionBuffer=await loadBuffer("./Tension.mp3");
    }catch(e){
      console.log("Tension load error",e);
    }
  }

  if(!hitBuffer){
    try{
      hitBuffer=await loadBuffer("./hit_music_final.mp3");
    }catch(e){
      console.log("Hit music load error",e);
    }
  }
}

function stopTension(){
  try{tensionSource?.stop()}catch(e){}
  tensionSource=null;
}

function startTension(){
  if(!audioCtx||!tensionBuffer)return;

  stopTension();

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=tensionBuffer;
  source.loop=true;
  gain.gain.value=.72;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);
  tensionSource=source;
}

function stopHitMusic(){
  try{hitSource?.stop()}catch(e){}
  hitSource=null;
}

function playHitMusic(){
  if(!audioCtx||!hitBuffer)return;

  stopHitMusic();

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=hitBuffer;
  gain.gain.value=1;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);
  hitSource=source;
}

/* =========================
   BASIC VISUALS
========================= */
function clearNumberClasses(){
  const n=$("#number");
  n.className="";
  n.style.opacity="";
  n.style.filter="";
  n.style.transform="";
}

function showNumber(value){
  const el=$("#number");

  $("#dots").style.display="none";

  el.style.display="block";

/* =========================
   SHOOTING STARS
========================= */
function clearStars(){
  starTimers.forEach(clearTimeout);
  starTimers=[];
  $$(".star").forEach(s=>s.remove());
}

function shootStar(){
  const star=document.createElement("div");
  star.className="star";

  const fromTop=Math.random()<.55;

  if(fromTop){
    star.style.left=(-12+Math.random()*52)+"vw";
    star.style.top=(-5-Math.random()*8)+"vh";
  }else{
    star.style.left=(-12-Math.random()*8)+"vw";
    star.style.top=(2+Math.random()*28)+"vh";
  }

  star.style.setProperty("--tail",(110+Math.random()*130)+"px");
  star.style.setProperty("--speed",(.62+Math.random()*.38)+"s");

  const size=.75+Math.random()*.65;
  star.style.width=(10*size)+"px";
  star.style.height=(10*size)+"px";

  document.body.appendChild(star);

  requestAnimationFrame(()=>star.classList.add("go"));
  setTimeout(()=>star.remove(),1400);
}

function starBurst(count){
  for(let i=0;i<count;i++){
    const timer=setTimeout(
      shootStar,
      i*(60+Math.random()*100)
    );
    starTimers.push(timer);
  }
}

function scheduleStars(token){
  if(Math.random()>=.27)return;

  const r=Math.random();
  let count;

  if(r<.75){
    count=1+Math.floor(Math.random()*3);
  }else if(r<.95){
    count=4+Math.floor(Math.random()*3);
  }else{
    count=7+Math.floor(Math.random()*4);
  }

  const delay=600+Math.random()*3000;

  starTimers.push(setTimeout(()=>{
    if(token!==playToken)return;

    starBurst(count);

    if(Math.random()<.15){
      starTimers.push(setTimeout(()=>{
        if(token===playToken){
          starBurst(1+Math.floor(Math.random()*4));
        }
      },700+Math.random()*1000));
    }
  },delay));
}

/* =========================
   PRIZE
   1等 2%
   2等 20%
   3等 78%
========================= */
function drawPrize(){
  const r=Math.random();

  if(r<.02)return 1;
  if(r<.22)return 2;

  return 3;
}

function rankClass(rank){
  return "rank"+rank;
}

function createChests(){
  const area=$("#chests");
  area.innerHTML="";

  for(let i=0;i<3;i++){
    const button=document.createElement("button");
    button.className="chest";

    button.innerHTML=`
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="openLid"></div>
        <div class="closedLid"></div>
        <div class="hinge"></div>
        <div class="chestBody"></div>
        <div class="lock"></div>
      </div>
      <div class="rankLabel"></div>
    `;

    button.addEventListener("click",()=>chooseChest(i));
    area.appendChild(button);
  }
}

  const big=$("#resultBig");

  small.textContent="あなたの結果";
  small.style.display="block";

  big.textContent=rank+"等 当選！";
  big.className=rankClass(rank);
  big.style.display="block";

  void big.offsetWidth;
  big.classList.add("resultPop");
}

async function chooseChest(index){
  if(chestBusy)return;

  chestBusy=true;
  selectedIndex=index;

  const chests=$$(".chest");
  const chosen=chests[index];

  chests.forEach(chest=>{
    chest.style.pointerEvents="none";
  });

  chosen.classList.add("shaking");

  await sleep(950);

  chosen.classList.remove("shaking");
  chosen.classList.add("open","selectedChest");

  await sleep(450);

  flash();

  await sleep(500);

  const label=chosen.querySelector(".rankLabel");

  label.textContent=selectedRank+"等";
  label.className="rankLabel "+rankClass(selectedRank);

  showSelectedResult(selectedRank);

  await sleep(1300);

  const remainingRanks=[1,2,3]
    .filter(rank=>rank!==selectedRank)
    .sort(()=>Math.random()-.5);

  const otherIndexes=[0,1,2]
    .filter(i=>i!==index)
    .sort(()=>Math.random()-.5);

  for(let i=0;i<otherIndexes.length;i++){
    const idx=otherIndexes[i];
    const chest=chests[idx];

    chest.classList.add("otherChest","shaking");

    await sleep(500);

    chest.classList.remove("shaking");
    chest.classList.add("open");

    const label=chest.querySelector(".rankLabel");
    const rank=remainingRanks[i];

    label.textContent=rank+"等";
    label.className="rankLabel "+rankClass(rank);

    await sleep(750);
  }

  $("#treasureTitle").textContent="あなたが選んだ宝箱";
  $("#treasureSub").textContent="選んだ結果はこちら";

  showSelectedResult(selectedRank);

  await sleep(600);

  $("#next").style.display="block";
}

/* =========================
   HIT SELECTOR
   32 + 12 = 44
========================= */
async function runHit(){
  const pattern=Math.floor(Math.random()*44);

  switch(pattern){
    case 0:return normalHitAt(3);
    case 1:return normalHitAt(2);
    case 2:return normalHitAt(1);
    case 3:return normalHitAt(0);
    case 4:return normalBlackout();
    case 5:return freezeTwo();
    case 6:return reverseCountdown();
    case 7:return zeroPremium();
    case 8:return numberDisappear();
    case 9:return soundStopPattern();
    case 10:return longOne();
    case 11:return recountSequence();
    case 12:return doubleCountdown();

    /* プチューン2種類 */
    case 13:return puchunDirect();
    case 14:return puchunRecount();

    case 15:return fakeSlashPattern();
    case 16:return weirdCountdown();
    case 17:return silentStart();
    case 18:return classicRevival();
    case 19:return skipCountHit();
    case 20:return oneVanishHit();
    case 21:return oneBackToTwoHit();
    case 22:return speedCountHit();
    case 23:return doubleSlashHit();
    case 24:return silentOddityHit();
    case 25:return questionHit();
    case 26:return blackoutReturnHit();
    case 27:return dotsDirectHit();
    case 28:return dotsOneRevival();
    case 29:return dotsBlackoutHit();
    case 30:return dotsStarHit();
    case 31:return dotsLongSilenceHit();

    case 32:return commonFxHit(0);
    case 33:return commonFxHit(1);
    case 34:return commonFxHit(2);
    case 35:return commonFxHit(3);
    case 36:return commonFxHit(4);
    case 37:return commonFxHit(5);
    case 38:return commonFxHit(6);
    case 39:return commonFxHit(7);
    case 40:return commonFxHit(8);
    case 41:return commonFxHit(9);
    case 42:return commonFxHit(10);
    case 43:return commonFxHit(11);
  }
}

/* =========================
   MISS SELECTOR
========================= */
async function runMiss(){
  if(Math.random()<.36){
    return commonFxMiss(
      Math.floor(Math.random()*12)
    );
  }

  const r=Math.random();

  if(r<.50){
    return normalMiss();
  }

  if(r<.75){
    return weakFake(
      Math.floor(Math.random()*10)
    );
  }

  return strongFake(
    Math.floor(Math.random()*6)
  );
}

/* =========================
   RESET
========================= */
function resetVisuals(){
  $("#black").style.display="none";
  $("#hitDark").style.display="none";

  $("#slash").className="";
  $("#flash").className="";
  $("#impactWhite").className="";
  $("#hitText").className="";
  $("#noise").className="";
  $("#lightning").className="";
  $("#logoGlow").className="";

  $("#question").style.display="none";

  $("#stage").classList.remove("bgDark","hitZoom");

  document.body.classList.remove("hitShake");

  hideDots();
  clearNumberClasses();
}

function resetMain(){
  stopTension();
  clearStars();

  resetVisuals();

  $("#treasure").className="";
  $("#next").style.display="none";

  $("#resultSmall").style.display="none";
  $("#resultBig").style.display="none";

  showNumber(3);

  $("#start").style.display="block";
  $("#info").style.display="block";

  busy=false;
  chestBusy=false;
  selectedRank=null;
  selectedIndex=-1;
}

/* =========================
   PLAY
========================= */
async function play(){
  if(busy)return;

  busy=true;

  $("#start").style.display="none";
  $("#info").style.display="none";

  playToken++;

  clearStars();
  resetVisuals();

  ensureAudioContext();

  const resumePromise=audioCtx.resume();

  try{
    await Promise.all([
      resumePromise,
      prepareAudio()
    ]);
  }catch(e){
    console.log("audio preparation error",e);
  }

  startTension();

  const token=playToken;

  /*
    流れ星は当落と独立
  */
  scheduleStars(token);

  /*
    ★ 本番抽選 ★
    STARTごとに1回だけ
    完全独立 1/30
  */
  const win=Math.random() < (1/30);

  if(win){
    await runHit();
  }else{
    await runMiss();
  }
}

/* =========================
   EVENTS
========================= */
$("#start").addEventListener("click",play);

$("#next").addEventListener("click",()=>{
  stopHitMusic();

  playToken++;

  resetMain();
});

/* =========================
   PRELOAD
========================= */
window.addEventListener("load",()=>{
  ensureAudioContext();

  prepareAudio().catch(()=>{});
});
</script>
