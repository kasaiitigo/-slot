
<!DOCTYPE html>

<style>

#noise{

<script>
"use strict";

/* ==============================
   SETTINGS
============================== */

/*
  true:
    テストモード
    STARTで毎回画面破壊当たり

  false:
    通常モード
    当選確率1/25
*/

const TEST_MODE = true;

/*
  当たりBGMはループ再生する。
*/

const LOOP_HIT_BGM = true;

const BACKGROUND_IMAGE =
  "./9E28B31B-C619-4F41-AB55-91C025168D02.png";

const CRACK_IMAGE =
  "./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png";

const TENSION_SOUND =
  "./Tension.mp3";

const HIT_SOUND =
  "./hit_music_final.mp3";

const GLASS_SOUND_MP3 =
  "./glass_crack_crack_shatter_v3.mp3";

const GLASS_SOUND_MOV =
  "./glass_crack_crack_shatter_v3_preview.mov";

/* ==============================
   BASIC
============================== */

const $ = id =>
  document.getElementById(id);

const wait = ms =>
  new Promise(resolve=>setTimeout(resolve,ms));

const rnd = (a,b) =>
  Math.floor(Math.random()*(b-a+1))+a;

const roll = p =>
  Math.random()<p;

const stage = $("stage");
const num = $("num");
const result = $("result");
const near = $("near");
const main = $("mainResult");
const message = $("message");
const black = $("black");
const fx = $("specialFX");

const glassArea = $("glassArea");
const glassUnder = $("glassUnder");
const glassLight = $("glassLight");
const glassCanvas = $("glassCanvas");
const ctx = glassCanvas.getContext("2d");

let busy = false;
let tapReady = false;
let runId = 0;

/* ==============================
   IPHONE AUDIO FIX

   Web Audio APIを使い、
   STARTのタップ操作内で
   AudioContextを有効化。

   BGMを事前にデコードし、
   当たり時にBufferSourceで
   再生する。
============================== */

const AudioContextClass =
  window.AudioContext ||
  window.webkitAudioContext;

let audioCtx = null;

const buffers = {
  tension:null,
  hit:null,
  glass:null
};

let tensionSource = null;
let hitSource = null;
let glassSource = null;

let audioLoadPromise = null;
let audioEnabled = false;

const fallbackGlassAudio = new Audio();
fallbackGlassAudio.preload = "auto";
fallbackGlassAudio.volume = 1;

function showAudioStatus(text){

  const el = $("audioStatus");

  el.textContent = text;

  if(text){
    el.classList.add("show");
  }else{
    el.classList.remove("show");
  }
}

/*
  iPhoneではユーザー操作の中で
  resume()を呼ぶことが重要。
*/

function activateAudio(){

  if(!AudioContextClass){
    showAudioStatus(
      "このブラウザは音声機能に対応していません"
    );
    return Promise.resolve();
  }

  if(!audioCtx){
    audioCtx = new AudioContextClass();
  }

  /*
    無音の短い音を鳴らし、
    START操作で音声を有効化する。
  */

  try{
    const silent = audioCtx.createBuffer(
      1,1,audioCtx.sampleRate
    );

    const source =
      audioCtx.createBufferSource();

    source.buffer = silent;
    source.connect(audioCtx.destination);
    source.start(0);
  }catch(error){
    console.warn("音声初期化:",error);
  }

  const promise = audioCtx.resume();

  return Promise.resolve(promise)
    .then(()=>{
      audioEnabled =
        audioCtx.state==="running";
    })
    .catch(error=>{
      console.warn("音声有効化:",error);
      audioEnabled = false;
    });
}

/*
  音声をダウンロードして
  ブラウザ内でデコードする。
*/

async function loadAudioBuffer(url){

  if(!audioCtx)return null;

  try{

    const response = await fetch(url);

    if(!response.ok){
      throw new Error(
        "HTTP "+response.status+" : "+url
      );
    }

    const bytes = await response.arrayBuffer();

    return await audioCtx.decodeAudioData(
      bytes.slice(0)
    );

  }catch(error){

    console.warn(
      "音声ファイルの読み込み失敗:",
      url,error
    );

    return null;
  }
}

/*
  STARTした時点で3種類を読み込む。

  最初のSTARTでは、
  読み込みが終わってから演出開始。
*/

async function prepareAudio(){

  if(!audioCtx)return;

  if(!audioLoadPromise){

    audioLoadPromise = (async()=>{

      const loaded = await Promise.all([
        loadAudioBuffer(TENSION_SOUND),
        loadAudioBuffer(HIT_SOUND),
        loadAudioBuffer(GLASS_SOUND_MP3)
      ]);

      buffers.tension = loaded[0];
      buffers.hit = loaded[1];
      buffers.glass = loaded[2];

      /*
        MP3がない場合、
        GitHubにあるMOVを予備に使う。
      */

      if(!buffers.glass){

        fallbackGlassAudio.src =
          GLASS_SOUND_MOV;

        fallbackGlassAudio.load();
      }

      if(!buffers.hit){

        showAudioStatus(
          "当たりBGMが読み込めません。hit_music_final.mp3 を確認"
        );
      }

    })();
  }

  await audioLoadPromise;
}

/*
  BufferSourceは1回ごとに新しく作る。
  iPhoneでも後から再生できる方式。
*/

function createSound(buffer,loop=false,volume=1){

  if(!audioCtx || !buffer)return null;

  try{

    const source =
      audioCtx.createBufferSource();

    const gain =
      audioCtx.createGain();

    source.buffer = buffer;
    source.loop = loop;

    gain.gain.value = volume;

    source.connect(gain);
    gain.connect(audioCtx.destination);

    source.start(0);

    return source;

  }catch(error){

    console.warn("BGM再生:",error);
    return null;
  }
}

function stopSource(source){

  if(!source)return;

  try{
    source.stop(0);
  }catch(error){}
}

function tension(){

  stopSource(tensionSource);

  tensionSource = createSound(
    buffers.tension,
    true,
    .7
  );
}

function stopTension(){

  stopSource(tensionSource);
  tensionSource = null;
}

/*
  当たり後のBGM。
  START画面へ戻るまで流す。
*/

function playHitBGM(){

  stopTension();
  stopSource(glassSource);
  glassSource = null;

  try{
    fallbackGlassAudio.pause();
  }catch(error){}

  stopSource(hitSource);

  hitSource = createSound(

    );

  }
}

function playGlassSound(){

  stopSource(glassSource);

  glassSource = createSound(
    buffers.glass,

    1
  );

  if(!glassSource){

    /*
      MP3がない場合のMOV予備再生。

    */

      fallbackGlassAudio.currentTime = 0;

      if(promise && promise.catch){
        promise.catch(error=>{
          console.warn("ガラス音:",error);
        });

    }
  }
}

/* ==============================
   CRACK IMAGE ANALYSIS
============================== */

let crackPixels = null;
let mapW = 0;
let mapH = 0;

function buildCrackMap(){

  const scale = Math.min(
    1,
    480/Math.max(cw,ch)
  );

  mapW = Math.max(
    1,
    Math.floor(cw*scale)
  );

  mapH = Math.max(
    1,
    Math.floor(ch*scale)
  );

  crackMap.width = mapW;
  crackMap.height = mapH;

  crackCtx.clearRect(
    0,0,mapW,mapH
  );

  if(!crackImage.naturalWidth){

    crackPixels = null;
    return;
  }

  const imageScale = Math.min(
    mapW/crackImage.naturalWidth,
    mapH/crackImage.naturalHeight
  );

  const iw =
    crackImage.naturalWidth*imageScale;

  const ih =
    crackImage.naturalHeight*imageScale;

  crackCtx.drawImage(
    crackImage,
    (mapW-iw)/2,
    (mapH-ih)/2,
    iw,ih
  );

  try{

    crackPixels =
      crackCtx.getImageData(
        0,0,mapW,mapH
      );

  }catch(error){

    crackPixels = null;
  }
}

function crackBrightness(x,y){

  if(!crackPixels)return 0;

  const px =
    Math.floor(x/cw*mapW);

  const py =
    Math.floor(y/ch*mapH);

  if(
    px<0 ||
    py<0 ||
    px>=mapW ||
    py>=mapH
  ){
    return 0;
  }

  const i =
    (py*mapW+px)*4;

  const d =
    crackPixels.data;

  return (
    d[i]*.30+
    d[i+1]*.55+
    d[i+2]*.15
  )*(d[i+3]/255)/255;
}

function snapToCrack(x,y,radius=18){

  if(!crackPixels){
    return {x,y};
  }

  let bestX = x;
  let bestY = y;
  let bestScore = -1;

  const step =
    Math.max(3,radius/4);

  for(
    let dy=-radius;
    dy<=radius;
    dy+=step
  ){

    for(
      let dx=-radius;
      dx<=radius;
      dx+=step
    ){

      const dist =
        Math.hypot(dx,dy);

      if(dist>radius)continue;

      const bx = x+dx;
      const by = y+dy;

      const score =
        crackBrightness(bx,by)
        -(dist/radius)*.27;

      if(score>bestScore){

        bestScore = score;
        bestX = bx;
        bestY = by;
      }
    }
  }

  if(bestScore<.22){
    return {x,y};
  }

  return {
    x:bestX,
    y:bestY
  };
}

/* ==============================
   GLASS GEOMETRY
============================== */

let shards = [];
let crackLines = [];
let dust = [];

function makeGeometry(){

  shards = [];
  crackLines = [];
  dust = [];

  const cx = cw*.5;
  const cy = ch*.48;

  const maxRadius =
    Math.hypot(cw,ch)*.9;

  const rings = [
    0,37,91,160,270,maxRadius
  ];

  const sides = 28;
  const vertices = [];

  for(
    let ring=0;
    ring<rings.length;
    ring++
  ){

    vertices[ring] = [];

    for(let i=0;i<sides;i++){

      if(ring===0){

        vertices[ring][i] = {
          x:cx,
          y:cy
        };

        continue;
      }

      const angle =
        i/sides*Math.PI*2+
        (Math.random()-.5)*.09;

      const radius =
        rings[ring]*
        (1+(Math.random()-.5)*.1);

      const x =
        cx+Math.cos(angle)*radius;

      const y =
        cy+Math.sin(angle)*radius;

      vertices[ring][i] =
        snapToCrack(
          x,y,ring<2?12:22
        );
    }
  }

  function addLine(a,b){

    crackLines.push({a,b});
  }

  function addShard(points){

    const mx =
      points.reduce(
        (s,p)=>s+p.x,0
      )/points.length;

    const my =
      points.reduce(
        (s,p)=>s+p.y,0
      )/points.length;

    const angle =
      Math.atan2(
        my-cy,
        mx-cx
      );

    const speed =
      170+Math.random()*360;

    shards.push({

      points,
      mx,my,

      vx:
        Math.cos(angle)*speed+
        (Math.random()-.5)*140,

      vy:
        Math.sin(angle)*speed+
        (Math.random()-.5)*130,

      spin:
        (Math.random()-.5)*9,

      depth:
        .65+Math.random()*1.55,

      delay:
        Math.random()*.09,

      duration:
        .9+Math.random()*.65,

      shine:
        Math.random()
    });
  }

  for(
    let ring=0;
    ring<rings.length-1;
    ring++
  ){

    for(let i=0;i<sides;i++){

      const j =
        (i+1)%sides;

      const a =
        vertices[ring][i];

      const b =
        vertices[ring+1][i];

      const c =
        vertices[ring+1][j];

      const d =
        vertices[ring][j];

      if(ring===0){

        addShard([a,b,c]);

        addLine(a,b);
        addLine(b,c);

      }else{

        if(Math.random()<.5){

          addShard([a,b,c]);
          addShard([a,c,d]);

          addLine(a,c);

        }else{

          addShard([a,b,d]);
          addShard([b,c,d]);

          addLine(b,d);
        }

        addLine(a,b);
        addLine(b,c);
      }
    }
  }

  for(let i=0;i<180;i++){

    const angle =
      Math.random()*Math.PI*2;

    const speed =
      120+Math.random()*540;

    dust.push({

      x:cx+(Math.random()-.5)*35,
      y:cy+(Math.random()-.5)*35,

      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed,

      size:
        .5+Math.random()*2.4,

      life:
        .5+Math.random()*1.1,

      delay:
        Math.random()*.18
    });
  }
}

/* ==============================
   DRAW CRACKS
============================== */

function drawCrackLines(progress){

  const cx = cw*.5;
  const cy = ch*.48;

  const radius =
    Math.hypot(cw,ch)*progress;

  ctx.save();

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if(crackImage.naturalWidth){

    const scale = Math.min(
      cw/crackImage.naturalWidth,
      ch/crackImage.naturalHeight
    );

    const iw =
      crackImage.naturalWidth*scale;

    const ih =
      crackImage.naturalHeight*scale;

    ctx.save();

    ctx.beginPath();

    ctx.arc(
      cx,cy,
      Math.max(1,radius),
      0,
      Math.PI*2
    );

    ctx.clip();

    ctx.globalAlpha = .16;

    ctx.globalCompositeOperation =
      "screen";

    ctx.drawImage(
      crackImage,
      (cw-iw)/2,
      (ch-ih)/2,
      iw,ih
    );

    ctx.restore();
  }

  for(const line of crackLines){

    const mx =
      (line.a.x+line.b.x)/2;

    const my =
      (line.a.y+line.b.y)/2;

    if(
      Math.hypot(
        mx-cx,
        my-cy
      )>radius
    ){
      continue;
    }

    ctx.beginPath();

    ctx.moveTo(
      line.a.x,
      line.a.y
    );

    ctx.lineTo(
      line.b.x,
      line.b.y
    );

    ctx.strokeStyle =
      "rgba(20,37,55,.82)";

    ctx.lineWidth = 3.5;
    ctx.shadowBlur = 0;
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
      line.a.x,
      line.a.y
    );

    ctx.lineTo(
      line.b.x,
      line.b.y
    );

    ctx.strokeStyle =
      "rgba(245,251,255,.94)";

    ctx.lineWidth = 1.3;
    ctx.shadowColor = "#d7f5ff";
    ctx.shadowBlur = 5;

    ctx.stroke();
  }

  ctx.restore();
}

/* ==============================
   DRAW SHARDS
============================== */

function drawShard(shard,elapsed){

  const t =
    elapsed-shard.delay;

  if(t<0)return;

  const p =
    t/shard.duration;

  if(p>=1)return;

  const dx =
    shard.vx*t;

  const dy =
    shard.vy*t+150*t*t;

  const rotation =
    shard.spin*t;

  const scale =
    1+p*shard.depth;

  const opacity =
    Math.pow(1-p,1.15);

  ctx.save();

  ctx.globalAlpha = opacity;

  ctx.translate(
    shard.mx+dx,
    shard.my+dy
  );

  ctx.rotate(rotation);
  ctx.scale(scale,scale);

  ctx.translate(
    -shard.mx,
    -shard.my
  );

  ctx.beginPath();

  shard.points.forEach(
    (point,i)=>{

      if(i===0){

        ctx.moveTo(
          point.x,
          point.y
        );

      }else{

        ctx.lineTo(
          point.x,
          point.y
        );
      }
    }
  );

  ctx.closePath();

  ctx.save();
  ctx.clip();

  ctx.drawImage(
    snapshot,
    0,0,
    snapshot.width,
    snapshot.height,
    0,0,cw,ch
  );

  const gradient =
    ctx.createLinearGradient(
      shard.mx-35,
      shard.my-35,
      shard.mx+35,
      shard.my+35
    );

  gradient.addColorStop(
    0,
    "rgba(255,255,255,.30)"
  );

  gradient.addColorStop(
    .45,
    "rgba(165,215,255,.03)"
  );

  gradient.addColorStop(
    1,
    "rgba(255,255,255,.24)"
  );

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.restore();

  ctx.lineWidth = 1.1;

  ctx.strokeStyle =
    "rgba(235,250,255,.84)";

  ctx.shadowColor =
    "rgba(160,220,255,.85)";

  ctx.shadowBlur = 5;
  ctx.stroke();

  if(shard.shine>.8){

    const a =
      shard.points[0];

    const b =
      shard.points[1];

    ctx.beginPath();

    ctx.moveTo(
      a.x*.75+b.x*.25,
      a.y*.75+b.y*.25
    );

    ctx.lineTo(
      a.x*.25+b.x*.75,
      a.y*.25+b.y*.75
    );

    ctx.strokeStyle =
      "rgba(255,255,255,.92)";

    ctx.lineWidth = 1;

    ctx.stroke();
  }

  ctx.restore();
}

/* ==============================
   DRAW DUST
============================== */

function drawDust(elapsed){

  ctx.save();

  for(const d of dust){

    const t =
      elapsed-d.delay;

    if(t<0 || t>d.life){
      continue;
    }

    const p =
      t/d.life;

    ctx.globalAlpha = 1-p;

    ctx.fillStyle =
      p<.5 ? "#fff" : "#c8efff";

    ctx.beginPath();

    ctx.arc(
      d.x+d.vx*t,
      d.y+d.vy*t+160*t*t,
      d.size*(1-p*.4),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

/* ==============================
   GLASS ANIMATION
============================== */

function flyGlass(){

  return new Promise(resolve=>{

    const started =
      performance.now();

    function frame(now){

      const elapsed =
        (now-started)/1000;

      ctx.clearRect(
        0,0,cw,ch
      );

      for(const shard of shards){

        drawShard(
          shard,
          elapsed
        );
      }

      drawDust(elapsed);

      if(elapsed<1.65){

        frameId =
          requestAnimationFrame(frame);

      }else{

        frameId = null;

        ctx.clearRect(
          0,0,cw,ch
        );

        resolve();
      }
    }

    frameId =
      requestAnimationFrame(frame);
  });
}

function growCracks(from,to,duration){

  return new Promise(resolve=>{

    const started =
      performance.now();

    function frame(now){

      const p = Math.min(
        (now-started)/duration,
        1
      );

      ctx.clearRect(
        0,0,cw,ch
      );

      drawCrackLines(
        from+(to-from)*p
      );

      if(p<1){

        frameId =
          requestAnimationFrame(frame);

      }else{

        frameId = null;
        resolve();
      }
    }

    frameId =
      requestAnimationFrame(frame);
  });
}

============================== */

async function glassBreak(){

  await Promise.all([
    imageLoaded(bgImage),
    imageLoaded(crackImage)
  ]);

  resizeCanvases();

  captureScreen();
  buildCrackMap();
  makeGeometry();

  stopTension();

  glassArea.classList.add("active");

  glassUnder.style.opacity = "0";

  ctx.clearRect(
    0,0,cw,ch
  );

  /*
    ピキッ！ピキッ！パリーン！！
  */

  playGlassSound();

  /* 1回目のヒビ */

  await growCracks(
    0,
    .26,
    360
  );

  await wait(150);

  /* 2回目のヒビ */

  await growCracks(
    .26,
    1.08,
    440
  );

  await wait(130);

  /* 全面破壊 */

  glassArea.classList.add("shake");

  anim(glassLight,"go");

  glassUnder.style.opacity = "1";

  num.style.visibility = "hidden";
  result.style.visibility = "hidden";

  await flyGlass();

  glassArea.classList.remove("shake");
  glassArea.classList.remove("active");

  glassUnder.style.opacity = "0";

  num.style.visibility = "";
  result.style.visibility = "";

  ctx.clearRect(
    0,0,cw,ch
  );

  hideFalseMiss();
  clearNum();

  /*
    最後のフラッシュ後、
    hit()で当たりBGMを再生。
  */

  await flash();
}

function reset(){

  runId++;

    START画面へ戻るときだけ
    当たりBGMも停止する。

  stopMusic();

  busy = false;
  tapReady = false;

  clearNum();
  fxHide();
  hideFalseMiss();

  $("start").style.display = "block";

  $("hit").classList.remove("go");

  $("hitInfo").classList.remove("show");

  $("hitName").textContent = "";

  $("tap").classList.remove("show");

  $("dim").style.opacity = "0";
  black.style.opacity = "0";

  $("flash").classList.remove("flashGo");

  $("slash1").classList.remove("go");
  $("slash2").classList.remove("go");

  glassArea.className = "";
  glassUnder.style.opacity = "0";

  num.style.visibility = "";
  result.style.visibility = "";

  if(frameId!==null){

    cancelAnimationFrame(frameId);

    frameId = null;
  }

  if(ctx){

    ctx.clearRect(
      0,0,cw,ch
    );
  }

  stage.querySelectorAll(
    ".shooting"
  ).forEach(el=>el.remove());
}

   START
============================== */

$("startBtn").onclick = async event=>{

  event.stopPropagation();

  if(busy)return;

  busy = true;
  tapReady = false;

  const id = ++runId;

  $("start").style.display = "none";

  /*
    テスト中は100%当たり。
    通常は1/25。
  */

  const won =
    TEST_MODE ? true : roll(1/25);

  try{

    /*
      ★重要★

      STARTボタンを押した直後、
      awaitする前に音声を有効化。

      iPhoneの自動再生制限対策。
    */

    const audioActivation =
      activateAudio();

    await audioActivation;

    /*
      緊張BGM・当たりBGM・
      ガラス音を読み込む。
    */

    await prepareAudio();

    if(id!==runId)return;

    /*
      音声を読み込めたら
      カウントダウン開始。
    */

    tension();

    if(roll(.28)){

      stars(rnd(2,9));
    }

    if(TEST_MODE){

      /*
        テスト：
        必ず画面破壊で当たり。
      */

      await guaranteedGlassHit();

    }else if(won){

      /*
        通常当たり。
      */

      await regularWinRoute();

    }else{

      /*
        通常ハズレ。
      */

      if(roll(1/2400)){

        await newRoute(
          "preview",
          false
        );

      }else if(roll(.10)){

        const kinds = [
          "freeze",
          "push",
          "promotion",
          "reverse",
          "odd"
        ];

        await newRoute(
          kinds[rnd(0,kinds.length-1)],
          false
        );

      }else{

        await missRoute();
      }
    }

  }catch(error){

    console.error(error);

    if(id===runId){
      reset();
    }
  }
};
