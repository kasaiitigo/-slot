
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17000e">
<title>Red Peanuts 4th Anniversary</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#17000e;color:white;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
body{touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
#stage{
 position:fixed;inset:0;overflow:hidden;
 background:#17000e url("./9E28B31B-C619-4F41-AB55-91C025168D02.png") center top/auto 100% no-repeat;
}
.layer{position:absolute;inset:0;pointer-events:none;opacity:0}
#shade{z-index:15;background:rgba(0,0,0,.7)}
#black{z-index:32;background:#000}
#hitBlack{z-index:33;background:#000}
#whiteFlash{z-index:65;background:white}
#noise{
 z-index:42;
 background:repeating-linear-gradient(0deg,#ffffff24 0 1px,#00000030 2px 4px);
}
#lightning{
 z-index:43;
 background:linear-gradient(118deg,transparent 41%,#fff 45%,#ff45a1 48%,transparent 52%);
 filter:drop-shadow(0 0 15px #ff007b);
}
#glow{
 z-index:19;height:40%;
 background:radial-gradient(ellipse at 50% 20%,#ffffffdc,#ff52ab8c 20%,transparent 60%);
}
#startScreen{position:absolute;inset:0;z-index:10}
#startButton{
 position:absolute;left:50%;bottom:8.5%;
 transform:translateX(-50%);
 width:min(78vw,390px);height:72px;
 border:2px solid white;border-radius:40px;
 background:linear-gradient(#ff6cbb,#d50069);
 box-shadow:0 0 14px #fff8,0 0 30px #ff008b;
 color:#fff;font-size:28px;font-weight:1000;letter-spacing:3px;
}
#probability{
 position:absolute;left:0;bottom:23%;width:100%;
 text-align:center;font-weight:900;
 text-shadow:0 2px 4px #000,0 0 10px #ff208d;
 pointer-events:none;
}
#probability .small{font-size:15px}
#probability .rate{
 font-size:28px;color:#fff2a5;letter-spacing:2px;
 text-shadow:0 2px 3px #000,0 0 12px #ffc400;
}
#expectButton{
 position:absolute;left:50%;bottom:34%;
 transform:translateX(-50%);
 border:1.5px solid white;border-radius:25px;
 background:#570030c9;color:white;
 padding:10px 21px;white-space:nowrap;
 font-size:14px;font-weight:900;
 box-shadow:0 0 15px #ff2c94;
}
#modal{
 display:none;position:fixed;inset:0;z-index:200;
 align-items:center;justify-content:center;
 padding:16px;background:#000d;
}
#modal.open{display:flex}
#modalBox{
 width:min(92vw,430px);max-height:90dvh;overflow-y:auto;
 padding:24px 15px;border:2px solid #ff80bd;
 border-radius:23px;text-align:center;
 background:linear-gradient(#57002f,#190010);
 box-shadow:0 0 20px #ff268e;
}
#modalTitle{
 font-size:26px;font-weight:1000;color:#ffeba0;
 margin-bottom:15px;text-shadow:0 0 12px #ff5b88;
}
.guideRow{
 padding:9px 3px;margin:6px 0;
 border-bottom:1px solid #ffffff25;
 font-size:16px;font-weight:800;
}
.guideRow span{color:#ffe279}
#closeModal{
 margin-top:15px;width:75%;height:46px;
 border:1px solid white;border-radius:24px;
 background:linear-gradient(#ff68b6,#d50067);
 color:white;font-size:17px;font-weight:900;
}
#number{
 position:absolute;z-index:25;
 left:50%;top:61%;width:100%;
 transform:translate(-50%,-50%);
 text-align:center;opacity:0;
 font-size:min(52vw,255px);line-height:1;font-weight:1000;
 color:#fff8fc;
 -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;
 text-shadow:0 6px #d82779,0 12px #a80052,0 18px 9px #31001e;
}
#number.show{opacity:1;animation:numPop .22s ease-out}
#number.gold{
 color:#fff1aa;
 -webkit-text-stroke:clamp(5px,1.6vw,9px) #ffae00;
 text-shadow:0 6px #d48300,0 12px #9d5700,0 0 28px #ffdb30;
}
#number.red{color:#ff3d73}
#number.pink{color:#ffb2d9}
#number.big{font-size:min(67vw,315px)}
#number.question{font-size:min(40vw,190px)}
#number.dots{
 font-size:min(34vw,155px);color:#fff1a2;
 -webkit-text-stroke:3px #ffb600;
 text-shadow:0 0 12px #fff,0 0 30px #ffc000,0 0 50px #ff1887;
}
@keyframes numPop{
 from{transform:translate(-50%,-50%) scale(.72)}
 70%{transform:translate(-50%,-50%) scale(1.09)}
 to{transform:translate(-50%,-50%) scale(1)}
}
#slash1,#slash2{
 position:absolute;z-index:60;left:-25%;top:49%;
 width:150%;height:27px;opacity:0;pointer-events:none;
 transform:rotate(-20deg) scaleX(0);transform-origin:left center;
 background:linear-gradient(90deg,transparent,#fff 12%,#fff 55%,#ff3b98,transparent);
 box-shadow:0 0 12px #fff,0 0 32px #ff1c89,0 0 60px #ff0077;
}
#slash2{top:54%;transform:rotate(17deg) scaleX(0)}
#slash1.go{animation:slashA .35s ease-out}
#slash2.go{animation:slashB .35s ease-out}
@keyframes slashA{
 0%{opacity:0;transform:rotate(-20deg) scaleX(0)}
 25%{opacity:1}
 80%{opacity:1;transform:rotate(-20deg) scaleX(1)}
 100%{opacity:0;transform:rotate(-20deg) scaleX(1.05)}
}
@keyframes slashB{
 0%{opacity:0;transform:rotate(17deg) scaleX(0)}
 25%{opacity:1}
 80%{opacity:1;transform:rotate(17deg) scaleX(1)}
 100%{opacity:0;transform:rotate(17deg) scaleX(1.05)}
}
#hitText{
 position:absolute;z-index:72;
 top:47%;left:50%;width:170%;
 transform:translate(-50%,-50%) scale(.1);
 text-align:center;opacity:0;pointer-events:none;
 font-size:min(43vw,215px);line-height:1.2;
 font-weight:1000;color:#fff3ae;
 -webkit-text-stroke:clamp(5px,1.5vw,9px) #ff245f;
 text-shadow:0 6px #ff9900,0 12px #ae002d,0 0 22px #fff,0 0 50px #ff0068;
}
#hitText.go{animation:hitPop .7s cubic-bezier(.15,.75,.2,1.3) forwards}
@keyframes hitPop{
 0%{opacity:0;transform:translate(-50%,-50%) scale(.08)}
 50%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}
 75%{transform:translate(-50%,-50%) scale(.94)}
 100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
#hitInfo{
 position:absolute;z-index:73;left:5%;top:65%;width:90%;
 text-align:center;opacity:0;pointer-events:none;
 transform:translateY(20px);
}
#hitInfo.show{animation:infoAppear .65s ease-out forwards}
#hitInfoLabel{
 font-size:16px;font-weight:900;
 color:white;text-shadow:0 2px 5px #000;
}
#hitRouteName{
 display:inline-block;margin-top:9px;
 padding:11px 20px;max-width:100%;
 border:1.5px solid #ffe28a;border-radius:15px;
 background:#4a082edb;color:#fff0a8;
 font-size:clamp(16px,5vw,24px);font-weight:1000;
 text-shadow:0 0 12px #ff9e00;
 box-shadow:0 0 16px #ff8c0077;
}
@keyframes infoAppear{
 to{opacity:1;transform:translateY(0)}
}
#tapGuide{
 position:absolute;z-index:74;bottom:9%;left:0;width:100%;
 text-align:center;opacity:0;pointer-events:none;
 font-size:16px;font-weight:900;
 text-shadow:0 2px 4px #000,0 0 12px #ff1688;
}
#tapGuide.show{animation:blink 1.3s infinite}
@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
#missScreen{
 position:absolute;z-index:90;inset:0;display:none;
 flex-direction:column;align-items:center;justify-content:center;
 padding:20px;text-align:center;
 background:#000a;pointer-events:none;
}
#missScreen.show{display:flex}
#closeText{
 opacity:0;font-size:min(14vw,70px);
 font-weight:1000;color:#ffe279;
 text-shadow:0 0 15px #ff9a00,0 3px #a04b00;
}
#closeText.show{animation:appear .4s ease-out forwards}
#missText{
 opacity:0;font-size:min(34vw,170px);line-height:1.15;
 font-weight:1000;color:#fff;
 -webkit-text-stroke:clamp(5px,1.6vw,9px) #d90068;
 text-shadow:0 7px #8e0046,0 0 22px #ff238d;
}
#missText.show{animation:missPop .55s ease-out forwards}
#missMessage{
 opacity:0;margin-top:25px;max-width:95%;
 font-size:clamp(15px,4.5vw,21px);
 line-height:1.65;font-weight:900;
 color:#ffe1a0;text-shadow:0 2px 5px #000;
}
#missMessage.show{animation:appear .6s ease-out forwards}
@keyframes appear{
 from{opacity:0;transform:translateY(12px)}
 to{opacity:1;transform:translateY(0)}
}
@keyframes missPop{
 0%{opacity:0;transform:scale(.2)}
 60%{opacity:1;transform:scale(1.16)}
 100%{opacity:1;transform:scale(1)}
}
.star{
 position:absolute;z-index:44;
 width:4px;height:4px;border-radius:50%;
 background:white;pointer-events:none;
 box-shadow:0 0 8px white,0 0 17px #ff69b6;
}
.star:after{
 content:"";position:absolute;right:0;top:1px;
 width:80px;height:2px;transform:rotate(45deg);
 transform-origin:right center;
 background:linear-gradient(90deg,transparent,#fff);
}
.star.fly{animation:starFly var(--duration) linear forwards}
@keyframes starFly{
 0%{opacity:0;transform:translate(0,0)}
 10%{opacity:1}
 85%{opacity:1}
 100%{opacity:0;transform:translate(var(--dx),var(--dy))}
}
.flashGo{animation:flashGo .28s ease-out}
@keyframes flashGo{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
.lightGo{animation:lightGo .45s ease-out}
@keyframes lightGo{0%{opacity:0}20%{opacity:1}45%{opacity:.1}65%{opacity:1}100%{opacity:0}}
.noiseGo{animation:noiseGo .6s steps(2,end)}
@keyframes noiseGo{0%{opacity:0}20%{opacity:.8}40%{opacity:.2}60%{opacity:.9}100%{opacity:0}}
.glowGo{animation:glowGo .9s ease-out}
@keyframes glowGo{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.shake{animation:shake .5s linear}
@keyframes shake{
 0%,100%{transform:translate(0,0)}
 15%{transform:translate(-12px,8px)}
 30%{transform:translate(13px,-7px)}
 45%{transform:translate(-9px,-5px)}
 60%{transform:translate(10px,7px)}
 75%{transform:translate(-5px,3px)}
}
</style>
</head>
<body>

<div id="stage">
 <div id="shade" class="layer"></div>
 <div id="glow" class="layer"></div>

 <div id="startScreen">
  <button id="expectButton">演出期待度を見る</button>
  <div id="probability">
   <div class="small">完全抽選</div>
   <div class="rate">1 / 25</div>
   <div class="small">毎回独立抽選</div>
  </div>
  <button id="startButton">START</button>
 </div>

 <div id="number"></div>
 <div id="black" class="layer"></div>
 <div id="hitBlack" class="layer"></div>
 <div id="noise" class="layer"></div>
 <div id="lightning" class="layer"></div>
 <div id="slash1"></div>
 <div id="slash2"></div>
 <div id="whiteFlash" class="layer"></div>

 <div id="hitText">当たり</div>
 <div id="hitInfo">
  <div id="hitInfoLabel">✨ 今回の当選演出 ✨</div>
  <div id="hitRouteName"></div>
 </div>
 <div id="tapGuide">画面をタップして戻る</div>

 <div id="missScreen">
  <div id="closeText">惜しい！</div>
  <div id="missText">ハズレ</div>
  <div id="missMessage"></div>
 </div>
</div>

<div id="modal">
 <div id="modalBox">
  <div id="modalTitle">✨ 演出期待度 ✨</div>
  <div class="guideRow">⚡ ピンク稲妻 → <span>チャンス！</span></div>
  <div class="guideRow">❓「？」出現 → <span>チャンス！</span></div>
  <div class="guideRow">✨ 流れ星大量 → <span>期待度UP！</span></div>
  <div class="guideRow">🌑 ブラックアウト → <span>大チャンス！？</span></div>
  <div class="guideRow">🟡 金色変化 → <span>大チャンス！？</span></div>
  <div class="guideRow">🔥「…」出現 → <span>大チャンス！？</span></div>
  <div class="guideRow">⚔️ 斬撃＋「当たり」 → <span>当選確定！</span></div>
  <button id="closeModal">閉じる</button>
 </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const chance=p=>Math.random()<p;

const stage=$("stage");
const number=$("number");
const startScreen=$("startScreen");
const startButton=$("startButton");
const modal=$("modal");
const black=$("black");
const hitBlack=$("hitBlack");
const shade=$("shade");
const lightning=$("lightning");
const noise=$("noise");
const glow=$("glow");
const whiteFlash=$("whiteFlash");
const slash1=$("slash1");
const slash2=$("slash2");
const hitText=$("hitText");
const hitInfo=$("hitInfo");
const hitRouteName=$("hitRouteName");
const tapGuide=$("tapGuide");
const missScreen=$("missScreen");
const closeText=$("closeText");
const missText=$("missText");
const missMessage=$("missMessage");

let playing=false;
let waitingTap=false;
let token=0;
let starTimers=[];

/* 演出期待度 */
$("expectButton").onclick=e=>{
 e.stopPropagation();
 modal.classList.add("open");
};
$("closeModal").onclick=e=>{
 e.stopPropagation();
 modal.classList.remove("open");
};
modal.onclick=e=>{
 if(e.target===modal)modal.classList.remove("open");
};

/* アニメーション */
function animate(el,name){
 el.classList.remove(name);
 void el.offsetWidth;
 el.classList.add(name);
}
function clearNumber(){
 number.className="";
 number.textContent="";
 number.style.opacity="";
}
async function showNumber(text,ms=1100,style=""){
 clearNumber();
 number.textContent=text;
 if(style)number.classList.add(style);
 number.classList.add("show");
 await sleep(ms);
 number.classList.remove("show");
}
async function countdown(){
 await showNumber("3",1250);
 await sleep(190);
 await showNumber("2",1250);
 await sleep(190);
 await showNumber("1",1450);
}
async function quickCount(){
 await showNumber("3",550);
 await showNumber("2",550);
 await showNumber("1",700);
}
async function dots(ms=1700){
 await showNumber("…",ms,"dots");
}
async function blackout(ms=1600){
 black.style.opacity="1";
 await sleep(ms);
 black.style.opacity="0";
}
async function pinkLightning(){
 animate(lightning,"lightGo");
 await sleep(460);
}
async function screenNoise(){
 animate(noise,"noiseGo");
 await sleep(620);
}
async function logoFlash(){
 animate(glow,"glowGo");
 await sleep(900);
}
async function slash(double=false){
 animate(slash1,"go");
 if(double){
  await sleep(115);
  animate(slash2,"go");
 }
 await sleep(390);
}

/* 音楽 */
let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let hitSource=null;
let audioReady=false;

function ensureAudio(){
 if(!audioCtx){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC)audioCtx=new AC();
 }
}
async function loadAudio(){
 if(audioReady||!audioCtx)return;

 const responses=await Promise.all([
  fetch("./Tension.mp3"),
  fetch("./hit_music_final.mp3")
 ]);
 if(responses.some(r=>!r.ok)){
  throw new Error("音源の読み込みに失敗しました");
 }

 const data=await Promise.all(responses.map(r=>r.arrayBuffer()));
 const buffers=await Promise.all(
  data.map(d=>audioCtx.decodeAudioData(d))
 );

 tensionBuffer=buffers[0];
 hitBuffer=buffers[1];
 audioReady=true;
}
function stopTension(){
 if(tensionSource){
  try{tensionSource.stop()}catch(e){}
  tensionSource=null;
 }
}
function stopHit(){
 if(hitSource){
  try{hitSource.stop()}catch(e){}
  hitSource=null;
 }
}
function playBuffer(buffer,loop=false,volume=1){
 if(!audioCtx||!buffer)return null;

 const source=audioCtx.createBufferSource();
 const gain=audioCtx.createGain();

 source.buffer=buffer;
 source.loop=loop;
 gain.gain.value=volume;
 source.connect(gain);
 gain.connect(audioCtx.destination);
 source.start();

 return source;
}
function playTension(){
 stopTension();
 tensionSource=playBuffer(tensionBuffer,true,.72);
}
function playHit(){
 stopHit();
 hitSource=playBuffer(hitBuffer,false,1);
}

/* 流れ星 */
function clearStars(){
 starTimers.forEach(clearTimeout);
 starTimers=[];
 stage.querySelectorAll(".star").forEach(s=>s.remove());
}
function makeStar(id){
 if(id!==token)return;

 const star=document.createElement("div");
 star.className="star";
 star.style.left=rand(-8,55)+"%";
 star.style.top=rand(-5,35)+"%";
 star.style.setProperty("--dx",rand(220,520)+"px");
 star.style.setProperty("--dy",rand(260,620)+"px");
 star.style.setProperty("--duration",rand(700,1250)+"ms");

 stage.appendChild(star);
 requestAnimationFrame(()=>{
  if(id===token)star.classList.add("fly");
  else star.remove();
 });

 starTimers.push(setTimeout(()=>star.remove(),1500));
}
function starBurst(id=token){
 const r=Math.random();
 const count=r<.75?rand(1,3):r<.95?rand(4,6):rand(7,10);

 for(let i=0;i<count;i++){
  starTimers.push(
   setTimeout(()=>makeStar(id),i*rand(80,170))
  );
 }
}
function scheduleStars(id){
 if(!chance(.27))return;

 starTimers.push(setTimeout(()=>{
  if(id===token)starBurst(id);
 },rand(850,3900)));

 if(chance(.15)){
  starTimers.push(setTimeout(()=>{
   if(id===token)starBurst(id);
  },rand(4200,6800)));
 }
}

/* 当たり画面 */
async function showHit(routeName,options={}){
 stopTension();
 clearNumber();

 await sleep(options.silence??650);

 hitBlack.style.opacity="1";
 await sleep(310);
 hitBlack.style.opacity="0";
 await sleep(80);

 animate(stage,"shake");
 animate(whiteFlash,"flashGo");
 await slash(options.double??chance(.25));

 animate(whiteFlash,"flashGo");
 animate(hitText,"go");
 playHit();

 /* 「当たり！」の後に演出名を表示 */
 await sleep(1050);

 hitRouteName.textContent=routeName;
 animate(hitInfo,"show");

 await sleep(450);
 waitingTap=true;
 tapGuide.classList.add("show");
}

/* ハズレ画面 */
async function showMiss(strong=false){
 stopTension();
 clearNumber();
 black.style.opacity="0";
 shade.style.opacity="0";

 closeText.classList.remove("show");
 missText.classList.remove("show");
 missMessage.classList.remove("show");

 missMessage.innerHTML=strong
  ?"今の演出は熱かった…！🔥<br>次のチャレンジに期待✨"
  :"またのチャレンジをお待ちしてます✨";

 missScreen.classList.add("show");

 if(strong){
  animate(closeText,"show");
  await sleep(550);
 }

 animate(missText,"show");
 await sleep(800);
 animate(missMessage,"show");

 await sleep(2500);
 resetGame();
}

/*
  44種類の当たり演出。
  18、27～31番が「…」を出す激アツルート。
*/
const hitNames=[
 "3からの即当たり",
 "2からの即当たり",
 "1からの直撃",
 "王道カウントダウン",
 "ブラックアウト直撃",
 "2で停止",
 "カウントダウン逆転",
 "0出現プレミア",
 "数字消失",
 "無音からの復活",
 "1ロング停止",
 "カウントダウン再始動",
 "ダブルカウントダウン",
 "プチュン暗転",
 "ブラックアウト再始動",
 "斬撃フェイント復活",
 "変則カウントダウン",
 "無音カウントダウン",
 "激アツ・沈黙からの復活",
 "数字飛ばし",
 "1消失からの復活",
 "2への巻き戻し",
 "高速カウントダウン",
 "ダブル斬撃",
 "突然の静寂",
 "？出現からの当たり",
 "ブラックアウト復活",
 "激アツ・沈黙直撃",
 "激アツ・1復活",
 "激アツ・暗転復活",
 "激アツ・流れ星復活",
 "激アツ・長い沈黙",
 "巨大数字変化",
 "数字ひび割れ",
 "ピンク稲妻",
 "ノイズ発生",
 "金色変化",
 "超ロング1",
 "？出現",
 "背景暗転",
 "カウントダウン停止",
 "無音消失",
 "カウントダウンやり直し",
 "ロゴ発光"
];

/* 当たり演出の個別ルート */
async function runHitRoute(i){
 switch(i){
  case 0:
   await showNumber("3",900);
   break;

  case 1:
   await showNumber("3",1100);
   await showNumber("2",900);
   break;

  case 2:
   await showNumber("3",1100);
   await showNumber("2",1100);
   await showNumber("1",850);
   break;

  case 3:
   await countdown();
   await sleep(550);
   break;

  case 4:
   await countdown();
   await blackout(rand(1500,2300));
   break;

  case 5:
   await showNumber("3",1150);
   await showNumber("2",rand(2600,3400));
   break;

  case 6:
   await countdown();
   await showNumber("2",750);
   break;

  case 7:
   await countdown();
   await showNumber("0",800,"gold");
   break;

  case 8:
   await showNumber("3");
   await showNumber("2");
   await showNumber("1",700);
   await sleep(1800);
   break;

  case 9:
   await showNumber("3");
   await showNumber("2");
   stopTension();
   await showNumber("1",1600);
   await sleep(1800);
   break;

  case 10:
   await showNumber("3");
   await showNumber("2");

/*
  抽選仕様

  当たり：毎回 1/25
  「…」当たり演出：44種類中6種類
  「…」ハズレ演出：ハズレ時704分の1

  P(当たり | 「…」出現)
  = (1/25 × 6/44)
    ÷ [(1/25 × 6/44)+(24/25 × 1/704)]
  = 80%

  演出抽選によって全体の1/25は変化しない。
*/
async function runMissRoute(){
 if(chance(1/704)){
  await dotsHotMiss();
  return;
 }

 if(chance(.36)){
  await commonMiss(rand(0,11));
  return;
 }

 const r=Math.random();

 if(r<.50){
  await normalMiss();
 }else if(r<.75){
  await weakFake(rand(0,9));
 }else{
  await strongFake(rand(0,5));
 }
}

/* START画面へ戻る */
function resetGame(){
 token++;
 stopTension();
 stopHit();
 clearStars();
 clearNumber();

 black.style.opacity="0";
 hitBlack.style.opacity="0";
 shade.style.opacity="0";

 hitText.classList.remove("go");
 hitInfo.classList.remove("show");
 hitRouteName.textContent="";
 tapGuide.classList.remove("show");

 missScreen.classList.remove("show");
 closeText.classList.remove("show");
 missText.classList.remove("show");
 missMessage.classList.remove("show");
 missMessage.textContent="";

 stage.classList.remove("shake");
 lightning.classList.remove("lightGo");
 noise.classList.remove("noiseGo");
 glow.classList.remove("glowGo");
 whiteFlash.classList.remove("flashGo");
 slash1.classList.remove("go");
 slash2.classList.remove("go");

 waitingTap=false;
 playing=false;
 startScreen.style.display="block";
}

/* 当たり後、画面タップでSTARTに戻る */
stage.addEventListener("click",()=>{
 if(waitingTap)resetGame();
});

/* START */
startButton.addEventListener("click",async e=>{
 e.stopPropagation();
 if(playing)return;

 playing=true;
 waitingTap=false;
 token++;
 const currentToken=token;

 startScreen.style.display="none";
 clearStars();

 /*
   STARTごとに1回だけ当選抽選。
   演出抽選とは完全に分離。
 */
 const win=chance(1/25);

 try{
  ensureAudio();

  if(audioCtx){
   await Promise.all([
    audioCtx.resume(),
    loadAudio()
   ]);
  }
 }catch(err){
  console.warn("音楽を読み込めませんでした:",err);
 }

 if(currentToken!==token)return;

 playTension();
 scheduleStars(currentToken);

 try{
  if(win){
   const route=rand(0,43);
   await runHitRoute(route);
  }else{
   await runMissRoute();
  }
 }catch(err){
  console.error("ゲームエラー:",err);
  resetGame();
 }
});
