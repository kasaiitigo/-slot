
<!DOCTYPE html>

<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#170010;color:#fff;font-family:system-ui,'Hiragino Kaku Gothic ProN',sans-serif}
button{cursor:pointer;font:inherit}
#stage{position:fixed;inset:0;overflow:hidden;background:#170010 url('./9E28B31B-C619-4F41-AB55-91C025168D02.png') center top/auto 100% no-repeat}

#startBtn{position:absolute;bottom:8.5%;left:50%;transform:translateX(-50%);width:min(80vw,390px);height:70px;border:2px solid #fff;border-radius:45px;background:linear-gradient(#ff78c4,#d00068);color:#fff;font-size:28px;font-weight:1000;box-shadow:0 0 28px #ff008d}
#rate{position:absolute;bottom:23%;width:100%;text-align:center;font-weight:900;text-shadow:0 2px 7px #000}

#dim,#black,#flash,#lightning,#noise{position:absolute;inset:0;opacity:0;pointer-events:none}
#dim{z-index:9;background:#0009}
#black{z-index:24;background:#000}
#noise{z-index:27;background:repeating-linear-gradient(0deg,#fff6 0 2px,#0005 2px 5px)}
#lightning{z-index:28;background:linear-gradient(120deg,transparent 42%,white 47%,#ff5db6 49%,transparent 54%);filter:drop-shadow(0 0 24px #ff1494)}
#flash{z-index:50;background:#fff}
#num{position:absolute;z-index:15;top:61%;left:50%;width:100%;text-align:center;transform:translate(-50%,-50%);font-size:min(52vw,255px);line-height:1.1;font-weight:1000;color:#fff;-webkit-text-stroke:clamp(5px,1.5vw,9px) #ff4b9d;text-shadow:0 7px #ae0054,0 14px 10px #370018;opacity:0;pointer-events:none}
#num.show{opacity:1;animation:pop .25s ease-out}
#num.gold{color:#fff1a8;-webkit-text-stroke:6px #f4a000;text-shadow:0 0 30px #ffd100}
#num.dots{font-size:min(34vw,155px);color:#fff1a8;-webkit-text-stroke:3px #f4a000}
#num.question{font-size:min(40vw,190px)}
#num.big{font-size:min(65vw,300px)}

#num.nocount{width:94%;font-size:clamp(31px,9vw,56px);letter-spacing:-.05em;white-space:nowrap;-webkit-text-stroke:2px #ff4b9d;text-shadow:0 4px #ae0054,0 0 15px #ff65b7}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6)}75%{transform:translate(-50%,-50%) scale(1.1)}to{transform:translate(-50%,-50%) scale(1)}}
#result{position:absolute;z-index:30;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;background:#000a;text-align:center;pointer-events:none}
#result.show{display:flex}
#near{font-size:clamp(26px,9vw,56px);font-weight:1000;color:#ffe18d;text-shadow:0 0 18px #ff8a00}
#mainResult{position:relative;display:inline-block;white-space:nowrap;max-width:100%;font-size:clamp(42px,15vw,82px);line-height:1.2;letter-spacing:-.05em;font-weight:1000;color:white;-webkit-text-stroke:clamp(2px,.8vw,4px) #e00073;text-shadow:0 5px #8e0044,0 0 18px #ff379a}
#mainResult.appear{animation:resultPop .55s ease-out}
#message{font-size:clamp(14px,4vw,20px);font-weight:900;color:#ffe5aa;line-height:1.7;margin-top:12px;text-shadow:0 2px 5px #000}
#message:empty{display:none}
@keyframes resultPop{from{opacity:0;transform:scale(.3)}65%{transform:scale(1.1)}to{opacity:1;transform:scale(1)}}
#cracks{position:absolute;inset:-7%;width:114%;height:114%;opacity:0;pointer-events:none;filter:drop-shadow(0 0 2px #000) drop-shadow(0 0 5px white)}
#cracks.show{opacity:1;animation:crack .55s steps(3,end)}
@keyframes crack{from{opacity:0}to{opacity:1}}
#result.shaking #mainResult{animation:shake .12s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,5px)}50%{transform:translate(7px,-5px)}75%{transform:translate(-5px,-7px)}}
.slash{position:absolute;z-index:48;left:-30%;top:48%;width:160%;height:22px;opacity:0;pointer-events:none;transform-origin:left center;background:linear-gradient(90deg,transparent,#ff87c9 10%,white 30%,white 75%,#ff1785,transparent);box-shadow:0 0 13px #fff,0 0 35px #ff0087}
#slash1{transform:rotate(-22deg) scaleX(0)}
#slash2{transform:rotate(19deg) scaleX(0)}
#slash1.go{animation:slashA .4s ease-out}
#slash2.go{animation:slashB .4s ease-out}
@keyframes slashA{0%{opacity:0;transform:rotate(-22deg) scaleX(0)}25%,75%{opacity:1}100%{opacity:0;transform:rotate(-22deg) scaleX(1)}}
@keyframes slashB{0%{opacity:0;transform:rotate(19deg) scaleX(0)}25%,75%{opacity:1}100%{opacity:0;transform:rotate(19deg) scaleX(1)}}
#hit{position:absolute;z-index:60;top:46%;left:50%;width:100%;text-align:center;white-space:nowrap;opacity:0;transform:translate(-50%,-50%) scale(.1);pointer-events:none;font-size:clamp(65px,23vw,155px);line-height:1.2;font-weight:1000;color:#fff2a8;-webkit-text-stroke:clamp(4px,1.2vw,7px) #ff266b;text-shadow:0 6px #ff9b00,0 12px #a90043,0 0 28px #fff}
#hit.go{animation:hitPop .7s cubic-bezier(.16,.7,.2,1.2) forwards}
@keyframes hitPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}55%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#hitInfo{position:absolute;z-index:61;top:65%;left:4%;width:92%;text-align:center;opacity:0;pointer-events:none;font-weight:900;text-shadow:0 2px 5px #000}
#hitInfo.show{animation:info .6s forwards}
#hitName{display:inline-block;margin-top:9px;padding:10px 18px;max-width:100%;border:1px solid #ffe391;border-radius:14px;background:#530b33e8;color:#ffec9c;font-size:clamp(15px,4.8vw,24px)}
@keyframes info{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
#tap{position:absolute;z-index:62;bottom:9%;width:100%;text-align:center;opacity:0;pointer-events:none;text-shadow:0 2px 5px black}
#tap.show{animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
.particle{position:absolute;z-index:47;pointer-events:none;color:#fff;font-size:25px;text-shadow:0 0 12px #fff,0 0 20px #ff2194;animation:fly 1.1s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.2)}}
.shooting{position:absolute;z-index:26;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 25px #ff62b9;pointer-events:none;animation:shoot .9s linear forwards}
.shooting:after{content:'';position:absolute;right:0;top:2px;width:75px;height:2px;background:linear-gradient(90deg,transparent,#fff)}
@keyframes shoot{from{opacity:0;transform:translate(0,0)}20%{opacity:1}to{opacity:0;transform:translate(240px,370px)}}
.flashGo{animation:fl .35s}
.lightGo{animation:fl .55s}
.noiseGo{animation:fl .6s}
@keyframes fl{0%,100%{opacity:0}40%{opacity:1}}

#specialFX.freeze{background:#000}

#specialFX .fxButton{pointer-events:auto;border:3px solid #ffdf78;border-radius:50%;width:min(59vw,245px);height:min(59vw,245px);background:url('./BF43324D-F195-4E15-A371-AA8862724654.png') center/contain no-repeat !important;box-shadow:0 0 25px #f80,0 0 50px #d00;color:transparent;text-shadow:none;animation:fxPulse .45s infinite alternate;cursor:pointer}
#specialFX.promotion{background:radial-gradient(circle,#ffe2a1 0%,#bc6900 28%,#380c19 74%,#100516)}
#specialFX.promotion .fxTitle{color:#fff4b0;-webkit-text-stroke:2px #ad4800}
@keyframes fxPulse{from{transform:scale(.96);filter:brightness(.85)}to{transform:scale(1.04);filter:brightness(1.3)}}
@keyframes fxHue{to{filter:hue-rotate(360deg)}}
#glassCanvas{position:absolute;inset:0;z-index:56;width:100%;height:100%;pointer-events:none;display:none}
#glassCanvas.visible{display:block}
#stage.glassShake{animation:glassShake .09s linear 5}
@keyframes glassShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-4px)}}

/* 追加画像2枚のスマホ表示設定 */
#gachaImageOverlay{position:fixed;inset:0;z-index:160;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.85);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#gachaImageOverlay.show{display:flex}
#gachaImageOverlay img{display:block;width:100%;height:100%;max-width:100vw;max-height:100dvh;object-fit:contain;object-position:center}
</style>

<script>
'use strict';
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,roll=p=>Math.random()<p;
const gachaImageFiles={
 question:'./65259064-963F-4279-821D-D0B5522E9088.png',
 confirmed:'./1C6E2850-6FE4-456A-92BB-2F098BD8A210.png'
};
function showGachaImage(kind){
 const root=$('gachaImageOverlay'),img=$('gachaImage');
 img.src=gachaImageFiles[kind];
 img.alt=kind==='question'?'ガチャガチャ？':'ガチャガチャ1回確定';
 root.classList.add('show');
}
function hideGachaImage(){$('gachaImageOverlay').classList.remove('show')}
const stage=$('stage'),num=$('num'),result=$('result'),near=$('near'),main=$('mainResult'),message=$('message'),black=$('black');
let busy=false,tapReady=false,session=0,audioCtx=null,tensionBuf=null,hitBuf=null,tensionSource=null,hitSource=null,audioLoading=null;
const winNames=[
'ハズレからブラックアウト復活','ノーカン！？再チャレンジ','ハズレ粉砕・復活','ダブルノーカン大逆転',
'ブラックアウト直撃','2で停止','カウントダウン逆転','0出現プレミア','数字消失','無音からの復活',
'1ロング停止','カウントダウン再始動','ダブルカウントダウン','プチュン暗転','ブラックアウト再始動',
'斬撃フェイント復活','変則カウントダウン','無音カウントダウン','沈黙からの復活','数字飛ばし',
'1消失からの復活','2への巻き戻し','高速カウントダウン','ダブル斬撃','突然の静寂',
'？出現からの当たり','ブラックアウト復活','「…」直撃','「…」からの復活','「…」暗転復活',
'「…」流れ星復活','「…」長い沈黙','巨大数字変化','数字色変化','ピンク稲妻',
'ノイズ発生','金色変化','超ロング1','？出現','背景暗転','カウントダウン停止',
'無音消失','カウントダウンやり直し','ロゴ発光'
];
function anim(el,c){el.classList.remove(c);void el.offsetWidth;el.classList.add(c)}
function clearNum(){num.textContent='';num.className='';num.style.opacity=''}
async function digit(s,t=1050,c=''){
 clearNum();num.textContent=s;
 if(c)num.classList.add(c);
 num.classList.add('show');
 if(s==='?'||s==='？')showGachaImage('question');
 await wait(t);
 if(s==='?'||s==='？')hideGachaImage();
 num.classList.remove('show');
}
async function count(){await digit('3',1100);await wait(150);await digit('2',1100);await wait(150);await digit('1',1250)}
async function fastCount(){await digit('3',500);await digit('2',500);await digit('1',650)}
async function dots(){await digit('…',1700,'dots')}
async function blackout(t=1400){black.style.opacity='1';await wait(t);black.style.opacity='0'}
async function flash(){anim($('flash'),'flashGo');await wait(340)}
async function lightning(){anim($('lightning'),'lightGo');await wait(560)}
async function noise(){anim($('noise'),'noiseGo');await wait(630)}
async function slashes(){anim($('slash1'),'go');await wait(135);anim($('slash2'),'go');await wait(320)}
function stars(n=8){
 for(let i=0;i<n;i++)setTimeout(()=>{
  if(!busy)return;
  let s=document.createElement('div');
  s.className='shooting';
  s.style.left=rnd(0,65)+'%';
  s.style.top=rnd(0,35)+'%';
  stage.append(s);
  setTimeout(()=>s.remove(),1000);
 },i*85);
}
function fragments(){
 const glyphs=['◆','✦','◈','✧','★'];
 for(let i=0;i<40;i++){
  let e=document.createElement('div');
  e.className='particle';
  e.textContent=glyphs[rnd(0,glyphs.length-1)];
  e.style.left=rnd(33,65)+'%';
  e.style.top=rnd(35,57)+'%';
  e.style.setProperty('--dx',rnd(-260,260)+'px');
  e.style.setProperty('--dy',rnd(-310,310)+'px');
  e.style.setProperty('--rot',rnd(-500,500)+'deg');
  stage.append(e);
  setTimeout(()=>e.remove(),1150);
 }
}
const fx=$('specialFX');
function fxShow(mode,title,sub=''){
 fx.className='active '+mode;
 fx.querySelector('.fxTitle').textContent=title;
 fx.querySelector('.fxSub').textContent=sub;
}
function fxHide(){
 fx.className='';
 fx.querySelector('.fxTitle').textContent='';
 fx.querySelector('.fxSub').textContent='';
 fx.querySelectorAll('button').forEach(b=>b.remove());
}
async function fxFreeze(){stopTension();fxShow('freeze','……','フリーズ');await wait(2200);fxHide();tension()}
async function fxPreview(){
 await blackout(450);
 fxShow('preview','次回予告','運命の瞬間が迫る');
 await wait(2300);
 fxHide();
 showGachaImage('confirmed');
 await wait(1700);
 hideGachaImage();
}
async function fxRainbow(){fxShow('rainbow','虹色爆発！！','当たり確定');fragments();await wait(2300);fxHide()}
async function fxPromotion(){
 await digit('3',700);
 await digit('2',650,'red');
 await digit('1',1000,'gold');
 fxShow('promotion','昇 格！！','');
 await wait(1000);
 fxHide();
}
async function fxReverse(){
 await digit('3',650);
 await digit('2',650);
 await digit('1',650);
 await noise();
 await digit('2',700,'red');
 await digit('3',800,'gold');
}

let glassFrame=0;
async function fxBreak(){
 const canvas=$('glassCanvas'),ctx=canvas.getContext('2d');
 if(!ctx){await slashes();fragments();return}
 const W=canvas.width=Math.max(1,Math.round(stage.clientWidth*devicePixelRatio));
 const H=canvas.height=Math.max(1,Math.round(stage.clientHeight*devicePixelRatio));
 const cx=W*.5,cy=H*.48,d=Math.max(W,H);
 const rayCount=21;
 const radii=[0,.14,.37,.72,1.3];
 const theta=Array.from({length:rayCount},(_,i)=>i*Math.PI*2/rayCount+(Math.random()-.5)*.11);
 const coords=radii.map((rad,k)=>theta.map((a,i)=>({
  x:cx+Math.cos(a+Math.sin(i*4+k)*.08)*d*rad*.65,
  y:cy+Math.sin(a+Math.cos(i*3+k)*.09)*d*rad*.65
 })));
 const shards=[];
 for(let ring=0;ring<radii.length-1;ring++)for(let i=0;i<rayCount;i++){
  const n=(i+1)%rayCount;
  const vertices=[coords[ring][i],coords[ring][n],coords[ring+1][n],coords[ring+1][i]];
  const center=vertices.reduce((a,p)=>({x:a.x+p.x/4,y:a.y+p.y/4}),{x:0,y:0});
  const angle=Math.atan2(center.y-cy,center.x-cx);
  shards.push({vertices,center,angle,spd:.25+Math.random()*.8,rot:(Math.random()-.5)*3,shade:Math.random()});
 }
 canvas.classList.add('visible');
 const t0=performance.now();
 await new Promise(resolve=>{
  const draw=now=>{
   const elapsed=now-t0;
   ctx.clearRect(0,0,W,H);
   if(elapsed<1050){
    const progress=elapsed<260?.25:elapsed<650?.60:1;
    ctx.fillStyle='rgba(3,4,12,.10)';
    ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.shadowBlur=14*devicePixelRatio;
    ctx.shadowColor='#d6f5ff';
    ctx.lineWidth=2.2*devicePixelRatio;
    ctx.strokeStyle='rgba(245,251,255,.96)';
    const maxR=(radii.length-1)*progress;
    for(let i=0;i<rayCount;i++){
     ctx.beginPath();
     ctx.moveTo(cx,cy);
     for(let ring=1;ring<=Math.ceil(maxR)&&ring<radii.length;ring++){
      const p=coords[ring][i],old=coords[ring-1][i];
      const fract=Math.min(1,Math.max(0,maxR-(ring-1)));
      ctx.lineTo(old.x+(p.x-old.x)*fract,old.y+(p.y-old.y)*fract);
     }
     ctx.stroke();
    }
    for(let ring=1;ring<radii.length;ring++){
     if(ring>maxR+.2)break;
     for(let i=0;i<rayCount;i++){
      const p=coords[ring][i],q=coords[ring][(i+1)%rayCount];
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();
     }
    }
    ctx.restore();
   }else{
    const p=Math.min(1,(elapsed-1050)/930);
    for(const sh of shards){
     const dist=d*.33*p*p*sh.spd;
     const dx=Math.cos(sh.angle)*dist;
     const dy=Math.sin(sh.angle)*dist+d*.08*p*p;
     ctx.save();
     ctx.globalAlpha=Math.max(0,1-p*.97);
     ctx.translate(sh.center.x+dx,sh.center.y+dy);
     ctx.rotate(sh.rot*p);
     ctx.beginPath();
     sh.vertices.forEach((v,j)=>j?ctx.lineTo(v.x-sh.center.x,v.y-sh.center.y):ctx.moveTo(v.x-sh.center.x,v.y-sh.center.y));
     ctx.closePath();
     ctx.fillStyle=`rgba(185,218,245,${.1+sh.shade*.16})`;
     ctx.fill();
     ctx.lineWidth=2*devicePixelRatio;
     ctx.strokeStyle='rgba(255,255,255,.94)';
     ctx.stroke();
     ctx.restore();
    }
    if(p<.28){
     ctx.fillStyle=`rgba(255,255,255,${(.28-p)*2})`;
     ctx.fillRect(0,0,W,H);
    }
   }
   if(elapsed<2000){glassFrame=requestAnimationFrame(draw)}
   else resolve();
  };
  glassFrame=requestAnimationFrame(draw);
 });
 cancelAnimationFrame(glassFrame);
 ctx.clearRect(0,0,W,H);
 canvas.classList.remove('visible');
 stage.classList.remove('glassShake');
}
async function fxPush(big=false){
 fxShow('push',big?'最終決戦！':'運命の一押し','ボタンを押せ！');
 const button=document.createElement('button');
 button.className='fxButton';
 button.textContent='PUSH';
 button.setAttribute('aria-label','結果を表示');
 fx.append(button);
 await new Promise(resolve=>{
  let done=false;
  const finish=()=>{if(done)return;done=true;resolve()};
  button.addEventListener('click',e=>{e.stopPropagation();finish()},{once:true});
  setTimeout(finish,12000);
 });
 fxHide();
 await flash();
}
async function surpriseGlass(){
 switch(rnd(0,7)){
  case 0:break;
  case 1:await digit('3',520);break;
  case 2:await digit('3',520);await digit('2',520);break;
  case 3:await fastCount();break;
  case 4:await count();await wait(900);break;
  case 5:await count();await falseMissPause(1100);break;
  case 6:await count();await falseMissPause(750);await noCount();break;
  case 7:await count();await fxPush();break;
 }
 await fxBreak();
 hideFalseMiss();
}
async function newRoute(kind,won){
 switch(kind){
  case 'freeze':await count();await fxFreeze();break;
  case 'preview':await count();await fxPreview();break;
  case 'push':await count();await fxPush(true);break;
  case 'promotion':await fxPromotion();break;
  case 'rainbow':await fxFreeze();await fxRainbow();break;
  case 'reverse':await fxReverse();break;
  case 'break':await surpriseGlass();break;
  case 'odd':await digit('3');await wait(800);await digit('3',750,'red');await fxFreeze();break;
  case 'rainbowBurst':await fxRainbow();break;
 }
 if(won)await hit(({
  freeze:'フリーズ',
  preview:'次回予告',
  push:'デカPUSH',
  promotion:'カウントダウン昇格',
  rainbow:'レインボーフリーズ',
  reverse:'逆転カウント',
  break:'画面破壊',
  odd:'違和感',
  rainbowBurst:'虹色爆発'
 })[kind]);
 else await miss(true);
}
function stopSource(src){if(src)try{src.stop()}catch(e){}}
function stopMusic(){stopSource(tensionSource);stopSource(hitSource);tensionSource=hitSource=null}
async function prepareAudio(){
 try{
  if(!audioCtx){
   let AC=window.AudioContext||window.webkitAudioContext;
   if(!AC)return;
   audioCtx=new AC();
  }
  await audioCtx.resume();
  if(!audioLoading)audioLoading=Promise.all(
   ['./Tension.mp3','./hit_music_final.mp3'].map(async u=>{
    let r=await fetch(u);
    if(!r.ok)throw Error(u);
    return audioCtx.decodeAudioData(await r.arrayBuffer());
   })
  ).then(a=>{[tensionBuf,hitBuf]=a}).catch(e=>console.warn('音声ファイル未読込',e));
  await audioLoading;
 }catch(e){console.warn(e)}
}
function play(buf,loop=false){
 if(!audioCtx||!buf)return null;
 let s=audioCtx.createBufferSource(),g=audioCtx.createGain();
 s.buffer=buf;s.loop=loop;g.gain.value=loop?.7:1;
 s.connect(g);g.connect(audioCtx.destination);s.start();
 return s;
}
function tension(){stopSource(tensionSource);tensionSource=play(tensionBuf,true)}
function stopTension(){stopSource(tensionSource);tensionSource=null}
function showFalseMiss(){
 result.classList.add('show');
 near.textContent='';
 message.textContent='';
 main.style.opacity='1';
 $('cracks').classList.remove('show');
 result.classList.remove('shaking');
 anim(main,'appear');
}
function hideFalseMiss(){
 result.classList.remove('show','shaking');
 main.classList.remove('appear');
 $('cracks').classList.remove('show');
 main.style.opacity='1';
}
async function miss(strong=false){
 stopTension();clearNum();
 black.style.opacity='0';
 $('dim').style.opacity='0';
 showFalseMiss();
 near.textContent=strong?'惜しい！':'';
 message.innerHTML=strong?'今の演出は熱かった…！🔥<br>次のチャレンジに期待✨':'またのチャレンジをお待ちしてます✨';
 await wait(3100);
 reset();
}
async function hit(name){
 stopTension();
 hideFalseMiss();
 clearNum();
 await wait(400);
 await blackout(300);
 await flash();
 await slashes();
 anim($('hit'),'go');
 hitSource=play(hitBuf);
 await wait(1000);
 $('hitName').textContent=name;
 anim($('hitInfo'),'show');
 await wait(450);
 tapReady=true;
 $('tap').classList.add('show');
}
async function falseMissPause(ms=1700){showFalseMiss();await wait(ms)}
async function noCount(){
 hideFalseMiss();
 await noise();
 await digit('ノーカン！？',1300,'nocount');
 await fastCount();
}
async function revivalBlack(){await count();await falseMissPause(1850);await blackout(1700);await hit(winNames[0])}
async function revivalNoCount(won){
 await count();await falseMissPause(1500);await noCount();
 if(won)await hit(winNames[1]);else await miss(true);
}
async function revivalCrack(){
 await count();await falseMissPause(1600);
 anim($('cracks'),'show');
 await wait(650);
 result.classList.add('shaking');
 await wait(900);
 await fxBreak();
 result.classList.remove('shaking');
 main.style.opacity='0';
 await flash();
 await blackout(550);
 await hit(winNames[2]);
}
async function revivalDouble(won){
 await count();await falseMissPause(1200);await noCount();
 await falseMissPause(1150);await noCount();
 if(won)await hit(winNames[3]);else await miss(true);
}
async function common(i){
 switch(i){
  case 0:await count();await digit('1',1500,'big');break;
  case 1:await count();await digit('1',900,'red');break;
  case 2:await count();await lightning();break;
  case 3:await digit('3');await noise();await digit('2');await digit('1');break;
  case 4:await digit('3',700);await digit('3',450,'red');await digit('3',700,'gold');break;
  case 5:await digit('3');await digit('2');await digit('1',3700);break;
  case 6:await count();await digit('?',1200,'question');break;
  case 7:$('dim').style.opacity='1';await count();$('dim').style.opacity='0';break;
  case 8:await digit('3');await digit('2');await digit('2',700);await digit('1');break;
  case 9:await count();stopTension();await wait(1700);break;
  case 10:await count();await wait(950);await fastCount();break;
  case 11:await digit('3');await flash();await digit('2');await digit('1');break;
 }
}
async function winRoute(i){
 if(i===0)return revivalBlack();
 if(i===1)return revivalNoCount(true);
 if(i===2)return revivalCrack();
 if(i===3)return revivalDouble(true);
 switch(i){
  case 4:await count();await blackout(1600);break;
  case 5:await digit('3');await digit('2',3100);break;
  case 6:await count();await digit('2',800);break;
  case 7:await count();await digit('0',800,'gold');break;
  case 8:await count();await wait(1700);break;
  case 9:await digit('3');await digit('2');stopTension();await digit('1',1500);await wait(1200);break;
  case 10:await digit('3');await digit('2');await digit('1',3600);break;
  case 11:await count();await fastCount();break;
  case 12:await fastCount();await fastCount();break;
  case 13:await count();stopTension();await blackout(2300);break;
  case 14:await count();await blackout(1600);await fastCount();break;
  case 15:await count();await slashes();await digit('1');break;
  case 16:await digit('3');await digit('1');await digit('2');break;
  case 17:stopTension();await count();break;
  case 18:await count();await dots();await digit('1',850);break;
  case 19:await digit('3');await digit('1');break;
  case 20:await count();await wait(1800);break;
  case 21:await count();await digit('2');break;
  case 22:await fastCount();break;
  case 23:await count();await slashes();break;
  case 24:await digit('3');stopTension();await wait(1100);await digit('2');await digit('1');break;
  case 25:await count();await digit('?',1000,'question');break;
  case 26:await count();await blackout(1600);await digit('1');break;
  case 27:await count();await dots();break;
  case 28:await count();await dots();await digit('1');break;
  case 29:await count();await dots();await blackout(1500);break;
  case 30:await count();await dots();stars(12);await wait(1000);break;
  case 31:await count();stopTension();await dots();await wait(2100);break;
  default:await common(i-32);
 }
 await hit(winNames[i]);
}
async function weakMiss(i){
 switch(i){
  case 0:await digit('3');await digit('2',2900);await digit('1');break;
  case 1:await digit('3');await digit('2');await digit('1',3200);break;
  case 2:await count();await digit('1',750,'red');break;
  case 3:stopTension();await count();await wait(1300);break;
  case 4:await count();await blackout(550);break;
  case 5:await digit('3',3000);await digit('2');await digit('1');break;
  case 6:await digit('3');await digit('2',650,'red');await digit('1');break;
  case 7:await count();await digit('0',500);break;
  case 8:await count();await wait(950);break;
  case 9:await fastCount();await wait(900);
 }
 await miss(false);
}
async function strongMiss(i){
 switch(i){
  case 0:await count();await slashes();break;
  case 1:await count();await blackout(1800);break;
  case 2:await digit('3');await digit('2');await digit('1',2700,'gold');break;
  case 3:await count();await slashes();await flash();break;
  case 4:await count();await blackout(1600);await digit('1',1900);break;
  case 5:await count();await digit('1',1000,'gold');await wait(1900);
 }
 await miss(true);
}
async function dotsMiss(){
 await count();await dots();
 switch(rnd(0,3)){
  case 0:await wait(1400);break;
  case 1:await blackout(1500);break;
  case 2:await digit('1',1100);break;
  case 3:stars(10);await wait(1300);
 }
 await miss(true);
}
async function missRoute(){
 if(roll(1/704))return dotsMiss();
 let r=Math.random();
 if(r<.08)return revivalNoCount(false);
 if(r<.105)return revivalDouble(false);
 if(r<.36){await common(rnd(0,11));return miss(false)}
 if(r<.66){await count();return miss(false)}
 if(r<.84)return weakMiss(rnd(0,9));
 return strongMiss(rnd(0,5));
}
function reset(){
 hideGachaImage();
 cancelAnimationFrame(glassFrame);
 $('glassCanvas').classList.remove('visible');
 fxHide();session++;stopMusic();busy=false;tapReady=false;
 clearNum();hideFalseMiss();
 $('start').style.display='block';
 $('hit').classList.remove('go');
 $('hitInfo').classList.remove('show');
 $('hitName').textContent='';
 $('tap').classList.remove('show');
 $('dim').style.opacity='0';
 black.style.opacity='0';
 $('flash').classList.remove('flashGo');
 $('slash1').classList.remove('go');
 $('slash2').classList.remove('go');
 stage.querySelectorAll('.particle,.shooting').forEach(e=>e.remove());
}
$('guideBtn').onclick=()=>{$('modal').classList.add('open')};
$('closeGuide').onclick=()=>{$('modal').classList.remove('open')};
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
stage.onclick=()=>{if(tapReady)reset()};
$('startBtn').onclick=async e=>{
 e.stopPropagation();
 if(busy)return;
 busy=true;tapReady=false;
 const id=++session;
 $('start').style.display='none';
 const won=roll(1/25);
 const route=won?rnd(0,43):-1;
 try{
  await prepareAudio();
  if(id!==session)return;
  tension();
  if(roll(.28))stars(rnd(2,9));
  if(won){
   if(roll(.35)){
    const kinds=['freeze','preview','push','promotion','rainbow','reverse','break','odd','rainbowBurst'];
    await newRoute(kinds[rnd(0,kinds.length-1)],true);
   }else await winRoute(route);
  }else{
   if(roll(.10)){
    const kinds=['freeze','push','promotion','reverse','odd'];
    await newRoute(kinds[rnd(0,kinds.length-1)],false);
   }else if(roll(0.000085)){
    await newRoute('preview',false);
   }else await missRoute();
  }
 }catch(err){
  console.error(err);
  reset();
 }
};
