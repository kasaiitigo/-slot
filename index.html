
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Red Peanuts 4th Anniversary</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#170010;
  color:#fff;
  font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;
}

button {
  font:inherit;
  cursor:pointer;
}

#stage {
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#170010 url("./9E28B31B-C619-4F41-AB55-91C025168D02.png")
    center top/auto 100% no-repeat;
}

#start {
  position:absolute;
  inset:0;
  z-index:5;
}

#startBtn {
  position:absolute;
  bottom:8.5%;
  left:50%;
  transform:translateX(-50%);
  width:min(80vw,390px);
  height:70px;
  border:2px solid #fff;
  border-radius:45px;
  background:linear-gradient(#ff78c4,#d00068);
  color:#fff;
  font-size:28px;
  font-weight:1000;
  box-shadow:0 0 28px #ff008d;
}

#rate {
  position:absolute;
  bottom:23%;
  width:100%;
  text-align:center;
  font-weight:900;
  text-shadow:0 2px 7px #000;
}

#rate b {
  display:block;
  color:#ffed9d;
  font-size:30px;
}

#guideBtn {
  position:absolute;
  bottom:34%;
  left:50%;
  transform:translateX(-50%);
  padding:11px 22px;
  white-space:nowrap;
  border:1px solid white;
  border-radius:30px;
  background:#580033d9;
  color:white;
  font-weight:900;
  box-shadow:0 0 14px #ff3896;
}

#modal {
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:#000d;
  padding:15px;
}

#modal.open {
  display:flex;
}

#guide {
  width:min(94vw,430px);
  max-height:88dvh;
  overflow:auto;
  padding:20px 14px;
  text-align:center;
  border:2px solid #ff8bc5;
  border-radius:22px;
  background:linear-gradient(#580031,#1b0013);
}

#guide h2 {
  color:#ffe6a1;
}

#guide p {
  padding:8px 0;
  border-bottom:1px solid #ffffff30;
  font-weight:800;
}

#guide em {
  color:#ffe58d;
  font-style:normal;
}

#closeGuide {
  margin:12px;
  padding:10px 50px;
  background:#ed2c8d;
  color:white;
  border:1px solid white;
  border-radius:25px;
}

#dim,#black,#flash,#lightning,#noise {
  position:absolute;
  inset:0;
  opacity:0;
  pointer-events:none;
}

#dim {
  z-index:9;
  background:#0009;
}

#black {
  z-index:24;
  background:#000;
}

#noise {
  z-index:27;
  background:repeating-linear-gradient(
    0deg,#fff6 0 2px,#0005 2px 5px
  );
}

#lightning {
  z-index:28;
  background:linear-gradient(
    120deg,
    transparent 42%,
    white 47%,
    #ff5db6 49%,
    transparent 54%
  );
  filter:drop-shadow(0 0 24px #ff1494);
}

#flash {
  z-index:50;
  background:#fff;
}

#num {
  position:absolute;
  z-index:15;
  top:61%;
  left:50%;
  width:100%;
  text-align:center;
  transform:translate(-50%,-50%);
  font-size:min(52vw,255px);
  line-height:1.1;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:clamp(5px,1.5vw,9px) #ff4b9d;
  text-shadow:0 7px #ae0054,0 14px 10px #370018;
  opacity:0;
  pointer-events:none;
}

#num.show {
  opacity:1;
  animation:pop .25s ease-out;
}

#num.gold {
  color:#fff1a8;
  -webkit-text-stroke:6px #f4a000;
  text-shadow:0 0 30px #ffd100;
}

#num.dots {
  font-size:min(34vw,155px);
  color:#fff1a8;
  -webkit-text-stroke:3px #f4a000;
}

#num.question {
  font-size:min(40vw,190px);
}

#num.big {
  font-size:min(65vw,300px);
}

#num.red {
  color:#ff508b;
}

@keyframes pop {
  from {
    transform:translate(-50%,-50%) scale(.6);
  }
  75% {
    transform:translate(-50%,-50%) scale(1.1);
  }
  to {
    transform:translate(-50%,-50%) scale(1);
  }
}

#result {
  position:absolute;
  z-index:30;
  inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:18px;
  background:#000a;
  text-align:center;
  pointer-events:none;
}

#result.show {
  display:flex;
}

#near {
  font-size:clamp(26px,9vw,56px);
  font-weight:1000;
  color:#ffe18d;
  text-shadow:0 0 18px #ff8a00;
}

#mainResult {
  position:relative;
  display:inline-block;
  white-space:nowrap;
  max-width:100%;
  font-size:clamp(42px,15vw,82px);
  line-height:1.2;
  letter-spacing:-.05em;
  font-weight:1000;
  color:white;
  -webkit-text-stroke:clamp(2px,.8vw,4px) #e00073;
  text-shadow:0 5px #8e0044,0 0 18px #ff379a;
}

#mainResult.appear {
  animation:resultPop .55s ease-out;
}

#message {
  font-size:clamp(14px,4vw,20px);
  font-weight:900;
  color:#ffe5aa;
  line-height:1.7;
  margin-top:12px;
  text-shadow:0 2px 5px #000;
}

#message:empty {
  display:none;
}

@keyframes resultPop {
  from {
    opacity:0;
    transform:scale(.3);
  }
  65% {
    transform:scale(1.1);
  }
  to {
    opacity:1;
    transform:scale(1);
  }
}

#cracks {
  position:absolute;
  inset:-7%;
  width:114%;
  height:114%;
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 2px #000)
    drop-shadow(0 0 5px white);
}

#cracks.show {
  opacity:1;
  animation:crack .55s steps(3,end);
}

@keyframes crack {
  from {opacity:0}
  to {opacity:1}
}

#result.shaking #mainResult {
  animation:shake .12s linear infinite;
}

@keyframes shake {
  0%,100% {transform:translate(0,0)}
  25% {transform:translate(-8px,5px)}
  50% {transform:translate(7px,-5px)}
  75% {transform:translate(-5px,-7px)}
}

.slash {
  position:absolute;
  z-index:48;
  left:-30%;
  top:48%;
  width:160%;
  height:22px;
  opacity:0;
  pointer-events:none;
  transform-origin:left center;
  background:linear-gradient(
    90deg,
    transparent,
    #ff87c9 10%,
    white 30%,
    white 75%,
    #ff1785,
    transparent
  );
  box-shadow:0 0 13px #fff,0 0 35px #ff0087;
}

#slash1 {
  transform:rotate(-22deg) scaleX(0);
}

#slash2 {
  transform:rotate(19deg) scaleX(0);
}

#slash1.go {
  animation:slashA .4s ease-out;
}

#slash2.go {
  animation:slashB .4s ease-out;
}

@keyframes slashA {
  0% {
    opacity:0;
    transform:rotate(-22deg) scaleX(0);
  }
  25%,75% {opacity:1}
  100% {
    opacity:0;
    transform:rotate(-22deg) scaleX(1);
  }
}

@keyframes slashB {
  0% {
    opacity:0;
    transform:rotate(19deg) scaleX(0);
  }
  25%,75% {opacity:1}
  100% {
    opacity:0;
    transform:rotate(19deg) scaleX(1);
  }
}

#hit {
  position:absolute;
  z-index:60;
  top:46%;
  left:50%;
  width:100%;
  text-align:center;
  white-space:nowrap;
  opacity:0;
  transform:translate(-50%,-50%) scale(.1);
  pointer-events:none;
  font-size:clamp(65px,23vw,155px);
  line-height:1.2;
  font-weight:1000;
  color:#fff2a8;
  -webkit-text-stroke:clamp(4px,1.2vw,7px) #ff266b;
  text-shadow:
    0 6px #ff9b00,
    0 12px #a90043,
    0 0 28px #fff;
}

#hit.go {
  animation:hitPop .7s
    cubic-bezier(.16,.7,.2,1.2) forwards;
}

@keyframes hitPop {
  0% {
    opacity:0;
    transform:translate(-50%,-50%) scale(.1);
  }
  55% {
    opacity:1;
    transform:translate(-50%,-50%) scale(1.18);
  }
  100% {
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

#hitInfo {
  position:absolute;
  z-index:61;
  top:65%;
  left:4%;
  width:92%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  font-weight:900;
  text-shadow:0 2px 5px #000;
}

#hitInfo.show {
  animation:info .6s forwards;
}

#hitName {
  display:inline-block;
  margin-top:9px;
  padding:10px 18px;
  max-width:100%;
  border:1px solid #ffe391;
  border-radius:14px;
  background:#530b33e8;
  color:#ffec9c;
  font-size:clamp(15px,4.8vw,24px);
}

@keyframes info {
  from {
    opacity:0;
    transform:translateY(20px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

#tap {
  position:absolute;
  z-index:62;
  bottom:9%;
  width:100%;
  text-align:center;
  opacity:0;
  pointer-events:none;
  text-shadow:0 2px 5px black;
}

#tap.show {
  animation:blink 1.2s infinite;
}

@keyframes blink {
  0%,100% {opacity:.4}
  50% {opacity:1}
}

.particle {
  position:absolute;
  z-index:47;
  pointer-events:none;
  color:#fff;
  font-size:25px;
  text-shadow:0 0 12px #fff,0 0 20px #ff2194;
  animation:fly 1.1s ease-out forwards;
}

@keyframes fly {
  from {
    opacity:1;
    transform:translate(0,0) rotate(0);
  }
  to {
    opacity:0;
    transform:translate(var(--dx),var(--dy))
      rotate(var(--rot)) scale(.2);
  }
}

.shooting {
  position:absolute;
  z-index:26;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 12px #fff,0 0 25px #ff62b9;
  pointer-events:none;
  animation:shoot .9s linear forwards;
}

.shooting:after {
  content:"";
  position:absolute;
  right:0;
  top:2px;
  width:75px;
  height:2px;
  background:linear-gradient(90deg,transparent,#fff);
}

@keyframes shoot {
  from {
    opacity:0;
    transform:translate(0,0);
  }
  20% {opacity:1}
  to {
    opacity:0;
    transform:translate(240px,370px);
  }
}

.flashGo {animation:fl .35s}
.lightGo {animation:fl .55s}
.noiseGo {animation:fl .6s}

@keyframes fl {
  0%,100% {opacity:0}
  40% {opacity:1}
}

/* 追加演出 */

#specialFX {
  position:absolute;
  inset:0;
  z-index:48;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  pointer-events:none;
  overflow:hidden;
  color:#fff;
  background:#080010;
}

#specialFX.active {
  display:flex;
}

#specialFX .fxTitle {
  font-size:clamp(38px,12vw,86px);
  font-weight:1000;
  line-height:1.16;
  text-shadow:0 0 18px #ffbc33,0 4px 0 #6b1600;
}

#specialFX .fxSub {
  font-weight:900;
  font-size:clamp(16px,5vw,29px);
  margin-top:22px;
  text-shadow:0 3px 8px #000;
}

/* 画像1：金炎・激熱 */

#specialFX.fire {
  background:
    url("./A1237DDA-95F5-4DD3-B2BD-BF33A829D07C.png")
    center/cover no-repeat;
  animation:fxPulse .32s infinite alternate;
}

#specialFX.fire .fxTitle {
  display:none;
}

/* 画像2：次回予告 */

#specialFX.preview {
  background:
    url("./0EB99059-7515-429E-B34D-8BFCE53ED083.png")
    center/cover no-repeat;
}

#specialFX.preview .fxTitle {
  display:none;
}

/* 画像3：虹色爆発 */

#specialFX.rainbow {
  background:
    url("./CC92EC2B-BC54-4037-9F8C-45DB1AE891E2.png")
    center/cover no-repeat;
  animation:fxHue 1s linear infinite;
}

#specialFX.rainbow .fxTitle {
  display:none;
}

/* 画像4：画面破壊 */

#specialFX.crash {
  background:
    url("./8CC59DB8-9809-47C1-89F3-8FA4895B18BD.png")
    center/cover no-repeat;
  animation:fxPulse .18s infinite alternate;
}

#specialFX.crash .fxTitle {
  font-size:clamp(28px,8vw,48px);
  background:#05000677;
  border-radius:18px;
  padding:12px 20px;
}

/* フリーズ */

#specialFX.freeze {
  background:#000;
}

/* PUSH演出 */

#specialFX.push {
  background:radial-gradient(circle,#581000,#080008 80%);
}

#specialFX.push .fxTitle {
  font-size:clamp(25px,7vw,48px);
}

/* 画像5：デカPUSH */

#specialFX .fxButton {
  pointer-events:auto;
  border:3px solid #ffdf78;
  border-radius:50%;
  width:min(72vw,310px);
  height:min(72vw,310px);
  background:
    url("./BF43324D-F195-4E15-A371-AA8862724654.png")
    center/cover no-repeat;
  box-shadow:0 0 25px #f80,0 0 50px #d00;
  color:transparent;
  font-size:clamp(40px,13vw,70px);
  font-weight:1000;
  animation:fxPulse .45s infinite alternate;
  cursor:pointer;
}

@keyframes fxPulse {
  from {
    transform:scale(.96);
    filter:brightness(.85);
  }
  to {
    transform:scale(1.04);
    filter:brightness(1.3);
  }
}

@keyframes fxHue {
  to {filter:hue-rotate(360deg)}
}
</style>
</head>

<body>

<div id="stage">

  <div id="specialFX" aria-live="polite">
    <div class="fxTitle"></div>
    <div class="fxSub"></div>
  </div>

  <div id="start">
    <button id="guideBtn">演出期待度を見る</button>
    <div id="rate">
      完全抽選
      <b>1 / 25</b>
      毎回独立抽選
    </div>
    <button id="startBtn">START</button>
  </div>

  <div id="dim"></div>
  <div id="num"></div>
  <div id="black"></div>
  <div id="noise"></div>
  <div id="lightning"></div>

  <div id="result">
    <div id="near"></div>
    <div id="mainResult">
      ハズレ
      <svg
        id="cracks"
        viewBox="0 0 320 130"
        preserveAspectRatio="none"
      >
        <g fill="none" stroke="white" stroke-width="3">
          <path d="M155 0 L143 24 L169 38 L147 56 L180 77 L155 100 L175 130"/>
          <path d="M143 24 L106 15 L88 35 L54 28"/>
          <path d="M169 38 L208 22 L229 44 L269 29"/>
          <path d="M147 56 L107 70 L83 63 L40 93"/>
          <path d="M180 77 L220 88 L244 74 L296 96"/>
          <path d="M155 100 L124 118 L90 105"/>
        </g>
      </svg>
    </div>
    <div id="message"></div>
  </div>

  <div id="slash1" class="slash"></div>
  <div id="slash2" class="slash"></div>
  <div id="flash"></div>

  <div id="hit">当たり</div>

  <div id="hitInfo">
    ✨ 今回の当選演出 ✨
    <div><span id="hitName"></span></div>
  </div>

  <div id="tap">画面をタップして戻る</div>

</div>

<div id="modal">
  <div id="guide">
    <h2>✨ 演出期待度 ✨</h2>
    <p>⚡ ピンク稲妻 → <em>チャンス！</em></p>
    <p>❓「？」出現 → <em>チャンス！</em></p>
    <p>✨ 流れ星大量 → <em>期待度UP！</em></p>
    <p>🌑 ブラックアウト → <em>大チャンス！？</em></p>
    <p>🟡 金色変化 → <em>大チャンス！？</em></p>
    <p>🔥 金炎・激熱 → <em>激アツ！</em></p>
    <p>🎬 次回予告 → <em>激アツ！</em></p>
    <p>💥 画面破壊 → <em>大チャンス！</em></p>
    <p>🌈 虹色爆発 → <em>当選確定！</em></p>
    <p>⚔️ 斬撃＋「当たり」 → <em>当選確定！</em></p>
    <button id="closeGuide">閉じる</button>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const wait = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

const rnd = (a,b) =>
  Math.floor(Math.random() * (b-a+1)) + a;

const roll = p => Math.random() < p;

const stage = $("stage");
const num = $("num");
const result = $("result");
const near = $("near");
const main = $("mainResult");
const message = $("message");
const black = $("black");
const fx = $("specialFX");

let busy = false;
let tapReady = false;
let session = 0;

let audioCtx = null;
let tensionBuf = null;
let hitBuf = null;
let tensionSource = null;
let hitSource = null;
let audioLoading = null;

/* 既存44種類の当選演出 */

const winNames = [
  "ハズレからブラックアウト復活",
  "ノーカン！？再チャレンジ",
  "ハズレ粉砕・復活",
  "ダブルノーカン大逆転",
  "ブラックアウト直撃",
  "2で停止",
  "カウントダウン逆転",
  "0出現プレミア",
  "数字消失",
  "無音からの復活",
  "1ロング停止",
  "カウントダウン再始動",
  "ダブルカウントダウン",
  "プチュン暗転",
  "ブラックアウト再始動",
  "斬撃フェイント復活",
  "変則カウントダウン",
  "無音カウントダウン",
  "沈黙からの復活",
  "数字飛ばし",
  "1消失からの復活",
  "2への巻き戻し",
  "高速カウントダウン",
  "ダブル斬撃",
  "突然の静寂",
  "？出現からの当たり",
  "ブラックアウト復活",
  "「…」直撃",
  "「…」からの復活",
  "「…」暗転復活",
  "「…」流れ星復活",
  "「…」長い沈黙",
  "巨大数字変化",
  "数字色変化",
  "ピンク稲妻",
  "ノイズ発生",
  "金色変化",
  "超ロング1",
  "？出現",
  "背景暗転",
  "カウントダウン停止",
  "無音消失",
  "カウントダウンやり直し",
  "ロゴ発光"
];

/* 基本アニメーション */

function anim(el,c) {
  el.classList.remove(c);
  void el.offsetWidth;
  el.classList.add(c);
}

function clearNum() {
  num.textContent = "";
  num.className = "";
  num.style.opacity = "";
}

async function digit(s,t=1050,c="") {
  clearNum();
  num.textContent = s;
  if(c) num.classList.add(c);
  num.classList.add("show");
  await wait(t);
  num.classList.remove("show");
}

async function count() {
  await digit("3",1100);
  await wait(150);
  await digit("2",1100);
  await wait(150);
  await digit("1",1250);
}

async function fastCount() {
  await digit("3",500);
  await digit("2",500);
  await digit("1",650);
}

async function dots() {
  await digit("…",1700,"dots");
}

async function blackout(t=1400) {
  black.style.opacity = "1";
  await wait(t);
  black.style.opacity = "0";
}

async function flash() {
  anim($("flash"),"flashGo");
  await wait(340);
}

async function lightning() {
  anim($("lightning"),"lightGo");
  await wait(560);
}

async function noise() {
  anim($("noise"),"noiseGo");
  await wait(630);
}

async function slashes() {
  anim($("slash1"),"go");
  await wait(135);
  anim($("slash2"),"go");
  await wait(320);
}

function stars(n=8) {
  for(let i=0;i<n;i++) {
    setTimeout(() => {
      if(!busy) return;

      const s = document.createElement("div");
      s.className = "shooting";
      s.style.left = rnd(0,65)+"%";
      s.style.top = rnd(0,35)+"%";

      stage.append(s);
      setTimeout(() => s.remove(),1000);
    },i*85);
  }
}

function fragments() {
  const glyphs = ["◆","✦","◈","✧","★"];

  for(let i=0;i<40;i++) {
    const e = document.createElement("div");
    e.className = "particle";
    e.textContent = glyphs[rnd(0,glyphs.length-1)];
    e.style.left = rnd(33,65)+"%";
    e.style.top = rnd(35,57)+"%";
    e.style.setProperty("--dx",rnd(-260,260)+"px");
    e.style.setProperty("--dy",rnd(-310,310)+"px");
    e.style.setProperty("--rot",rnd(-500,500)+"deg");

/* 音楽 */

function stopSource(src) {
  if(src) {
    try {
      src.stop();
    } catch(e) {}
  }
}

function stopMusic() {
  stopSource(tensionSource);
  stopSource(hitSource);
  tensionSource = null;
  hitSource = null;
}

async function prepareAudio() {
  try {
    if(!audioCtx) {
      const AC =
        window.AudioContext ||
        window.webkitAudioContext;

      if(!AC) return;
      audioCtx = new AC();
    }

    await audioCtx.resume();

    if(!audioLoading) {
      audioLoading = Promise.all(
        [
          "./Tension.mp3",
          "./hit_music_final.mp3"
        ].map(async url => {
          const response = await fetch(url);
          if(!response.ok) throw Error(url);

          return audioCtx.decodeAudioData(
            await response.arrayBuffer()
          );
        })
      ).then(buffers => {
        [tensionBuf,hitBuf] = buffers;
      }).catch(err => {
        console.warn("音声ファイル未読込",err);
      });
    }

    await audioLoading;

  } catch(err) {
    console.warn(err);
  }
}

function play(buf,loop=false) {
  if(!audioCtx || !buf) return null;

  const source = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();

  source.buffer = buf;
  source.loop = loop;
  gain.gain.value = loop ? .7 : 1;

  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start();

  return source;
}

function tension() {
  stopSource(tensionSource);
  tensionSource = play(tensionBuf,true);
}

function stopTension() {
  stopSource(tensionSource);
  tensionSource = null;
}

/* ハズレ側の演出振り分け */

async function missRoute() {
  if(roll(1/704)) {
    return dotsMiss();
  }

  const r = Math.random();

  if(r < .08) {
    return revivalNoCount(false);
  }

  if(r < .105) {
    return revivalDouble(false);
  }

  if(r < .36) {
    await common(rnd(0,11));
    return miss(false);
  }

  if(r < .66) {
    await count();
    return miss(false);
  }

  if(r < .84) {
    return weakMiss(rnd(0,9));
  }

  return strongMiss(rnd(0,5));
}

/* STARTボタン */

$("startBtn").onclick = async e => {
  e.stopPropagation();

  if(busy) return;

  busy = true;
  tapReady = false;

  const id = ++session;

  $("start").style.display = "none";

  /*
    ここで1回だけ抽選。
    毎回完全独立の1/25。
    演出によって当選確率は変わらない。
  */

  const won = roll(1/25);

  const route = won ? rnd(0,43) : -1;

  try {
    await prepareAudio();

    if(id !== session) return;

    tension();

    if(roll(.28)) {
      stars(rnd(2,9));
    }

    if(won) {
      /*
        当たり時：
        35%で新演出、
        65%で既存44ルート。
      */

      if(roll(.35)) {
        const kinds = [
          "freeze",
          "preview",
          "push",
          "promotion",
          "rainbow",
          "reverse",
          "break",
          "fire",
          "odd",
          "rainbowBurst"
        ];

        const kind = kinds[
          rnd(0,kinds.length-1)
        ];

        await newRoute(kind,true);

      } else {
        await winRoute(route);
      }

    } else {
      /*
        ハズレ時：
        10%で新演出、
        90%で既存ハズレ演出。

        虹色系はハズレ側に入れない。
      */

      if(roll(.10)) {
        const kinds = [
          "freeze",
          "preview",
          "push",
          "promotion",
          "reverse",
          "break",
          "fire",
          "odd"
        ];

        const kind = kinds[
          rnd(0,kinds.length-1)
        ];

        await newRoute(kind,false);

      } else {
        await missRoute();
      }
    }

  } catch(err) {
    console.error(err);
    reset();
  }
};
