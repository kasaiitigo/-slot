<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RP COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN",sans-serif;
}

body{user-select:none}

/* =========================
   MAIN
========================= */
#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background-color:#120008;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
  transform-origin:center center;
}

#stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:rgba(0,0,0,0);
  transition:background 1s;
}

#stage.bgDark::after{background:rgba(0,0,0,.76)}

#stage.hitZoom{
  animation:hitStageZoom .52s cubic-bezier(.12,.8,.15,1);
}

@keyframes hitStageZoom{
  0%{transform:scale(1)}
  18%{transform:scale(1.13)}
  35%{transform:scale(.98)}
  55%{transform:scale(1.07)}
  100%{transform:scale(1)}
}

/* =========================
   COUNT NUMBER
========================= */
#number{
  position:absolute;
  z-index:20;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;
  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);
  transition:
    color .18s,
    transform .18s,
    opacity .18s,
    filter .18s;
}

#number.show{animation:numberPop .32s ease-out}

@keyframes numberPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.16);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

#number.bigChance{
  animation:bigChance .7s cubic-bezier(.1,1.4,.2,1);
}

@keyframes bigChance{
  0%{transform:translate(-50%,-50%) scale(1)}
  35%{transform:translate(-50%,-50%) scale(1.55)}
  65%{transform:translate(-50%,-50%) scale(.92)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

#number.red{
  color:#ff5353;
  -webkit-text-stroke-color:#fff;
}

#number.gold{
  color:#fff0a0;
  -webkit-text-stroke-color:#ffb300;
  text-shadow:
    0 6px 0 #d78c00,
    0 12px 0 #8c5200,
    0 0 20px #fff,
    0 0 45px #ffc400;
}

#number.pink{color:#ffb6dc}

#number.cracked{
  filter:contrast(1.5);
  text-shadow:
    -4px -2px 0 rgba(255,255,255,.5),
    4px 3px 0 #8b003d,
    0 8px 0 #d82779,
    0 15px 0 #7a003a;
}

#dots{
  position:absolute;
  z-index:22;
  display:none;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  font-size:90px;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:4px #ff4b9d;
  text-shadow:
    0 5px 0 #d82779,
    0 10px 0 #970049;
}

/* =========================
   START
========================= */
#start{
  position:absolute;
  z-index:100;
  left:50%;
  bottom:max(7%,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(72vw,330px);
  padding:17px 20px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:999px;
  background:linear-gradient(180deg,#ff73b9,#d00064);
  color:#fff;
  font-size:21px;
  font-weight:1000;
  letter-spacing:.12em;
  box-shadow:
    0 5px 0 #79003a,
    0 0 25px rgba(255,40,140,.7);
}

#start:active{
  transform:translateX(-50%) translateY(4px);
}

#info{
  position:absolute;
  z-index:100;
  left:0;
  right:0;
  bottom:calc(max(7%,env(safe-area-inset-bottom)) + 75px);
  text-align:center;
  font-size:11px;
  font-weight:800;
  line-height:1.6;
  text-shadow:0 2px 5px #000;
}

/* =========================
   COMMON FX
========================= */
#black{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  background:#000;
}

#noise{
  position:fixed;
  inset:0;
  z-index:125;
  display:none;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,.13) 0px,
    rgba(255,255,255,.13) 1px,
    rgba(0,0,0,.2) 2px,
    rgba(0,0,0,.2) 4px
  );
  mix-blend-mode:screen;
}

#noise.go{
  display:block;
  animation:noiseMove .07s steps(2) infinite;
}

@keyframes noiseMove{
  0%{transform:translate(0,0)}
  25%{transform:translate(5px,-4px)}
  50%{transform:translate(-5px,3px)}
  75%{transform:translate(3px,5px)}
  100%{transform:translate(-3px,-5px)}
}

#lightning{
  position:fixed;
  inset:0;
  z-index:130;
  display:none;
  pointer-events:none;
}

#lightning.go{display:block}

.bolt{
  position:absolute;
  left:48%;
  top:-10%;
  width:10px;
  height:125%;
  background:#fff;
  transform:rotate(17deg);
  box-shadow:
    0 0 10px #fff,
    0 0 30px #ff4fa8,
    0 0 70px #ff0080;
  clip-path:polygon(
    50% 0,100% 0,65% 38%,100% 38%,
    38% 100%,50% 53%,0 53%
  );
}

#logoGlow{
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(
    circle at 50% 27%,
    rgba(255,255,255,.95) 0%,
    rgba(255,50,155,.6) 8%,
    rgba(255,0,100,.18) 23%,
    transparent 43%
  );
}

#logoGlow.go{animation:logoGlow .8s ease-out}

@keyframes logoGlow{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

#question{
  position:fixed;
  z-index:140;
  display:none;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  font-size:110px;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:5px #ff4b9d;
  text-shadow:0 0 25px #ff1493;
}

/* =========================
   SHOOTING STARS
========================= */
.star{
  position:fixed;
  z-index:12;
  pointer-events:none;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 5px #fff,
    0 0 12px rgba(255,255,255,.95),
    0 0 22px rgba(255,190,225,.7);
}

.star::after{
  content:"";
  position:absolute;
  right:4px;
  top:4px;
  width:var(--tail,150px);
  height:2px;
  transform-origin:right center;
  transform:rotate(32deg);
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.04) 18%,
    rgba(255,255,255,.18) 45%,
    rgba(255,255,255,.55) 76%,
    #fff 100%
  );
}

.star.go{
  animation:shootNatural var(--speed,.85s) linear forwards;
}

@keyframes shootNatural{
  0%{transform:translate3d(0,0,0);opacity:0}
  7%{opacity:1}
  75%{opacity:1}
  100%{
    transform:translate3d(78vw,48vh,0);
    opacity:0;
  }
}

/* =========================
   HIT IMPACT
========================= */
#hitDark{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  background:rgba(0,0,0,.92);
}

#slash{
  position:fixed;
  inset:0;
  z-index:210;
  display:none;
  pointer-events:none;
  overflow:hidden;
}

#slash.go{display:block}

.slashLine{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:31px;
  background:#fff;
  box-shadow:
    0 0 8px #fff,
    0 0 22px #fff,
    0 0 50px #ff58ad,
    0 0 110px #ff007b;
  transform:rotate(-18deg) scaleX(0);
}

#slash.go .slashLine{
  animation:slashGo .22s ease-out forwards;
}

@keyframes slashGo{
  to{transform:rotate(-18deg) scaleX(1)}
}

#flash{
  position:fixed;
  inset:0;
  z-index:260;
  pointer-events:none;
  background:#fff;
  opacity:0;
}

#flash.go{animation:whiteFlash .55s ease-out}

@keyframes whiteFlash{
  0%{opacity:0}
  8%{opacity:1}
  20%{opacity:1}
  35%{opacity:.15}
  48%{opacity:1}
  100%{opacity:0}
}

#impactWhite{
  position:fixed;
  inset:0;
  z-index:280;
  pointer-events:none;
  display:none;
  background:#fff;
}

#impactWhite.go{
  display:block;
  animation:impactWhite .24s linear forwards;
}

@keyframes impactWhite{
  0%{opacity:1}
  42%{opacity:1}
  100%{opacity:0}
}

body.hitShake{
  animation:hitShake .065s linear 10;
}

@keyframes hitShake{
  0%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-12px,7px) rotate(-.7deg)}
  20%{transform:translate(11px,-8px) rotate(.7deg)}
  30%{transform:translate(-8px,-9px) rotate(-.4deg)}
  40%{transform:translate(13px,6px) rotate(.5deg)}
  50%{transform:translate(-12px,9px) rotate(-.6deg)}
  60%{transform:translate(9px,-7px) rotate(.5deg)}
  70%{transform:translate(-7px,5px) rotate(-.4deg)}
  80%{transform:translate(7px,-4px) rotate(.3deg)}
  90%{transform:translate(-3px,2px)}
  100%{transform:translate(0,0)}
}

#hitText{
  position:fixed;
  z-index:300;
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:180vw;
  text-align:center;
  font-size:min(43vw,220px);
  line-height:1;
  font-weight:1000;
  color:#fff4a6;
  -webkit-text-stroke:5px #ff245f;
  text-shadow:
    0 8px 0 #b0003c,
    0 15px 0 #60001f,
    0 0 20px #fff,
    0 0 55px #ffca00,
    0 0 120px #ff004c;
}

#hitText.go{
  display:block;
  animation:hitExplosion 1.05s cubic-bezier(.08,1.45,.12,1);
}

@keyframes hitExplosion{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(6.5) rotate(-7deg);
    filter:blur(20px);
  }
  17%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.55) rotate(2deg);
    filter:blur(0);
  }
  31%{transform:translate(-50%,-50%) scale(1.45) rotate(-1deg)}
  46%{transform:translate(-50%,-50%) scale(.88)}
  61%{transform:translate(-50%,-50%) scale(1.18)}
  76%{transform:translate(-50%,-50%) scale(.96)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

/* =========================================================
   REALISTIC TREASURE
========================================================= */
#treasure{
  position:fixed;
  inset:0;
  z-index:350;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 43%,
      rgba(132,0,66,.95) 0%,
      rgba(65,0,34,.97) 35%,
      #16000c 68%,
      #050002 100%);
}

#treasure::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.65;
  background:
    radial-gradient(circle at 50% 52%,
      rgba(255,48,142,.2),
      transparent 37%),
    repeating-radial-gradient(
      ellipse at 50% 105%,
      rgba(255,255,255,.025) 0 2px,
      transparent 3px 22px
    );
}

#treasure.show{display:flex}

#treasureTitle{
  position:absolute;
  z-index:20;
  top:max(7%,env(safe-area-inset-top));
  width:100%;
  text-align:center;
  font-size:28px;
  font-weight:1000;
  letter-spacing:.02em;
  text-shadow:
    0 3px 8px #000,
    0 0 20px rgba(255,40,140,.65);
}

#treasureSub{
  position:absolute;
  z-index:20;
  top:14%;
  width:100%;
  text-align:center;
  font-size:13px;
  font-weight:800;
  opacity:.82;
}

#chests{
  position:relative;
  z-index:10;
  width:min(98vw,680px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:2px;
  margin-top:8px;
  perspective:900px;
}

.chest{
  appearance:none;
  border:0;
  outline:0;
  background:none;
  color:#fff;
  width:33%;
  padding:0;
  position:relative;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:
    transform .3s cubic-bezier(.2,.9,.2,1),
    opacity .35s,
    filter .35s;
}

.chestWrap{
  position:relative;
  width:100%;
  height:162px;
  perspective:650px;
  transform-style:preserve-3d;
  filter:drop-shadow(0 17px 13px rgba(0,0,0,.72));
}

/* 地面の影 */
.chestWrap::after{
  content:"";
  position:absolute;
  z-index:0;
  left:13%;
  bottom:2px;
  width:74%;
  height:17px;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  filter:blur(6px);
}

/* 箱本体 */
.chestBody{
  position:absolute;
  z-index:8;
  left:7%;
  bottom:10px;
  width:86%;
  height:78px;
  overflow:hidden;

  border:3px solid #e8a82c;
  border-radius:7px 7px 17px 17px;

  background:
    linear-gradient(
      100deg,
      transparent 0 14%,
      rgba(255,255,255,.18) 18%,
      transparent 24% 65%,
      rgba(255,255,255,.12) 72%,
      transparent 80%
    ),
    repeating-linear-gradient(
      90deg,
      rgba(72,0,31,.18) 0 2px,
      transparent 2px 21px
    ),
    linear-gradient(
      180deg,
      #ff4997 0%,
      #dc176d 34%,
      #a6004c 72%,
      #66002c 100%
    );

  box-shadow:
    inset 0 5px 8px rgba(255,255,255,.25),
    inset 0 -14px 18px rgba(47,0,20,.5),
    inset 8px 0 10px rgba(255,255,255,.08),
    inset -8px 0 12px rgba(45,0,20,.35),
    0 4px 0 #754000;
}

/* 箱の金属下帯 */
.chestBody::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:11px;
  height:10px;
  background:
    linear-gradient(
      180deg,
      #fff0a0,
      #f8bf39 27%,
      #b86c05 67%,
      #704000
    );
  box-shadow:
    0 2px 4px rgba(0,0,0,.5),
    inset 0 1px 2px #fff9c9;
}

/* 木目っぽい筋 */
.chestBody::after{
  content:"";
  position:absolute;
  inset:7px 5px 25px;
  opacity:.32;
  background:
    repeating-linear-gradient(
      4deg,
      transparent 0 10px,
      rgba(75,0,30,.65) 11px,
      transparent 13px
    );
}

/* 閉じたフタ */
.closedLid{
  position:absolute;
  z-index:15;
  left:4%;
  bottom:83px;
  width:92%;
  height:61px;

  transform-origin:50% 100%;
  backface-visibility:hidden;

  border:3px solid #efb53b;
  border-radius:50% 50% 8px 8px / 68% 68% 15px 15px;

  background:
    linear-gradient(
      100deg,
      transparent 0 16%,
      rgba(255,255,255,.24) 21%,
      transparent 28% 68%,
      rgba(255,255,255,.14) 75%,
      transparent 82%
    ),
    repeating-linear-gradient(
      90deg,
      rgba(80,0,35,.15) 0 2px,
      transparent 2px 22px
    ),
    linear-gradient(
      180deg,
      #ff64a9 0%,
      #ed277e 36%,
      #ae0051 76%,
      #710032 100%
    );

  box-shadow:
    inset 0 8px 10px rgba(255,255,255,.28),
    inset 0 -11px 15px rgba(70,0,28,.45),
    0 5px 5px rgba(0,0,0,.45);
}

/* 金色のフタ帯 */
.closedLid::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:7px;
  height:10px;

  background:linear-gradient(
    180deg,
    #fff3a8,
    #ffc63d 30%,
    #b96a03 70%,
    #704000
  );

  box-shadow:
    inset 0 1px 2px #fff,
    0 2px 4px rgba(0,0,0,.55);
}

/*
  開いたフタ。
  浮かせず、蝶番の奥側に固定して見せる。
*/
.openLid{
  position:absolute;
  z-index:4;
  left:7%;
  bottom:82px;
  width:86%;
  height:55px;

  opacity:0;

  transform-origin:50% 100%;
  transform:
    translateY(16px)
    rotateX(-76deg)
    scaleY(.7);

  border:3px solid #eeb43b;
  border-radius:50% 50% 7px 7px;

  background:
    linear-gradient(
      180deg,
      #ff5ca4,
      #c8005d 55%,
      #720032
    );

  box-shadow:
    inset 0 5px 8px rgba(255,255,255,.25),
    0 -4px 12px rgba(0,0,0,.6);

  transition:
    opacity .18s,
    transform .48s cubic-bezier(.15,.9,.2,1);
}

/* 箱の内側 */
.chestInterior{
  position:absolute;
  z-index:6;
  left:10%;
  bottom:69px;
  width:80%;
  height:24px;

  opacity:0;
  border-radius:50%;
  border:2px solid #8d5205;

  background:
    radial-gradient(
      ellipse,
      #ffec8d 0%,
      #ff9d19 18%,
      #541222 50%,
      #160007 78%
    );

  box-shadow:
    inset 0 7px 13px #050001,
    0 0 15px rgba(255,185,50,.35);

  transition:opacity .25s;
}

/* 蝶番 */
.hinge{
  position:absolute;
  z-index:18;
  left:16%;
  bottom:78px;
  width:68%;
  height:9px;

  border-radius:5px;

  background:linear-gradient(
    180deg,
    #fff2a1,
    #f5b82c 35%,
    #a65c00 75%,
    #633700
  );

  box-shadow:
    0 2px 4px rgba(0,0,0,.65),
    inset 0 1px 1px #fff;
}

/* 縦の金具 */
.metalBand{
  position:absolute;
  z-index:19;
  left:46%;
  bottom:12px;
  width:9%;
  height:128px;

  border-left:1px solid rgba(255,246,179,.65);
  border-right:1px solid #6d3a00;

  background:linear-gradient(
    90deg,
    #7c4300,
    #f4b72b 24%,
    #fff09a 50%,
    #d58a09 72%,
    #6d3900
  );

  box-shadow:
    2px 0 4px rgba(0,0,0,.4);
}

/* ロック */
.lock{
  position:absolute;
  z-index:25;
  left:38%;
  bottom:60px;
  width:24%;
  height:34px;

  border:2px solid #fff0a0;
  border-radius:6px 6px 9px 9px;

  background:
    radial-gradient(circle at 50% 35%,#fff5a7 0 8%,transparent 9%),
    linear-gradient(
      135deg,
      #754000,
      #f9bd2f 28%,
      #fff1a0 48%,
      #d07c04 70%,
      #6a3900
    );

  box-shadow:
    inset 0 0 5px rgba(255,255,255,.6),
    0 3px 5px rgba(0,0,0,.55),
    0 0 8px rgba(255,196,55,.35);

  transition:opacity .2s;
}

.lock::after{
  content:"";
  position:absolute;
  left:42%;
  top:43%;
  width:16%;
  height:35%;
  border-radius:5px;
  background:#4b2600;
  box-shadow:inset 0 1px 2px #160800;
}

/* 宝石 */
.gem{
  position:absolute;
  z-index:27;
  left:44%;
  bottom:87px;
  width:12%;
  aspect-ratio:1;
  transform:rotate(45deg);

  border:2px solid #ffd5eb;

  background:
    linear-gradient(
      135deg,
      #fff 0%,
      #ffb7df 18%,
      #ff1688 48%,
      #8f003f 100%
    );

  box-shadow:
    0 0 5px #fff,
    0 0 12px rgba(255,25,136,.8);

  transition:opacity .2s;
}

/* 箱から漏れる光 */
.chestLight{
  position:absolute;
  z-index:7;
  left:20%;
  bottom:58px;
  width:60%;
  height:32px;
  opacity:0;
  border-radius:50%;

  background:#fff7b5;

  box-shadow:
    0 0 16px #fff,
    0 0 35px #ffe063,
    0 0 65px #ffb000,
    0 0 105px #ff3c9d;

  pointer-events:none;
}

.chestLight::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:0;
  width:120%;
  height:130px;
  transform:translateX(-50%);
  opacity:.65;

  background:linear-gradient(
    0deg,
    rgba(255,229,104,.65),
    rgba(255,88,165,.15) 60%,
    transparent
  );

  clip-path:polygon(33% 100%,67% 100%,100% 0,0 0);
}

/* OPEN状態 */
.chest.open .closedLid{
  opacity:0;
  transform:rotateX(-80deg) scaleY(.72);
}

.chest.open .openLid{

/* =========================
   AUDIO
========================= */
function ensureAudioContext(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  return audioCtx;
}

async function loadBuffer(url){
  const res=await fetch(url,{cache:"force-cache"});
  if(!res.ok)throw new Error(url+" load failed");
  const arr=await res.arrayBuffer();
  return await audioCtx.decodeAudioData(arr);
}

async function prepareAudio(){
  ensureAudioContext();

  if(!tensionBuffer){
    try{
      tensionBuffer=await loadBuffer("./Tension.mp3");
    }catch(e){
      console.log("Tension load error",e);
    }
  }

  if(!hitBuffer){
    try{
      hitBuffer=await loadBuffer("./hit_music_final.mp3");
    }catch(e){
      console.log("Hit music load error",e);
    }
  }
}

function stopTension(){
  try{tensionSource?.stop()}catch(e){}
  tensionSource=null;
}

function startTension(){
  if(!audioCtx||!tensionBuffer)return;

  stopTension();

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=tensionBuffer;
  source.loop=true;
  gain.gain.value=.72;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);
  tensionSource=source;
}

function stopHitMusic(){
  try{hitSource?.stop()}catch(e){}
  hitSource=null;
}

function playHitMusic(){
  if(!audioCtx||!hitBuffer)return;

  stopHitMusic();

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=hitBuffer;
  gain.gain.value=1;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);
  hitSource=source;
}

/* =========================

========================= */
function clearStars(){
  starTimers.forEach(clearTimeout);
  starTimers=[];
  $$(".star").forEach(s=>s.remove());
}

function shootStar(){
  const star=document.createElement("div");
  star.className="star";

  const fromTop=Math.random()<.55;

  if(fromTop){
    star.style.left=(-12+Math.random()*52)+"vw";
    star.style.top=(-5-Math.random()*8)+"vh";
  }else{
    star.style.left=(-12-Math.random()*8)+"vw";
    star.style.top=(2+Math.random()*28)+"vh";
  }

  star.style.setProperty("--tail",(110+Math.random()*130)+"px");
  star.style.setProperty("--speed",(.62+Math.random()*.38)+"s");

  const size=.75+Math.random()*.65;
  star.style.width=(10*size)+"px";
  star.style.height=(10*size)+"px";

  document.body.appendChild(star);

  requestAnimationFrame(()=>star.classList.add("go"));
  setTimeout(()=>star.remove(),1400);
}

function starBurst(count){
  for(let i=0;i<count;i++){
    const timer=setTimeout(
      shootStar,
      i*(60+Math.random()*100)
    );
    starTimers.push(timer);
  }
}

function scheduleStars(token){
  if(Math.random()>=.27)return;

  const r=Math.random();
  let count;

  if(r<.75){
    count=1+Math.floor(Math.random()*3);
  }else if(r<.95){
    count=4+Math.floor(Math.random()*3);
  }else{
    count=7+Math.floor(Math.random()*4);
  }

  const delay=600+Math.random()*3000;

  starTimers.push(setTimeout(()=>{
    if(token!==playToken)return;

    starBurst(count);

    if(Math.random()<.15){
      starTimers.push(setTimeout(()=>{
        if(token===playToken){
          starBurst(1+Math.floor(Math.random()*4));
        }
      },700+Math.random()*1000));
    }
  },delay));
}

    case 4:
      await normalCount();
      hideNumber();
      await blackout(650);
      showNumber(1);
      await sleep(1400);
      break;

    case 5:
      showNumber(3);
      await sleep(3400);
      showNumber(2);
      await sleep(1500);
      showNumber(1);
      await sleep(1600);
      break;

    case 6:
      showNumber(3);
      await sleep(1500);
      showNumber(2);
      $("#number").classList.add("red");
      await sleep(500);
      $("#number").classList.remove("red");
      await sleep(1100);
      showNumber(1);
      await sleep(1500);
      break;

    case 7:
      showNumber(3);
      await sleep(1400);
      showNumber(2);
      await sleep(1400);
      showNumber(0);
      await sleep(280);
      showNumber(1);
      await sleep(1700);
      break;

    case 8:
      await normalCount();
      $("#number").style.transform=
        "translate(-50%,-50%) scale(.78)";
      await sleep(900);
      break;

    case 9:
      showNumber(3);
      await sleep(400);
      showNumber(2);
      await sleep(500);
      showNumber(1);
      await sleep(1900);
      break;
  }

  stopTension();
  showDots();

  await sleep(1400);

  return finishMiss();
}

async function strongFake(type){
  switch(type){
    case 0:
      await normalCount();
      stopTension();

      $("#slash").className="go";
      await sleep(230);
      $("#slash").className="";

      await sleep(1800);
      break;

    case 1:
      await normalCount();

      stopTension();
      hideNumber();

      await blackout(2200);
      break;

    case 2:
      await normalCount();

      $("#number").classList.add("gold");
      await sleep(3000);
      $("#number").classList.remove("gold");
      break;

    case 3:
      await normalCount();

      stopTension();

      $("#slash").className="go";
      await sleep(220);

      flash();

      await sleep(250);
      $("#slash").className="";

      await sleep(1800);
      break;

    case 4:
      await normalCount();

      stopTension();
      hideNumber();

      await blackout(1500);

      showNumber(1);
      await sleep(2300);
      break;

    case 5:
      await normalCount();

      $("#number").classList.add("gold");
      await sleep(700);

      stopTension();
      await sleep(3300);

      $("#number").classList.remove("gold");
      break;
  }

  showDots();

  await sleep(1500);

  return finishMiss();
}

/* =========================
   COMMON FX - MISS
========================= */
async function commonFxMiss(index){
  switch(index){
    case 0:
      await normalCount();
      await fxBigNumber();
      break;

    case 1:
      await normalCount();
      await fxCrack();
      break;

    case 2:
      await normalCount();
      await fxLightning(Math.random()<.25?3:1);
      break;

    case 3:
      showNumber(3);
      await sleep(1400);
      showNumber(2);
      await fxNoise(700);
      showNumber(1);
      await sleep(1700);
      break;

    case 4:
      await normalCount();
      await fxColorStep();
      await sleep(1000);
      break;

    case 5:
      showNumber(3);
      await sleep(1500);
      showNumber(2);
      await sleep(1600);
      await fxSuperLongOne();
      break;

    case 6:
      showNumber(3);
      await sleep(1400);
      await fxQuestion();
      showNumber(2);
      await sleep(1500);
      showNumber(1);
      await sleep(1600);
      break;

    case 7:
      await normalCount();
      await fxBackgroundDark();
      break;

    case 8:
      await fxStopRestart();
      break;

    case 9:
      showNumber(3);
      await sleep(1500);
      showNumber(2);
      await sleep(1600);
      await fxSilentDisappear();
      break;

    case 10:
      await fxFakeFinish();
      break;

    case 11:
      await normalCount();
      await fxLogoGlow();
      await sleep(1000);
      break;
  }

  stopTension();

  if(Math.random()<.55){
    showDots();
    await sleep(1200+Math.random()*700);
  }else{
    hideNumber();
    hideDots();
    await sleep(1300);
  }

  return finishMiss();
}

async function finishMiss(){
  stopTension();

  hideNumber();
  hideDots();

  $("#stage").classList.remove("bgDark","hitZoom");
  $("#noise").className="";
  $("#lightning").className="";
  $("#question").style.display="none";
  $("#black").style.display="none";
  $("#slash").className="";
  $("#impactWhite").className="";

  document.body.classList.remove("hitShake");

  await sleep(800);

  resetMain();
}

/* =========================
   PRIZE
========================= */
function drawPrize(){
  const r=Math.random();

  if(r<.02)return 1;
  if(r<.22)return 2;

  return 3;
}

function rankClass(rank){
  return "rank"+rank;
}

/* =========================
   REAL CHESTS
========================= */
function createChests(){
  const area=$("#chests");
  area.innerHTML="";

  for(let i=0;i<3;i++){
    const button=document.createElement("button");
    button.className="chest";

    button.innerHTML=`
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="openLid"></div>
        <div class="chestInterior"></div>
        <div class="closedLid"></div>

        <div class="chestBody"></div>

        <div class="hinge"></div>
        <div class="metalBand"></div>
        <div class="lock"></div>
        <div class="gem"></div>
      </div>

      <div class="rankLabel"></div>
    `;

    button.addEventListener("click",()=>chooseChest(i));
    area.appendChild(button);
  }
}

function showTreasure(){
  selectedRank=drawPrize();
  selectedIndex=-1;
  chestBusy=false;

  createChests();

  $("#treasureTitle").textContent="宝箱を1つ選べ！";
  $("#treasureSub").textContent="好きな宝箱をタップ";

  $("#resultSmall").style.display="none";
  $("#resultBig").style.display="none";
  $("#next").style.display="none";

  $("#treasure").className="show";
}

function showSelectedResult(rank){
  const small=$("#resultSmall");
  const big=$("#resultBig");

  small.textContent="あなたの結果";
  small.style.display="block";

  big.textContent=rank+"等 当選！";
  big.className=rankClass(rank);
  big.style.display="block";

  void big.offsetWidth;
  big.classList.add("resultPop");
}

async function chooseChest(index){
  if(chestBusy)return;

  chestBusy=true;
  selectedIndex=index;

  const chests=$$(".chest");
  const chosen=chests[index];

  chests.forEach(chest=>{
    chest.style.pointerEvents="none";
  });

  /* 選んだ箱が震える */
  chosen.classList.add("shaking");

  await sleep(950);

  /* 開封 */
  chosen.classList.remove("shaking");
  chosen.classList.add("open","selectedChest");

  await sleep(500);

  flash();

  await sleep(550);

  const label=chosen.querySelector(".rankLabel");

  label.textContent=selectedRank+"等";
  label.className="rankLabel "+rankClass(selectedRank);

  showSelectedResult(selectedRank);

  await sleep(1400);

  /*
    選ばなかった2箱。
    選択された等級以外を1つずつ配置。
  */
  const remainingRanks=[1,2,3]
    .filter(rank=>rank!==selectedRank)
    .sort(()=>Math.random()-.5);

  const otherIndexes=[0,1,2]
    .filter(i=>i!==index)
    .sort(()=>Math.random()-.5);

  for(let i=0;i<otherIndexes.length;i++){
    const idx=otherIndexes[i];
    const chest=chests[idx];

    chest.classList.add("otherChest","shaking");

    await sleep(500);

    chest.classList.remove("shaking");
    chest.classList.add("open");

    await sleep(350);

    const label=chest.querySelector(".rankLabel");
    const rank=remainingRanks[i];

    label.textContent=rank+"等";
    label.className="rankLabel "+rankClass(rank);

    await sleep(750);
  }

  $("#treasureTitle").textContent="あなたが選んだ宝箱";
  $("#treasureSub").textContent="選んだ結果はこちら";

  /*
    結果を最後まで残す
  */
  showSelectedResult(selectedRank);

  await sleep(600);

  $("#next").style.display="block";
}

/* =========================
   HIT SELECTOR
   32 + 12 = 44
========================= */
async function runHit(){
  const pattern=Math.floor(Math.random()*44);

  switch(pattern){
    case 0:return normalHitAt(3);
    case 1:return normalHitAt(2);
    case 2:return normalHitAt(1);
    case 3:return normalHitAt(0);
    case 4:return normalBlackout();
    case 5:return freezeTwo();
    case 6:return reverseCountdown();
    case 7:return zeroPremium();
    case 8:return numberDisappear();
    case 9:return soundStopPattern();
    case 10:return longOne();
    case 11:return recountSequence();
    case 12:return doubleCountdown();
    case 13:return puchunDirect();
    case 14:return puchunRecount();
    case 15:return fakeSlashPattern();
    case 16:return weirdCountdown();
    case 17:return silentStart();
    case 18:return classicRevival();
    case 19:return skipCountHit();
    case 20:return oneVanishHit();
    case 21:return oneBackToTwoHit();
    case 22:return speedCountHit();
    case 23:return doubleSlashHit();
    case 24:return silentOddityHit();
    case 25:return questionHit();
    case 26:return blackoutReturnHit();
    case 27:return dotsDirectHit();
    case 28:return dotsOneRevival();
    case 29:return dotsBlackoutHit();
    case 30:return dotsStarHit();
    case 31:return dotsLongSilenceHit();

    case 32:return commonFxHit(0);
    case 33:return commonFxHit(1);
    case 34:return commonFxHit(2);
    case 35:return commonFxHit(3);
    case 36:return commonFxHit(4);
    case 37:return commonFxHit(5);
    case 38:return commonFxHit(6);
    case 39:return commonFxHit(7);
    case 40:return commonFxHit(8);
    case 41:return commonFxHit(9);
    case 42:return commonFxHit(10);
    case 43:return commonFxHit(11);
  }
}

/* =========================
   MISS SELECTOR
========================= */
async function runMiss(){
  if(Math.random()<.36){
    return commonFxMiss(
      Math.floor(Math.random()*12)
    );
  }

  const r=Math.random();

  if(r<.50){
    return normalMiss();
  }

  if(r<.75){
    return weakFake(
      Math.floor(Math.random()*10)
    );
  }

  return strongFake(
    Math.floor(Math.random()*6)
  );
}

/* =========================
   RESET
========================= */
function resetVisuals(){
  $("#black").style.display="none";
  $("#hitDark").style.display="none";

  $("#slash").className="";
  $("#flash").className="";
  $("#impactWhite").className="";
  $("#hitText").className="";
  $("#noise").className="";
  $("#lightning").className="";
  $("#logoGlow").className="";

  $("#question").style.display="none";

  $("#stage").classList.remove("bgDark","hitZoom");

  document.body.classList.remove("hitShake");

  hideDots();
  clearNumberClasses();
}

function resetMain(){
  stopTension();
  clearStars();

  resetVisuals();

  $("#treasure").className="";
  $("#next").style.display="none";

  $("#resultSmall").style.display="none";
  $("#resultBig").style.display="none";

  showNumber(3);

  $("#start").style.display="block";
  $("#info").style.display="block";

  busy=false;
  chestBusy=false;
  selectedRank=null;
  selectedIndex=-1;
}

/* =========================
   PLAY
========================= */
async function play(){
  if(busy)return;

  busy=true;

  $("#start").style.display="none";
  $("#info").style.display="none";

  playToken++;

  clearStars();
  resetVisuals();

  ensureAudioContext();

  const resumePromise=audioCtx.resume();

  try{
    await Promise.all([
      resumePromise,
      prepareAudio()
    ]);
  }catch(e){
    console.log("audio preparation error",e);
  }

  startTension();

  const token=playToken;

  scheduleStars(token);

  /*
    STARTごとに1回だけ
    完全独立 1/30
  */
  const win=Math.random() < (1/30);

  if(win){
    await runHit();
  }else{
    await runMiss();
  }
}

/* =========================
   EVENTS
========================= */
$("#start").addEventListener("click",play);

$("#next").addEventListener("click",()=>{
  stopHitMusic();

  playToken++;

  resetMain();
});

/* =========================
   PRELOAD
========================= */
window.addEventListener("load",()=>{
  ensureAudioContext();

  prepareAudio().catch(()=>{});
});
</script>
