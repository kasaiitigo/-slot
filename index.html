
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120008">
<title>Red Peanuts 4th Anniversary</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  font-family:-apple-system,BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
body{touch-action:manipulation;}

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
  background-color:#120008;
  transform-origin:center;
}

/* ===== OVERLAYS：元コード ===== */

#darkOverlay,#hitDark,#impactWhite,#flash,
#noise,#bgDark,#lightning,#logoGlow{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
#darkOverlay{
  z-index:30;
  background:#000;
}
#hitDark{
  z-index:31;
  background:rgba(0,0,0,.92);
}
#impactWhite{
  z-index:60;
  background:#fff;
}
#flash{
  z-index:61;
  background:rgba(255,255,255,.95);
}
#bgDark{
  z-index:15;
  background:rgba(0,0,0,.72);
}
#noise{
  z-index:45;
  background:repeating-linear-gradient(
    0deg,
    rgba(255,255,255,.13) 0,
    rgba(255,255,255,.13) 1px,
    rgba(0,0,0,.15) 2px,
    rgba(0,0,0,.15) 4px
  );
  mix-blend-mode:screen;
}
#lightning{
  z-index:46;
  background:linear-gradient(
    118deg,
    transparent 42%,
    rgba(255,255,255,.98) 46%,
    #ff4fa7 48%,
    transparent 52%
  );
  filter:drop-shadow(0 0 14px #ff1b8d);
}
#logoGlow{
  z-index:20;
  height:36%;
  background:radial-gradient(
    ellipse at 50% 25%,
    rgba(255,255,255,.98) 0%,
    rgba(255,88,176,.70) 13%,
    rgba(255,0,115,.24) 31%,
    transparent 58%
  );
}

/* ===== START：元コードのまま ===== */

#startScreen{
  position:absolute;
  inset:0;
  z-index:10;
}
#startButton{
  position:absolute;
  left:50%;
  bottom:8.5%;
  transform:translateX(-50%);
  width:min(78vw,390px);
  height:72px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:40px;
  background:linear-gradient(
    180deg,
    rgba(255,85,171,.97),
    rgba(215,0,103,.97)
  );
  box-shadow:
    0 0 12px rgba(255,255,255,.75),
    0 0 26px rgba(255,0,125,.85),
    inset 0 2px 7px rgba(255,255,255,.55);
  color:#fff;
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
}
#probability{
  position:absolute;
  z-index:12;
  width:100%;
  bottom:23%;
  text-align:center;
  color:#fff;
  font-weight:800;
  pointer-events:none;
  text-shadow:
    0 2px 4px #000,
    0 0 8px #ff278c;
}
.lottery-title{font-size:15px;}
.lottery-rate{
  margin:2px 0;
  font-size:27px;
  line-height:1.05;
  font-weight:1000;
  color:#fff3a5;
  letter-spacing:2px;
  text-shadow:
    0 2px 3px #000,
    0 0 8px #ffca28,
    0 0 15px #ff278c;
}
.lottery-sub{font-size:14px;}

/* ===== EXPECTATION：元の位置35% ===== */

#expectButton{
  position:absolute;
  z-index:13;
  left:50%;
  bottom:35%;
  transform:translateX(-50%);
  border:1.5px solid rgba(255,255,255,.9);
  border-radius:25px;
  padding:9px 20px;
  background:rgba(85,0,48,.72);
  color:#fff;
  font-size:14px;
  font-weight:900;
  box-shadow:
    0 0 8px rgba(255,255,255,.5),
    0 0 16px rgba(255,28,137,.7);
  white-space:nowrap;
}
#expectModal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.82);
  padding:20px;
}
#expectModal.show{display:flex;}
#expectBox{
  width:min(90vw,430px);
  max-height:90dvh;
  overflow-y:auto;
  padding:28px 18px 22px;
  border:2px solid #ff79bc;
  border-radius:25px;
  background:linear-gradient(
    180deg,
    rgba(86,0,48,.98),
    rgba(27,0,17,.98)
  );
  box-shadow:
    0 0 18px #ff2b91,
    0 0 45px rgba(255,43,145,.55);
  color:#fff;
  text-align:center;
}
#expectTitle{
  margin-bottom:20px;
  color:#fff3a4;
  font-size:27px;
  font-weight:1000;
  text-shadow:
    0 0 8px #ff8a00,
    0 0 15px #ff2b91;
}
.expectRow{
  margin:12px 0;
  padding:9px 5px;
  border-bottom:1px solid rgba(255,255,255,.18);
  font-size:17px;
  font-weight:800;
}
.expectChance{color:#ff9ed0;}
.expectBig{
  color:#ffe46e;
  font-size:20px;
}
.expectSure{
  color:#fff36e;
  font-size:20px;
  text-shadow:
    0 0 7px #ff7900,
    0 0 12px #ff006e;
}
#expectClose{
  margin-top:17px;
  width:75%;
  height:48px;
  border:1.5px solid #fff;
  border-radius:25px;
  background:linear-gradient(180deg,#ff65b2,#d80068);
  color:#fff;
  font-size:17px;
  font-weight:900;
}

/* ===== COUNTDOWN：元コードのまま ===== */

#number{
  position:absolute;
  z-index:25;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  transform-origin:center;
  width:100%;
  text-align:center;
  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;
  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);
  opacity:0;
}
#number.show{
  opacity:1;
  animation:numberPop .20s ease-out;
}
#number.big{
  transform:translate(-50%,-50%) scale(1.28);
}
#number.crack{
  text-shadow:
    -5px -3px 0 rgba(255,255,255,.7),
    4px 4px 0 #b50059,
    0 9px 0 #8b003e,
    0 18px 8px rgba(60,0,28,.75);
}
#number.pink{color:#ffb5dc;}
#number.red{color:#ff315f;}
#number.gold{
  color:#fff0a8;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ffb400;
  text-shadow:
    0 6px 0 #d48300,
    0 12px 0 #9d5700,
    0 18px 8px rgba(60,25,0,.72);
}
#number.dots{font-size:90px;}
#number.question{font-size:min(35vw,175px);}
@keyframes numberPop{
  0%{transform:translate(-50%,-50%) scale(.78);}
  70%{transform:translate(-50%,-50%) scale(1.06);}
  100%{transform:translate(-50%,-50%) scale(1);}
}

/* ===== SLASH：元コード ===== */

#slash1,#slash2{
  position:absolute;
  z-index:55;
  left:-30%;
  top:50%;
  width:160%;
  height:31px;
  opacity:0;
  transform:rotate(-19deg) scaleX(0);
  transform-origin:left center;
  background:linear-gradient(
    90deg,
    transparent,
    #fff 8%,
    #fff 43%,
    #ff4aa5 68%,
    transparent
  );
  box-shadow:
    0 0 9px #fff,
    0 0 22px #fff,
    0 0 40px #ff1687,
    0 0 70px #ff1687;
}
#slash2{
  top:54%;
  transform:rotate(17deg) scaleX(0);
}
.slashGo{
  animation:slashGo .32s cubic-bezier(.1,.7,.2,1);
}
#slash2.slashGo{
  animation:slashGo2 .32s cubic-bezier(.1,.7,.2,1);
}
@keyframes slashGo{
  0%{opacity:0;transform:rotate(-19deg) scaleX(0);}
  12%{opacity:1;}
  72%{opacity:1;transform:rotate(-19deg) scaleX(1);}
  100%{opacity:0;transform:rotate(-19deg) scaleX(1.06);}
}
@keyframes slashGo2{
  0%{opacity:0;transform:rotate(17deg) scaleX(0);}
  12%{opacity:1;}
  72%{opacity:1;transform:rotate(17deg) scaleX(1);}
  100%{opacity:0;transform:rotate(17deg) scaleX(1.06);}
}

/* ===== HIT：元コード ===== */

#hitText{
  position:absolute;
  z-index:70;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%) scale(.1);
  width:180vw;
  text-align:center;
  color:#fff7bd;
  font-size:min(43vw,220px);
  font-weight:1000;
  -webkit-text-stroke:clamp(5px,1.5vw,9px) #ff245f;
  text-shadow:
    0 5px 0 #ff9a00,
    0 10px 0 #b50c22,
    0 0 18px #fff,
    0 0 42px #ff005d,
    0 0 75px #ff9a00;
  opacity:0;
  pointer-events:none;
}
#hitText.go{
  animation:hitPop .68s cubic-bezier(.15,.75,.2,1.4) forwards;
}
@keyframes hitPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.08);
  }
  48%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.30);
  }
  72%{
    transform:translate(-50%,-50%) scale(.92);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}
#hitTapGuide{
  position:absolute;
  z-index:72;
  left:0;
  bottom:10%;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:1px;
  opacity:0;
  pointer-events:none;
  text-shadow:
    0 2px 4px #000,
    0 0 10px #ff278c;
}
#hitTapGuide.show{
  animation:guideBlink 1.25s ease-in-out infinite;
}
@keyframes guideBlink{
  0%,100%{opacity:.45;}
  50%{opacity:1;}
}

/* ===== 当選演出名：追加 ===== */

#hitInfo{
  position:absolute;
  z-index:73;
  top:72%;
  left:5%;
  width:90%;
  text-align:center;
  color:#fff;
  opacity:0;
  pointer-events:none;
}
#hitInfo.show{
  animation:infoAppear .6s ease-out forwards;
}
#hitInfoLabel{
  font-size:15px;
  font-weight:900;
  text-shadow:0 2px 6px #000;
}
#hitRouteName{
  display:inline-block;
  margin-top:9px;
  max-width:100%;
  padding:9px 16px;
  border:1.5px solid #ffe68a;
  border-radius:13px;
  background:rgba(65,0,37,.9);
  color:#fff1aa;
  font-size:clamp(15px,4.5vw,22px);
  font-weight:1000;
  box-shadow:0 0 17px #ff2b91;
}
@keyframes infoAppear{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}

/* ===== MISS：文字サイズのみ修正 ===== */

#missResult{
  position:absolute;
  z-index:90;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  pointer-events:none;
  background:rgba(0,0,0,.52);
}
#missResult.show{display:flex;}
#missSub{
  margin-bottom:5px;
  color:#ffe978;
  font-size:min(13vw,68px);
  line-height:1;
  font-weight:1000;
  opacity:0;
  text-shadow:
    0 3px 0 #b44c00,
    0 0 10px #fff,
    0 0 25px #ff7600;
}
#missSub.show{
  animation:missSubPop .45s ease-out forwards;
}
#missMain{
  position:relative;
  color:#fff;

  /* ハズレだけ小さく・横1行 */
  font-size:clamp(46px,17vw,95px);
  white-space:nowrap;
  max-width:95vw;

  line-height:1.15;
  font-weight:1000;
  letter-spacing:-5px;
  -webkit-text-stroke:clamp(3px,1.1vw,6px) #d90068;
  text-shadow:
    0 7px 0 #920046,
    0 14px 8px rgba(0,0,0,.8),
    0 0 18px #ff258b;
  opacity:0;
  transform:scale(.15);
}
#missMain.show{
  animation:missPop .55s cubic-bezier(.15,.8,.25,1.35) forwards;
}
#missMessage{
  max-width:90%;
  margin-top:23px;
  color:#fff1b0;
  font-size:clamp(14px,4vw,19px);
  font-weight:900;
  line-height:1.65;
  text-shadow:0 2px 5px #000;
  opacity:0;
}
#missMessage.show{
  animation:infoAppear .5s ease-out forwards;
}
@keyframes missSubPop{
  from{opacity:0;transform:scale(.4);}
  to{opacity:1;transform:scale(1);}
}
@keyframes missPop{
  0%{opacity:0;transform:scale(.15);}
  55%{opacity:1;transform:scale(1.2);}
  78%{transform:scale(.92);}
  100%{opacity:1;transform:scale(1);}
}

/* ===== 復活③：ヒビ・粉砕 ===== */

#missCracks{
  position:absolute;
  inset:-12%;
  width:124%;
  height:124%;
  opacity:0;
  pointer-events:none;
  filter:drop-shadow(0 0 3px #000);
}
#missCracks.show{
  animation:cracksAppear .65s steps(3,end) forwards;
}
@keyframes cracksAppear{
  0%{opacity:0;}
  35%{opacity:.4;}
  70%{opacity:.8;}
  100%{opacity:1;}
}
#missMain.shaking{
  opacity:1;
  animation:missCrackShake .12s linear infinite;
}
@keyframes missCrackShake{
  0%,100%{transform:translate(0,0);}
  25%{transform:translate(-5px,4px);}
  50%{transform:translate(6px,-4px);}
  75%{transform:translate(-4px,-6px);}
}
.fragment{
  position:absolute;
  z-index:95;
  color:#fff;
  font-size:24px;
  pointer-events:none;
  text-shadow:0 0 9px #fff,0 0 18px #ff258b;
  animation:fragmentFly 1s ease-out forwards;
}
@keyframes fragmentFly{
  from{
    opacity:1;
    transform:translate(0,0) rotate(0);
  }
  to{
    opacity:0;
    transform:translate(var(--fx),var(--fy))
      rotate(var(--fr)) scale(.1);
  }
}

/* ===== 復活②④：ノーカン ===== */

#noCount{
  position:absolute;
  z-index:95;
  left:50%;
  top:50%;
  width:100%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:#fff2a0;
  font-size:clamp(44px,12vw,85px);
  font-weight:1000;
  white-space:nowrap;
  -webkit-text-stroke:3px #ff278c;
  text-shadow:
    0 5px #a60050,
    0 0 25px #ff2b91;
  opacity:0;
  pointer-events:none;
}
#noCount.show{
  animation:noCountPop .6s ease-out forwards;
}
@keyframes noCountPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.15);
  }
  60%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* ===== STARS：元コード ===== */

.star{
  position:absolute;
  z-index:42;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 7px #fff,
    0 0 15px #ff78c1,
    0 0 26px #ff1687;
  pointer-events:none;
}
.star::after{
  content:"";
  position:absolute;
  right:1px;
  top:50%;
  width:80px;
  height:2px;
  transform:translateY(-50%) rotate(45deg);
  transform-origin:right center;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.92)
  );
}
.star.fly{
  animation:starFly var(--dur) linear forwards;
}
@keyframes starFly{
  from{
    opacity:0;
    transform:translate(0,0);
  }
  8%{opacity:1;}
  85%{opacity:1;}
  to{
    opacity:0;
    transform:translate(var(--dx),var(--dy));
  }
}

/* ===== GENERAL：元コード ===== */

.hitShake{
  animation:hitShake .48s linear;
}
@keyframes hitShake{
  0%{transform:translate(0,0)}
  10%{transform:translate(-14px,8px)}
  20%{transform:translate(13px,-9px)}
  30%{transform:translate(-11px,-5px)}
  40%{transform:translate(14px,7px)}
  50%{transform:translate(-8px,4px)}
  60%{transform:translate(9px,-6px)}
  70%{transform:translate(-5px,3px)}
  80%{transform:translate(5px,-2px)}
  100%{transform:translate(0,0)}
}
.hitZoom{
  animation:hitZoom .55s ease-out;
}
@keyframes hitZoom{
  0%{transform:scale(1)}
  45%{transform:scale(1.07)}
  100%{transform:scale(1)}
}
.fadeWhite{
  animation:fadeWhite .23s ease-out;
}
@keyframes fadeWhite{
  0%{opacity:0;}
  40%{opacity:1;}
  100%{opacity:0;}
}
.noiseGo{
  animation:noiseGo .55s steps(2,end);
}
@keyframes noiseGo{
  0%{opacity:0;}
  20%{opacity:.75;}
  38%{opacity:.18;}
  55%{opacity:.85;}
  70%{opacity:.25;}
  100%{opacity:0;}
}
.lightningGo{
  animation:lightningGo .4s ease-out;
}
@keyframes lightningGo{
  0%{opacity:0;}
  15%{opacity:1;}
  35%{opacity:.1;}
  52%{opacity:.9;}
  100%{opacity:0;}
}
.logoGlowGo{
  animation:logoGlowGo .85s ease-out;
}
@keyframes logoGlowGo{
  0%{opacity:0;}
  30%{opacity:1;}
  100%{opacity:0;}
}
.bgDarkGo{
  opacity:1!important;
}
</style>
</head>

<body>

<div id="stage">

  <div id="bgDark"></div>
  <div id="logoGlow"></div>

  <div id="startScreen">

    <button id="expectButton">
      演出期待度を見る
    </button>

    <div id="probability">
      <div class="lottery-title">完全抽選</div>
      <div class="lottery-rate">1 / 25</div>
      <div class="lottery-sub">毎回独立抽選</div>
    </div>

    <button id="startButton">START</button>

  </div>

  <div id="number"></div>

  <div id="darkOverlay"></div>
  <div id="hitDark"></div>
  <div id="noise"></div>
  <div id="lightning"></div>

  <div id="slash1"></div>
  <div id="slash2"></div>

  <div id="impactWhite"></div>
  <div id="flash"></div>

  <div id="hitText">当たり</div>

  <div id="hitInfo">
    <div id="hitInfoLabel">
      ✨ 今回の当選演出 ✨
    </div>
    <div id="hitRouteName"></div>
  </div>

  <div id="hitTapGuide">
    画面をタップして戻る
  </div>

  <div id="missResult">
    <div id="missSub"></div>

    <div id="missMain">
      ハズレ
      <svg id="missCracks"
        viewBox="0 0 320 130"
        preserveAspectRatio="none">
        <g fill="none"
          stroke="#fff"
          stroke-width="3"
          stroke-linecap="round">
          <path d="M155 0 L144 24 L170 38 L147 56 L181 77 L155 100 L176 130"/>
          <path d="M144 24 L107 14 L90 35 L58 28"/>
          <path d="M170 38 L208 23 L230 44 L267 29"/>
          <path d="M147 56 L108 70 L84 63 L42 92"/>
          <path d="M181 77 L220 88 L243 74 L294 96"/>
          <path d="M155 100 L125 118 L92 105"/>
        </g>
      </svg>
    </div>

    <div id="missMessage"></div>
  </div>

  <div id="noCount">ノーカン！？</div>

</div>

<div id="expectModal">
  <div id="expectBox">

    <div id="expectTitle">✨ 演出期待度 ✨</div>

    <div class="expectRow">
      ⚡ ピンク稲妻
      <span class="expectChance">チャンス！</span>
    </div>

    <div class="expectRow">
      ❓「？」出現
      <span class="expectChance">チャンス！</span>
    </div>

    <div class="expectRow">
      ✨ 流れ星大量
      <span class="expectChance">期待度UP！</span>
    </div>

    <div class="expectRow">
      🌑 ブラックアウト
      <span class="expectBig">大チャンス！？</span>
    </div>

    <div class="expectRow">
      🟡 金色変化
      <span class="expectBig">大チャンス！？</span>
    </div>

    <div class="expectRow">
      🔥「…」出現
      <span class="expectBig">大チャンス！？</span>
    </div>

    <div class="expectRow">
      ⚔️ 斬撃＋「当たり」
      <span class="expectSure">当選確定！</span>
    </div>

    <button id="expectClose">閉じる</button>

  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function chance(p){
  return Math.random()<p;
}

const stage=$("stage");
const startScreen=$("startScreen");
const startButton=$("startButton");
const number=$("number");

const darkOverlay=$("darkOverlay");
const hitDark=$("hitDark");
const slash1=$("slash1");
const slash2=$("slash2");

/* ===== AUDIO：元コード ===== */

let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let hitSource=null;
let audioLoaded=false;
let audioLoading=null;

function ensureAudioContext(){
  if(!audioCtx){
    const AC=
      window.AudioContext ||
      window.webkitAudioContext;

    if(AC)audioCtx=new AC();
  }
  return audioCtx;
}

async function prepareAudio(){
  if(audioLoaded)return;
  if(audioLoading)return audioLoading;

  audioLoading=(async()=>{
    ensureAudioContext();
    if(!audioCtx)return;

    const [tensionRes,hitRes]=await Promise.all([
      fetch("./Tension.mp3"),
      fetch("./hit_music_final.mp3")
    ]);

    if(!tensionRes.ok||!hitRes.ok){
      throw new Error("音声ファイルを読み込めません");
    }

    const [tensionData,hitData]=await Promise.all([
      tensionRes.arrayBuffer(),
      hitRes.arrayBuffer()
    ]);

    tensionBuffer=
      await audioCtx.decodeAudioData(tensionData);

    hitBuffer=
      await audioCtx.decodeAudioData(hitData);

    audioLoaded=true;
  })();

  try{
    await audioLoading;
  }finally{
    audioLoading=null;
  }
}

function stopTension(){
  if(tensionSource){
    try{tensionSource.stop();}catch(e){}
    tensionSource=null;
  }
}

function startTension(){
  stopTension();
  if(!audioCtx||!tensionBuffer)return;

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=tensionBuffer;
  source.loop=true;
  gain.gain.value=.72;

  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start(0);
  tensionSource=source;
}

function stopHitMusic(){
  if(hitSource){
    try{hitSource.stop();}catch(e){}
    hitSource=null;
  }
}

function playHitMusic(){
  stopHitMusic();
  if(!audioCtx||!hitBuffer)return;

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=hitBuffer;
  gain.gain.value=1;

  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start(0);
  hitSource=source;
}

/* ===== STARS：元コード ===== */

function clearStars(){
  starTimers.forEach(t=>clearTimeout(t));
  starTimers=[];

  document.querySelectorAll(".star")
    .forEach(el=>el.remove());
}

function makeStar(){
  const s=document.createElement("div");
  s.className="star";

  if(chance(.55)){
    s.style.left=rand(-8,55)+"%";
    s.style.top=rand(-5,28)+"%";
  }else{
    s.style.left=rand(-8,12)+"%";
    s.style.top=rand(4,48)+"%";
  }

  s.style.setProperty("--dx",rand(220,520)+"px");
  s.style.setProperty("--dy",rand(260,620)+"px");
  s.style.setProperty("--dur",rand(700,1250)+"ms");

  stage.appendChild(s);

  requestAnimationFrame(()=>{
    s.classList.add("fly");
  });

  setTimeout(()=>s.remove(),1500);
}

function starBurst(){
  let count;
  const r=Math.random();

  if(r<.75){
    count=rand(1,3);
  }else if(r<.95){
    count=rand(4,6);
  }else{
    count=rand(7,10);
  }

  for(let i=0;i<count;i++){
    setTimeout(makeStar,i*rand(80,170));
  }
}

function scheduleStars(token){
  if(!chance(.27))return;

  const t1=setTimeout(()=>{
    if(token!==playToken)return;
    starBurst();
  },rand(850,3900));

  starTimers.push(t1);

  if(chance(.15)){
    const t2=setTimeout(()=>{
      if(token!==playToken)return;
      starBurst();
    },rand(4200,6800));

    starTimers.push(t2);
  }
}

/* ===== REAL HIT：元演出＋演出名 ===== */

async function realHit(options={}){
  const silence=options.silence??700;
  const doubleSlash=
    options.doubleSlash??chance(.25);

  stopTension();
  number.classList.remove("show");

  await sleep(silence);

  hitDark.style.opacity="1";
  await sleep(310);
  hitDark.style.opacity="0";
  await sleep(70);

  stage.classList.add("hitZoom");
  document.body.classList.add("hitShake");

  restartAnimation(impactWhite,"fadeWhite");

  await slash(doubleSlash);

  restartAnimation(flash,"fadeWhite");

  restartAnimation(hitText,"go");
  playHitMusic();

  await sleep(260);

  document.body.classList.remove("hitShake");
  void document.body.offsetWidth;
  document.body.classList.add("hitShake");

  await sleep(900);

  document.body.classList.remove("hitShake");
  stage.classList.remove("hitZoom");

  hitRouteName.textContent=
    options.routeName||"スペシャル当選";

  restartAnimation(hitInfo,"show");

  hitWaitingForTap=true;
  hitTapGuide.classList.add("show");
}

      await showNumber("2",1000);

      resetNumberStyle();
      number.textContent="1";
      number.classList.add("show");

      number.style.transform=
        "translate(-50%,-50%) scale(.78)";

      await sleep(1700);

      number.style.transform="";
      number.classList.remove("show");
      break;

    case 9:
      await showNumber("3",450);
      await showNumber("2",450);
      await showNumber("1",1500);
      break;
  }

  stopTension();

  /* 「…」はここでは出さない */
  await sleep(1100);
  await showMissResult(false);
}

async function strongFake(i){
  switch(i){

    case 0:
      await normalCount();
      stopTension();
      await sleep(500);
      await slash(false);
      await sleep(1200);
      break;

    case 1:
      await normalCount();
      stopTension();
      await blackout(1900);
      break;

    case 2:
      await showNumber("3",1000);
      await showNumber("2",1000);

      resetNumberStyle();
      number.textContent="1";
      number.classList.add("show","gold");

      await sleep(3000);
      number.classList.remove("show","gold");
      break;

    case 3:
      await normalCount();
      stopTension();
      await slash(false);
      restartAnimation(flash,"fadeWhite");
      await sleep(1300);
      break;

    case 4:
      await normalCount();
      stopTension();
      await blackout(1400);
      await showNumber("1",2100);
      break;

    case 5:
      await showNumber("3",1000);
      await showNumber("2",1000);

      resetNumberStyle();
      number.textContent="1";
      number.classList.add("show","gold");

      await sleep(800);
      stopTension();
      await sleep(2600);

      number.classList.remove("show","gold");
      break;
  }

  await blackout(500);

  /* 「…」はここでは出さない */
  await sleep(1000);
  await showMissResult(true);
}

async function commonFxMiss(i){
  await commonFx[i]();

  stopTension();

  /* 共通演出のガセでも「…」は出さない */
  await sleep(rand(800,1500));

  await showMissResult(true);
}

/* ===== 「…」専用の激レアハズレ ===== */

async function dotsHotMiss(){
  const pattern=rand(0,3);

  await normalCount();
  stopTension();

  if(pattern===0){
    await showDots(1900);
    await sleep(900);

  }else if(pattern===1){
    await showDots(1600);
    await blackout(1500);

  }else if(pattern===2){
    await showDots(1700);
    await showNumber("1",950);

  }else{
    await showDots(1600);
    starBurst();
    await sleep(1100);
  }

  await showMissResult(true);
}

/* ===== HIT SELECTOR ===== */

/*
  44種類の既存演出は維持。

  「…」を含まない当たりルートでのみ
  低確率で新しい復活演出へ分岐する。

  「…」当たりルートは
  18、27、28、29、30、31の6種類。
*/

async function runHitRoute(){
  const route=Math.floor(Math.random()*44);

  const dotsRoutes=[18,27,28,29,30,31];

  if(!dotsRoutes.includes(route)&&chance(.16)){
    const revival=rand(0,3);

    if(revival===0)return revivalBlackout();
    if(revival===1)return revivalNoCount();
    if(revival===2)return revivalCrack();
    return revivalDoubleNoCount();
  }

  /*
    realHitに演出名を渡すため、
    この当選1回だけ名前を保持する。
  */
  currentHitRouteName=hitNames[route];

  switch(route){
    case 0:return normalHitAt(3);
    case 1:return normalHitAt(2);
    case 2:return normalHitAt(1);
    case 3:return normalHitAt(0);
    case 4:return normalBlackout();
    case 5:return freezeTwo();
    case 6:return reverseCountdown();
    case 7:return zeroPremium();
    case 8:return numberDisappear();
    case 9:return soundStopPattern();
    case 10:return longOne();
    case 11:return recountSequence();
    case 12:return doubleCountdown();
    case 13:return puchunDirect();
    case 14:return puchunRecount();
    case 15:return fakeSlashPattern();
    case 16:return weirdCountdown();
    case 17:return silentStart();
    case 18:return classicRevival();
    case 19:return skipCountHit();
    case 20:return oneVanishHit();
    case 21:return oneBackToTwoHit();
    case 22:return speedCountHit();
    case 23:return doubleSlashHit();
    case 24:return silentOddityHit();
    case 25:return questionHit();
    case 26:return blackoutReturnHit();
    case 27:return dotsDirectHit();
    case 28:return dotsOneRevival();
    case 29:return dotsBlackoutHit();
    case 30:return dotsStarHit();
    case 31:return dotsLongSilenceHit();

    default:
      return commonFxHit(route-32);
  }
}

let currentHitRouteName="";

/*
  既存のrealHit呼び出しで、
  演出名を指定していない場合のみ
  44種類の名前を使う。
*/
const originalRealHit=realHit;

realHit=async function(options={}){
  return originalRealHit({
    ...options,
    routeName:
      options.routeName||
      currentHitRouteName||
      "スペシャル当選"
  });
};

/* ===== MISS SELECTOR ===== */

/*
  STARTで当選した場合:
    44ルート中6ルートで「…」

  STARTでハズレの場合:
    704分の1で「…」

  P(当たり | 「…」出現)
    = (1/25 × 6/44)
      / ((1/25 × 6/44)+(24/25 × 1/704))
    = 80%

  ノーカン演出でも再抽選はしない。
*/

async function runMissRoute(){
  /* 「…」専用のハズレ */
  if(chance(1/704)){
    return dotsHotMiss();
  }

  /* ノーカン1回：ハズレもあり */
  if(chance(.012)){
    return missNoCount();
  }

  /* ノーカン2回：さらにレア */
  if(chance(.003)){
    return missDoubleNoCount();
  }

  /* 既存の共通演出 */
  if(Math.random()<.36){
    return commonFxMiss(
      Math.floor(Math.random()*12)
    );
  }

  const r=Math.random();

  if(r<.50){
    return normalMiss();

  }else if(r<.75){
    return weakFake(
      Math.floor(Math.random()*10)
    );

  }else{
    return strongFake(
      Math.floor(Math.random()*6)
    );
  }
}

  clearStars();

  document.querySelectorAll(".fragment")
    .forEach(el=>el.remove());

  resetNumberStyle();
  number.textContent="";

  darkOverlay.style.opacity="0";
  hitDark.style.opacity="0";

  bgDark.classList.remove("bgDarkGo");

  hitText.classList.remove("go");
  hitText.style.opacity="";

  hitTapGuide.classList.remove("show");
  hitInfo.classList.remove("show");
  hitRouteName.textContent="";

  noCount.classList.remove("show");
  noCount.style.opacity="0";

  stage.classList.remove("hitZoom");
  document.body.classList.remove("hitShake");

  slash1.classList.remove("slashGo");
  slash2.classList.remove("slashGo");

  noise.classList.remove("noiseGo");
  lightning.classList.remove("lightningGo");
  logoGlow.classList.remove("logoGlowGo");

  impactWhite.classList.remove("fadeWhite");
  flash.classList.remove("fadeWhite");

  currentHitRouteName="";
}

function resetToStart(){
  playToken++;

  stopTension();
  stopHitMusic();

  resetVisuals();

  hitWaitingForTap=false;
  playing=false;

  startScreen.style.display="block";
}

/* ===== HIT SCREEN TAP ===== */

stage.addEventListener("click",()=>{
  if(!hitWaitingForTap)return;
  resetToStart();
});

/* ===== START ===== */

startButton.addEventListener("click",async e=>{
  e.stopPropagation();

  if(playing)return;

  playing=true;
  hitWaitingForTap=false;

  playToken++;
  const thisPlay=playToken;

  clearStars();
  currentHitRouteName="";

  /*
    当落はSTARTごとに一度だけ決定。
    音声の読み込み中も再抽選しない。
  */
  const win=Math.random()<(1/25);

  startScreen.style.display="none";

  try{
    ensureAudioContext();

    if(audioCtx){
      await Promise.all([
        audioCtx.resume(),
        prepareAudio()
      ]);
    }
  }catch(err){
    console.log("Audio load error:",err);
  }

  if(thisPlay!==playToken)return;

  startTension();
  scheduleStars(thisPlay);

  try{
    if(win){
      await runHitRoute();
    }else{
      await runMissRoute();
    }
  }catch(err){
    console.error("Game error:",err);
    resetToStart();
  }
});
