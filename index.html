<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RP COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Hiragino Kaku Gothic ProN",sans-serif;
}
body{
  user-select:none;
}

/* =========================
   MAIN
========================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background-color:#120008;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
}

#stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  background:rgba(0,0,0,0);
  transition:background 1s;
}

#stage.bgDark::after{
  background:rgba(0,0,0,.76);
}

#number{
  position:absolute;
  z-index:20;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;

  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;

  color:#fff7fb;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;

  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);

  transition:
    color .18s,
    transform .18s,
    opacity .18s,
    filter .18s;
}

#number.show{
  animation:numberPop .32s ease-out;
}

@keyframes numberPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.16);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

#number.bigChance{
  animation:bigChance .7s cubic-bezier(.1,1.4,.2,1);
}

@keyframes bigChance{
  0%{transform:translate(-50%,-50%) scale(1)}
  35%{transform:translate(-50%,-50%) scale(1.55)}
  65%{transform:translate(-50%,-50%) scale(.92)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

#number.red{
  color:#ff5353;
  -webkit-text-stroke-color:#fff;
}

#number.gold{
  color:#fff0a0;
  -webkit-text-stroke-color:#ffb300;
  text-shadow:
    0 6px 0 #d78c00,
    0 12px 0 #8c5200,
    0 0 20px #fff,
    0 0 45px #ffc400;
}

#number.pink{
  color:#ffb6dc;
}

#number.cracked{
  filter:contrast(1.5);
  text-shadow:
    -4px -2px 0 rgba(255,255,255,.5),
    4px 3px 0 #8b003d,
    0 8px 0 #d82779,
    0 15px 0 #7a003a;
}

#dots{
  position:absolute;
  z-index:22;
  display:none;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  font-size:90px;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:4px #ff4b9d;
  text-shadow:
    0 5px 0 #d82779,
    0 10px 0 #970049;
}

/* =========================
   START
========================= */

#start{
  position:absolute;
  z-index:100;
  left:50%;
  bottom:max(7%,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(72vw,330px);
  padding:17px 20px;

  border:2px solid rgba(255,255,255,.9);
  border-radius:999px;

  background:linear-gradient(180deg,#ff73b9,#d00064);
  color:#fff;

  font-size:21px;
  font-weight:1000;
  letter-spacing:.12em;

  box-shadow:
    0 5px 0 #79003a,
    0 0 25px rgba(255,40,140,.7);
}

#start:active{
  transform:translateX(-50%) translateY(4px);
}

#info{
  position:absolute;
  z-index:100;
  left:0;
  right:0;
  bottom:calc(max(7%,env(safe-area-inset-bottom)) + 75px);
  text-align:center;
  font-size:11px;
  font-weight:800;
  line-height:1.6;
  text-shadow:0 2px 5px #000;
}

/* =========================
   COMMON EFFECTS
========================= */

#black{
  position:fixed;
  inset:0;
  z-index:150;
  display:none;
  background:#000;
}

#noise{
  position:fixed;
  inset:0;
  z-index:125;
  display:none;
  pointer-events:none;
  background:
    repeating-linear-gradient(
      0deg,
      rgba(255,255,255,.13) 0px,
      rgba(255,255,255,.13) 1px,
      rgba(0,0,0,.2) 2px,
      rgba(0,0,0,.2) 4px
    );
  mix-blend-mode:screen;
}

#noise.go{
  display:block;
  animation:noiseMove .07s steps(2) infinite;
}

@keyframes noiseMove{
  0%{transform:translate(0,0)}
  25%{transform:translate(5px,-4px)}
  50%{transform:translate(-5px,3px)}
  75%{transform:translate(3px,5px)}
  100%{transform:translate(-3px,-5px)}
}

#lightning{
  position:fixed;
  inset:0;
  z-index:130;
  display:none;
  pointer-events:none;
}

#lightning.go{
  display:block;
}

.bolt{
  position:absolute;
  left:48%;
  top:-10%;
  width:10px;
  height:125%;
  background:#fff;
  transform:rotate(17deg);
  box-shadow:
    0 0 10px #fff,
    0 0 30px #ff4fa8,
    0 0 70px #ff0080;
  clip-path:polygon(
    50% 0,100% 0,65% 38%,100% 38%,
    38% 100%,50% 53%,0 53%
  );
}

#logoGlow{
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(
      circle at 50% 27%,
      rgba(255,255,255,.95) 0%,
      rgba(255,50,155,.6) 8%,
      rgba(255,0,100,.18) 23%,
      transparent 43%
    );
}

#logoGlow.go{
  animation:logoGlow .8s ease-out;
}

@keyframes logoGlow{
  0%{opacity:0}
  30%{opacity:1}
  100%{opacity:0}
}

#question{
  position:fixed;
  z-index:140;
  display:none;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  font-size:110px;
  font-weight:1000;
  color:#fff;
  -webkit-text-stroke:5px #ff4b9d;
  text-shadow:0 0 25px #ff1493;
}

/* =========================
   STARS
========================= */

.star{
  position:fixed;
  z-index:12;
  pointer-events:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 8px #fff,
    0 0 18px #fff;
}

.star::after{
  content:"";
  position:absolute;
  right:5px;
  top:5px;
  width:220px;
  height:3px;
  transform-origin:right center;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.1),
    #fff
  );
}

.star.go{
  animation:shoot .78s linear forwards;
}

@keyframes shoot{
  from{
    transform:translate(0,0) rotate(-28deg);
    opacity:1;
  }
  to{
    transform:translate(-65vw,55vh) rotate(-28deg);
    opacity:0;
  }
}

/* =========================
   SLASH / HIT
========================= */

#slash{
  position:fixed;
  inset:0;
  z-index:210;
  display:none;
  pointer-events:none;
  overflow:hidden;
}

#slash.go{
  display:block;
}

.slashLine{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:28px;

  background:#fff;

  box-shadow:
    0 0 8px #fff,
    0 0 22px #fff,
    0 0 45px #ff58ad,
    0 0 90px #ff007b;

  transform:rotate(-18deg) scaleX(0);
}

#slash.go .slashLine{
  animation:slashGo .24s ease-out forwards;
}

@keyframes slashGo{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

#flash{
  position:fixed;
  inset:0;
  z-index:260;
  pointer-events:none;
  background:#fff;
  opacity:0;
}

#flash.go{
  animation:whiteFlash .55s ease-out;
}

@keyframes whiteFlash{
  0%{opacity:0}
  12%{opacity:1}
  35%{opacity:.25}
  48%{opacity:1}
  100%{opacity:0}
}

body.hitShake{
  animation:hitShake .08s linear 8;
}

@keyframes hitShake{
  0%{transform:translate(0,0)}
  25%{transform:translate(-9px,5px)}
  50%{transform:translate(8px,-5px)}
  75%{transform:translate(-6px,-4px)}
  100%{transform:translate(5px,4px)}
}

#hitDark{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  background:rgba(0,0,0,.88);
}

#hitText{
  position:fixed;
  z-index:300;
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:180vw;
  text-align:center;

  font-size:min(43vw,220px);
  line-height:1;
  font-weight:1000;

  color:#fff4a6;
  -webkit-text-stroke:5px #ff245f;

  text-shadow:
    0 8px 0 #b0003c,
    0 15px 0 #60001f,
    0 0 20px #fff,
    0 0 50px #ffca00,
    0 0 100px #ff004c;
}

#hitText.go{
  display:block;
  animation:hitExplosion .9s cubic-bezier(.1,1.4,.15,1);
}

@keyframes hitExplosion{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(4.2);
    filter:blur(12px);
  }
  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.72);
    filter:blur(0);
  }
  45%{transform:translate(-50%,-50%) scale(1.22)}
  62%{transform:translate(-50%,-50%) scale(.94)}
  78%{transform:translate(-50%,-50%) scale(1.08)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

/* =========================
   TREASURE
========================= */

#treasure{
  position:fixed;
  inset:0;
  z-index:350;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle at 50% 40%,#5e0a37,#1c0010 55%,#050003);
}

#treasure.show{
  display:flex;
}

#treasureTitle{
  position:absolute;
  top:max(8%,env(safe-area-inset-top));
  width:100%;
  text-align:center;
  font-size:27px;
  font-weight:1000;
  text-shadow:0 3px 8px #000;
}

#treasureSub{
  position:absolute;
  top:15%;
  width:100%;
  text-align:center;
  font-size:13px;
  font-weight:800;
  opacity:.8;
}

#chests{
  width:min(96vw,650px);
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:10px;
}

.chest{
  appearance:none;
  border:0;
  background:none;
  color:#fff;
  width:32%;
  padding:0;
  position:relative;
  transition:
    transform .2s,
    opacity .3s,
    filter .3s;
}

.chestWrap{
  position:relative;
  width:100%;
  height:145px;
}

.chestBody{
  position:absolute;
  z-index:5;
  left:8%;
  bottom:8px;
  width:84%;
  height:72px;
  border:4px solid #ffd0e5;
  border-radius:8px 8px 18px 18px;
  background:
    linear-gradient(
      90deg,
      #b9005c,
      #ff4e9d 22%,
      #bd005e 52%,
      #ff63ad 80%,
      #a60051
    );
  box-shadow:
    inset 0 0 16px rgba(80,0,35,.65),
    0 10px 18px rgba(0,0,0,.65);
}

/* 2-state lid */
.closedLid{
  position:absolute;
  z-index:9;
  left:5%;
  bottom:73px;
  width:90%;
  height:55px;
  border:4px solid #ffd0e5;
  border-radius:50% 50% 7px 7px;
  background:
    linear-gradient(
      90deg,
      #ad0056,
      #ff55a3 25%,
      #bc005c 55%,
      #ff6ab3 82%,
      #a30050
    );
  transition:opacity .2s,transform .25s;
}

.openLid{
  position:absolute;
  z-index:3;
  left:8%;
  bottom:70px;
  width:84%;
  height:43px;
  border:4px solid #ffd0e5;
  border-radius:50% 50% 8px 8px;
  background:linear-gradient(#ff62ad,#a90053);
  transform:translateY(12px) scaleY(.35);
  opacity:0;
  transition:.35s;
}

.hinge{
  position:absolute;
  z-index:10;
  left:17%;
  bottom:69px;
  width:66%;
  height:7px;
  border-radius:10px;
  background:#ffd0e5;
}

.lock{
  position:absolute;
  z-index:12;
  left:41%;
  bottom:60px;
  width:18%;
  height:28px;
  border-radius:6px;
  border:2px solid #fff;
  background:linear-gradient(#fff2a0,#ffbd00);
  box-shadow:0 0 7px rgba(255,255,255,.6);
}

.chest.open .closedLid{
  opacity:0;
  transform:scale(.9);
}

.chest.open .openLid{
  opacity:1;
  transform:translateY(0) scaleY(1);
}

.chest.open .lock{
  opacity:0;
}

.chestLight{
  position:absolute;
  z-index:4;
  left:27%;
  bottom:55px;
  width:46%;
  height:20px;
  opacity:0;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 20px #fff,
    0 0 45px #ff77bb,
    0 0 90px #ff0080;
}

.chest.open .chestLight{
  animation:chestBurst .8s ease-out;
}

@keyframes chestBurst{
  0%{opacity:1;transform:scale(.4)}
  100%{opacity:0;transform:scale(5)}
}

.chest.shaking .chestWrap{
  animation:chestShake .09s linear infinite;
}

@keyframes chestShake{
  0%{transform:translateX(-4px) rotate(-1deg)}
  50%{transform:translateX(4px) rotate(1deg)}
  100%{transform:translateX(-4px) rotate(-1deg)}
}

.rankLabel{
  min-height:38px;
  margin-top:3px;
  font-size:25px;
  font-weight:1000;
  text-shadow:0 2px 5px #000;
}

.rank1{color:#ffe04f}
.rank2{color:#eef5ff}
.rank3{color:#ff9d56}

.chest.selectedChest{
  z-index:25;
  filter:
    brightness(1.18)
    drop-shadow(0 0 7px #fff)
    drop-shadow(0 0 17px #ff4fa1)
    drop-shadow(0 0 30px rgba(255,0,118,.9));
}

.chest.selectedChest::before{
  content:"あなたが選んだ箱";
  position:absolute;
  z-index:40;
  left:50%;
  top:-48px;
  transform:translateX(-50%);
  width:max-content;
  padding:6px 11px;
  border-radius:999px;
  background:linear-gradient(180deg,#ff6bb0,#c90060);
  border:2px solid #fff;
  color:#fff;
  font-size:12px;
  font-weight:1000;
  box-shadow:
    0 3px 0 #750038,
    0 0 15px rgba(255,73,160,.8);
  text-shadow:0 1px 3px rgba(0,0,0,.5);
}

.chest.otherChest{
  opacity:.48;
  filter:brightness(.72) saturate(.7);
}

.selectedChest .rankLabel{
  font-size:31px;
}

#prizeResult{
  margin-top:55px;
  min-height:96px;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#resultSmall{
  display:none;
  margin-bottom:2px;
  color:#fff;
  font-size:16px;
  font-weight:900;
  letter-spacing:.08em;
  text-shadow:0 2px 6px #000;
}

#resultBig{
  display:none;
  font-size:46px;
  line-height:1.1;
  font-weight:1000;
  white-space:nowrap;
  -webkit-text-stroke:2px rgba(90,0,40,.45);
  text-shadow:
    0 4px 0 rgba(80,0,35,.65),
    0 7px 10px rgba(0,0,0,.7),
    0 0 14px currentColor;
}

.resultPop{
  animation:resultPop .6s cubic-bezier(.1,1.5,.2,1);
}

@keyframes resultPop{
  from{transform:scale(.2);opacity:0}
  70%{transform:scale(1.18);opacity:1}
  to{transform:scale(1)}
}

#next{
  display:none;
  margin-top:18px;
  padding:14px 45px;
  border:2px solid #fff;
  border-radius:999px;
  background:linear-gradient(#ff70b4,#c90060);
  color:#fff;
  font-size:18px;
  font-weight:1000;
}

/* accessibility */
@media (prefers-reduced-motion:reduce){
  *{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
  }
}
</style>
</head>

<body>

<div id="stage">
  <div id="number">3</div>
  <div id="dots">…</div>

  <div id="info">
    完全抽選 1/30<br>
    毎回独立抽選
  </div>

  <button id="start">START</button>
</div>

<div id="noise"></div>
<div id="lightning"><div class="bolt"></div></div>
<div id="logoGlow"></div>
<div id="question">？</div>

<div id="black"></div>
<div id="hitDark"></div>

<div id="slash">
  <div class="slashLine"></div>
</div>

<div id="flash"></div>
<div id="hitText">当たり</div>

<div id="treasure">
  <div id="treasureTitle">宝箱を1つ選べ！</div>
  <div id="treasureSub">好きな宝箱をタップ</div>

  <div id="chests"></div>

  <div id="prizeResult">
    <div id="resultSmall">あなたの結果</div>
    <div id="resultBig"></div>
  </div>

  <button id="next">NEXT</button>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let busy=false;
let chestBusy=false;
let selectedRank=null;
let selectedIndex=-1;

let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let hitSource=null;

let playToken=0;
let starTimers=[];

/* ========================================
   AUDIO
   MP3再生のみ。合成音なし
======================================== */

function ensureAudioContext(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  }
  return audioCtx;
}

async function loadBuffer(url){
  const res=await fetch(url,{cache:"force-cache"});
  if(!res.ok) throw new Error(url+" load failed");
  const arr=await res.arrayBuffer();
  return await audioCtx.decodeAudioData(arr);
}

async function prepareAudio(){
  ensureAudioContext();

  if(!tensionBuffer){
    try{
      tensionBuffer=await loadBuffer("./Tension.mp3");
    }catch(e){
      console.log("Tension load error",e);
    }
  }

  if(!hitBuffer){
    try{
      hitBuffer=await loadBuffer("./hit_music_final.mp3");
    }catch(e){
      console.log("Hit music load error",e);
    }
  }
}

async function unlockAudio(){
  ensureAudioContext();

  const resumePromise=audioCtx.resume();

  await Promise.all([
    resumePromise,
    prepareAudio()
  ]);
}

function stopTension(){
  try{tensionSource?.stop()}catch(e){}
  tensionSource=null;
}

function startTension(){
  if(!audioCtx||!tensionBuffer)return;

  stopTension();

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=tensionBuffer;
  source.loop=true;
  gain.gain.value=.72;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);

  tensionSource=source;
}

function stopHitMusic(){
  try{hitSource?.stop()}catch(e){}
  hitSource=null;
}

function playHitMusic(){
  if(!audioCtx||!hitBuffer)return;

  stopHitMusic();

  const source=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  source.buffer=hitBuffer;
  gain.gain.value=1;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);
  hitSource=source;
}

/* ========================================
   BASIC
======================================== */

function clearNumberClasses(){
  $("#number").className="";
  $("#number").style.opacity="";
  $("#number").style.filter="";
}

function showNumber(n){
  const el=$("#number");

  $("#dots").style.display="none";

  clearNumberClasses();

  el.style.display="block";
  el.textContent=n;

  void el.offsetWidth;
  el.classList.add("show");
}

function hideNumber(){
  $("#number").style.display="none";
}

function showDots(){
  hideNumber();
  $("#dots").style.display="block";
}

function hideDots(){
  $("#dots").style.display="none";
}

function flash(){
  const f=$("#flash");
  f.className="";
  void f.offsetWidth;
  f.className="go";
}

async function blackout(ms=1000){
  $("#black").style.display="block";
  await sleep(ms);
  $("#black").style.display="none";
}

/* ========================================
   STARS
======================================== */

function clearStars(){
  starTimers.forEach(clearTimeout);
  starTimers=[];

  $$(".star").forEach(x=>x.remove());
}

function shootStar(){
  const s=document.createElement("div");
  s.className="star";

  s.style.left=(45+Math.random()*55)+"vw";
  s.style.top=(5+Math.random()*35)+"vh";

  const scale=.75+Math.random()*.55;
  s.style.transform=`scale(${scale})`;

  document.body.appendChild(s);

  requestAnimationFrame(()=>{
    s.classList.add("go");
  });

  setTimeout(()=>s.remove(),1200);
}

function starBurst(count){
  for(let i=0;i<count;i++){
    const t=setTimeout(shootStar,i*(60+Math.random()*100));
    starTimers.push(t);
  }
}

function scheduleStars(token){
  /* 約73%は星なし */
  if(Math.random()>=.27)return;

  const r=Math.random();

  let count;

  if(r<.75){
    count=1+Math.floor(Math.random()*3);
  }else if(r<.95){
    count=4+Math.floor(Math.random()*3);
  }else{
    count=7+Math.floor(Math.random()*4);
  }

  const delay=600+Math.random()*3000;

  starTimers.push(setTimeout(()=>{
    if(token!==playToken)return;

    starBurst(count);

    if(Math.random()<.15){
      starTimers.push(setTimeout(()=>{
        if(token===playToken){
          starBurst(1+Math.floor(Math.random()*4));
        }
      },700+Math.random()*1000));
    }
  },delay));
}

/* 1等2% / 2等20% / 3等78% */
function drawPrize(){
  const r=Math.random();

  if(r<.02)return 1;
  if(r<.22)return 2;

  return 3;
}

function rankClass(rank){
  return "rank"+rank;
}

function createChests(){
  const area=$("#chests");
  area.innerHTML="";

  for(let i=0;i<3;i++){
    const b=document.createElement("button");
    b.className="chest";

    b.innerHTML=`
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="openLid"></div>
        <div class="closedLid"></div>
        <div class="hinge"></div>
        <div class="chestBody"></div>
        <div class="lock"></div>
      </div>
      <div class="rankLabel"></div>
    `;

    b.addEventListener("click",()=>{
      chooseChest(i);
    });

    area.appendChild(b);
  }
}

function showTreasure(){
  selectedRank=drawPrize();
  selectedIndex=-1;
  chestBusy=false;

  createChests();

  $("#treasureTitle").textContent="宝箱を1つ選べ！";
  $("#treasureSub").textContent="好きな宝箱をタップ";

  $("#resultSmall").style.display="none";
  $("#resultBig").style.display="none";
  $("#next").style.display="none";

  $("#treasure").className="show";
}

function showSelectedResult(rank){
  const small=$("#resultSmall");
  const big=$("#resultBig");

  small.textContent="あなたの結果";
  small.style.display="block";

  big.textContent=rank+"等 当選！";
  big.className=rankClass(rank);
  big.style.display="block";

  void big.offsetWidth;
  big.classList.add("resultPop");
}

async function chooseChest(index){
  if(chestBusy)return;

  chestBusy=true;
  selectedIndex=index;

  const chests=$$(".chest");
  const chosen=chests[index];

  chests.forEach(c=>{
    c.style.pointerEvents="none";
  });

  chosen.classList.add("shaking");

  await sleep(950);

  chosen.classList.remove("shaking");
  chosen.classList.add("open","selectedChest");

  await sleep(450);

  flash();

  await sleep(500);

  const label=chosen.querySelector(".rankLabel");

  label.textContent=selectedRank+"等";
  label.className="rankLabel "+rankClass(selectedRank);

  showSelectedResult(selectedRank);

  await sleep(1300);

  /* 残りは他の2等級 */
  const remainingRanks=[1,2,3]
    .filter(r=>r!==selectedRank)
    .sort(()=>Math.random()-.5);

  const otherIndexes=[0,1,2]
    .filter(i=>i!==index)
    .sort(()=>Math.random()-.5);

  for(let i=0;i<otherIndexes.length;i++){
    const idx=otherIndexes[i];
    const c=chests[idx];

    c.classList.add("otherChest","shaking");

    await sleep(500);

    c.classList.remove("shaking");
    c.classList.add("open");

    const l=c.querySelector(".rankLabel");
    const rank=remainingRanks[i];

    l.textContent=rank+"等";
    l.className="rankLabel "+rankClass(rank);

    await sleep(750);
  }

  $("#treasureTitle").textContent="あなたが選んだ宝箱";
  $("#treasureSub").textContent="選んだ結果はこちら";

  /* 選んだ結果を最後まで残す */
  showSelectedResult(selectedRank);

  await sleep(600);

  $("#next").style.display="block";
}

    case 27:return dotsDirectHit();
    case 28:return dotsOneRevival();
    case 29:return dotsBlackoutHit();
    case 30:return dotsStarHit();
    case 31:return dotsLongSilenceHit();

    /* 新12 */
    case 32:return commonFxHit(0);
    case 33:return commonFxHit(1);
    case 34:return commonFxHit(2);
    case 35:return commonFxHit(3);
    case 36:return commonFxHit(4);
    case 37:return commonFxHit(5);
    case 38:return commonFxHit(6);
    case 39:return commonFxHit(7);
    case 40:return commonFxHit(8);
    case 41:return commonFxHit(9);
    case 42:return commonFxHit(10);
    case 43:return commonFxHit(11);
  }
}

/* ========================================
   MISS SELECTOR
======================================== */

async function runMiss(){
  /*
    ハズレの基本振り分けを維持しつつ
    一部を新12共通演出へ差し替える。

    新演出が出ても当たり確定にならない。
  */

  if(Math.random()<.36){
    return commonFxMiss(
      Math.floor(Math.random()*12)
    );
  }

  const r=Math.random();

  if(r<.50){
    return normalMiss();
  }

  if(r<.75){
    return weakFake(
      Math.floor(Math.random()*10)
    );
  }

  return strongFake(
    Math.floor(Math.random()*6)
  );
}

/* ========================================
   START
======================================== */

async function play(){
  if(busy)return;

  busy=true;

  $("#start").style.display="none";
  $("#info").style.display="none";

  playToken++;
  clearStars();

  resetVisuals();

  /*
    iPhone Safari対策：
    ユーザーのタップ中にAudioContextをresume開始
  */
  ensureAudioContext();

  const resumePromise=audioCtx.resume();

  try{
    await Promise.all([
      resumePromise,
      prepareAudio()
    ]);
  }catch(e){
    console.log("audio prepare",e);
  }

  startTension();

  scheduleStars(playToken);

  /*
    ★ 本番抽選
    START 1回につき1回だけ
    完全独立 1/30
  */
  const win=Math.random() < (1/30);

  if(win){
    return runHit();
  }

  return runMiss();
}

/* ========================================
   RESET
======================================== */

function resetVisuals(){
  $("#black").style.display="none";
  $("#hitDark").style.display="none";
  $("#slash").className="";
  $("#flash").className="";
  $("#hitText").className="";
  $("#noise").className="";
  $("#lightning").className="";
  $("#logoGlow").className="";
  $("#question").style.display="none";

  $("#stage").classList.remove("bgDark");

  hideDots();

  clearNumberClasses();

  $("#number").style.display="block";
  $("#number").textContent="3";
}

function resetMain(){
  playToken++;

  clearStars();

  stopTension();
  stopHitMusic();

  resetVisuals();

  $("#treasure").className="";

  $("#resultSmall").style.display="none";
  $("#resultBig").style.display="none";
  $("#next").style.display="none";

  $("#start").style.display="block";
  $("#info").style.display="block";

  selectedRank=null;
  selectedIndex=-1;

  chestBusy=false;
  busy=false;
}

/* ========================================
   EVENTS
======================================== */

$("#start").addEventListener("click",play);

$("#next").addEventListener("click",()=>{
  resetMain();
});

/* audio preload */
window.addEventListener("load",()=>{
  ensureAudioContext();
  prepareAudio().catch(()=>{});
});
